#
# cbindgen config for the array bounds the struct-layout limb of the FFI
# signature gate needs (scripts/ci/check_ffi_signatures.sh, BOUNDS). Each
# file in BOUNDS defines a constant a crossing struct uses as an array
# length. Generating it from that file keeps the bound Rust's own value:
# a bound typed into the gate would compare the header against the gate.

language = "C++"
cpp_compat = true
usize_is_size_t = true
namespace = "rust_layout"
no_includes = true

[parse]
parse_deps = false

[export]
item_types = ["constants"]
