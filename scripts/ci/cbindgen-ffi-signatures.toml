#
# cbindgen config for the FFI signature gate
# (scripts/ci/check_ffi_signatures.sh). Generates a declarations-only
# header from each gated Rust source file; the gate TU includes them AFTER
# the hand-written src/shekyl/shekyl_ffi.h, so any signature disagreement
# is a conflicting-declaration compile error.
#
# item_types deliberately excludes structs and constants:
# - a crossing struct's DEFINITION (ShekylRelayBlob, ShekylBuffer) lives in
#   the hand-written header (a second
#   definition would be an unconditional redefinition error; its byte layout
#   is pinned by the header's own static_assert, and referenced-only types
#   still surface here as opaque forward declarations, which redeclare
#   legally);
# - the SHEKYL_RELAY_ZONE_* flag VALUES are pinned by the
#   zone_flag_bits_do_not_transpose ABI test — and the hand-written #defines
#   would macro-expand inside generated constant declarations.
# Signatures are this gate's job; values have their own regime.

language = "C++"
cpp_compat = true
usize_is_size_t = true

[export]
item_types = ["functions", "typedefs", "opaque"]

# A crossing struct whose hand-written C name differs from its Rust name is
# renamed here, so the generated signature names the header's type, which
# the header defines (and pins by static_assert). The relay blob types share
# one name on both sides; the peer-list entry does not.
[export.rename]
"ShekylRpcPeerFacts" = "shekyl_rpc_peer_facts"
"ShekylIngestBlob" = "shekyl_ingest_blob"
"ShekylIngestArrival" = "shekyl_ingest_arrival"
"ShekylIngestReply" = "shekyl_ingest_reply"
"IngestPostFn" = "shekyl_ingest_post_fn"

[parse]
parse_deps = false
