# engine_decomposition_ratchet.conf
#
# Structural anti-drift baselines for the `Engine` composition root.
# Consumed by scripts/ci/check_engine_decomposition.sh.
# Policy: docs/design/ENGINE_COMPOSITION_DECOMPOSITION.md (+ rule 4X).
#
# The check FAILS in BOTH directions, exactly like .zeroize-allowlist:
#   - regression: a measured value EXCEEDS its ceiling, or a non-baselined
#     file crosses NEW_FILE_CAP  -> the monolith is re-forming.
#   - slack: a FILE dropped more than BAND below its ceiling without the
#     baseline being tightened -> a win was made but not locked in; lower
#     the number here so it can never grow back.
#
# Raising any ceiling is therefore a visible, reviewable diff in THIS file —
# that diff is the "demotion requires an explicit decision" gate. Nothing
# grows silently; every relaxation is a line a reviewer must approve.
#
# Baselines captured from dev @ 98a29a5 (2026-07-20). Ratchet them DOWN as
# transfer/ and StakeWorkflow extraction lands; never up without rationale.

# --- Engine<...> generic parameter count: FROZEN, not ratcheted (§1, §7) ---
PARAMS_MAX       7

# --- Engine top-level field count: ratchets down as §5 grouping lands ---
FIELDS_CEILING   16

# --- Any engine/*.rs NOT baselined below must stay at/under this ----------
NEW_FILE_CAP     2000

# --- Slack band (lines) for FILE ceilings before "tighten the baseline" ---
BAND             100

# --- Per-file ceilings: currently over NEW_FILE_CAP; can only decrease -----
FILE   local_pending_tx.rs   5420
FILE   stake_engine.rs       4749
FILE   refresh.rs            4366
FILE   lifecycle.rs          2783
FILE   local_refresh.rs      2676
FILE   local_keys.rs         2060
FILE   merge.rs              2036

# --- Test / bench / fault-injection scaffolding: not orchestration -------
# These are not the monolith concern; a growing test harness is not a
# re-forming god-object. Kept explicit (not glob-guessed) so the exclusion
# set is itself reviewable.
EXCLUDE   regtest_e2e.rs
EXCLUDE   test_support.rs
EXCLUDE   key_dispatch_bench.rs
EXCLUDE   tx_weight_kat.rs
EXCLUDE   fault_injecting_refresh.rs
EXCLUDE   fault_injecting_pending_tx.rs
EXCLUDE   synthetic_tree.rs
