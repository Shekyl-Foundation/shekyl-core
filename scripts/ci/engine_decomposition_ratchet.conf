# engine_decomposition_ratchet.conf
#
# Structural anti-drift baselines for the `Engine` composition root.
# Consumed by scripts/ci/check_engine_decomposition.sh.
# Policy: docs/design/ENGINE_COMPOSITION_DECOMPOSITION.md (+ rule 4X).
#
# The check FAILS in BOTH directions, exactly like .zeroize-allowlist:
#   - regression: a measured value EXCEEDS its ceiling, or a non-baselined
#     file crosses NEW_FILE_CAP  -> the monolith is re-forming.
#   - slack: a FILE dropped more than BAND below its ceiling without the
#     baseline being tightened -> a win was made but not locked in; lower
#     the number here so it can never grow back.
#
# Raising any ceiling is therefore a visible, reviewable diff in THIS file —
# that diff is the "demotion requires an explicit decision" gate. Nothing
# grows silently; every relaxation is a line a reviewer must approve.
#
# Baselines: transfer/ extraction (chore/transfer-from-local-pending-tx) removed
# the 5420-line local_pending_tx.rs monofile. Shim is tiny (under NEW_FILE_CAP);
# production lives under transfer/{types,support,engine,trait_impl}.rs; tests are
# EXCLUDE'd. Ratchet DOWN further as StakeWorkflow extraction lands; never up
# without rationale.

# --- Engine<...> generic parameter count: FROZEN, not ratcheted (§1, §7) ---
PARAMS_MAX       7

# --- Engine top-level field count: ratchets down as §5 grouping lands ---
FIELDS_CEILING   16

# --- Any engine/*.rs NOT baselined below must stay at/under this ----------
# 2000 → 1200 (chore/ffi-and-engine-size-debt): new modules may not re-form
# god-files without a reviewed FILE baseline. Pre-existing oversize modules
# are baselined below at their measured sizes and can only shrink.
NEW_FILE_CAP     1200

# --- Slack band (lines) for FILE ceilings before "tighten the baseline" ---
BAND             100

# --- Per-file ceilings: currently over NEW_FILE_CAP; can only decrease -----
# (local_pending_tx.rs monofile removed — shim only; no FILE baseline)
# stake_engine monofile removed (StakeWorkflow carve): production lives under
# engine/stake_engine/{types,helpers,actor,persona,bond,drain,claim,scan,retire,handle}.rs
# — each under NEW_FILE_CAP. Tests EXCLUDE'd as stake_engine/stake_engine_tests.rs.
# refresh.rs 4366 -> 4368, local_refresh.rs 2676 -> 2695, merge.rs
# 2036 -> 2057 (WI-RPC-3 proofs tranche, PR #365). Reviewed raises per
# the explicit-decision clause above. The lines are the spend-quadruple
# and retention-reconcile legs, each bound to its call site:
# local_refresh's two KeyImageObserved collection loops grow the
# containing-txid pairing (miner-tx lazy hash + the positional
# tx/tx_hash zip), merge's apply path threads the pair into
# detect_spends and runs the reconcile_tx_key_retention post-pass under
# the same write guard (I-2 atomicity — it cannot move out), and
# refresh's +2 are mandatory fixture fields in the inline
# refresh_driver_tests (the category stake_engine's note above already
# names). Deletion target: the refresh/merge workflow split extracts
# the inline test modules into EXCLUDE'd siblings and ratchets these
# back DOWN.
#
# refresh.rs 4368 -> 4256 (Phase 4c rescan, this PR): a ratchet DOWN, locking
# in two extractions. `Engine::start_rescan` landed in its own workflow file
# (engine/rescan.rs) instead of growing this one, and `RefreshSlot` /
# `SlotGuard` moved to engine/refresh_slot.rs — a single-flight primitive that
# two entry points now claim belongs to neither of them.
FILE   refresh.rs            4256
FILE   lifecycle.rs          2783
FILE   local_refresh.rs      2695
# local_keys.rs 2060 -> 2067 (SA-2 nested combiner, PR-SA-2). Reviewed raise per
# the explicit-decision clause: the two JoinMarket bond-signature test asserts
# gained the mandatory scheme domain argument (SA-R-2), which rustfmt expands to
# one-arg-per-line on the 4-arg verify chain. Test-only growth on an existing
# god-file; not new production accretion, and small.
FILE   local_keys.rs         2067
# merge.rs 2057 -> 2058 (Phase 4c rescan, this PR). Reviewed raise per the
# explicit-decision clause above, and the smallest one available: the reorg
# rewind now takes its expiry-classification height as an explicit argument
# rather than reading it back off a ledger the other caller has already
# zeroed. One line, at the call site, for a correctness fix that cannot be
# expressed without it.
FILE   merge.rs              2058


# --- Existing modules over NEW_FILE_CAP 1200 (baselined at drop 2000→1200) ---
# Ratchet DOWN when they shrink; raising any line needs the explicit-decision note.
FILE   emission_claim.rs            1969
FILE   pscan/scan_step.rs           1894
FILE   diagnostics.rs               1850
# Explicit decision (PR #416): +43 for the SendJournalBlock write sites and the
# lock re-derivation that landed on dev in 53b4ad2d3 / 37370cd32. Not
# orchestration growth — the journal became the lock's single owner, which is a
# net deletion of the F14 dual-write elsewhere in the file. Ratchet back down
# when the projections cut (PR-SJ-2) removes the transitional readers.
FILE   transfer/engine.rs           1761
# Explicit decision (PR-SM-1): +4. One line is the `message_signing`
# module declaration; three are `primary_address` switching from a bare
# `pqc_public_key[32..]` slice to the named `ml_kem_encap_key()` accessor,
# which deleted that literal offset from three call sites. Baseline moved
# rather than shaving an unrelated doc comment to fit — a ratchet you can
# only satisfy by degrading nearby code is measuring the wrong thing.
# Explicit decision (PR-SA-4): +1 net. Registration of `set_tx_note` (one
# locator comment + `pub mod`; no blank) — the annotation workflow lives
# in set_tx_note.rs (well under NEW_FILE_CAP). Composition root gains only
# the module registration, not Engine methods/fields
# (ENGINE_COMPOSITION_DECOMPOSITION.md §2: split by workflow).
FILE   mod.rs                       1560
FILE   error.rs                     1523
# Explicit decision (PR #416): +6 from the same dev landing (53b4ad2d3) — the
# send-journal write site on the pending path. Same reversion criterion as
# transfer/engine.rs above.
FILE   pending.rs                   1490
FILE   submit_lifecycle.rs          1405
FILE   backing_set.rs               1321
FILE   pscan/dispatch.rs            1226
FILE   pscan/accrual.rs             1219
FILE   pscan/task.rs                1206
# --- Test / bench / fault-injection scaffolding: not orchestration -------
# These are not the monolith concern; a growing test harness is not a
# re-forming god-object. Kept explicit (not glob-guessed) so the exclusion
# set is itself reviewable.
EXCLUDE   regtest_e2e.rs
EXCLUDE   test_support.rs
EXCLUDE   key_dispatch_bench.rs
EXCLUDE   tx_weight_kat.rs
EXCLUDE   fault_injecting_refresh.rs
EXCLUDE   fault_injecting_pending_tx.rs
EXCLUDE   synthetic_tree.rs
# Transfer pending-tx unit suite (was inline in local_pending_tx.rs monofile).
# Keyed by its ENGINE_DIR-relative path: the scan now reaches into transfer/, so
# a bare basename would be ambiguous against a future top-level file.
EXCLUDE   transfer/transfer_pending_tx_tests.rs
# Proofs workflow unit suite (was inline in proofs.rs; extracted so the
# NEW_FILE_CAP measures the workflow file, not its tests). `#[path]`
# child of `proofs::tests`, same pattern as the transfer suite above.
EXCLUDE   proofs_tests.rs
# Message-signing workflow unit suite (sibling of message_signing/; same
# pattern as proofs_tests — NEW_FILE_CAP measures the workflow, not tests).
EXCLUDE   message_signing/message_signing_tests.rs
# Stake-engine actor unit suite (was inline in stake_engine monofile).
EXCLUDE   stake_engine/stake_engine_tests.rs
