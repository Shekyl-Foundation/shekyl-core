#
# First set to 811 the same day — the file's exact size after extraction —
# and that was too tight to be useful: the next review-round fix added ten
# lines and tripped the gate on a file that had just shed 766. A ceiling with
# zero headroom does not protect the decomposition, it just converts every
# one-line change into an edit of THIS file, which is friction without
# safety. 900 keeps the win that matters (326 lines below the old ceiling,
# and the test suite permanently out of the production file) while sitting
# inside BAND, which is this config's own statement of how much headroom is
# acceptable before slack is called. Ratchet down again when the file next
# sheds real production weight — not to its byte count on a given afternoon.
