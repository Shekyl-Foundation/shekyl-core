[package]
name = "shekyl-ffi"
description = "FFI bridge between Shekyl's C++ core and Shekyl's Rust crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# `benches/relay_admission_fixture.rs` is a shared module `#[path]`-included by
# both bench targets, NOT a bench of its own. Autodiscovery would compile and
# run it as a third target -- a libtest harness over zero tests, whose only
# effect is CI time and a bench name that measures nothing. The two real
# targets are declared explicitly below.
autobenches = false

[lib]
name = "shekyl_ffi"
crate-type = ["staticlib", "rlib"]

[features]
default = []
multisig = ["shekyl-fcmp/multisig", "modular-frost"]

[dependencies]
shekyl-chacha = { path = "../shekyl-chacha" }
# `test-utils` enables the test-support `generate_ephemeral_keypair_for_tests`
# reached only via the `shekyl_pqc_keypair_generate` FFI export (F-7; C++ test
# suite). FOLLOWUPS: move to a separate test-only archive to gate it out of
# production.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq", features = ["test-utils"] }
shekyl-address = { path = "../shekyl-address" }
shekyl-encoding = { path = "../shekyl-encoding" }
shekyl-fcmp = { path = "../shekyl-fcmp" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
shekyl-consensus = { path = "../shekyl-consensus" }
shekyl-difficulty = { path = "../shekyl-difficulty" }
# RandomX v2 light-cache PoW verifier. Consumed by `pow_randomx_ffi.rs`
# (the `shekyl_pow_randomx_v2_*` exports) which is the consensus PoW
# verification boundary per `RANDOMX_V2_PHASE3_PLAN.md` §6. Default
# features only; the `internal-pool-bench` / `test-internals` features are
# never enabled in production builds.
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
shekyl-economics = { path = "../shekyl-economics" }
# (ARCHIVAL_REWARD_GATE_M1.md §4) — delete this feature at the §14.4 seal.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# Single-sourced CT cleartext balance equation (`shekyl_verify_ct_balance`
# general export in `ct_balance_ffi.rs`). Same crate the bond-post path reaches
# via archival-retention; depended on directly here for the no-bond-term shape.
shekyl-ct-balance = { path = "../shekyl-ct-balance" }
# `AtomicUnits` amount-newtype (`docs/completed/ATOMIC_UNITS_NEWTYPE.md`).
# FFI structs stay `#[repr(C)] u64`; this is used only to wrap raw `u64` at
# the `SpendInput`/`sign_transaction` edge (§4.3).
shekyl-units = { path = "../shekyl-units" }
shekyl-proofs = { path = "../shekyl-proofs" }
shekyl-tx-builder = { path = "../shekyl-tx-builder" }
shekyl-engine-file = { path = "../shekyl-engine-file" }
shekyl-engine-prefs = { path = "../shekyl-engine-prefs" }
shekyl-engine-state = { path = "../shekyl-engine-state" }
# Single-Rust-image contract: every binary links exactly one Rust archive,
# and that archive must carry the `shekyl_log_*` exports plus the one
# `tracing-core` GLOBAL_DISPATCH that this crate graph's `tracing::*`
# macros dispatch through. Folding shekyl-logging into shekyl-ffi makes
# `libshekyl_ffi.a` that single image for wallet-side binaries; without
# it, the forwarder installs into a standalone logging image while
# engine/fcmp events dispatch into this image's dispatcher and are
# silently dropped. See V3_WALLET_DECISION_LOG.md (single-image contract)
# and the nm gate in src/daemon/CMakeLists.txt.
shekyl-logging = { path = "../shekyl-logging" }
# Dandelion++ embargo / propagation-timeout (`dandelionpp_ffi.rs`, RP-4).
# Stem-map exports retired at RP-3a. The FFI owns the CSPRNG (`OsRng`); the
# measurement crate stays deterministic.
shekyl-relay-privacy = { path = "../shekyl-relay-privacy" }
# Live relay zone (RP-3a). The scheduling logic; this crate only marshals.
shekyl-relay = { path = "../shekyl-relay" }
# Levin payload compression (`levin_ffi.rs`): the C++ epee::levin compression
# shim reaches the Rust-pinned libzstd through these exports, making it the
# single zstd in the binary (system-libzstd link dropped).
shekyl-levin = { path = "../shekyl-levin" }
curve25519-dalek = "4"
postcard = { version = "1", features = ["alloc"] }
# OsRng for the testnet/fakechain raw-seed generation FFI. The feature set is
# minimal; we do not enable any of rand's derive or integration machinery.
rand = "0.8"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
zeroize = { workspace = true }
libc = "0.2"
dalek-ff-group = "0.5"
ciphersuite = "0.4"
modular-frost = { version = "0.11", features = ["ed25519"], optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
rand_core = { version = "0.6", features = ["std"] }
ec-divisors = { path = "../shekyl-oxide/crypto/divisors" }
multiexp = "0.4"
ciphersuite = "0.4"
helioselene = { path = "../shekyl-oxide/crypto/helioselene" }
shekyl-fcmp-proofs = { path = "../shekyl-fcmp-proofs" }
# §72.6: two instruments, two consumers. `criterion` is wall clock -- the `hop`
# input, and the arm that must run on BOTH the reference machine and the slow
# one. `gungraun` is hardware-independent instruction counts -- the CI drift
# gate that fires when the proof system moves, x86 only. Conflating them gives
# either a gate that flaps with runner hardware or a number that cannot be
# gated.
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.19"

[lints]
workspace = true

[[bench]]
name = "relay_admission_verify"
harness = false

[[bench]]
name = "relay_admission_verify_iai"
harness = false
