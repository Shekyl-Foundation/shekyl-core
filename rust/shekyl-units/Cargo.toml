[package]
name = "shekyl-units"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Foundational monetary-amount newtype (AtomicUnits) with checked-only arithmetic"
build = "build.rs"

[dependencies]
# `default-features = false`, direct pins rather than `workspace = true`, for
# the reason `shekyl-types` gives: this crate is `#![no_std]` + `alloc` so the
# vocabulary crate can carry an `AtomicUnits` field (`BondRecord.bonded_total`,
# DRS-E4 `ARW-Q8`) without losing its own `no_std` posture — Cargo ignores
# `default-features = false` on a workspace dep whose workspace entry enables
# defaults, and the workspace's serde/zeroize enable `std`. `alloc` on serde
# is for `String` on the wire form; `derive` on both is all the newtype needs.
zeroize = { version = "1.5", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `postcard_schema::Schema` is opt-in (mirrors `shekyl-types`): only crates that
# persist `AtomicUnits` inside a schema-snapshotted block (e.g. the P-scan
# accruals in `shekyl-engine-state`) enable the `schema` feature. Same `0.2` pin
# as the rest of the workspace's postcard-schema usage.
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "use-std"], optional = true }

[features]
schema = ["dep:postcard-schema"]

[build-dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
