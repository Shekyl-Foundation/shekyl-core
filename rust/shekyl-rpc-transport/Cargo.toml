[package]
name = "shekyl-rpc-transport"
version = "0.1.0"
# Vendored shekyl-oxide app crate: workspace path-dependency only, never published, on the
# un-vendor track — no external consumers, so no SemVer contract on its public surface.
publish = false
description = "RPC connection to a Shekyl daemon via simple-request, built around shekyl-oxide"
license = "BSD-3-Clause"
repository = "https://github.com/Shekyl-Foundation/shekyl-core"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Shekyl Foundation <dev@shekyl.org>"]
edition = "2021"
rust-version = "1.75"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
zeroize = { version = "^1.5", default-features = false, features = ["alloc", "std"] }
digest_auth = { version = "0.3", default-features = false }
simple-request = { version = "0.2", default-features = false, features = ["tls"] }
tokio = { version = "1", default-features = false }

shekyl-rpc-client = { path = "../shekyl-rpc-client", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros"] }
# Integration tests decode Bech32m addresses for generate_blocks (see tests/tests.rs).
shekyl-address = { path = "../shekyl-address" }
