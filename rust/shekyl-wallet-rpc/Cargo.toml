[package]
name = "shekyl-wallet-rpc"
description = "Shekyl-native wallet JSON-RPC server (Phase 4; Engine-backed)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "shekyl_wallet_rpc"
crate-type = ["lib"]

[[bin]]
name = "shekyl-wallet-rpc"
path = "src/main.rs"

[dependencies]
# The release version string (DC-Q20): the one crate that reads it.
shekyl-version = { path = "../shekyl-version" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
http = "1"
base64 = "0.22"
# Constant-time credential compare for HTTP basic auth (password is a
# secret under 35-secure-memory.mdc). Same pin as shekyl-scanner.
subtle = "2"
tracing = "0.1"
rand = "0.8"
hex = "0.4"
zeroize = { workspace = true }
shekyl-logging = { path = "../shekyl-logging" }
# The option table and its one load (`INPUT_GRAMMAR.md` IG-15, §12.4).
shekyl-options = { path = "../shekyl-options" }
shekyl-daemon-config = { path = "../shekyl-daemon-config" }
shekyl-engine-core = { path = "../shekyl-engine-core" }
shekyl-engine-file = { path = "../shekyl-engine-file" }
shekyl-engine-state = { path = "../shekyl-engine-state" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-rpc-transport = { path = "../shekyl-rpc-transport" }
shekyl-rpc-client = { path = "../shekyl-rpc-client", features = ["std"] }
shekyl-scanner = { path = "../shekyl-scanner" }
# WI-RPC-3 proofs: decode / network-check the counterparty address the
# proof binds to (canonical decoded-form comparison per the contract).
shekyl-address = { path = "../shekyl-address" }
shekyl-units = { path = "../shekyl-units" }
shekyl-types = { path = "../shekyl-types" }
# `Nullable<T>`: the required-nullable reply member (rule 43). `staking_info`
# fields whose `null` is an answer are required and decode a missing key as
# an error. Already in this crate's graph through engine-core; the
# daemon-identity tests also build replies from its real response types.
shekyl-rpc-types = { path = "../shekyl-rpc-types" }
shekyl-wallet-contract = { path = "../shekyl-wallet-contract" }
# The process hardening, the first statement of `main` (rule 35, DC-Q21):
# no core and no same-account tracer before an argument is read.
shekyl-process = { path = "../shekyl-process" }
# The account's effective user id: the start-up sweep removes only this
# account's stale socket directories.
shekyl-os-account = { path = "../shekyl-os-account" }

# WP-W2: the in-process host's named-pipe listener. The `unsafe`
# `create_with_security_attributes_raw` call and the owner-only descriptor
# live there (WP-D2 — this crate is `deny(unsafe_code)`); what is here is one
# `cfg(windows)` arm of `BoundListener` and an axum `Listener` adapter.
[target.'cfg(windows)'.dependencies]
shekyl-win-sec = { path = "../shekyl-win-sec" }

[dev-dependencies]
shekyl-rpc-transport = { path = "../shekyl-rpc-transport", features = ["test-override"] }
tokio = { version = "1", features = ["full", "test-util"] }
# The receive-row projection tests build a real `TransferDetails` through
# the scanner's `test-utils` constructor (same edge shekyl-engine-state's
# tests use); feature unification keeps the production edge unchanged.
shekyl-scanner = { path = "../shekyl-scanner", features = ["test-utils"] }
curve25519-dalek = { version = "4", features = ["alloc", "zeroize"] }
shekyl-curve-primitives = { path = "../shekyl-curve-primitives" }
# The startup-disclosure wiring test reads what `run_server` logs. The
# workspace already compiles this version (with more features) through
# shekyl-logging; feature unification makes this edge free.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# A spawned server's configuration file sits below no directory another
# account can write, as the file's check requires.
shekyl-os-account = { path = "../shekyl-os-account", features = ["test-fixture"] }
# Enable the engine-core `test-helpers` surface for this crate's tests only
# (the `__test_helpers::make_staker_for_test` staker constructor the WI-1 P-scan
# lifecycle test needs). Dev-dep self-referencing the same path dep so the
# feature is on for `cargo test`/`cargo clippy --all-targets` but never for the
# production dependency edge above (mirrors the shekyl-scanner precedent).
shekyl-engine-core = { path = "../shekyl-engine-core", features = ["test-helpers"] }
# The `operator_alarm` tests raise each condition through its real producer
# (the alarm crate's raise and clear are crate-private by design), and those
# producers take their inputs in these crates' vocabulary. The production
# edge reaches all three through shekyl-engine-core already.
shekyl-operator-alarm = { path = "../shekyl-operator-alarm" }
shekyl-p-host = { path = "../shekyl-p-host" }
shekyl-tor-control-wallet = { path = "../shekyl-tor-control-wallet" }

[target.'cfg(unix)'.dev-dependencies]
# `tests/stops.rs` names the signal a child died by.
libc = "0.2"

[lints]
workspace = true
