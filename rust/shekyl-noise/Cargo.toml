[package]
name = "shekyl-noise"
description = "Noise symmetric state and transport direction shared by the P2P and RPC transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
blake2 = { version = "0.10", default-features = false }
# The class byte's mask is one keystream byte of the ChaCha20 the AEAD
# already uses (RPC_CHANNEL.md section 4.4); the version chacha20poly1305 0.10
# depends on.
chacha20 = { version = "0.9", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { workspace = true }

[dev-dependencies]
# The cacophony NN vector drives the symmetric state through an X25519
# exchange. Direction does not, so the dependency stays off the production
# graph.
x25519-dalek = { version = "2", features = ["static_secrets"] }

[features]
# One rekey HKDF, for the P2P transport's C5 bench. The derived keys stay in
# this crate. That crate's `c5-bench` feature is the only enabler
# (CONSUMER_OWNED in check_test_only_features.py).
rekey-timing = []

[lints]
workspace = true
