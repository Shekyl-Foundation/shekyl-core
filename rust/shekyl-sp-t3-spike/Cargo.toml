[package]
name = "shekyl-sp-t3-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DISPOSABLE measurement spike: PD-F-2 Tor-borne shard-fetch dispersion (SP-T3). Not canonical; delete or rewrite before TJ-B."
publish = false

[dependencies]
# The serve endpoint itself — the production one. This crate used to carry its
# own near-identical copy; the two had already diverged (accept-error backoff on
# one side only), which for a measurement rig means measuring something other
# than what ships. It now drives `shekyl_p_serve` behind a fixture
# `ShardProvider`, so the inbound-hardening shape under test is the shipped one.
# `test-signer` arms the ephemeral attestation key the personas countersign
# with (`SF-D8`): this crate is a DISPOSABLE measurement rig, not a production
# graph, and `scripts/ci/check_p_fetch_dep_cut.py` asserts the feature stays
# out of every graph that ships.
shekyl-p-serve = { path = "../shekyl-p-serve", features = ["test-signer"] }
# The harness's own async plumbing (bring-up, timed fetches, teardown). The v3
# onion encoding that used to live here (and its ed25519-dalek/sha3/sha2
# deps) relocated to `shekyl-tor-control-client::onion_identity` — SPIKE-F-4
# completed. `zeroize` stays as a direct dep for the apparatus master seed.
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "macros", "sync"] }
# Speaks the control protocol directly (ADD_ONION, managed launch) — the client
# crate, not the wallet supervisor.
shekyl-tor-control-client = { path = "../shekyl-tor-control-client" }
# The per-apparatus onion-identity master seed (`harness::fresh_apparatus_seed`)
# is a cryptographic secret: wrap it in `Zeroizing` at mint (rule 35). Direct
# dep, same workspace pin as the rest of the tree — not a leftover of the
# relocated onion-encoding stack.
zeroize = { workspace = true }
# The harness holds the control actor's `ActorRef` to issue ADD_ONION; kameo is
# the workspace's actor stack, already pinned there.
kameo = { workspace = true }
# The per-apparatus derivation seed (`harness::fresh_apparatus_seed`): OS
# entropy, so no two apparatus instances ever publish the same `.onion`. Same
# crate and pin as `shekyl-p-fetch`'s request nonce.
getrandom = "0.2"
# The client leg: the **production** daemon fetch client (`SF-D5` header,
# `SF-D8` countersignature verify, `SF-D6` typed outcomes). `shekyl-p-transport`
# used to sit here; its `blocking_get` cannot carry the request header, so every
# fetch through it was the identical 404 once (a) landed. This crate is the one
# place both halves of the `SF-D4` dep cut are linked on purpose — it is a rig,
# not a shipped root, and `check_p_fetch_dep_cut.py` reads its roots from
# `BuildRust.cmake`, which never names this crate.
shekyl-p-fetch = { path = "../shekyl-p-fetch" }
# `PASS_ANCHOR_DEPTH_BLOCKS` — the one burial depth both sides of the apparatus
# anchor against, read from the same constant the verifier reads.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# `PSlot` — the persona identity the derivation binds to.
shekyl-types = { path = "../shekyl-types" }
# `derive_p_hs_id_seed` (+ `DerivationNetwork` / `SeedFormat`) — the production
# GF-9 HS-identity seed the onion encoding consumes (SPIKE-F-4 relocation).
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# `construct_leaf` — the shard fixture must be the leaf bytes a persona archives,
# not the compressed points the RPC returns (see src/bin/extract_shard.rs).
shekyl-fcmp = { path = "../shekyl-fcmp" }
# The extraction binary's JSON-RPC calls to the local regtest daemon. Loopback
# only, no persona involved, so it deliberately does NOT go through PTorClient.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The measurement binary's own temp DataDirectory (it is a binary dependency, not
# just a test one, so it is not in dev-dependencies).
tempfile = "3"

# NOTE: the binaries live in `bins/`, NOT Cargo's conventional `src/bin/`.
# The repo's `.gitignore` carries a bare `bin/` rule (line 88), which matches a
# directory named `bin` at ANY depth — including `src/bin/`. Binaries placed
# there are silently untracked: they build locally and vanish in CI. See the
# measurement report's SPIKE-F-9. Do not "tidy" these back into `src/bin/`
# without fixing the ignore rule first.
[[bin]]
name = "pd-f2-measure"
path = "bins/pd_f2_measure.rs"

[[bin]]
name = "serve-only"
path = "bins/serve_only.rs"

[[bin]]
name = "extract-shard"
path = "bins/extract_shard.rs"

[dev-dependencies]
# The live apparatus test drives the harness on a tokio runtime; the loopback
# client-leg test runs a SOCKS5h shim on it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
