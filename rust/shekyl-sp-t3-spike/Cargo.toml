[package]
name = "shekyl-sp-t3-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DISPOSABLE measurement spike: PD-F-2 Tor-borne shard-fetch dispersion (SP-T3). Not canonical; delete or rewrite before TJ-B."
publish = false

[dependencies]
# The serve endpoint: a loopback listener whose accept loop is decoupled from any
# actor mailbox and whose every read step is timeout-bounded (the SP-T3 inbound
# threat model, ARCHIVAL_BOND_2D2_TRANSPORT_PLAN.md §6a). Hand-rolled over
# `tokio::net` rather than an HTTP framework: the response must be byte-identical
# across personas down to the header set, which is precisely what a framework's
# defaults (Server, Date, ETag) take out of our hands.
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "macros", "sync"] }
# The onion surface (D1) and the managed-tor lifecycle the measurement rides.
shekyl-tor = { path = "../shekyl-tor" }
# The harness holds the control actor's `ActorRef` to issue ADD_ONION; kameo is
# the workspace's actor stack, already pinned there.
kameo = { workspace = true }
# The client leg: per-persona SOCKS isolation + the bounded `blocking_get`.
shekyl-p-transport = { path = "../shekyl-p-transport" }
# `PCanonicalId` / `PSlot` — the persona identity the derivation binds to.
shekyl-types = { path = "../shekyl-types" }
# `derive_p_hs_id_seed` (+ `DerivationNetwork` / `SeedFormat`) — the production
# GF-9 HS-identity seed the onion encoding consumes (SPIKE-F-4 relocation).
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# `construct_leaf` — the shard fixture must be the leaf bytes a persona archives,
# not the compressed points the RPC returns (see src/bin/extract_shard.rs).
shekyl-fcmp = { path = "../shekyl-fcmp" }
# The extraction binary's JSON-RPC calls to the local regtest daemon. Loopback
# only, no persona involved, so it deliberately does NOT go through PTorClient.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The measurement binary's own temp DataDirectory (it is a binary dependency, not
# just a test one, so it is not in dev-dependencies).
tempfile = "3"

# NOTE: the binaries live in `bins/`, NOT Cargo's conventional `src/bin/`.
# The repo's `.gitignore` carries a bare `bin/` rule (line 88), which matches a
# directory named `bin` at ANY depth — including `src/bin/`. Binaries placed
# there are silently untracked: they build locally and vanish in CI. See the
# measurement report's SPIKE-F-9. Do not "tidy" these back into `src/bin/`
# without fixing the ignore rule first.
[[bin]]
name = "pd-f2-measure"
path = "bins/pd_f2_measure.rs"

[[bin]]
name = "serve-only"
path = "bins/serve_only.rs"

[[bin]]
name = "extract-shard"
path = "bins/extract_shard.rs"

[dev-dependencies]
# The live apparatus test drives the harness on a tokio runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
