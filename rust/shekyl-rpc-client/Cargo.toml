[package]
name = "shekyl-rpc-client"
version = "0.1.0"
# Vendored shekyl-oxide app crate: a workspace path-dependency only, never published to
# crates.io, and on the un-vendor track (Track B relocates/renames it). It has no external
# downstream consumers, so its public surface carries no SemVer contract — API changes
# during un-vendoring (e.g. removing the block/tx RPC methods) are not breaking changes.
publish = false
description = "Trait for an RPC connection to a Shekyl daemon, built around shekyl-oxide"
license = "MIT"
repository = "https://github.com/Shekyl-Foundation/shekyl-core"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Shekyl Foundation <dev@shekyl.org>"]
edition = "2021"
rust-version = "1.75"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
std-shims = { version = "0.1.4", default-features = false }

thiserror = { version = "2", default-features = false }

zeroize = { version = "^1.5", default-features = false, features = ["zeroize_derive"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

shekyl-curve-io = { path = "../shekyl-curve-io", default-features = false }

[features]
std = [
  "std-shims/std",

  "thiserror/std",

  "zeroize/std",
  "hex/std",
  "serde/std",
  "serde_json/std",

  "shekyl-curve-io/std",
]
default = ["std"]
