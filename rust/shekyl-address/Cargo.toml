[package]
name = "shekyl-address"
description = "Network-aware Bech32m address encoding for Shekyl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shekyl-encoding = { path = "../shekyl-encoding" }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
shekyl-network = { path = "../shekyl-network" }
bech32 = "0.11"
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# Reads docs/test_vectors/MULTISIG_FINGERPRINT_V2.json in the fingerprint KAT.
# Already in Cargo.lock as a workspace dependency (17-dependency-discipline).
serde_json = { workspace = true }

[features]
default = []
serde = ["dep:serde", "shekyl-network/serde"]

[lints]
workspace = true
