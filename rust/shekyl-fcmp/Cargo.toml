[package]
name = "shekyl-fcmp"
description = "FCMP++ full-chain membership proofs with Shekyl PQC extensions (4-scalar leaf)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Shekyl-first typed primitives. `KeyImage` is the canonical typed wrapper
# for 32-byte key-image bytes; `verify` takes `&[KeyImage]` so callers
# cannot accidentally pass arbitrary `[u8; 32]` payloads (commitments,
# pseudo-outs, hashes) where a key image is required.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# The proof takes the tree root and the message it proves over by type
# (`CurveTreeRoot`, `TxSignableHash`; `DOMAIN_BINDING_RATCHET.tsv`).
# `CurveTreeRoot::EMPTY` is pinned as bytes there so the store can name the
# empty tree without this crate; `tests/empty_root_kat.rs` is what stops that
# pin drifting from `SELENE_HASH_INIT` (S-CHAIN-W §3.4).
shekyl-types = { path = "../shekyl-types" }
# First-party FCMP++ proof + generator crates (relocated out of shekyl-oxide in the
# un-vendor; no longer tracked upstream).
shekyl-fcmp-proofs = { path = "../shekyl-fcmp-proofs", default-features = false, features = ["std", "compile-time-generators"] }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
# Vendored FCMP++ research crypto, kept pristine and tracked in
# Shekyl-Foundation/monero-oxide (workspace-excluded; A1 content gate).
helioselene = { path = "../shekyl-oxide/crypto/helioselene" }
generalized-bulletproofs = { path = "../shekyl-oxide/crypto/generalized-bulletproofs" }
dalek-ff-group = "0.5"
ciphersuite = "0.4"
multiexp = "0.4"
ec-divisors = { path = "../shekyl-oxide/crypto/divisors", features = ["ed25519"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

# Crypto primitives
zeroize = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }
# The verify's batch weights (ruling R3, CEN-I15): a `ChaCha20Rng` seeded by
# `shekyl_crypto_hash::cshake256_32` over every value the verify reads, in
# place of `OsRng`. Both already in the workspace lockfile.
rand_chacha = { workspace = true }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }

# FROST multisig (optional)
transcript = { package = "flexible-transcript", version = "0.3", features = ["recommended"], optional = true }
modular-frost = { version = "0.11", features = ["ed25519"], optional = true }
# The dealer split of a new group's `y_group` (`frost_sal::dealer_split`): the
# same publisher and pin family as `modular-frost`, already in the lockfile as
# its optional dependency.
dkg-dealer = { version = "0.6", default-features = false, features = ["std"], optional = true }

tracing = "0.1"
thiserror.workspace = true
serde.workspace = true

[dev-dependencies]
rand = "0.8"
# `PqcKeyScalar`'s manual `Deserialize` is a refuse-don't-reduce boundary
# check; its refusal test exercises it through a real serde format.
serde_json = "1"
modular-frost = { version = "0.11", features = ["ed25519", "tests"] }
transcript = { package = "flexible-transcript", version = "0.3", features = ["recommended"] }
rand_chacha = "0.3"

[features]
default = ["std"]
std = []
multisig = ["shekyl-fcmp-proofs/multisig", "dep:transcript", "dep:modular-frost", "dep:dkg-dealer"]

[lints]
workspace = true
