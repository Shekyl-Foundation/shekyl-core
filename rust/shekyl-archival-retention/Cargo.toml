[package]
name = "shekyl-archival-retention"
description = "Archival serve-credit challenge replay and segment Merkle path verification (docs/design/ARCHIVAL_RETENTION_GATE2.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
sha3 = { version = "0.10", default-features = false }
shekyl-fcmp = { path = "../shekyl-fcmp" }
shekyl-curve-io = { path = "../shekyl-curve-io" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
curve25519-dalek = "4"
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
# Single-sourced RCT balance equation + typed-side terms (bond_rct_balance wraps
# this; construct uses the same definitions — ARCHIVAL_BOND_CONSTRUCTION.md §7.2).
shekyl-rct-balance = { path = "../shekyl-rct-balance" }
shekyl-units = { path = "../shekyl-units" }

[build-dependencies]
serde_json = { workspace = true }

# CT-4 assembled-path KAT cross-check (gate-2 §10 step 1).
[dev-dependencies]
shekyl-curve-tree = { path = "../shekyl-curve-tree" }
serde_json = { workspace = true }
# ARCHIVAL_P_DERIVE_V1 p_canonical_id cross-check: derive `P` via
# `shekyl-crypto-pq::archival_p` and confirm `id::p_canonical_id_from_hybrid_pubkey`
# reproduces the KAT-pinned value (the second of the two independent cSHAKE256
# paths the crypto-pq KAT establishes).
hex = "0.4"

[lints]
workspace = true
