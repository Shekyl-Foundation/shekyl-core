[package]
name = "shekyl-staking-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-based staker-archival coverage simulation (docs/design/STAKER_ARCHIVAL_SIM.md; gate4 fine sweep + L8–L16)"

# NOTE: this crate intentionally does NOT set `[lints] workspace = true`.
# Like `shekyl-economics-sim`, it is a numeric simulation harness (not
# consensus/crypto code), so the workspace's strict cast/float clippy denies
# (cast_precision_loss, float_cmp, ...) would be pure friction here. The crate
# is excluded from the consensus-critical lint surface by the same reasoning
# the economics sim is.

[dependencies]
serde = { workspace = true }
serde_json = "1"
shekyl-archival-retention = { path = "../shekyl-archival-retention" }

# The funding-seam standoff draw + its conformance instruments are
# single-sourced in `shekyl-standoff`; the sim's `run()` does not call the draw
# in production logic, so this is a dev-only dependency (the `conformance`
# feature pulls the float grading + self-cert harness for the smoke test that
# the sim's `SplitMix64` conforms through the shared `certify_draw`).
[dev-dependencies]
shekyl-standoff = { path = "../shekyl-standoff", features = ["conformance"] }
