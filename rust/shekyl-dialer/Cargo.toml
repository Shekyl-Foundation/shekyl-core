[package]
name = "shekyl-dialer"
description = "The outbound dialer and the session layer's peers owner: which address to dial next and why, the pending attempts, the retries within a test, and the lists peers send. Over shekyl-peerlist and shekyl-p2p-session (P2P_3_SLICE_3_DIALER_BRIEF.md; P2P_3_REMNANT_CUTOVER_BRIEF.md section 2.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shekyl-peerlist = { path = "../shekyl-peerlist" }
# The session layer: the dial, the handshake, the board and the owner
# hooks this crate implements.
shekyl-p2p-session = { path = "../shekyl-p2p-session" }
shekyl-capped-stream = { path = "../shekyl-capped-stream" }
# The peer-list entry the layer's hooks carry.
shekyl-levin = { path = "../shekyl-levin" }
shekyl-onion-v3 = { path = "../shekyl-onion-v3" }
# The wake is an owner of the daemon's one timing engine.
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
# Each connector's dial profile: the targets, the bound, the retry and
# cooldown ladders, the window and the wake spacing.
shekyl-transport-layer = { path = "../shekyl-transport-layer" }
# A failed address-file write is logged, not lost.
tracing = "0.1"
# The cancel signal of a dial attempt, and `select` so the attempt and the
# cancel are one race. The session layer already depends on tokio.
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt"] }
# The RNG seam the draws are generic over.
shekyl-draw-rng = { path = "../shekyl-draw-rng" }

[features]
# Test seams only. A setter for a connector's in-flight bound, so a test can
# run the dialer at a bound above the protocol's, and a non-consuming wait
# for a posted result. No production crate turns this on; the bound is
# protocol data (rule 71).
test-seams = []

[dev-dependencies]
# This crate with its test seams, for the integration tests.
shekyl-dialer = { path = ".", features = ["test-seams"] }
# The seeded reference generator, for the tests only.
shekyl-draw-rng = { path = "../shekyl-draw-rng", features = ["splitmix"] }
# The owner's test rig: the session layer over its in-memory peer, with a
# manual clock.
shekyl-p2p-session = { path = "../shekyl-p2p-session", features = ["harness"] }
shekyl-peer-policy = { path = "../shekyl-peer-policy" }
# The connectors' own tables: a fake dialer answers as a connector would.
shekyl-clearnet = { path = "../shekyl-clearnet" }
shekyl-tor = { path = "../shekyl-tor" }
# A directory of its own for each address-file test.
tempfile = "3"
# The idle-wake warning is asserted from the log line.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# A test dial carries a real gap sender, a tokio oneshot, as the connectors do.
tokio = { version = "1", default-features = false, features = ["sync"] }

[lints]
workspace = true
