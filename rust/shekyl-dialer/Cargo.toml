[package]
name = "shekyl-dialer"
description = "The outbound dialer: which address to dial next and why, the pending attempts, the failed-address memory and the self-connection nonces. Over shekyl-peerlist; the C++ reaches it only through shekyl-ffi (P2P_3_SLICE_3_DIALER_BRIEF.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shekyl-peerlist = { path = "../shekyl-peerlist" }
# The RNG seam the draws are generic over, and the two outbound targets
# (`MIN_PROVISIONED_OUT_PEERS`, `P2P_DEFAULT_OUT_PEERS`). The seam moves to
# `shekyl-draw-rng` when that crate lands on `dev`.
shekyl-relay-privacy = { path = "../shekyl-relay-privacy" }

[lints]
workspace = true
