# 44932808209, at shekyl-core 6bef7f0fbd (pull request #1500), the layers
# named by that commit's `forge --layers`. Its blocks and corpus are the
# ones pinned at CF-3's 7e1f143424 (run 44857446184, digest
# sha256:568aca6c…a300); the trace moves with its version, carrying the
# tables digest at the chain's three indexed events.
