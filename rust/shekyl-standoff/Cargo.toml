[package]
name = "shekyl-standoff"
description = "Funding-seam entry-standoff draw, single-sourced and build-float-free, with feature-gated conformance instruments (docs/design/ARCHIVAL_FIREWALL_GATE6.md §10.12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default build is the draw + plan only: float-free, dependency-free, the path
# a wallet ships. `conformance` pulls the statistics utility and compiles the
# grading + self-certification machinery (test/diagnostic only).
default = []
conformance = ["dep:shekyl-stats"]
# GF-7 measurement-hook seam (`docs/design/ARCHIVAL_BOND_2C_GF7_HOOKS.md` §3/§4):
# the `BroadcastTimelineObserver` trait + the three-axis `TimelineEvent`
# vocabulary. NEVER default — release artifacts build with this off (the §4
# layer-3 no-emit containment, same shape as `conformance` above); the only
# recording impl lives in `shekyl-staking-sim` (layer 2, CI dependency-graph
# asserted). Adds no dependencies: the seam is inert by type (layer 1).
gf7-hooks = []
# DEFAULT_EXIT_GAP_WINDOW unsealed-sentinel acknowledgment (F-D4 §5.4,
# ARCHIVAL_EXIT_STANDOFF_FD4_WINDOW.md; the k_cover.rs shape). While the
# window is the provisional sentinel, src/exit.rs refuses to compile without
# this explicit acknowledgment — the shipping guard is the compile refusal.
# DELETE at the Phase 7.7 seal, together with every consumer acknowledgment
# line (deletion target named in the spec §5.4).
provisional-exit-gap-window = []
# Exit-window KAT-injection constructor (`ExitGapWindow::kat_inject`) for tests
# and conformance arms. PERMANENT (unlike provisional-exit-gap-window): the
# fixtures must survive the §5.4 seal, so this feature does not ride the
# provisional flag. Approved consumers: dev-dependencies, and the
# `shekyl-staking-sim` measurement harness (the F-D4 §8 sweep parameterizes
# the window per swept row; the sim is a standalone binary outside every
# production graph — layer 2 of the no-emit guard). Never enable from a
# wallet or consensus crate.
exit-window-kat = []

[dependencies]
shekyl-stats = { path = "../shekyl-stats", optional = true }

# Integration tests and doc-tests build this crate as a dependency of
# themselves, so the provisional-exit-gap-window acknowledgment must ride the
# dev graph explicitly (delete with the feature at the seal). exit-window-kat
# is permanent and dev-only — this line is how the KAT constructor stays out
# of production graphs.
[dev-dependencies]
shekyl-standoff = { path = ".", features = ["provisional-exit-gap-window", "exit-window-kat"] }

[lints]
workspace = true
