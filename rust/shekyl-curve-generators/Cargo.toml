[package]
name = "shekyl-curve-generators"
version = "0.4.0"
description = "Shekyl's hash to point function and generators"
license = "BSD-3-Clause"
repository = "https://github.com/Shekyl-Foundation/shekyl-core"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Shekyl Foundation <dev@shekyl.org>"]
edition = "2021"
rust-version = "1.66"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
std-shims = { version = "0.1.5", default-features = false }

subtle = { version = "^2.4", default-features = false }

sha3 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }

group = { version = "0.13", default-features = false, features = ["alloc"] }
ciphersuite = { version = "0.4", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
crypto-bigint = { version = "0.5", default-features = false, features = ["alloc"] }
dalek-ff-group = { version = "0.5", default-features = false }
helioselene = { path = "../shekyl-oxide/crypto/helioselene", version = "0.1", default-features = false }

generalized-bulletproofs = { path = "../shekyl-oxide/crypto/generalized-bulletproofs", default-features = false }
full-chain-membership-proofs = { path = "../shekyl-oxide/crypto/fcmps", default-features = false }

shekyl-curve-io = { path = "../shekyl-curve-io", version = "0.1", default-features = false }

[dev-dependencies]
hex = "0.4"

[features]
std = [
  "std-shims/std",

  "subtle/std",

  "sha3/std",
  "blake2/std",

  "ciphersuite/std",
  "dalek-ff-group/std",
  "helioselene/std",

  "generalized-bulletproofs/std",

  "shekyl-curve-io/std"
]
default = ["std"]
