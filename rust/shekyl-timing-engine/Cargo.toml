[package]
name = "shekyl-timing-engine"
description = "P2P timing engine: time-ordered wake hints and the one-thread service around them. No sockets and no async runtime. The thread is a shekyl-thread-ledger row."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The thread ledger only. This crate does not build a runtime.
shekyl-thread-ledger = { path = "../shekyl-thread-ledger" }

[dev-dependencies]
# Already pinned in the workspace lockfile. The model test is the
# scheduler's evidence; the bench is the input to D5's engine-thread budget.
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wake_hints"
harness = false

[lints]
workspace = true
