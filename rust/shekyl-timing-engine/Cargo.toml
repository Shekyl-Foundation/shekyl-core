[package]
name = "shekyl-timing-engine"
description = "P2P timing engine: time-ordered wake hints and the one-thread service around them. No sockets. The thread is not an async runtime. An async home waits on the slot's waker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The thread ledger. This crate does not build a runtime.
shekyl-thread-ledger = { path = "../shekyl-thread-ledger" }
# The awake-time waits sleep on tokio's timer (`wait`). Its `time` feature
# alone, from the tokio already in Cargo.lock.
tokio = { version = "1", default-features = false, features = ["time"] }

# The awake-time source on Windows: the unbiased interrupt time
# (`MonotonicClock`). Already in the lockfile, at the version the workspace's
# other Windows crates use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_WindowsProgramming"] }

[dev-dependencies]
# The waits' tests pause tokio's time and jump it.
tokio = { version = "1", default-features = false, features = ["time", "rt", "macros", "test-util"] }
# Already pinned in the workspace lockfile. The model test is the
# scheduler's evidence; the bench is the input to D5's engine-thread budget.
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wake_hints"
harness = false

[lints]
workspace = true
