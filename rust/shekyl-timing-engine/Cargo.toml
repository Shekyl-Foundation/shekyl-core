[package]
name = "shekyl-timing-engine"
description = "P2P timing-engine core: time-ordered wake hints, generation drop, and lateness. No sockets and no event loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
# Already pinned in the workspace lockfile. The model test is the
# scheduler's evidence; the bench is the input to D5's engine-thread budget.
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wake_hints"
harness = false

[lints]
workspace = true
