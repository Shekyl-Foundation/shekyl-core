[package]
name = "shekyl-transport-layer"
description = "P2P transport layer logic: connector declarations, the stack plan, socket admission, and the ban list. No sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The cold-first-contact measurement build only (Rick, 2026-10-14): the
# Tor dial and gap deadlines lifted to 120 s, so the distributions they are
# derived from are read uncensored. Never a runtime option, never in a
# release build: only CMake's SHEKYL_MEASUREMENT_SPANS turns it on, and
# scripts/ci/check_measurement_spans.py holds that.
measurement-spans = []

[dependencies]
shekyl-net-address = { path = "../shekyl-net-address" }
shekyl-onion-v3 = { path = "../shekyl-onion-v3" }
shekyl-p2p-transport = { path = "../shekyl-p2p-transport" }
shekyl-peer-policy = { path = "../shekyl-peer-policy" }
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
shekyl-relay-privacy = { path = "../shekyl-relay-privacy" }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
