# Clippy configuration for the workspace (`cargo clippy --all-targets -- -D
# warnings` reads this beside `[workspace.lints.clippy]` in Cargo.toml).

# `result_large_err` fires when an `Err` arm exceeds this many bytes (default
# 128). Two consensus fault types carry a pair of `RuleSet`s **by value** in
# their rule-set-mismatch arm — `shekyl_chain_rules::Stale::RuleSet` and the
# store's `connect` mismatch — because a Fakechain `Fixed` target reuses
# `RuleSetId::GENESIS`, so ids cannot tell two rule sets apart (fault.rs).
# `RuleSet` gains a parameter with each E6 slice (slice 4 took it to five,
# 144 bytes for the pair), and both faults are `Copy`, which their drivers
# rely on. Raising the threshold records the decision once rather than as an
# `#[expect]` on every function that returns either fault.
large-error-threshold = 256
