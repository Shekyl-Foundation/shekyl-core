[package]
name = "shekyl-bulletproofs"
version = "0.1.0"
description = "Bulletproofs(+) range proofs, as defined by the Shekyl protocol"
license = "BSD-3-Clause"
repository = "https://github.com/Shekyl-Foundation/shekyl-core"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Shekyl Foundation <dev@shekyl.org>"]
edition = "2021"
rust-version = "1.67"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
std-shims = { version = "0.1.5", default-features = false }

thiserror = { version = "2", default-features = false }

rand_core = { version = "0.6", default-features = false }
zeroize = { version = "^1.5", default-features = false, features = ["zeroize_derive"] }

# Cryptographic dependencies
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

# Other Shekyl dependencies
shekyl-curve-io = { path = "../shekyl-curve-io", version = "0.1", default-features = false }
shekyl-curve-generators = { path = "../shekyl-curve-generators", version = "0.4", default-features = false }
shekyl-curve-primitives = { path = "../shekyl-curve-primitives", version = "0.1", default-features = false }

# The derived-weight batch verify (`derived.rs`, CEN-H19, ruling R3): the
# weights are a `ChaCha20Rng` seeded by `shekyl_crypto_hash::cshake256_32` over
# the batch. Both are already workspace dependencies (rand_chacha 0.3.1 is the
# workspace's deterministic CSPRNG; shekyl-crypto-hash is the one audited
# keccak/cSHAKE home), so the lockfile gains no package. Optional because
# shekyl-crypto-hash is a `std` crate: the module and both edges ride `std`.
shekyl-crypto-hash = { path = "../shekyl-crypto-hash", optional = true }
rand_chacha = { workspace = true, optional = true }

[build-dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
shekyl-curve-generators = { path = "../shekyl-curve-generators", version = "0.4", default-features = false }

[dev-dependencies]
hex-literal = { version = ">= 0.4, <= 1", default-features = false }

[features]
std = [
  "std-shims/std",

  "thiserror/std",

  "rand_core/std",
  "zeroize/std",

  "shekyl-curve-io/std",
  "shekyl-curve-generators/std",
  "shekyl-curve-primitives/std",

  "dep:shekyl-crypto-hash",
  "dep:rand_chacha",
]
compile-time-generators = ["curve25519-dalek/precomputed-tables"]
default = ["std", "compile-time-generators"]
