[package]
name = "shekyl-relay"
description = "Live daemon relay scheduler: owns the Dandelion++ zone state and drives the timing primitives from shekyl-relay-privacy. Separate from that crate because a zone actor chooses peers and reaches transport, which its scope boundary forbids."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The timing primitives and the stem map. This crate drives them; it does not
# reimplement them. Note the dependency direction: primitives stay
# dependency-light and synchronous, which is what keeps the force-step entry
# points — and therefore the 33-test oracle — available (DAEMON_RELAY_PRIVACY.md
# §18.1).
shekyl-relay-privacy = { path = "../shekyl-relay-privacy" }
# The RNG seam the zone's draws are generic over. `owner::SecureRelayRng`
# is the daemon's CSPRNG behind it.
shekyl-draw-rng = { path = "../shekyl-draw-rng" }
# The owner's seat: `RelayOwner`, `Established`, `Taken`, `Message`
# (`P2P_3_REMNANT_CUTOVER_BRIEF.md` §2.1, §7). Owners sit above sessions;
# the session crate never names this one.
shekyl-p2p-session = { path = "../shekyl-p2p-session" }
# The relay's messages and the carrier's windows are built here and
# nowhere else (brief §2.1, "Relay dispatch").
shekyl-levin = { path = "../shekyl-levin" }
# Every wake is a timing-engine owner (brief §2 rule 7): the zone's
# `next_wake` is armed on an `OwnerClass::Relay` handle.
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
# The owner is one task: its inbox, the node's sync watch, the verdict watch.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync"] }
# `OsRng` for `SecureRelayRng`. Pinned per crate; the workspace has no
# `rand` entry (rule 17 §1).
rand = "0.8"
# The seam's byte-pinned vocabulary (`RelayMethod`, `NetZone`) lives below both
# this crate and the daemon store (rule 18; DRS-E1 S-POOL `SPL-Q6`).
shekyl-types = { path = "../shekyl-types" }
# The connector declaration table. Hop 0 reads a row of it; this crate does
# not name a connector in a match.
shekyl-transport-layer = { path = "../shekyl-transport-layer" }
# The daemon installs one process-wide subscriber (`shekyl-logging`). An
# `error` here is the hop-0 pool report; it is not a second logger.
tracing = "0.1"

[dev-dependencies]
# The origin-budget pin reads `RecoveryBudget::for_cap`'s cycle count.
# The feature stays off the production dependency: dependents do not
# build the conformance instruments.
shekyl-relay-privacy = { path = "../shekyl-relay-privacy", features = ["conformance"] }
# `SplitMix64`, for the unit tests only. Not a grader feature.
shekyl-draw-rng = { path = "../shekyl-draw-rng", features = ["splitmix"] }
# The owner's tests drive it from the far side of the session layer's
# in-memory peer (`tests/owner.rs`).
shekyl-p2p-session = { path = "../shekyl-p2p-session", features = ["harness"] }
shekyl-peer-policy = { path = "../shekyl-peer-policy" }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
# The fleet's learn-latency reading (DAEMON_RELAY_PRIVACY.md §97): the
# relay's debug lines name each batch's transactions by short id, so one
# transaction is followed from the origin's log to each receiver's. Empty,
# and built only by the measurement binary (cmake/BuildRust.cmake,
# `SHEKYL_MEASUREMENT_SPANS`): a shipped node's log must not name the
# transactions it originated or where it first sent them. A Cargo edge
# would fail `scripts/ci/check_measurement_spans.py`.
measurement-spans = []

[lints]
workspace = true
