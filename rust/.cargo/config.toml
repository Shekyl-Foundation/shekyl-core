# +crt-static for the MSVC target family. Rust otherwise links the dynamic
# CRT, and the cc-built C objects inside the staticlibs follow this feature
# (/MT). The feature selects libcmt in every profile, debug included.
# CMake requires -DSTATIC=ON and rewrites /MD to /MT on Debug, Release,
# RelWithDebInfo and MinSizeRel (CMakeLists.txt); Debug's /MDd becomes
# /MTd, which is the static triplet's debug libraries and not libcmt.
# Cargo reads this file because CMake runs cargo from this directory
# (cmake/BuildRust.cmake, WORKING_DIRECTORY ${RUST_SOURCE_DIR}), and so
# does every direct cargo invocation here. That cmake file lists this path
# in _shekyl_rust_deps, so an edit rebuilds the archives. An environment
# RUSTFLAGS replaces these flags; the build sets none for an MSVC target.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
