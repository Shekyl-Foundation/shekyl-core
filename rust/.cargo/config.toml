# Every Rust crate linked into a Windows MSVC binary links the static C
# runtime, as the C++ does (`CMakeLists.txt`: under MSVC, `STATIC` is on by
# default and replaces `/MD` with `/MT`). Rust defaults to the dynamic
# runtime on MSVC, and the `cc`-built C objects inside the Rust staticlibs
# follow the target's `crt-static` feature. A mixed image warned LNK4098 at
# every link and worked only while no allocation crossed the boundary (Rick,
# 2026-10-19). Set once here, where cargo reads it: CMake runs cargo from
# this directory (`cmake/BuildRust.cmake`, WORKING_DIRECTORY
# ${RUST_SOURCE_DIR}), and so does every direct `cargo` invocation. An
# environment RUSTFLAGS would replace these flags, and nothing in the build
# sets one for an MSVC target. A non-static MSVC build is refused at
# configure time (`CMakeLists.txt`), since it would mix the runtimes the
# other way.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
