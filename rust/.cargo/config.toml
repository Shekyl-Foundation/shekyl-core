# +crt-static for the MSVC target family. Rust otherwise links the dynamic
# CRT, and the cc-built C objects inside crates follow this feature (/MT).
# The feature selects libcmt in every profile, debug included, so the
# Windows binaries need no Visual C++ runtime beside them.
# Cargo reads this file because CMake runs cargo from this directory
# (cmake/BuildRust.cmake, WORKING_DIRECTORY ${RUST_SOURCE_DIR}), and so
# does every direct cargo invocation here. An environment RUSTFLAGS
# replaces these flags; the build sets none for an MSVC target.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
