# The crypto closure: every registry package on a proving, signing, wiping,
# RNG or seed path, at the version core's test vectors, KATs and
# constant-time harness ran against, with the reason it is here.
#
# Checked by scripts/ci/check_crypto_closure.py:
#   - every lock (rust/Cargo.lock, each rust/*/fuzz/Cargo.lock, and the GUI
#     wallet's src-tauri/Cargo.lock) carries each package below on its
#     compatibility line at exactly this version, or not at all;
#   - `--complete`: this list is the closure, no more and no less: the
#     registry packages a local crate reaches through a normal edge from a
#     package named in `roots`, walking normal and build edges (a held
#     crate's build script chooses what compiles: curve25519-dalek's picks
#     its SIMD cfgs through rustc_version), a derive recorded and its
#     compiler toolchain not walked.
#
# Moving a version here is a review, not a refresh: read the change at
# source against .cursor/rules/30-cryptography.mdc and 35-secure-memory.mdc,
# and run the KATs, the pinned FCMP++ vectors and the checkct rows on it
# (rule 17). A new primitive dependency adds its name to `roots` in the
# change that adds it.

roots = [
    "aes",
    "argon2",
    "bip39",
    "blake2",
    "chacha20",
    "chacha20poly1305",
    "cipher",
    "ciphersuite",
    "crypto-bigint",
    "curve25519-dalek",
    "dalek-ff-group",
    "dkg-dealer",
    "ed25519-dalek",
    "ff",
    "fips203",
    "fips204",
    "fips205",
    "flexible-transcript",
    "fn-dsa",
    "fn-dsa-comm",
    "fn-dsa-kgen",
    "fn-dsa-sign",
    "fn-dsa-vrfy",
    "generic-array",
    "getrandom",
    "group",
    "hkdf",
    "hmac",
    "modular-frost",
    "multiexp",
    "poly1305",
    "rand",
    "rand_chacha",
    "rand_core",
    "sha2",
    "sha3",
    "std-shims",
    "subtle",
    "x25519-dalek",
    "zeroize",
]

