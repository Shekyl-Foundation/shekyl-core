reason = "Byte casts inside ppv-lite86, under rand_chacha. 0.8.64 admitted after diffing the three surfaces ppv-lite86 0.2.21 uses (src/soft.rs, generic.rs, x86_64/): cryptocorrosion_derive_traits! changes only its hidden TryFromBytes hook's name (is_bit_valid to is_safe), transmute! changes only doc examples, and impls.rs renames the internal pointer invariant Valid to Safe and adds tests; the rest of the 0.8.49-0.8.64 diff is the pointer/transmute machinery behind that rename and new DST-layout support. Release notes live on GitHub Releases, not in the crate."

