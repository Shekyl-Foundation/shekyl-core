[[package]]
name = "unicode-normalization"
version = "0.1.26"
reason = "bip39's NFKD of the mnemonic input. The mnemonic has no passphrase and no PBKDF2 step (shekyl-crypto-pq/src/bip39.rs): parse_in(English, ...) normalizes the input, then matches ASCII words, and the entropy comes from word indices. 0.1.26 admitted: its only change is the tables, Unicode 17 to 18 (UNICODE_VERSION in src/tables.rs). NFKD stays on, as ruled, under Unicode's normalization stability policy: an assigned character's decomposition never changes, so input that parsed before parses the same; newly assigned characters can only change which odd spellings of the words are accepted, never the derived key."

