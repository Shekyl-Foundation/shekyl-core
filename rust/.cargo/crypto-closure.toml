[[package]]
name = "multiexp"
version = "0.4.2"
reason = "Multi-scalar multiplication and batch verification in FCMP++ and the generalized Bulletproofs (fcmps, generalized-bulletproofs, shekyl-fcmp, shekyl-fcmp-proofs, shekyl-engine-core, shekyl-verify-cost). Kept at 0.4.2 while FROST moves to 0.5.2. 0.4's non-vartime multiexp indexes its Straus tables and Pippenger buckets by secret scalar bits (straus.rs: tables[s][groupings[s][b]]; pippenger.rs: buckets[bits[p][n]]), and every non-vartime multiexp in the prover takes secret scalars: generalized-bulletproofs lib.rs:323 (Pedersen commit) and :353 (PedersenVectorCommitment::commit), arithmetic_circuit_proof.rs:377 (AI), :390 (AO), :412 (S, the blinds) and :585/:591 (the t/tau transcript points), point_vector.rs:122, fcmps tape.rs:275 (the witness tape's commitments); fcmps lib.rs:605-625 (tree roots) run non-vartime on public data (cost only); the verifiers use verify_vartime (shekyl-fcmp proof.rs:1082/1208, sal/multisig.rs:316). 0.5 scans every entry with conditional_assign, at a cost to the prover's large multiexps. Reopen: the prover measured on 0.5 at the device floor (rule 76) and a ruling on moving these crates; 0.5 needs its alloc feature there, or multiexp falls back to a naive sum."

[[package]]
name = "multiexp"
version = "0.5.2"
reason = "Multi-scalar multiplication and batch verification under modular-frost 0.11.1 (multisig FROST). Admitted after diffing src against 0.4.2: the non-vartime Straus and Pippenger select table entries and buckets with subtle's conditional_assign over every index instead of indexing by secret scalar bits (the reason the group gains a ConditionallySelectable bound), BatchVerifier's constant-time verify moves to that bound's impl block with an unchanged body, std-shims gives way to alloc, and the vartime paths are unchanged. Without its alloc feature multiexp is a naive sum; modular-frost enables it."

