# cargo-audit configuration
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# This file MUST live at `.cargo/audit.toml` relative to the directory
# `cargo audit` runs in (the `rust/` workspace root). cargo-audit only
# auto-loads `.cargo/audit.toml`; a bare `audit.toml` is NOT read and any
# ignores placed there are silently inert. Do not move this back to
# `rust/audit.toml`.

[advisories]
# Every entry below is an "unmaintained" INFO notice (not a vulnerability)
# on a transitive, non-consensus, non-secret dependency that cannot be
# dropped without an upstream crate moving first. `cargo audit` reports
# unmaintained as a warning; we ignore these documented cases so the audit
# signal stays actionable -- a real vulnerability or a newly-fixable notice
# stands out instead of being buried under perennial notices. Each carries
# an explicit reopen criterion per
# .cursor/rules/21-reversion-clause-discipline.mdc: when the named upstream
# change lands, drop the ignore and let the dep fall out.
#
# paste 1.0.15 -- RUSTSEC-2024-0436: unmaintained. Compile-time-only
# proc-macro for token concatenation; emits no runtime code and never
# appears in the shipped artifact. Pulled only by `shekyl-shard-visual`'s
# `imageproc 0.25`, via two paths that both terminate at `imageproc`:
#   imageproc -> nalgebra -> simba -> paste
#   imageproc -> image (default features) -> ravif -> rav1e -> paste
# Not removable without dropping `imageproc` (a rasterizer rewrite); our
# direct `image` dep is already `default-features = false, features =
# ["png"]`, but `imageproc` re-enables image's defaults under additive
# feature unification. Reopen when `imageproc`/`nalgebra` drop `paste`, or
# when `shekyl-shard-visual` replaces `imageproc` with hand-rolled
# rasterization.
#
# atomic-polyfill 1.0.3 -- RUSTSEC-2023-0089: unmaintained (superseded by
# `portable-atomic`). Pulled only by `heapless 0.7.17` <- `postcard 1.1.3`,
# and only on targets *without* native atomics -- it is not compiled for
# Shekyl's x86_64/aarch64 release targets at all. `postcard 1.1.3` pins
# `heapless ^0.7`; `heapless 0.8` is the release that swapped
# atomic-polyfill for portable-atomic, so no lockfile update can move it.
# The advisory is crate-level (every version is "unmaintained"), so a bump
# cannot clear it -- only dropping the crate can. Reopen when `postcard`
# ships a release depending on `heapless >= 0.8` (then `cargo update -p
# postcard` drops it), or when the wallet engine crates move off `postcard`.
#
# ttf-parser 0.25.1 -- RUSTSEC-2026-0192: unmaintained. Font glyph parser,
# aesthetic-only and build/render-time (no consensus or secret surface).
# Pulled only by `shekyl-shard-visual`, same `imageproc` root as `paste`:
#   imageproc -> ab_glyph -> owned_ttf_parser -> ttf-parser
# Crate-level advisory (every version is "unmaintained"), so bumping cannot
# clear it -- only dropping it can. Reopen when `ab_glyph`/`imageproc` move
# off `ttf-parser`, or when `shekyl-shard-visual` replaces `imageproc`.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2023-0089", "RUSTSEC-2026-0192"]
