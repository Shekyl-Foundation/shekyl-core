[package]
name = "shekyl-economics-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Eight-scenario economics simulation harness for DESIGN_CONCEPTS parameter validation"

[dependencies]
shekyl-economics = { path = "../shekyl-economics" }
# `AtomicUnits`, the operand type of `CirculatingSupply::derive` — the one
# owner of the net supply the burn reads (ECONOMICS_SIM_PRODUCTION_REBASE.md
# ESR-5).
shekyl-units = { path = "../shekyl-units" }
# Gate-7 derived-lock model: compile-time tie to the pinned consensus
# constants (`ARCHIVAL_BOND_FLOOR_ATOMIC`, `SETTLEMENT_EPOCH_BLOCKS`)
# instead of re-asserting their values locally.
# (ARCHIVAL_REWARD_GATE_M1.md §4) — delete this feature at the §14.4 seal.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# The emission-split epoch the validator judges a block at
# (`EMISSION_SPLIT_EPOCH`), read rather than restated
# (`ECONOMICS_SIM_PRODUCTION_REBASE.md` ESR-3).
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
# The producer's fill rule (`Fill`): how many transactions a block takes at
# the effective median, the comparison `fill_block_template` makes, called
# rather than restated (ECONOMICS_SIM_PRODUCTION_REBASE.md ESR-6).
shekyl-block-template = { path = "../shekyl-block-template" }
# A4 W9 stuffer: price real transaction weights through the SAME single-sourced
# predictor the wallet fee path uses (DQ-2G dep-don't-mirror, D-1 hoist).
shekyl-tx-weight = { path = "../shekyl-tx-weight" }
# A4 tree-depth-from-n: `outputs_per_node` — the production curve-tree capacity
# function — so the stuffer's FCMP proof cost rides real chain depth, not a
# mirrored width product (DQ-2G).
shekyl-curve-tree = { path = "../shekyl-curve-tree" }
# The D2 operand's unit (SHT-Q2): `SHARD_LENGTH` (W) and `shard_of`, the one
# boundary function — the sim folds archival bytes and calls the partition, it
# never divides by W itself (05-system-thinking "a formula two lanes need is a
# function"; ARCHIVAL_SHARD_COUNT_CUTOVER.md §F step 3).
shekyl-types = { path = "../shekyl-types" }
serde = { workspace = true }
serde_json = "1"
