[package]
name = "shekyl-economics-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Eight-scenario economics simulation harness for DESIGN_CONCEPTS parameter validation"

[dependencies]
shekyl-economics = { path = "../shekyl-economics" }
# Gate-7 derived-lock model: compile-time tie to the pinned consensus
# constants (`ARCHIVAL_BOND_FLOOR_ATOMIC`, `SETTLEMENT_EPOCH_BLOCKS`)
# instead of re-asserting their values locally.
# (ARCHIVAL_REWARD_GATE_M1.md §4) — delete this feature at the §14.4 seal.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# A4 W9 stuffer: price real transaction weights through the SAME single-sourced
# predictor the wallet fee path uses (DQ-2G dep-don't-mirror, D-1 hoist).
shekyl-tx-weight = { path = "../shekyl-tx-weight" }
# A4 tree-depth-from-n: `outputs_per_node` — the production curve-tree capacity
# function — so the stuffer's FCMP proof cost rides real chain depth, not a
# mirrored width product (DQ-2G).
shekyl-curve-tree = { path = "../shekyl-curve-tree" }
# FL instrument: the block-policy zone constant read from its single Rust
# owner (`shekyl_wire::transaction::MIN_BLOCK_WEIGHT`) instead of a third
# hand-pinned copy (FL round review round 3).
shekyl-wire = { path = "../shekyl-wire" }
serde = { workspace = true }
serde_json = "1"
