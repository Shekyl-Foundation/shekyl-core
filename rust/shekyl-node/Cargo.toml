[package]
name = "shekyl-node"
description = "The daemon's one Node: the chain store, ingest, the pool, the hasher budget, the cache store, the job board and the socket table (DRS_X_STORE_FLIP.md DX-Q6, N1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shekyl-address = { path = "../shekyl-address" }
shekyl-chain-ingest = { path = "../shekyl-chain-ingest" }
# The witness ring the node's templates draw from, and the bundle
# producer that files from it (SO-D12 increment 4c). The fetch read is
# `fetch`, which chain-ingest's `producer` feature also turns on.
shekyl-bundle-producer = { path = "../shekyl-bundle-producer", features = ["fetch"] }
# The fetch scheduler the producer reads through, dialling the operator's
# Tor SOCKS endpoint. Daemon-only, as the node is.
shekyl-archival-fetch-sched = { path = "../shekyl-archival-fetch-sched" }
# The sync state the follower posts on: chain sync's own type, so its
# cutover plugs a publisher in and changes nothing else (DX-Q3, Q13).
shekyl-chain-sync = { path = "../shekyl-chain-sync" }
# The coinbase keys the node's one template pays (N2).
shekyl-block-template = { path = "../shekyl-block-template" }
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
shekyl-chain-store = { path = "../shekyl-chain-store" }
shekyl-daemon-config = { path = "../shekyl-daemon-config" }
shekyl-daemon-rpc = { path = "../shekyl-daemon-rpc" }
shekyl-ffi = { path = "../shekyl-ffi" }
shekyl-genesis-tool = { path = "../shekyl-genesis-tool" }
shekyl-hash-budget = { path = "../shekyl-hash-budget" }
shekyl-mempool = { path = "../shekyl-mempool" }
shekyl-miner = { path = "../shekyl-miner" }
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
shekyl-rpc-types = { path = "../shekyl-rpc-types" }
shekyl-runtime = { path = "../shekyl-runtime" }
shekyl-transport-layer = { path = "../shekyl-transport-layer" }
shekyl-types = { path = "../shekyl-types" }
shekyl-units = { path = "../shekyl-units" }
shekyl-wire = { path = "../shekyl-wire" }
shekyl-win-sec = { path = "../shekyl-win-sec" }
hex = "0.4"
rustix = { version = "1", features = ["fs"] }
thiserror = { workspace = true }
tracing = "0.1"
# The sync watch and the posting watch; `stop` checks it is not in a runtime.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
# The flush-fault test refuses the pool file's next commit
# (`pool-commit-fault`). Dev edge only; check_test_only_features.py holds
# that the normal dependency above leaves it off.
shekyl-mempool = { path = "../shekyl-mempool", features = ["pool-commit-fault"] }
# The planted entry's body, a harness spend.
shekyl-chain-rules = { path = "../shekyl-chain-rules", features = ["harness"] }
# A mining address for the template tests, from a fixed seed's keys.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-difficulty = { path = "../shekyl-difficulty" }
shekyl-options = { path = "../shekyl-options" }
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
shekyl-store-codec = { path = "../shekyl-store-codec" }
tempfile = "3"
redb = { workspace = true }

[lints]
workspace = true
