[package]
name = "shekyl-node"
description = "The daemon's one Node: the chain store, ingest, the pool, the hasher budget, the cache store, the job board and the socket table (DRS_X_STORE_FLIP.md DX-Q6, N1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shekyl-address = { path = "../shekyl-address" }
shekyl-chain-ingest = { path = "../shekyl-chain-ingest" }
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
shekyl-chain-store = { path = "../shekyl-chain-store" }
shekyl-daemon-config = { path = "../shekyl-daemon-config" }
shekyl-daemon-rpc = { path = "../shekyl-daemon-rpc" }
shekyl-genesis-tool = { path = "../shekyl-genesis-tool" }
shekyl-hash-budget = { path = "../shekyl-hash-budget" }
shekyl-mempool = { path = "../shekyl-mempool" }
shekyl-miner = { path = "../shekyl-miner" }
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
shekyl-rpc-types = { path = "../shekyl-rpc-types" }
shekyl-runtime = { path = "../shekyl-runtime" }
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
shekyl-transport-layer = { path = "../shekyl-transport-layer" }
shekyl-types = { path = "../shekyl-types" }
shekyl-wire = { path = "../shekyl-wire" }
shekyl-win-sec = { path = "../shekyl-win-sec" }
hex = "0.4"
rustix = { version = "1", features = ["fs"] }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
shekyl-difficulty = { path = "../shekyl-difficulty" }
shekyl-ffi = { path = "../shekyl-ffi" }
shekyl-options = { path = "../shekyl-options" }
tempfile = "3"

[lints]
workspace = true
