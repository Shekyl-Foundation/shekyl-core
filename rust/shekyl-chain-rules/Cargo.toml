[package]
name = "shekyl-chain-rules"
description = "Consensus validation: form (stateless) then validate (view-bound) → ChainValid or InvalidBlock. No store handle (DRS-E6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The crate's defining property is what is *absent* here: no `redb`, no
# `shekyl-chain-store`, directly or transitively, in any dependency section
# (CHAIN_RULES_CRATE.md G1). `check_chain_rules_coverage.py` refuses either
# token in this file; `check_chain_rules_no_store.sh` (rust-audit-test.yml)
# refuses either package anywhere in the resolved `cargo tree` closure. Every
# rule must stay unit-testable against a mock view with no database
# (CONSENSUS_C2_R8_STORE_PLACEMENT.md §9.1) — a dependency that reaches a
# store is the inversion R8 banned.
[dependencies]
# Chain identities and the recorded facts a rule reads: BlockHeight,
# BlockHash, TxHash, KeyImage, CurveTreeRoot.
shekyl-types = { path = "../shekyl-types" }
shekyl-units = { path = "../shekyl-units" }
# The candidate's own shape — Block, BlockHeader, Transaction — and the
# consensus hash identities (`Block::hash`, `Transaction::hash`) CEN-B6
# defines. Deps: shekyl-crypto-hash, shekyl-curve-generators; no store.
shekyl-wire = { path = "../shekyl-wire" }
# `Network`, the one nettype enum in the workspace: it selects a
# `RuleSchedule` (rule 71 — data, never control flow). Default features only;
# `serde` stays off.
shekyl-address = { path = "../shekyl-address" }
# The 4.C/4.D bodies (LWMA-1, MTP/FTL, check_hash) and the difficulty
# newtypes — adopted, not re-derived (slice 2, Q2). Depends on shekyl-types
# alone; the G1 belt's closure grows by exactly this crate.
shekyl-difficulty = { path = "../shekyl-difficulty" }

[features]
# The negative-fixture harness (`harness.rs`: `MockChain`, `MockSubstrate`,
# fixtures) as a library surface for ONE consumer: the store's
# mock-vs-`BatchView` conformance test (slice 2 F11). G1 forbids this crate
# from depending on the store, so the test that reconciles the mock against
# the real view must live on the store side and reach the mock from here.
# Test-only in effect — enabled from `shekyl-chain-store`'s dev-dependencies;
# never from a normal dependency. Nothing here is a production API.
harness = []

[dev-dependencies]
# The shared C2-R3 boundary vectors (`docs/test_vectors/MTP_BOUNDARY_V1.json`)
# are driven through the 4.C rules as well as through `shekyl-difficulty`.
# Already pinned in the workspace lockfile; test-only.
serde_json = "1"

[lints]
workspace = true
