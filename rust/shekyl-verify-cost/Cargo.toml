[package]
name = "shekyl-verify-cost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Verification-cost instruments: pool admission and cold-block connect, measured at the bodies the rules run"

[dependencies]
# The fixtures build real proofs and real transactions, then call the
# verification bodies. Every crate here is already in the workspace
# lockfile (rule 17). The production graph does not depend on this one;
# `scripts/ci/check_bench_not_a_dependency.py` holds that.
shekyl-types = { path = "../shekyl-types" }
shekyl-wire = { path = "../shekyl-wire" }
shekyl-fcmp = { path = "../shekyl-fcmp" }
shekyl-fcmp-proofs = { path = "../shekyl-fcmp-proofs" }
shekyl-ct-balance = { path = "../shekyl-ct-balance" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-bulletproofs = { path = "../shekyl-bulletproofs" }
shekyl-curve-io = { path = "../shekyl-curve-io" }
shekyl-curve-primitives = { path = "../shekyl-curve-primitives" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
curve25519-dalek = "4"
ciphersuite = "0.4"
dalek-ff-group = "0.5"
ec-divisors = { path = "../shekyl-oxide/crypto/divisors" }
helioselene = { path = "../shekyl-oxide/crypto/helioselene" }
multiexp = "0.4"
rand_core = { version = "0.6", features = ["std"] }

[features]
# The fixtures (`relay`, `door`, `connect`): every one builds its proof
# through `shekyl-fcmp`'s seeded prover, so a run gives byte-identical
# fixtures and stable instruction counts. TEST_ONLY
# (`scripts/ci/check_test_only_features.py`, CHAIN_FORGE.md CF-R9): the seeded
# prover exists only under `shekyl-fcmp/seeded-rng`, which this forwards, and
# only this crate's own benches and tests turn it on (the self edge below).
# Without it the library is empty; nothing in a shipped graph depends on
# this crate.
seeded-rng = ["shekyl-fcmp/seeded-rng"]

[dev-dependencies]
# This crate's benches and pins build the fixtures: `seeded-rng` on its own
# dev edge, so it is on only for them.
shekyl-verify-cost = { path = ".", features = ["seeded-rng"] }
# Wall clock is criterion. The drift gate is gungraun. The connect bench's
# one RandomX hash is the shipped verifier. All three are already in the
# lockfile.
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.19"
rand_chacha = { workspace = true }
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
# The drift gate signs under a seeded ML-DSA nonce: a hedged signature
# differs every run, and the count with it. `sign_pqc_auth_for_output_with_ml_dsa_seed`
# is `seeded-rng` surface (TEST_ONLY), so it rides this dev edge only, as
# `shekyl-tx-builder`'s `transfer_e2e_iai` rides `sign_with_ml_dsa_seed`.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq", features = ["seeded-rng"] }

[[bench]]
name = "relay_admission_verify"
harness = false

[[bench]]
name = "relay_admission_verify_iai"
harness = false

[[bench]]
name = "block_connect_verify"
harness = false

[lints]
workspace = true
