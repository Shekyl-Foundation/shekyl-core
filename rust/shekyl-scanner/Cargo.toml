[package]
name = "shekyl-scanner"
description = "Transaction scanner for the Shekyl protocol with FCMP++, PQC, and staking support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zeroize = { workspace = true }
curve25519-dalek = { version = "4", features = ["alloc", "zeroize"] }
hex = { version = "0.4", features = ["alloc"] }
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
tracing = "0.1"

# Canonical genesis block/tx wire format. Parses the coinbase `Ct::Null`
# committed base (`enc_amounts`/`enc_labels`/`outPk`, GENESIS §9.7) the vendored
# `shekyl-oxide` reader skipped — the bug this crate's scan path is migrated off
# (`SHEKYL_OXIDE_UNVENDOR.md` step 4). Block/tx parsing lives here now;
# `shekyl-oxide` is retained only for the residual typed domain elements
# (`Timelock`, `StakingMeta`, `CompressedPoint`, `Commitment`).
shekyl-wire = { path = "../shekyl-wire" }
shekyl-curve-io = { path = "../shekyl-curve-io" }
shekyl-curve-primitives = { path = "../shekyl-curve-primitives" }
shekyl-rpc-client = { path = "../shekyl-rpc-client" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
shekyl-staking = { path = "../shekyl-staking" }
shekyl-address = { path = "../shekyl-address" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
shekyl-engine-state = { path = "../shekyl-engine-state" }
shekyl-units = { path = "../shekyl-units" }
# `TxHash` newtype: the scanner lifts oxide's raw `[u8; 32]` txid into the
# typed domain at the `from_wallet_output` boundary.
shekyl-types = { path = "../shekyl-types" }

[features]
default = ["std"]
std = ["shekyl-curve-io/std", "shekyl-curve-generators/std", "shekyl-curve-primitives/std", "shekyl-rpc-client/std"]
test-utils = []

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
proptest = "1"

# Hardening-pass commit 2 (`docs/MID_REWIRE_HARDENING.md` §3.2):
# criterion + gungraun harness for the `scan_block_K` path.
# Benches exercise `LedgerIndexes::process_scanned_outputs` — the
# scanner's non-crypto bookkeeping path — over K synthetic owned
# outputs built via the crate's own `test-utils` constructors,
# operating on a fresh `(LedgerBlock, LedgerIndexes)` pair. The
# FCMP++/KEM output-recovery portion is separately covered by
# `shekyl-crypto-pq/benches/pqc_rederivation.rs`; the two together span
# the "owned output lands in wallet state" pipeline.
#
# Uses `dev-dependencies` self-dep pattern to enable the `test-utils`
# feature during bench compilation without leaking it into the crate's
# default feature set.
shekyl-scanner = { path = ".", features = ["test-utils"] }
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.19"

[[bench]]
name = "scan_block"
harness = false

[[bench]]
name = "scan_block_iai"
harness = false

# PR 4 §3.1 / F11-S substrate: per-output cost measurement for
# `Scanner::scan` against worst-case (all view tags match — F11-S
# binding) and typical-case (view-tag-filtered — contextual) fixtures.
# The wall-clock harness (`scan_transaction.rs`) sweeps N ∈ {1,4,8,16}
# in warm/cold-cache variants and reports quantiles; the gungraun
# companion (`scan_transaction_iai.rs`) cross-validates with
# deterministic instruction counts. Both bench files share fixture
# helpers via `shekyl_scanner::bench_fixtures::*` (gated by the
# `test-utils` feature on the self-dep above).
[[bench]]
name = "scan_transaction"
harness = false

[[bench]]
name = "scan_transaction_iai"
harness = false

[lints]
workspace = true
