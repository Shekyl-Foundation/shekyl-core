[package]
name = "shekyl-chain-ingest"
description = "The daemon's block-ingest pipeline: Source → form → sequence → validate+connect → sinks. Production code shared by DRS-E2 (replay) and DRS-X (live, the store flip); the replay driver is its first source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate is the one place the validator, the store and RandomX meet
# (DRS_E2_REPLAY_DRIVER.md RD-Q1). The store names `Corrupt` at
# `WriteBatch::refuse_corrupt` (RD-Q4) and nothing else of the validator's
# fault/substrate types; it never names RandomX or `InvalidBlock`. The
# validator never names the store (G1); the pipeline names all three and
# wires them.
#
# Features let a consumer take part of the crate: `shekyl-chain-sync-runtime`
# and `shekyl-p2p-harness` depend with `default-features = false, features =
# ["pipeline"]` — the trace writer and the ingest service, not the corpus
# fetcher (RPC) or the replay CLI (clap / HTTP / settlement epoch), and
# `shekyl-chain-sync` takes none of them. The pipeline (kameo/tokio and the
# service's pool, miner and hasher-budget edges), the fetcher and the CLI are
# optional. Default enables all of them, so `cargo test -p
# shekyl-chain-ingest` is the full crate and the node takes everything.
#
# `producer` is the bundle producer's read path (SO-D12 increment 4c): the
# fetch scheduler, its store-backed shard facts, and the task that reads,
# assembles and files. It is the one feature that brings the shard-fetch
# client into this crate's graph, so a `pipeline`-only consumer never has it
# (SF-D4). The witness ring the template
# draws from is in `pipeline`: it holds secrets and fetches nothing.
[features]
default = ["pipeline", "fetch", "replay-cli", "producer"]
producer = [
    "pipeline",
    "shekyl-bundle-producer/fetch",
    "dep:shekyl-archival-fetch-sched",
    "dep:shekyl-crypto-pq",
    # A read's start delay (`bundle_producer::spawn_read`).
    "tokio/time",
]
pipeline = [
    "dep:kameo",
    "dep:tokio",
    "dep:tracing",
    "dep:shekyl-hasher",
    "dep:shekyl-miner",
    "dep:shekyl-mempool",
    "dep:shekyl-block-template",
    "dep:shekyl-chain-sync",
    "dep:rand",
    "dep:zeroize",
    "dep:shekyl-bundle-producer",
]
fetch = ["dep:shekyl-rpc-client", "dep:shekyl-rpc-types"]
# bench-internals: the synchronous block-path driver the instruction-count
# benches run (`bench_support.rs`; `benches/block_path_iai.rs` and the
# benches that read or serve from its store). The driver
# also needs `harness`, for the unpinned regtest rules a fixture chain is
# mined under (`ChainRules::harness_regtest`). This feature does not enable
# it: `harness` is TEST_ONLY and no feature of this crate may turn it on
# (check_test_only_features.py). The bench target requires both, and the
# capture script names both on its command line.
bench-internals = ["pipeline", "dep:tempfile"]
replay-cli = [
    "pipeline",
    "fetch",
    "dep:clap",
    "dep:shekyl-hash-budget",
    "dep:shekyl-rpc-transport",
]
# harness: the driver's emission-claim assembly (`emission_assembly.rs`,
# E6 slice 8 row 7) for the one test outside this crate that needs it —
# `shekyl-engine-core`'s byte-identity pin against its own handler. A
# TEST_ONLY feature (check_test_only_features.py): no feature here enables
# it, `default` included, and the only enabler is that crate's
# [dev-dependencies] edge. A shipping build never carries a second producer.
# It forwards `shekyl-chain-rules/harness` because `ChainRules::unpinned()`
# here reads `GenesisPin::NONE`, which exists only under that feature; an
# enabler that turns on this crate's harness alone must still compile.
harness = [
    "shekyl-chain-rules/harness",
    "dep:shekyl-crypto-pq",
    "dep:shekyl-tx-builder",
    "dep:shekyl-curve-generators",
    "dep:curve25519-dalek",
    "dep:zeroize",
]

# The block path's instruction counts (BENCHMARK_ALIGNMENT.md BA-T2,
# BA-T41): form, connect with its commit, pop and three store reads, over
# committed blocks of four transactions. The per-PR capture.
[[bench]]
name = "block_path_iai"
harness = false
required-features = ["bench-internals", "harness"]

# The same three block rows over blocks at the weight limit: twenty
# minutes of callgrind a row, so the nightly capture's (nightly.yml,
# bench-full) and not a pull request's.
[[bench]]
name = "block_path_full_iai"
harness = false
required-features = ["bench-internals", "harness"]

# One body response built from the store (BA-T44): the sync owner's
# `serve_bodies`, over the block-path driver's store.
[[bench]]
name = "serve_bodies_iai"
harness = false
required-features = ["bench-internals", "harness"]

# One inbound body response read off the session and decoded (BA-T45).
[[bench]]
name = "levin_bodies_iai"
harness = false
required-features = ["bench-internals", "harness"]

# A wallet's block read answered from the store (BA-T47): the RPC's
# `block_list` over the store facts, and the reply serialized.
[[bench]]
name = "wallet_block_read_iai"
harness = false
required-features = ["bench-internals", "harness"]

# One block template built over a committed listing (BA-T46).
[[bench]]
name = "block_template_iai"
harness = false
required-features = ["bench-internals", "harness"]

[[bin]]
name = "shekyl-chain-replay"
path = "src/bin/shekyl-chain-replay.rs"
required-features = ["replay-cli"]

[dependencies]
# form (stateless) / validate (view-bound), Substrate, Candidate, the
# verdict and fault types. The validator, never re-derived here.
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
# The bundle's bytes: the corpus holds each body to its reference (§7.5)
# in every build, and the pipeline builds and roots the template's
# section. The validator already depends on it.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# The production PoW verifier's `Seedhash`, the name the hasher knows a
# cache by. The cache itself is the hasher's: nothing here derives one.
# Verification is this crate everywhere, forever (§1.3); the JIT is never
# consulted here.
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
# The store the actor owns: ChainStore / WriteBatch::{connect, pop,
# refuse_corrupt}, ConnectFacts (the trace's borrow door converts into it,
# PassedThrough by construction), LogicalStateDigestV0 (the checkpoint
# shape, assembled by one function on both sides).
shekyl-chain-store = { path = "../shekyl-chain-store" }
# `Network`: which public schedule a run resolves rules from (rule 71 —
# data, never control flow). Default features only.
shekyl-address = { path = "../shekyl-address" }
# The network table: a run's network, its schedule, and the levers its row
# permits (NETWORK_IDENTITY.md NI-R4, NI-R6).
shekyl-network = { path = "../shekyl-network" }
# CumulativeDifficulty — the accumulator the trace records for SI-10.
shekyl-difficulty = { path = "../shekyl-difficulty" }
shekyl-consensus = { path = "../shekyl-consensus" }
# The owners of two connect-fact folds `facts::Composed` performs:
# `advance_already_generated` (CEN-F13's accumulator) and `long_term_weight`
# (CEN-G6's clamp). Composition, not derivation — the emission itself is
# never re-derived here (facts.rs module docs).
shekyl-economics = { path = "../shekyl-economics" }
# BlockHeight, BlockHash, PowHash, Timestamp, the weight newtypes.
shekyl-types = { path = "../shekyl-types" }
# AtomicUnits: coins_generated and burned in the trace.
shekyl-units = { path = "../shekyl-units" }
# Block / Transaction parsing and hashing — the corpus verifies every record
# against the header's list (RD-F15).
shekyl-wire = { path = "../shekyl-wire" }
thiserror = { workspace = true }
# The graded-run artifact and the extracted register are JSON (RD-Q6:
# drs_artifact.py's schema discipline; the register comes from the coverage
# gate's own parse).
serde = { workspace = true }
serde_json = { workspace = true }

# pipeline: the one stateful stage is an actor (RD-Q11); form workers are
# blocking tasks on the same runtime.
# pipeline: the node's one hasher (RANDOMX_CACHE_ACTOR.md), which every
# hash in the ingest borrows a cache from, inside a job. The ingest holds
# no budget: a permit is taken through a job and nowhere else.
shekyl-hasher = { path = "../shekyl-hasher", optional = true }
# replay-cli: the budget the replay binary starts its own hasher over, one
# permit per `--hashers`. The library names no budget.
shekyl-hash-budget = { path = "../shekyl-hash-budget", optional = true }
# pipeline: the miner's job board and found-block sink, which the ingest
# service's tip follower feeds and receives from (DX-Q2 item 5, DX-Q4).
shekyl-miner = { path = "../shekyl-miner", optional = true }
# pipeline: the pool, as a consumer of the connector (c6): reconciled per
# tip, a switch's returns and an alternative block's bodies offered to its
# door, a compact block's bodies resolved from what it shows.
shekyl-mempool = { path = "../shekyl-mempool", optional = true }
# pipeline: the node's one block template, built by the tip follower on one
# snapshot (`DRS_X_STORE_FLIP.md` DX-Q3, N2), and the reward-aware fill it lists
# bodies under (#1152).
shekyl-block-template = { path = "../shekyl-block-template", optional = true }
# pipeline: the template's coinbase secret, drawn from the OS per template
# (Q4), and its wipe.
rand = { version = "0.8", optional = true }
# pipeline: chain sync's own state, the watch the follower posts a job on
# only while it reads `Synced` (Q13).
shekyl-chain-sync = { path = "../shekyl-chain-sync", optional = true }
kameo = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"], optional = true }
# A pool-file fault is logged and ingest continues: the file is discardable.
tracing = { version = "0.1", optional = true }

# fetch: the daemon RPC contract the corpus fetcher speaks.
shekyl-rpc-client = { path = "../shekyl-rpc-client", optional = true }
shekyl-rpc-types = { path = "../shekyl-rpc-types", optional = true }

# pipeline: the witness ring the template draws its `0x0C` commitment
# from (SO-D12 increment 4c), without the crate's `fetch` feature.
# producer: the same crate's challenge read, and the daemon's fetch
# scheduler it reads through.
shekyl-bundle-producer = { path = "../shekyl-bundle-producer", optional = true }
shekyl-archival-fetch-sched = { path = "../shekyl-archival-fetch-sched", optional = true }

# bench-internals: the bench store's own directory (`bench_support.rs`).
tempfile = { workspace = true, optional = true }

# replay-cli: argument parsing as shekyl-cli does it; HTTP transport for
# `fetch`; SETTLEMENT_EPOCH_BLOCKS — a consensus constant, not a flag.
clap = { version = "4", features = ["derive"], optional = true }
shekyl-rpc-transport = { path = "../shekyl-rpc-transport", optional = true }

# harness: what `emission_assembly.rs` signs and encodes with — the same
# crates the [dev-dependencies] below name unconditionally for the rest of
# the driver. Optional here, enabled by `harness` alone.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq", optional = true }
shekyl-tx-builder = { path = "../shekyl-tx-builder", optional = true }
shekyl-curve-generators = { path = "../shekyl-curve-generators", optional = true }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"], optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
# The budget a test starts its own hasher over, and the one the service
# tests' gate takes its jobs' permits from. The library names no budget.
shekyl-hash-budget = { path = "../shekyl-hash-budget" }
# The Tor status a store test hands `daemon_status`, as the daemon's
# supervisor would answer it.
shekyl-tor-status = { path = "../shekyl-tor-status" }
# The instruction-count harness of `benches/block_path_iai.rs`, at the
# version every other gated bench uses.
gungraun = "0.19"
# `serve_bodies`, the subject of `benches/serve_bodies_iai.rs` and the
# producer of the frame `benches/levin_bodies_iai.rs` decodes. That crate
# depends on this one, so the edge is a dev-dependency cycle, as
# `shekyl-chain-sync`'s edge back to this crate is.
shekyl-chain-sync-runtime = { path = "../shekyl-chain-sync-runtime" }
# The body request and response those two benches build and decode.
shekyl-levin = { path = "../shekyl-levin" }
# Each test store's own directory (`test_support::tmp`), which takes the
# store's sidecar files with it when the test ends.
tempfile = { workspace = true }
# Its workers' ledger rows, counted by the same tests.
shekyl-thread-ledger = { path = "../shekyl-thread-ledger" }
# `BoundTx::modify` for the below-horizon test's edited body (TEST_ONLY,
# check_test_only_features.py).
shekyl-wire = { path = "../shekyl-wire", features = ["test-fixtures"] }
shekyl-thread-priority = { path = "../shekyl-thread-priority" }
# `shekyl-chain-rules`' fixtures are behind `harness`, a TEST_ONLY feature
# (check_test_only_features.py) — never enabled from [dependencies].
# The rules crate's fixtures — MockSubstrate, the always-satisfying
# longhash — for pipeline tests. Dev-dependency edge only.
shekyl-chain-rules = { path = "../shekyl-chain-rules", features = ["harness"] }
# The block producer the scenario driver (`scenario.rs`, test-only) builds
# candidates with — the production template over the production stack
# (CHAIN_RULES_SLICE_6.md §5.3). Unconditional here for the driver; the
# [dependencies] edge above is the tip follower's (`template.rs`).
shekyl-block-template = { path = "../shekyl-block-template" }
# The harness miner every scenario block pays (`scenario.rs`), and the
# spender over the scenario's blocks: the wallet-side curve tree mirrors
# the store's over the same blocks — DRS-D3c's two Rust producers compared
# — and assembles the membership path; the production tx-builder signs
# the spend; the result self-verifies through the consensus verifier
# against the wallet-side root before the driver lists it. Both are test
# instruments the 4.I verification rows (CEN-I15, H19-verify) are judged
# with; the store's tests take the same two edges (the wallet's already,
# the spender's with its fixture migration), which is why the spender is
# a crate and not this crate's module.
shekyl-harness-wallet = { path = "../shekyl-harness-wallet" }
shekyl-harness-spender = { path = "../shekyl-harness-spender" }
# Two subjects over the scenario chain: CEN-M9's witness (the submit
# engine, with the production verifier, over
# `shekyl_daemon_rpc::RustPoolShim` — the prepared reversion judged end to
# end where the real spends live), and DRS-X PR 3's store-backed RPC facts
# and read handlers, over the scenario chain and the captured chains.
shekyl-daemon-rpc = { path = "../shekyl-daemon-rpc" }
# The persona's keys (`derive_archival_p_keys`) and the emission claim's
# assembly (`emission_assembly.rs`, also behind `harness` above).
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
# The driver's coinbase secret is a `Zeroizing<[u8; 32]>`, the type
# `TemplateContext` takes (rule 35).
zeroize = { workspace = true }
# The emission claim's assembly (`emission_assembly.rs`): the production
# tx-builder signs it and `open_spend` encodes it. Also behind `harness` above.
shekyl-tx-builder = { path = "../shekyl-tx-builder" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
# The emission scenarios verify a claim's proof through the consensus
# verifier (`proof::verify`) against the wallet-side root.
shekyl-fcmp = { path = "../shekyl-fcmp" }
# Planting a corrupt row for the SI-10 path.
redb = { workspace = true }
# The mutation family's seed-sensitive mock longhash (`keccak256(blob ‖ seed)`,
# DRS_E2_REPLAY_DRIVER.md §3.10): already in the normal graph via shekyl-wire;
# named here only so the test can call it directly.
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
# DRS-X PR 3: the RPC wire types the store-backed facts and read handlers
# answer on (`rpc_store_facts_tests.rs`, `rpc_store_reads_tests.rs`).
shekyl-rpc-types = { path = "../shekyl-rpc-types" }
hex = "0.4"
# The wallet's block fetch over the store-backed handlers (the review of
# #1165, ruling 7): the wallet's own client and transport, against a local
# HTTP stand-in that serves `get_block`, `get_transactions` and
# `get_o_indexes.bin` from `StoreFacts`.
# `test-helpers`: the staged receipt capability over a harness persona's
# keys (`__test_helpers::resident_receipt_key`), for the bundle producer's
# gate test (SO-D12 increment 4c). TEST_ONLY; this dev edge enables it.
shekyl-engine-core = { path = "../shekyl-engine-core", features = ["test-helpers"] }
# The gate test's persona serves its shard on the production serve loop
# behind the loopback SOCKS shim, its height on a tip cache the test
# stamps. Dev-only: SF-D4 keeps the serve edge off every shipped graph.
shekyl-p-loopback = { path = "../shekyl-p-loopback" }
shekyl-p-host = { path = "../shekyl-p-host", features = ["test-signer"] }
shekyl-p-serve = { path = "../shekyl-p-serve", features = ["test-signer"] }
shekyl-rpc-transport = { path = "../shekyl-rpc-transport" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "test-util"] }

[lints]
workspace = true
