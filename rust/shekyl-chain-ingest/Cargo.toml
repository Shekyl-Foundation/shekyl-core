[package]
name = "shekyl-chain-ingest"
description = "The daemon's block-ingest pipeline: Source → form → sequence → validate+connect → sinks. Production code shared by DRS-E2 (replay) and E3 (live); the replay driver is its first source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate is the one place the validator, the store and RandomX meet
# (DRS_E2_REPLAY_DRIVER.md RD-Q1). The store never names RandomX or the
# validator's fault/substrate types; the validator never names the store (G1);
# the pipeline names all three and wires them. Dependencies are added as the
# stage that uses them lands — a dependency with no consumer is a claim about
# the future, not a fact about the crate.
[dependencies]
# `Substrate`, `Candidate`, the two-stage entry points and the fault arms the
# supervision map (§1.1) is written over.
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
# The production longhash: `PreparedCache` / `CacheStore` / `compute_hash`.
# The verifier's surface and nothing else — never the JIT (§1.3), and not
# `VmStatePool`, which is bench scaffolding (RD-F14).
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
# `BlockHash`, `BlockHeight`, `PowHash`, `Timestamp`, `TxHash`.
shekyl-types = { path = "../shekyl-types" }
# The corpus parses what it stores — `Block::read`, `Transaction::read`,
# the txid — so a record is verified against its own header (RD-F15), and
# the wire's size caps bound every length prefix.
shekyl-wire = { path = "../shekyl-wire" }

[lints]
workspace = true
