[package]
name = "shekyl-chain-ingest"
description = "The daemon's block-ingest pipeline: Source → form → sequence → validate+connect → sinks. Production code shared by DRS-E2 (replay) and E3 (live); the replay driver is its first source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate is the one place the validator, the store and RandomX meet
# (DRS_E2_REPLAY_DRIVER.md RD-Q1). The store names `Corrupt` at
# `WriteBatch::refuse_corrupt` (RD-Q4) and nothing else of the validator's
# fault/substrate types; it never names RandomX or `InvalidBlock`. The
# validator never names the store (G1); the pipeline names all three and
# wires them.
#
# Features keep the harvest FFI lean: `shekyl-ffi` depends with
# `default-features = false` and compiles the trace writer only. The
# pipeline (kameo/tokio), the corpus fetcher (RPC), and the replay CLI
# (clap / HTTP / settlement epoch) are optional. Default enables all three
# so `cargo test -p shekyl-chain-ingest` is the full crate.
[features]
default = ["pipeline", "fetch", "replay-cli"]
pipeline = ["dep:kameo", "dep:tokio"]
fetch = ["dep:shekyl-rpc-client", "dep:shekyl-rpc-types"]
replay-cli = [
    "pipeline",
    "fetch",
    "dep:clap",
    "dep:shekyl-rpc-transport",
    "dep:shekyl-archival-retention",
]
# harness: the driver's emission-claim assembly (`emission_assembly.rs`,
# E6 slice 8 row 7) for the one test outside this crate that needs it —
# `shekyl-engine-core`'s byte-identity pin against its own handler. A
# TEST_ONLY feature (check_test_only_features.py): no feature here enables
# it, `default` included, and the only enabler is that crate's
# [dev-dependencies] edge. A shipping build never carries a second producer.
harness = [
    "dep:shekyl-archival-retention",
    "dep:shekyl-crypto-pq",
    "dep:shekyl-tx-builder",
    "dep:shekyl-bulletproofs",
    "dep:shekyl-curve-generators",
    "dep:curve25519-dalek",
    "dep:zeroize",
]

[[bin]]
name = "shekyl-chain-replay"
path = "src/bin/shekyl-chain-replay.rs"
required-features = ["replay-cli"]

[dependencies]
# form (stateless) / validate (view-bound), Substrate, Candidate, the
# verdict and fault types. The validator, never re-derived here.
shekyl-chain-rules = { path = "../shekyl-chain-rules" }
# The production PoW verifier: PreparedCache / compute_hash / CacheStore.
# Verification is this crate everywhere, forever (§1.3); the JIT is never
# consulted here.
shekyl-pow-randomx = { path = "../shekyl-pow-randomx" }
# The store the actor owns: ChainStore / WriteBatch::{connect, pop,
# refuse_corrupt}, ConnectFacts (the trace's borrow door converts into it,
# PassedThrough by construction), LogicalStateDigestV0 (the checkpoint
# shape, assembled by one function on both sides).
shekyl-chain-store = { path = "../shekyl-chain-store" }
# `Network`: which public schedule a run resolves rules from (rule 71 —
# data, never control flow). Default features only.
shekyl-address = { path = "../shekyl-address" }
# CumulativeDifficulty — the accumulator the trace records for SI-10.
shekyl-difficulty = { path = "../shekyl-difficulty" }
# The owners of two connect-fact folds `facts::Composed` performs:
# `advance_already_generated` (CEN-F13's accumulator) and `long_term_weight`
# (CEN-G6's clamp). Composition, not derivation — the emission itself is
# never re-derived here (facts.rs module docs).
shekyl-economics = { path = "../shekyl-economics" }
# BlockHeight, BlockHash, PowHash, Timestamp, the weight newtypes.
shekyl-types = { path = "../shekyl-types" }
# AtomicUnits: coins_generated and burned in the trace.
shekyl-units = { path = "../shekyl-units" }
# Block / Transaction parsing and hashing — the corpus verifies every record
# against the header's list (RD-F15).
shekyl-wire = { path = "../shekyl-wire" }
thiserror = { workspace = true }
# The graded-run artifact and the extracted register are JSON (RD-Q6:
# drs_artifact.py's schema discipline; the register comes from the coverage
# gate's own parse).
serde = { workspace = true }
serde_json = { workspace = true }

# pipeline: the one stateful stage is an actor (RD-Q11); form workers are
# blocking tasks on the same runtime.
kameo = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"], optional = true }

# fetch: the daemon RPC contract the corpus fetcher speaks.
shekyl-rpc-client = { path = "../shekyl-rpc-client", optional = true }
shekyl-rpc-types = { path = "../shekyl-rpc-types", optional = true }

# replay-cli: argument parsing as shekyl-cli does it; HTTP transport for
# `fetch`; SETTLEMENT_EPOCH_BLOCKS — a consensus constant, not a flag.
clap = { version = "4", features = ["derive"], optional = true }
shekyl-rpc-transport = { path = "../shekyl-rpc-transport", optional = true }
shekyl-archival-retention = { path = "../shekyl-archival-retention", optional = true }

# harness: what `emission_assembly.rs` signs and encodes with — the same
# crates the [dev-dependencies] below name unconditionally for the rest of
# the driver. Optional here, enabled by `harness` alone.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq", optional = true }
shekyl-tx-builder = { path = "../shekyl-tx-builder", optional = true }
shekyl-bulletproofs = { path = "../shekyl-bulletproofs", optional = true }
shekyl-curve-generators = { path = "../shekyl-curve-generators", optional = true }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"], optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
# `shekyl-chain-rules`' fixtures are behind `harness`, a TEST_ONLY feature
# (check_test_only_features.py) — never enabled from [dependencies].
# The rules crate's fixtures — MockSubstrate, the always-satisfying
# longhash — for pipeline tests. Dev-dependency edge only.
shekyl-chain-rules = { path = "../shekyl-chain-rules", features = ["harness"] }
# The block producer the scenario driver (`scenario.rs`, test-only) builds
# candidates with — the production template over the production stack
# (CHAIN_RULES_SLICE_6.md §5.3). Dev-dependency: the driver is a test
# instrument; the template crate's production consumer is E3's handler.
shekyl-block-template = { path = "../shekyl-block-template" }
# The driver's miner keys (an Edwards spend key, a hybrid KEM keypair).
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# The archival body fixtures (`test_support::{serve_credit_body,
# emission_claim_body}`, slice 7 commit 7): the kept-half and emission-vin
# codecs, so the mutation family's duplicates carry keys the validator's
# parse (`ArchivalKey::of`) reads. Unconditional here; the [dependencies]
# edge above stays optional for the replay CLI alone.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
# The driver's coinbase secret is a `Zeroizing<[u8; 32]>`, the type
# `TemplateContext` takes (rule 35).
zeroize = { workspace = true }
# The scenario spend (DRS-E3 commit 7, `scenario_spend.rs`): the wallet-side
# curve tree mirrors the store's over the same blocks — DRS-D3c's two Rust
# producers compared — and assembles the membership path; the production
# tx-builder signs the spend; the Bulletproof+ blob is read back for the
# production wire encoder. All test-only: the driver is the instrument the
# 4.I verification rows (CEN-I15, H19-verify) will be judged with.
shekyl-curve-tree = { path = "../shekyl-curve-tree" }
shekyl-tx-builder = { path = "../shekyl-tx-builder" }
shekyl-bulletproofs = { path = "../shekyl-bulletproofs" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
# The archival scenarios (`scenario_archival.rs`, DRS-E4 commit 4): the
# production bond-post constructors (`build_join_market_vin`,
# `build_release_vin`) shape the posts a persona rides on the driver's
# spend, so CEN-L7 is judged over posts a wallet would emit, not fixtures.
shekyl-archival-bond-builder = { path = "../shekyl-archival-bond-builder" }
# The spend self-verifies through the consensus verifier (`proof::verify`)
# against the wallet-side root before the driver lists it: until CEN-I15
# lands, admission alone would not say the proof is sound.
shekyl-fcmp = { path = "../shekyl-fcmp" }
# Planting a corrupt row for the SI-10 path.
redb = { workspace = true }
# The mutation family's seed-sensitive mock longhash (`keccak256(blob ‖ seed)`,
# DRS_E2_REPLAY_DRIVER.md §3.10): already in the normal graph via shekyl-wire;
# named here only so the test can call it directly.
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }

[lints]
workspace = true
