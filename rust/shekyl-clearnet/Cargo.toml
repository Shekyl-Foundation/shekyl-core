[package]
name = "shekyl-clearnet"
description = "Clearnet connector. One runtime, plaintext while the option is off, Noise while it is on. The choice is the declaration's stack plan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shekyl-capped-stream = { path = "../shekyl-capped-stream" }
shekyl-net-address = { path = "../shekyl-net-address" }
shekyl-p2p-transport = { path = "../shekyl-p2p-transport" }
shekyl-socks = { path = "../shekyl-socks" }
shekyl-peer-policy = { path = "../shekyl-peer-policy" }
shekyl-runtime = { path = "../shekyl-runtime" }
shekyl-timing-engine = { path = "../shekyl-timing-engine" }
shekyl-transport-layer = { path = "../shekyl-transport-layer" }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[lints]
workspace = true
