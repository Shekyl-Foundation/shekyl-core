[package]
name = "shekyl-archival-fetch-sched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon-only scheduler of shekyl-p-fetch: holder draw, SF-D6 moves, the shard view (ARCHIVAL_SHARD_FETCH.md SF-D1, SHARD_VIEW_FETCH.md)"
publish = false

[dependencies]
# The fetch client itself. This crate is the only production edge that may
# name it besides `shekyl-daemon-image` (SF-D4; check_p_fetch_dep_cut.py).
shekyl-p-fetch = { path = "../shekyl-p-fetch" }
# `ShardId` / `ArchivalLength` / `BlockHeight` / `BlockHash` /
# `PCanonicalId` / `ShardViewHash` — the domain the scheduler speaks in.
shekyl-types = { path = "../shekyl-types" }
# `PASS_ANCHOR_DEPTH_BLOCKS`: the requester's anchor is `tip − depth`, the
# same constant the pass verifier reads.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# `TxidParts`, the retained row an expectation is built from.
shekyl-wire = { path = "../shekyl-wire" }
# `HybridPublicKey` on a holder's `FetchTarget`.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# The holder draw: OS entropy, nothing derived (`SF-D10`: memoryless).
getrandom = "0.2"
# sync for the view cache; rt + macros for spawning a view's fetch.
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "net"] }
# One real serving endpoint behind the loopback SOCKS shim, so a need runs
# through the production client against the production serve loop.
# Dev-only — SF-D4 forbids the serve edge on the shipped graph.
shekyl-p-serve = { path = "../shekyl-p-serve", features = ["test-signer"] }
shekyl-p-loopback = { path = "../shekyl-p-loopback" }

[lints]
workspace = true
