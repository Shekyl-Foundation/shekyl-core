[package]
name = "shekyl-rpc-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wallet-daemon RPC wire-contract types: the SubmitVerdict/RejectCause submit contract (docs/design/DAEMON_SUBMIT_VERDICT.md §2), single Rust definition consumed by shekyl-daemon-rpc and shekyl-rpc-client"

[dependencies]
serde = { workspace = true }
# The network type `nettype` carries (`get_version`, `get_info`), with its
# lowercase serde names.
shekyl-network = { path = "../shekyl-network", features = ["serde"] }
# Reading a JSON-RPC error object (class + diagnostic) is this crate's,
# so a client does not grow a second parser (RK-D1, RW-Q3).
serde_json = { workspace = true }
# `AtomicUnits`, and its wire form `AtomicUnitsString`: the one definition of
# how an amount of coin crosses a JSON edge, shared with the wallet RPC
# (RK-Q2). Foundational and `no_std`; it brings serde and zeroize, both
# already in this crate's graph through every consumer.
shekyl-units = { path = "../shekyl-units" }
# `From<Network> for DaemonNetwork`: the wallet's three networks and the
# daemon's nettype are one conversion (G2). Address does not depend on
# this crate, so the impl lives here.
shekyl-address = { path = "../shekyl-address" }
# The grants the method table's policy column names (RPC_CHANNEL.md §6.1).
shekyl-rpc-grants = { path = "../shekyl-rpc-grants" }
# The Tor status's one shape (`TOR_STATUS_CRATE.md`): `daemon_status`'s Tor
# fields are its types, so the daemon and every client read the same values.
# serde only, no I/O.
shekyl-tor-status = { path = "../shekyl-tor-status" }
# A body's one encoding on the wire: base64, RFC 4648 §4, padded (RW-Q4,
# IG-6 `bytes`). Already in the tree (shekyl-cli, shekyl-wallet-rpc).
base64 = "0.22"

[build-dependencies]
# VC-1 (CLIENT_VERSION_CONSTANTS_VALIDATION.md §3.4): `build.rs` canonicalises
# config/consensus_constants.json and emits CONSENSUS_CONSTANTS_DIGEST — once,
# here, for every RPC party that depends on this crate. Build-time only; the
# production surface gains one `&str` and no runtime dependency.
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = { workspace = true }
# The tests include the same canonicaliser `build.rs` does, to pin its rules
# against a synthetic KAT and the live file.
sha2 = "0.10"
# Only to render a byte diff when a `.bin` parity test fails.
hex = "0.4"
# The frozen-hex txid KAT (tests/txid_kat.rs) computes the engine-side txid
# over a C++-captured oracle blob. Dev-only, and that is the load-bearing
# part: a wire-contract crate that pulled in the tx builder to check a test
# vector would invert its own dependency direction. The production surface is
# serde and the `.bin` codec above — nothing else.
shekyl-wire = { path = "../shekyl-wire" }

[lints]
workspace = true
