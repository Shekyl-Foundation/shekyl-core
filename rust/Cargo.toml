[workspace]
members = [
    "shekyl-ffi",
    "shekyl-fcmp",

    # V3.1 multisig — Option E′ (MS-5). The FROST spend-ceremony FSM, blob
    # format, and nonce typestates. Pure logic; its dependency list is the
    # structural "no transport" ban (docs/design/V3_1_MULTISIG_RUST_ENGINE.md,
    # MS-1). Wired to the wallet ledger by shekyl-engine-core.
    "shekyl-multisig",

    "shekyl-chacha",
    "shekyl-crypto-pq",
    "shekyl-crypto-hash",
    "shekyl-consensus",

    # DISPOSABLE measurement spike (SP-T3 / PD-F-2): the Tor-borne shard-fetch
    # dispersion harness. Named `-spike` on purpose -- nothing in it is canonical
    # and it must be deleted or fully rewritten before TJ-B (rule 15: debt,
    # labelled at birth). See docs/design/SP_T3_SKELETON_MEASUREMENT.md.
    "shekyl-sp-t3-spike",

    # DISPOSABLE measurement spike (§94): Tor transit, onion-to-onion, one-way.
    # Named `-spike` on purpose -- nothing in it is canonical and it is deleted
    # once `ANON_ZONE_TRANSIT_MEASURED_MS` lands (rule 15: debt, labelled at
    # birth). Separate from `shekyl-sp-t3-spike` because that one times a
    # `p-serve` fetch -- a round trip with application handling in the path,
    # which is what §94.5 amended the estimator away from.
    # See DAEMON_RELAY_PRIVACY.md §94.
    "shekyl-tor-transit-spike",

    # Canonical genesis block/tx binary wire-format serializer — the clean,
    # Shekyl-owned replacement for the vendored shekyl-oxide block/tx/ct modules
    # (docs/design/GENESIS_TX_WIRE_FORMAT.md, Decision 1 / §4).
    "shekyl-wire",

    # Windows security primitives for the wallet transport (WP-D2): owner-only
    # security descriptors built from SDDL, the current-user SID the pipe name
    # is derived from, and the client-side peer check. Its own crate rather
    # than a module because BOTH sides need the same Win32 token/SID calls and
    # one of them (`shekyl-wallet-rpc`) is `#![deny(unsafe_code)]`. Compiles to
    # nothing off Windows. See docs/design/WINDOWS_WALLET_SUPPORT.md.
    "shekyl-win-sec",

    # Genesis build/verify tool (`geblock`) — Rust replacement for the deleted
    # C++ genesis_builder (formerly shekyl-dev/tools/genesis_builder). Derives
    # the genesis tx key deterministically (domain-separated cSHAKE over the
    # recipients file), so the pinned GENESIS_TX in src/cryptonote_config.h is
    # byte-reproducible from config/genesis_recipients.*.json — the property
    # the fresh-txkey C++ tool could never provide and the config-pin CI gate
    # rests on. Also owns the fresh-entropy genesis wallet ceremony
    # (`geblock gen-wallets`).
    "shekyl-genesis-tool",

    # Structural tx-weight predictor (byte-mirror of shekyl_wire::Transaction::write)
    # + bounded input/output counts. Hoisted from shekyl-engine-core so the wallet
    # fee path and shekyl-economics-sim share one single-sourced weight model
    # (docs/design/ARCHIVAL_WORK_PRECISION_AND_ESCALATION.md §12.3 D-1).
    "shekyl-tx-weight",

    "shekyl-economics",
    "shekyl-economics-sim",

    # Agent-based staker-archival coverage simulation (iteration 1).
    # Epoch-granular agent dynamics; distinct instrument from the
    # year-granular macro `shekyl-economics-sim`. See
    # docs/design/STAKER_ARCHIVAL_SIM.md.
    "shekyl-staking-sim",

    # Funding-seam entry-standoff draw, single-sourced and build-float-free
    # (docs/design/ARCHIVAL_FIREWALL_GATE6.md §10.12), plus its generic
    # goodness-of-fit home. `shekyl-standoff` carries the wallet-importable
    # draw + feature-gated conformance; `shekyl-stats` is the dependency-free
    # statistics utility both it and `shekyl-crypto-pq` reuse (rule 18).
    "shekyl-standoff",
    "shekyl-stats",

    # Daemon relay-privacy timing core (Dandelion++ epoch/stem/fluff/embargo
    # draws + the stem map), derived from the paper rather than inherited as
    # `#define`s. Standalone measurement instrument: links nothing, replaces
    # nothing, and precedes any decision to move the C++ relay path. Shares
    # `shekyl-stats` with `shekyl-standoff` under the same `conformance`
    # feature split.
    "shekyl-relay-privacy",

    # Live daemon relay scheduler (RP-3a): owns the Dandelion++ zone state and
    # drives the timing primitives above. Deliberately separate — that crate's
    # charter is "timing only, nothing chooses peers or touches a socket", and
    # a zone actor does both. The split is what keeps the primitives
    # synchronous and pure, which is what the daemon's run_epoch/run_next_wake/
    # run_fluff force-step hooks — and therefore the gtest oracle — rest on.
    # See docs/design/DAEMON_RELAY_PRIVACY.md §18.
    "shekyl-relay",

    # Levin p2p framing layer (bucket header, fragments, noise, zstd flag
    # path) — the byte-exact Rust skeleton of docs/LEVIN_PROTOCOL.md, KAT'd
    # against the C++ epee::levin oracle. Framing only: no portable_storage,
    # no sockets. The compression half is production-live (the C++
    # epee::levin compression path shims through shekyl-ffi's
    # shekyl_levin_* exports — single-owner libzstd); the framing half is
    # inert until the scheduled p2p cutover (IMPLEMENTATION_INDEX.md LV row).
    "shekyl-levin",

    # LV-2a: binary portable_storage codec. Limits are a parameter so HTTP
    # `.bin` RPC and Levin share one decoder. Typed command maps are LV-2b
    # in shekyl-levin. See docs/design/LV2_PORTABLE_STORAGE.md.
    "shekyl-portable-storage",

    "shekyl-archival-retention",

    # Phase 4 Engine-native wallet RPC (docs/api/wallet_rpc.yaml). Replaces
    # C++ wallet_rpc_server. The transitional `shekyl-engine-rpc` wallet2-FFI
    # bridge that used to sit beside it is deleted (roadmap B1); the C++
    # `wallet2_ffi` surface it wrapped is Phase 5's to remove.
    "shekyl-wallet-rpc",

    "shekyl-tx-builder",
    "shekyl-daemon-rpc",

    # Single-sourced CT cleartext balance equation + typed-side terms, imported
    # by both construct (shekyl-tx-builder) and verify (shekyl-archival-retention)
    # (docs/design/ARCHIVAL_BOND_CONSTRUCTION.md §7.2 / §11.1 Q2)
    "shekyl-ct-balance",

    # Construct side of the archival bond: JoinMarket vin + hybrid signature +
    # credit balance term, mirroring the shekyl-archival-retention verify side
    # (docs/design/ARCHIVAL_BOND_CONSTRUCTION.md §7)
    "shekyl-archival-bond-builder",

    # Link-image crate: the daemon's single Rust archive (shekyl-ffi +
    # shekyl-daemon-rpc → one tracing-core dispatcher). No logic; see
    # its crate docs and src/daemon/CMakeLists.txt's nm gate.
    "shekyl-daemon-image",
    "shekyl-encoding",
    "shekyl-address",
    "shekyl-difficulty",

    # Foundational monetary-amount newtype (docs/completed/ATOMIC_UNITS_NEWTYPE.md)
    "shekyl-units",

    # Foundational state-shaped domain newtypes — heights, indices, hashes,
    # timestamps (docs/design/RAW_TYPE_NEWTYPE_MIGRATION.md PR 0)
    "shekyl-types",

    # First-party crates relocated out of the vendored shekyl-oxide tree in the
    # un-vendor slice-2 Track B (docs/design/SHEKYL_OXIDE_UNVENDOR.md §6 B2): the
    # FCMP++ application/support layer is ours, no longer upstream-tracked. Renamed
    # to role-honest names; provenance stamped per file. The pristine FCMP++ crypto
    # research crates remain workspace-excluded (see the `exclude` list below) and
    # vendored — those are the only "vendored" crates left.
    "shekyl-curve-io",
    "shekyl-curve-generators",
    "shekyl-curve-primitives",
    "shekyl-bulletproofs",
    "shekyl-fcmp-proofs",
    "shekyl-rpc-client",
    "shekyl-rpc-transport",

    # Wallet↔daemon wire-contract types: the SubmitVerdict/RejectCause submit
    # contract (docs/design/DAEMON_SUBMIT_VERDICT.md §2) — the single Rust
    # definition consumed by shekyl-daemon-rpc (server) and shekyl-rpc-client
    # (wallet). Draft until the §8 parity matrix clears.
    "shekyl-rpc-types",

    # Per-P archival-firewall network transport (2d-2 SP-T1)
    "shekyl-p-transport",

    # Persona serving loop: loopback shard server behind the P onion
    # service (2d-2 serving path; provisional THROWAWAY framing)
    "shekyl-p-serve",

    # The serving host: composes `shekyl-p-serve`'s loopback endpoint with
    # `shekyl-tor`'s onion supervisor over a serve-set derived from the bond
    # record (ARCHIVAL_CHALLENGE_MECHANISM.md §9.5 item 3, §9.6 item 4). Holds
    # the read-only store handle and never a wallet seed — §7.2(iii) custody.
    "shekyl-p-host",

    # Wallet-owned Tor integration: control client + lifecycle (2d-2 SP-T0)
    "shekyl-tor",

    # The operator alarm channel (OA-1): the snapshot a human reads when a
    # guarantee the wallet cannot restore by itself has been lost. A leaf on
    # purpose — it names no engine type, so an embedder can render an alarm
    # without linking the wallet orchestrator (rule 82 makes failure-mode UX
    # first-class, and a GUI matching on `OperatorAlarm` should not have to
    # pull `shekyl-engine-core` to do it).
    "shekyl-operator-alarm",

    # Shekyl-native scanner crate
    "shekyl-scanner",

    # Wallet-side FCMP++ curve-tree client (docs/design/CURVE_TREE_CLIENT.md):
    # local membership-path assembly and block-derived root reconstruction.
    "shekyl-curve-tree",

    # Canonical engine state types (transfers, runtime state, staker pool)
    "shekyl-engine-state",

    # v1 two-file wallet envelope orchestrator (.wallet.keys + .wallet)
    "shekyl-engine-file",

    # Plaintext-with-HMAC user preferences (layer 2 of WALLET_PREFS.md)
    "shekyl-engine-prefs",

    # V3 proof protocol (tx_proof, reserve_proof)
    "shekyl-proofs",

    # Shekyl engine core: orchestrator and transaction builders
    "shekyl-engine-core",

    # Interactive CLI engine (replacement for simplewallet)
    "shekyl-cli",

    # Unified tracing-based logger init for all Rust binaries
    "shekyl-logging",

    # Pure-software RandomX v2 verifier (docs/design/RANDOMX_V2_PLAN.md,
    # RANDOMX_V2_RUST.md). Consumed by shekyl-ffi (Phase 3); not the miner.
    "shekyl-pow-randomx",

    # Phase 2g Rust/C differential harness substrate: hand-written
    # `extern "C"` bindings for `external/randomx-v2` per R1-D2
    # option (c) close in `docs/design/RANDOMX_V2_PHASE2G_PLAN.md`
    # §3.5. Sole consumer is `shekyl-randomx-differential` (lands
    # at C4 per §8.1); T14 (§6.6) asserts the sole-consumer
    # invariant via `cargo metadata`. Fork-pin coupled per §1.7 +
    # §5.2.4 `[package.metadata.shekyl] fork-pin-sha`.
    "randomx-v2-sys",

    # Phase 2g Rust/C differential test harness binary. Compares
    # the `shekyl-pow-randomx` verifier against the `external/randomx-v2`
    # C reference (via `randomx-v2-sys`). Sole consumer of the
    # `randomx-v2-sys` crate (per R1-D13) and sole consumer of the
    # `shekyl-pow-randomx` `test-internals` feature (per R5-D1).
    # See `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §5.1 + §8.
    "shekyl-randomx-differential",
    "shekyl-shard-visual",

    # Shard data-source abstraction (list + aggregate lookup) consumed by the
    # GUI shard view. Fixtures-backed today; ArchivalEngine impl at Stage 5.
    "shekyl-shard-source",
]
# Local-only harnesses that must not participate in the parent
# workspace. Excluded here (rather than relying on the nested
# `[workspace]` table inside each one) so that `cargo check
# --workspace` on stable never tries to resolve libfuzzer-sys, which
# only builds under `cargo +nightly fuzz build`. Hardening-pass
# commit 8 (`docs/MID_REWIRE_HARDENING.md` §3.8).
exclude = [
    "shekyl-archival-retention/fuzz",
    "shekyl-engine-state/fuzz",
    # FCMP++ research crypto, vendored from the monero-oxide fork (pinned by
    # UPSTREAM_MONERO_OXIDE_COMMIT). The clean upstream-formatted mirror lives on
    # the fork — the EC-membership review artifact; this vendored copy is
    # reformatted to the workspace rustfmt style (the fork uses nightly-only
    # rustfmt options Shekyl's stable toolchain can't replicate). Excluded from
    # the workspace so upstream code is not subjected to Shekyl's clippy `-D`
    # gate (it builds as a path-dep of consumers; `cargo fmt --all` still formats
    # it to workspace style). The A1 content gate (CRYPTO_CONTENT_MANIFEST.sha256)
    # verifies its integrity. See docs/design/SHEKYL_OXIDE_UNVENDOR.md §6 (A0/A1).
    "shekyl-oxide/crypto/helioselene",
    "shekyl-oxide/crypto/divisors",
    "shekyl-oxide/crypto/generalized-bulletproofs",
    "shekyl-oxide/crypto/fcmps/circuit-abstraction",
    "shekyl-oxide/crypto/fcmps/ec-gadgets",
    "shekyl-oxide/crypto/fcmps",
]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"
# MSRV binding constraints (workspace floor = max of consumers):
#   - `kameo = "=0.20.0"`: 1.88.0 (crates.io index, 2026-05-29)
#   - `redb = "4.1.0"` (CT-1 LeafStore): 1.89.0
#   - `shekyl-pow-randomx`: `Box::new_zeroed_slice` (stable 1.92.0)
# Workspace pins 1.94.0 intentionally (RandomX PoW + CT-1 redb) and
# aligns with `shekyl-gui-wallet/src-tauri/
# rust-toolchain.toml`. Per `RANDOMX_V2_PHASE2B_PLAN.md` §9: the
# declared floor produces a clean cargo MSRV error rather than a
# cryptic compile failure deep in the graph. CI runs an explicit
# `rust-msrv-gate` job at 1.94.0 in addition to `@stable`; no
# workspace `rust-toolchain.toml` — the gate is the declaration plus
# the job, not a pinned local channel. Guix substrate does not exist
# today per `RANDOMX_V2_RUST.md` §22; when it lands, its rustc must
# be ≥ MSRV.
#
# Enforcement: this declaration is inherited by every first-party crate
# via `rust-version.workspace = true` in each member's `[package]`. The
# `[workspace.package]` value alone does not gate member crates —
# cargo only enforces a crate's MSRV when that crate declares
# `rust-version` (literal or `.workspace = true`). Propagating the
# inherit to all members makes the gate real per-crate rather than a
# virtual-root annotation; a future bump touches only the value here.
rust-version = "1.94"
license = "BSD-3-Clause"
repository = "https://github.com/radawson/Shekyl"

[workspace.dependencies]
thiserror = "2"
# Single-source zstd pin (decision 2026-08-06). One consumer today:
# `shekyl-levin`'s COMPRESSED path, which production reaches via the
# shekyl_levin_* FFI.
#
# The original justification — "shard serving is the anticipated second
# consumer" — was **falsified the same day** by the Z-1 measurement
# (FOLLOWUPS, "Shard serving on `P`: zstd compression REJECTED by
# measurement"): Shekyl wire bytes run 7.97–7.995 bits/B of entropy and
# zstd levels 1/3/9 *expand* every corpus. So this entry is not holding a
# place for a second consumer, and it is not here for frame
# interoperability either.
#
# It stays because the **feature set below is load-bearing** and must not
# be re-litigated per crate. A second crate that added `zstd = "0.13"` with
# defaults would silently re-break the Win64 cross build and re-widen the
# receive-path C surface, and `links = "zstd"` makes the graph collision a
# hard error rather than a quiet one (Z-5 records that hazard). Centralising
# the decision is what makes those failure modes unreachable.
#
# `default-features = false` drops all three of the crate's defaults, and
# each is dropped for a reason — they are not incidental trimming:
#
# - `zdict_builder` compiles `zstd/lib/dictBuilder` (`cover.c`), which calls
#   POSIX `qsort_r`. mingw-w64 has no `qsort_r`, so the Win64 cross build
#   fails at link with an undefined reference the moment `libshekyl_ffi.a`
#   carries those objects — which it does since the compression-shim cut
#   folded `shekyl-levin` into the daemon's Rust image. We train no
#   dictionaries; the builder is dead weight that breaks a supported target.
# - `legacy` compiles the decoders for zstd frame formats v0.1–v0.7. Every
#   frame we inflate came from this same pinned encoder, so a legacy frame
#   on the wire is by definition non-conforming — keeping those decoders
#   would only widen the attacker-reachable C surface on the p2p receive
#   path for a format we never emit.
# - `arrays` adds a `WriteBuf` impl for `[u8; N]` only. We write into
#   `Vec<u8>` and `&mut [u8]`, both of which are impl'd unconditionally.
#
# What remains is what `shekyl-levin` actually calls: `zstd::bulk` and
# `zstd::zstd_safe::{get_frame_content_size, decompress}`, over the
# `std`-enabled `zstd-safe` that the crate pins internally.
zstd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
# Single source of truth for the secret-wiping crate, replacing the
# per-crate pins that had drifted across two version floors (`1` / `^1.5`)
# and two derive-feature spellings (`derive` / `zeroize_derive`). First-party
# crates reference this as `{ workspace = true }`; the vendored `shekyl-oxide/crypto/*`
# crates keep their own `default-features = false` pins (rule 10).
zeroize = { version = "1.5", features = ["derive"] }

# RandomX v2 verifier primitives (Phase 2b). Both verified at source
# in `RANDOMX_V2_PHASE2B_PLAN.md` §4 and §5.6.
#
# `aes` provides the `hazmat::cipher_round` / `equiv_inv_cipher_round`
# round primitives for AesGenerator1R/4R and AesHash1R per `specs.md`
# §§3.2-3.4. The `hazmat` feature gates the single-round API per
# `aes-0.9.0/Cargo.toml:43-44`; without it the API is unreachable.
# Soft fallback is constant-time fixslicing per `aes-0.9.0/src/lib.rs:20-22`
# (not load-bearing for RandomX since the "keys" are public, but
# strictly better than `soft_aes.cpp`'s LUT path).
aes = { version = "0.9", default-features = false, features = ["hazmat"] }
#
# `blake2` provides `Blake2b512` for the §3.5 BlakeGenerator's
# "S = Hash512(S)" rebuild step. Currently transitive via `argon2 →
# blake2` in `shekyl-pow-randomx`; promoted to direct dep here so the
# consumption surface is honest and unaffected if `argon2` later drops
# its `blake2` dep. Cargo unifies; no additional build cost.
blake2 = { version = "0.10", default-features = false }

# Phase 2g Rust/C differential harness primitives. See
# `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §3.16 R4-D1 (the
# implementation-correctness decision that pins these as workspace
# deps) and §5.1.15 (the consumption surface in
# `shekyl-randomx-differential`'s `Cargo.toml`). All three are
# already widely-used direct deps across the workspace with
# independent per-crate pins (`sha2` in `shekyl-engine-core`,
# `shekyl-crypto-pq`, `shekyl-proofs`, `shekyl-engine-prefs`;
# `rand_chacha` in `shekyl-engine-core`, `shekyl-crypto-pq`,
# `shekyl-fcmp`, `shekyl-fcmp-proofs`; `serde_json` across
# ~14 crates). This section adds them to `[workspace.dependencies]`
# so the new `shekyl-randomx-differential` crate can reference them
# via `{ workspace = true }` and inherit a single shared pin; the
# existing per-crate pins are unaffected (Cargo unifies on the
# lockfile-resolved version regardless of declaration style).
# Lockfile-verified per `17-dependency-discipline.mdc`: sha2 0.10.9,
# rand_chacha 0.3.1, serde_json 1.0.149. The workspace addition
# introduces zero new transitive edges into the workspace dep graph
# (these crates are already resolved into the graph via the
# existing direct consumers).
#
# `rand_chacha` provides `ChaCha20Rng` for the deterministic
# corpus-generation path per R1-D4 (32-byte seed produces a
# reproducible draw of `(seedhash, data)` pairs across runs;
# determinism is load-bearing for the corpus-coverage proof, per
# §4.6 M1). Pinned at `0.3` to match the lower of two lockfile
# entries (the workspace already pulls `0.3.1` transitively; the
# `0.9.0` entry comes from an unrelated leaf and stays where it
# is — Cargo unifies on the workspace pin without forcing a graph
# rewrite).
rand_chacha = "0.3"
#
# `sha2` provides `Sha256` for the R1-D14 cache-equivalence
# precondition: the Rust-derived `PreparedCache`'s 256 MiB
# Argon2d-fill memory is streamed through a `Sha256` hasher (via
# the §5.3.3 `test-internals`-gated visitor accessor) and the
# digest is compared against `SHA-256(randomx_get_cache_memory(c))`
# computed by the C reference. The digest output is public (a
# correctness fingerprint, not a secret); no `Zeroize`-on-Drop
# discipline applies per `35-secure-memory.mdc`. Hasher state
# does hold transient block residue but is dropped synchronously
# after the digest call; the harness's drop-discipline memory
# budget (§3.15.4) is preserved.
sha2 = "0.10"
#
# `serde_json` provides the failure-output JSON schema serializer
# per R1-D11 + T11. On byte-equality divergence the harness emits
# a structured JSON record to stderr enumerating the 11 required
# fields (seedhash, data, expected/actual hex, mode, worker_id,
# timestamp, etc. per §5.1.14); T11 (`src/failure_output.rs`'s
# `#[cfg(test)]` module) round-trips a synthetic divergence record
# through `serde_json::to_string` + `serde_json::from_str` and
# asserts all 11 fields are present in the parsed map.
serde_json = "1"

# CT-1 `shekyl-curve-tree` LeafStore persistence (`docs/design/CT1_ROUND1_PINS.md`).
# Verified at source (redb 4.1.0): `Database::create`, `begin_write`/`begin_read`,
# `TableDefinition`, `ReadableTable` range scan; public chain data only — no
# `Zeroize` requirement (`17-dependency-discipline.mdc`). Pre-genesis greenfield:
# v3 file format only (no v2 migration path).
redb = "4.1.0"

# `kameo` actor framework — Stage 2 gate (per `docs/FOLLOWUPS.md`
# "kameo dependency pin and MSRV alignment before Stage 2 cuts" and
# the 2026-04-27 *Engine binary boundary* decision in
# `docs/V3_WALLET_DECISION_LOG.md`). Verified at source via the
# crates.io index 2026-05-29: 0.20.0 is the newest stable (released
# 2026-04-07, not yanked); supervision support shipped in 0.20.0 and
# the v0.19.x/v0.20.0 line carries the no-cycle-DAG deadlock fixes
# this project's topology depends on. Crate MSRV 1.88.0 (below the
# workspace floor). Pinned with an exact
# patch-level cap (`=0.20.0`) per the FOLLOWUP precondition: an actor
# framework is a coordination-load-bearing dependency where a silent
# minor bump could alter mailbox/supervision semantics under us.
#
# Live consumer (Stage 2): `shekyl-engine-core` consumes
# `kameo = { workspace = true }` as of the `KeyActor` migration
# (`docs/design/STAGE_2_KEY_ENGINE_ACTOR.md`); the pin is no longer
# inert in the build graph. The supervision/mailbox API surface was
# verified at source at that consumption point per
# `17-dependency-discipline.mdc` (§0.5 B6 finding below).
#
# Bounded-mailbox default convention (FOLLOWUP precondition 3): every
# actor uses a bounded mailbox; the workspace default is **capacity 64**.
# Unbounded mailboxes are forbidden under Path B for memory-pressure
# reasons. The *mechanism*, verified at source in kameo 0.20.0 (§0.5 B6):
# `Spawn::spawn(args)` is already bounded at 64 by default — there is **no
# `#[actor(mailbox = ...)]` attribute** (the earlier convention text named
# one that does not exist). Per-actor overrides pass an explicit mailbox to
# `spawn_with_mailbox(args, kameo::mailbox::bounded(n))` with an inline
# rationale naming the back-pressure or throughput measurement that
# justifies the deviation. `KeyActor` takes the default-64 `spawn` path.
kameo = "=0.20.0"

# Compile crypto-heavy crates with optimizations even in dev
[profile.dev.package]
subtle = { opt-level = 3 }
curve25519-dalek = { opt-level = 3 }
ff = { opt-level = 3 }
group = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
dalek-ff-group = { opt-level = 3 }
helioselene = { opt-level = 3 }
multiexp = { opt-level = 3 }
ec-divisors = { opt-level = 3 }
generalized-bulletproofs = { opt-level = 3 }
generalized-bulletproofs-circuit-abstraction = { opt-level = 3 }
generalized-bulletproofs-ec-gadgets = { opt-level = 3 }
full-chain-membership-proofs = { opt-level = 3 }
shekyl-curve-io = { opt-level = 3 }
shekyl-curve-generators = { opt-level = 3 }
shekyl-curve-primitives = { opt-level = 3 }
shekyl-bulletproofs = { opt-level = 3 }
shekyl-fcmp-proofs = { opt-level = 3 }
# SLH-DSA-192s is hash-bound: an unoptimized `fips205` (and the `sha2` it
# leans on) turns the message-signing and ACVP suites from ~3 s into ~85 s
# of every debug `cargo test` run, here and in CI.
fips205 = { opt-level = 3 }
sha2 = { opt-level = 3 }

[profile.dev]
panic = "abort"
overflow-checks = true
[profile.release]
panic = "abort"
overflow-checks = true
[profile.test]
overflow-checks = true
[profile.bench]
overflow-checks = true

[workspace.lints.clippy]
incompatible_msrv = "allow"
unwrap_or_default = "allow"
map_unwrap_or = "allow"
# Belt-and-braces for the `shekyl-logging::init(...)` footgun. The primary
# defense is `#[must_use]` on `LoggerGuard`, which fires on the common
# unbound shape `init(cfg)?;`. This lint catches only the narrower
# `let _ = init(cfg)?;` shape, which `#[must_use]` does not. See
# `rust/shekyl-logging/README.md` for the full defense hierarchy.
let_underscore_must_use = "deny"
borrow_as_ptr = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
enum_glob_use = "deny"
expl_impl_clone_on_copy = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
flat_map_option = "deny"
float_cmp = "deny"
fn_params_excessive_bools = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
invalid_upcast_comparisons = "deny"
large_stack_arrays = "deny"
linkedlist = "deny"
macro_use_imports = "deny"
manual_instant_elapsed = "deny"
manual_let_else = "deny"
manual_ok_or = "deny"
manual_string_new = "deny"
match_bool = "deny"
match_same_arms = "deny"
missing_fields_in_debug = "deny"
needless_pass_by_value = "deny"
ptr_cast_constness = "deny"
range_minus_one = "deny"
range_plus_one = "deny"
redundant_closure_for_method_calls = "deny"
redundant_else = "deny"
string_add_assign = "deny"
unchecked_time_subtraction = "deny"
uninlined_format_args = "deny"
unnecessary_box_returns = "deny"
unnecessary_join = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unused_async = "deny"
unused_self = "deny"
zero_sized_map_values = "deny"
