[package]
name = "shekyl-difficulty"
description = "LWMA-1 difficulty adjustment for Shekyl (docs/completed/DAA_LWMA1.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Leaf crate: no *external* runtime crates. First-party `shekyl-types` is
# the shared vocabulary (`BlockHeight`, `Timestamp`) so this crate does
# not redefine them as `u64`. `DAA_LWMA1.md` §2.1's "zero internal
# workspace dependencies" is the 2026-06 cycle-ban that produced that
# redefinition; RTN-5 restores the types. The build script still reads
# `config/consensus_constants.json` directly.
[dependencies]
shekyl-types = { path = "../shekyl-types" }

[build-dependencies]
serde_json = "1"

# Test-only. The runtime crate keeps its zero-dependency posture
# (DAA_LWMA1.md §2.1); `proptest` is a dev-dependency used solely by
# the `check_hash` differential fuzz test, and `serde_json` (already a
# build-dependency above) additionally serves the shared C2-R3 boundary
# vectors in `tests/mtp_boundary_vectors.rs`. Both are already pinned in
# the workspace lockfile, so neither adds new resolution.
[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints]
workspace = true
