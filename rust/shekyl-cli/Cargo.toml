[package]
name = "shekyl-cli"
description = "Interactive CLI engine for Shekyl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shekyl-cli"
path = "src/main.rs"

[dependencies]
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-types = { path = "../shekyl-types" }
# The daemon's `get_info` reply is one type, defined once (RK-D1); the CLI
# reads it for `chain_health` and the mining gates.
shekyl-rpc-types = { path = "../shekyl-rpc-types" }
shekyl-wallet-rpc = { path = "../shekyl-wallet-rpc" }
# The release version string the binary prints (DC-Q20).
shekyl-version = { path = "../shekyl-version" }
# `shard fetch --png`: the candidate.v1 renderer over the aggregate
# `get_shard_view` returns. Rendering is the viewer's; no picture crosses
# the wallet RPC (SV-D).
shekyl-shard-visual = { path = "../shekyl-shard-visual" }
# The outbound-endpoint disclosure (`network_posture`) and the host extractor
# `--rpc-url` validation shares with it; already in this binary's graph
# through shekyl-wallet-rpc.
shekyl-rpc-transport = { path = "../shekyl-rpc-transport" }
# The console renderers read the block target from the economics
# parameters, the peer-list caps, and the daemon's option table.
shekyl-economics = { path = "../shekyl-economics" }
shekyl-peerlist = { path = "../shekyl-peerlist" }
shekyl-daemon-config = { path = "../shekyl-daemon-config" }
shekyl-options = { path = "../shekyl-options" }
clap = { version = "4", features = ["derive"] }
rustyline = "15"
tokio = { version = "1", features = ["full"] }
# Derives the request shapes in `rpc_client::params`, whose borrowed `&str`
# fields are what keep a password out of an unwipeable `serde_json::Value`
# (rule 35). The workspace entry, already locked and already compiled here
# through `serde_json` — a direct edge onto a vetted dependency, not a new one.
serde = { workspace = true }
serde_json = "1"
zeroize = { workspace = true }
rpassword = "7"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
tracing = "0.1"
shekyl-logging = { path = "../shekyl-logging" }
# Already locked through shekyl-logging. A direct edge so the status line
# can ask the system clock for local civil time (`localtime_r` inside
# `OffsetDateTime::now_local`) instead of a hand-rolled calendar.
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
shekyl-units = { path = "../shekyl-units" }
# The console binds a transaction body and recomputes its id (`tx show`).
shekyl-wire = { path = "../shekyl-wire" }
hex = "0.4"

# WP-W2: the self-hosted transport's dial (`open_verified`, which runs the
# peer check before handing back a handle) and the seed file's owner-only
# create (WP-D8). Both need Win32 calls and `unsafe`; this crate has neither
# and per WP-D2 does not acquire them. Off Windows the crate compiles to
# nothing and the call sites are `cfg(windows)`.
[target.'cfg(windows)'.dependencies]
shekyl-win-sec = { path = "../shekyl-win-sec" }

[dev-dependencies]
proptest = "1"
tempfile = "3"
# Console fixtures that build a reply the daemon would send
# (`project_transactions`, a view-listener refusal).
shekyl-daemon-rpc = { path = "../shekyl-daemon-rpc" }
# `tx show`'s regtest: a wallet that holds a coinbase, against a real daemon.
shekyl-engine-core = { path = "../shekyl-engine-core" }
shekyl-address = { path = "../shekyl-address" }
shekyl-engine-file = { path = "../shekyl-engine-file" }
shekyl-engine-prefs = { path = "../shekyl-engine-prefs" }
shekyl-rpc-client = { path = "../shekyl-rpc-client" }

[lints]
workspace = true
