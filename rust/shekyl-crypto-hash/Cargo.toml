[package]
name = "shekyl-crypto-hash"
description = "Keccak-256 (original, non-SHA3) hashing for Shekyl consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Audited RustCrypto keccak — `Keccak256` is original Keccak (0x01 padding), the
# consensus-critical variant. Shared with shekyl-curve-primitives so the codebase
# has one keccak implementation. The empty-input KAT in lib.rs pins byte-identity.
sha3 = { version = "0.10", default-features = false }

[lints]
workspace = true
