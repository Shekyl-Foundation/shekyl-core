# `seeds/<target>/` is committed and read by every run of that target
# (the nightly workflow's `fuzz` job; locally,
#   cargo +nightly fuzz run <target> corpus/<target> seeds/<target>).
# The KEM seeds are the eight vectors of `docs/test_vectors/
# KEM_DERIVE_V1_KAT.json`, each `x25519_eph_pk || ml_kem_ct`, the layout
# `fuzz_kem_decapsulate` reads. The multisig key and signature blob seeds
# are the non-empty `adversarial_test_cases` inputs of
# `docs/PQC_TEST_VECTOR_002_MULTISIG.json`, one file per case, named for
# it; the signature blob also gets `kat_one_signature`, a well-formed
# one-signature container (`0x01 || sig || 0x00`) around the
# `hybrid_signature_hex` of `docs/test_vectors/PQC_HYBRID_V2_KAT.json`,
# so the fuzzer starts past the count and length checks. The
# `fuzz_construct_output_malformed_kem` seeds are the vectors of
# `docs/test_vectors/PQC_SCAN_OUTPUT_KAT.json`, each
# `amount_le8 || output_index_le8 || tx_key || recipient_x25519_pk ||
# recipient_ml_kem_ek`, the layout that harness reads.
# A crash's input joins its target's directory with the fix:
# `fuzz_bech32m_address_decode/crash_third_inside_a_character` is the
# first nightly dispatch's, valid UTF-8 whose byte-length third fell
# inside a two-byte character, which the harness sliced at.

[package]
name = "shekyl-crypto-pq-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.8"
# `seeded-rng` (TEST_ONLY): a fuzz input becomes a transaction key through
# `TxKey::seeded` (R-21); the fuzz crate is outside the workspace and ships nothing.
shekyl-crypto-pq = { path = "..", features = ["seeded-rng"] }
shekyl-types = { path = "../../shekyl-types" }

[[bin]]
name = "fuzz_multisig_key_blob"
path = "fuzz_targets/fuzz_multisig_key_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_multisig_sig_blob"
path = "fuzz_targets/fuzz_multisig_sig_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_multisig_verify"
path = "fuzz_targets/fuzz_multisig_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bech32m_address_decode"
path = "fuzz_targets/fuzz_bech32m_address_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_kem_decapsulate"
path = "fuzz_targets/fuzz_kem_decapsulate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_construct_output"
path = "fuzz_targets/fuzz_construct_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_construct_output_malformed_kem"
path = "fuzz_targets/fuzz_construct_output_malformed_kem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_derive_output_key"
path = "fuzz_targets/fuzz_derive_output_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_scan_malformed_ct"
path = "fuzz_targets/fuzz_scan_malformed_ct.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_derive_output_secrets"
path = "fuzz_targets/fuzz_derive_output_secrets.rs"
test = false
