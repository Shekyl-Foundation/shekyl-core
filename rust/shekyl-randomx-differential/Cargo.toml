[package]
name = "shekyl-randomx-differential"
description = "Phase 2g Rust/C differential test harness: shekyl-pow-randomx vs external/randomx-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Phase 2g C4 skeleton (per `docs/design/RANDOMX_V2_PHASE2G_PLAN.md`
# §5.1 + §8.1). This crate is a leaf workspace member that owns the
# differential harness comparing the `shekyl-pow-randomx` Rust verifier
# against the `external/randomx-v2` C reference (via the
# `randomx-v2-sys` extern-"C" wrapper crate). Per §5.6 + R1-D13 it has
# no downstream consumers — it is a binary-only harness, with an
# `#[doc(hidden)]` `[lib]` surface that exists solely so integration
# tests under `tests/` and the `src/bin/gen_canonical_outputs.rs`
# binary (a separately-compiled crate per Cargo convention) can
# reach the harness's modules. Items are declared `pub` rather than
# `pub(crate)` because integration tests and binaries consume the
# library as a separate crate; the §5.6 sole-binary invariant + the
# crate-level `#![doc(hidden)]` attribute preserve the spirit of
# `pub(crate)` (no production consumer outside the harness; T14
# asserts via `cargo metadata`). The plan-doc's `pub(crate)` text
# in §5.1.5–§5.1.14 / §5.1.17 / §5.1.18 is a minor imprecision
# corrected in `src/lib.rs`'s "Visibility note" docstring at C5a.
# Modules land at C5+ per §8.1; the C4 skeleton's `src/lib.rs` is
# intentionally empty per §5.1.4.
#
# §5.1.15 dep wiring:
#   - `shekyl-pow-randomx = { path = "...", features = ["test-internals"] }`
#     enables the R5-D1 cache-byte-access accessor (§3.17 + §5.3.3)
#     needed by §5.1.7's R1-D14 cache-equivalence precondition.
#     **Path-dep, not workspace-dep**: `shekyl-pow-randomx` is a
#     workspace member, not an external crate registered in
#     `[workspace.dependencies]`; the path form parallels
#     `randomx-v2-sys = { path = "..." }` below. The plan-doc row
#     for §5.1.15 was substrate-corrected at C4 close per the same
#     substrate-reading discipline that closed Copilot PR #75's R4-D1
#     finding (rule-17 + rule-26 forward-action queue).
#   - `randomx-v2-sys = { path = "../randomx-v2-sys" }` is the C
#     reference's Rust binding; the path-dep form is required because
#     §5.6 forbids any other workspace member from depending on this
#     crate (sole-consumer invariant; asserted by T14 §6.6).
#   - `rand_chacha`, `sha2`, `serde_json` are workspace deps promoted at
#     C0 (per R4-D1 + Copilot PR #75 correction); they are widely used
#     direct deps elsewhere in the workspace, and the harness inherits
#     the workspace-level pin for consistency.
#   - `serde` (with `derive` feature, workspace-pinned) added at C9 for
#     the §5.1.14 `FailureOutput` `#[derive(Serialize, Deserialize)]`
#     surface (T11 round-trip). The workspace dep is already pinned at
#     `serde = { version = "1", features = ["derive"] }`; no new
#     supply-chain surface is added by enabling it here.
#
# Per §5.3 the harness does NOT enable the `internal-pool-bench`
# feature on `shekyl-pow-randomx`; only `test-internals`.

[lib]
name = "shekyl_randomx_differential"
path = "src/lib.rs"

[[bin]]
name = "shekyl-randomx-differential"
path = "src/main.rs"

# Explicit (not auto-discovered) so the bin name is hyphenated to
# match the house invocation style; auto-discovery would name it
# `gen_parity_corpus` after the file stem.
[[bin]]
name = "gen-parity-corpus"
path = "src/bin/gen_parity_corpus.rs"

# The Phase 3a full-dataset parity gate and its miner-shaped known
# answer (`RANDOMX_V2_PHASE3_PLAN.md` §7), run by the `full-parity` job
# of `randomx-v2-differential.yml`.
[[bin]]
name = "full-parity"
path = "src/bin/full_parity.rs"
required-features = ["full-dataset"]

[[bin]]
name = "miner-kat"
path = "src/bin/miner_kat.rs"
required-features = ["full-dataset"]

# Forwards `randomx-v2-sys`'s miner symbols. The light differential
# build does not enable this. `full-parity` and `miner-kat` require it.
[features]
full-dataset = ["randomx-v2-sys/full-dataset"]

[dependencies]
shekyl-pow-randomx = { path = "../shekyl-pow-randomx", features = ["test-internals"] }
randomx-v2-sys = { path = "../randomx-v2-sys" }
# The concurrent mode (T7, T8) hashes through the daemon's one owner of
# caches, so its RSS ceiling is the production owner's
# (RANDOMX_CACHE_ACTOR.md §8). The parity and corpus modes derive caches
# directly: they compare the verifier with the C reference.
shekyl-hasher = { path = "../shekyl-hasher" }
shekyl-hash-budget = { path = "../shekyl-hash-budget" }
# `PowHash`: the type the verifier↔JIT parity verdict compares across
# (DRS-E2 RD-Q12). Already in the graph through shekyl-pow-randomx; named
# here because the comparison is this crate's.
shekyl-types = { path = "../shekyl-types" }
# Rotating-corpus seed derivation (§7.9 MR-R1): the house cSHAKE256
# primitive, so the domain separator is registry-governed like every
# other one rather than a local Keccak call.
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
# The full-dataset gate's genesis case: mainnet's genesis block as the
# daemon assembles it (the network table's transaction under the genesis
# tool's header), hashed and PoW-blobbed by the wire crate.
shekyl-network = { path = "../shekyl-network" }
shekyl-genesis-tool = { path = "../shekyl-genesis-tool" }
shekyl-wire = { path = "../shekyl-wire" }
hex = "0.4"
rand_chacha = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Workspace clippy lint set per `rust/Cargo.toml`. The light build
# declares no `extern "C"` (that surface stays in `randomx-v2-sys`).
# The `full-dataset` feature's module is the one unsafe caller, and it
# calls the sys crate rather than declaring symbols here. The workspace
# defaults are sufficient.
[lints]
workspace = true
