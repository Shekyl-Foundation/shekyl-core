# `seeds/<target>/` is committed and read by every run of that target
# (the nightly workflow's `fuzz` job; locally,
#   cargo +nightly fuzz run <target> corpus/<target> seeds/<target>).
# `crash_commitments_passed_times_eight` is the first input the first
# nightly dispatch drove into the prover: the harness handed the verifier
# `8·C` where it reads `C` as carried, so every proof failed. A crash's
# input joins its target's directory with the fix.

[package]
name = "shekyl-tx-builder-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shekyl-bulletproofs = { path = "../../shekyl-bulletproofs" }
shekyl-curve-primitives = { path = "../../shekyl-curve-primitives" }
shekyl-curve-io = { path = "../../shekyl-curve-io" }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
rand_core = { version = "0.6", features = ["std"] }

[[bin]]
name = "fuzz_bp_plus_masks"
path = "fuzz_targets/fuzz_bp_plus_masks.rs"
test = false
doc = false
bench = false

[workspace]
