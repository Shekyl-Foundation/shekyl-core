[package]
name = "shekyl-tx-builder"
description = "Native Rust transaction signing for Shekyl FCMP++ (BP+, membership proof, PQC auth)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The signers' seeded forms: `sign_transaction_with_terms_seeded`,
# `sign_pqc_auths_seeded`, `open_spend_seeded` and
# `prove_backing_membership_seeded`, which draw every random value (the range
# proof, the pseudo-out blinds, the membership proof, the ML-DSA nonces) from a
# caller's seed, so one seed gives one transaction byte for byte. For the chain
# forge's reproducible chains (CHAIN_FORGE.md §5.3, seam T2). TEST_ONLY
# (`scripts/ci/check_test_only_features.py`): forwards the seeded provers and
# signers below it, and no build that ships has a signer that takes its
# caller's randomness (CF-R9).
seeded-rng = ["shekyl-fcmp/seeded-rng", "shekyl-crypto-pq/seeded-rng", "dep:rand_chacha"]

[dependencies]
# The network id each input's signature hash binds (NETWORK_IDENTITY.md NI-Q4).
shekyl-network = { path = "../shekyl-network" }
shekyl-fcmp = { path = "../shekyl-fcmp" }
# `AtomicUnits` amount-newtype (`docs/completed/ATOMIC_UNITS_NEWTYPE.md`).
# Carries `SpendInput`/`OutputInfo` amounts and validate/sign totals; raw
# `u64` reappears only at the oxide `Commitment::new` edge (§4.1).
shekyl-units = { path = "../shekyl-units" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
# Single-sourced CT cleartext balance terms (InputTerm / OutputTerm). Construct
# consumes the same typed-side terms verify checks
# (docs/design/ARCHIVAL_BOND_CONSTRUCTION.md §7.2); the builder stays bond-agnostic.
shekyl-ct-balance = { path = "../shekyl-ct-balance" }
shekyl-bulletproofs = { path = "../shekyl-bulletproofs" }
shekyl-curve-primitives = { path = "../shekyl-curve-primitives" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
shekyl-curve-io = { path = "../shekyl-curve-io" }
# Canonical genesis spend serializer + signing hashes (the wire authority). The wire
# adapter (`wire.rs`) maps onto this. (Bp+ crypto comes from `shekyl-bulletproofs`
# above; the dissolved `shekyl-oxide` crate is no longer a dependency.)
shekyl-wire = { path = "../shekyl-wire" }
# The group recipient of a multisig output (`outputs::Payee::Group`).
shekyl-address = { path = "../shekyl-address" }
# The prefix hash the builder signs is the txid preimage's first component and
# leaves `shekyl-wire` typed (`PrefixHash`, RTN-7); it stays typed through the
# signer entry points and becomes bytes only at the proof-crate handoff.
shekyl-types = { path = "../shekyl-types" }

curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
fips204 = "0.4.6"
rand_core = { version = "0.6", features = ["std"] }
# The seeded entry points' generator (`seeded-rng` only).
rand_chacha = { version = "0.3", optional = true }
zeroize = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
# `HARNESS_NETWORK_ID` for this crate's tests, which sign or judge a
# harness chain under it: TEST_ONLY (CHAIN_FORGE.md CF-R15), dev edge only.
shekyl-network = { path = "../shekyl-network", features = ["harness"] }
rand = "0.8"
# The seeded signers' own determinism tests (`seeded-rng`, on this dev edge only).
shekyl-tx-builder = { path = ".", features = ["seeded-rng"] }

# Hardening-pass commit 2 (`docs/MID_REWIRE_HARDENING.md` §3.2):
# criterion + gungraun harness for `transfer_e2e_1in_2out`. The
# bench composes the two crypto pieces we can exercise without a
# synthetic FCMP++ curve-tree fixture — BP+ range proof over 2 output
# commitments and one ML-DSA-65 hybrid signature. The manifest
# (`docs/benchmarks/shekyl_rust_v0.manifest.md`) documents this
# explicitly as a *components* bench; adding the full
# `sign_transaction` call with a valid tree fixture is tracked as a
# known gap for a future commit (see §3.2 "Known gaps").
criterion = { version = "0.5", features = ["html_reports"] }
gungraun = "0.19"
shekyl-bulletproofs = { path = "../shekyl-bulletproofs" }
# The transfer_e2e benches: `test-utils` for the ephemeral keypair, and
# `seeded-rng` for `sign_with_ml_dsa_seed`, whose fixed nonce keeps the
# instruction count stable. Both TEST_ONLY; dev edge only.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq", features = ["test-utils", "seeded-rng"] }
rand_core = { version = "0.6", features = ["std"] }

[[bench]]
name = "transfer_e2e"
harness = false

[[bench]]
name = "transfer_e2e_iai"
harness = false

[lints]
workspace = true
