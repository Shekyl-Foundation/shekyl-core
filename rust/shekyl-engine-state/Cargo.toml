[package]
name = "shekyl-engine-state"
description = "Canonical Shekyl engine state types: TransferDetails, RuntimeWalletState, StakerPoolState, and the blocks persisted to the wallet file ledger section."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zeroize = { version = "^1.5", features = ["zeroize_derive"] }
curve25519-dalek = { version = "4", features = ["alloc", "zeroize"] }
hex = { version = "0.4", features = ["alloc"] }
serde.workspace = true
serde_bytes = "0.11"
thiserror.workspace = true
tracing = "0.1"
postcard = { version = "1", features = ["alloc"] }
getrandom = { version = "0.2", features = ["std"] }

# Hardening-pass commit 3.4 (`docs/MID_REWIRE_HARDENING.md` §3.4):
# `postcard-schema` turns the `block_version` discipline from cultural
# invariant into a mechanical check. Every persisted block derives
# `Schema`; `src/schema_snapshot.rs` snapshots the resulting `NamedType`
# tree to JSON and CI diffs that snapshot on every PR. Pinned at
# `0.2` (same major as `postcard = "1"`, stable schema representation).
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "use-std"] }

shekyl-address = { path = "../shekyl-address" }
# `KeyImage` newtype consumed by `TransferDetails::key_image` for
# type-system protection at the engine-state boundary; serialization
# is `#[serde(transparent)]` so the on-disk format is unchanged.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-oxide = { path = "../shekyl-oxide/shekyl-oxide" }
shekyl-staking = { path = "../shekyl-staking" }
# `AtomicUnits` amount newtype (docs/completed/ATOMIC_UNITS_NEWTYPE.md). The
# `TransferDetails::amount()` accessor returns it; the stored `commitment`
# stays fork-`u64` and converts at the `commitment_bytes` serializer edge.
shekyl-units = { path = "../shekyl-units" }
# Canonical `TxHash` newtype for `TransferDetails::tx_hash` /
# `PaymentRequest::matched_tx_hash`. No `schema` feature needed: those blocks
# derive `Schema` via wire-native mirror structs, so the persisted schema and
# its snapshot are unchanged by the newtype (it is transparent over `[u8; 32]`).
shekyl-types = { path = "../shekyl-types" }

[dev-dependencies]
serde_json = "1"
proptest = "1"

# Hardening-pass commit 2 (`docs/MID_REWIRE_HARDENING.md` §3.2): criterion for
# wall-clock metrics on the two engine-state hot paths (`ledger`, `balance`),
# and iai-callgrind for deterministic instruction-count metrics mirroring the
# same hot paths (suffix `_iai`). The criterion harness runs on any host;
# iai-callgrind requires Valgrind plus `cargo install iai-callgrind-runner`
# and is the metric the §3.3 CI gate enforces against.
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.16"

# Used only by `benches/balance.rs` — the canonical `BalanceSummary::compute`
# lives in the scanner crate; the bench lives in `shekyl-engine-state` because
# that is where the `TransferDetails` input type is defined. Dev-only, does
# not widen the crate's runtime dep graph.
shekyl-scanner = { path = "../shekyl-scanner" }
shekyl-oxide = { path = "../shekyl-oxide/shekyl-oxide" }
curve25519-dalek = { version = "4", features = ["alloc", "zeroize"] }

[[bench]]
name = "ledger"
harness = false

[[bench]]
name = "ledger_iai"
harness = false

[[bench]]
name = "balance"
harness = false

[[bench]]
name = "balance_iai"
harness = false

[lints]
workspace = true
