# cargo-fuzz harness for the region-2 payload parser. Excluded from the
# parent workspace (see `rust/Cargo.toml`'s `[workspace].exclude`) so the
# workspace's stable checks never resolve `libfuzzer-sys`. `ci/fuzz-harness`
# type-checks it on stable; the nightly workflow's `fuzz` job runs it
# (`cargo +nightly fuzz run region2_parser`).
# See `README.md` in this directory for the invocation (hardening-pass
# commit 8 — `docs/MID_REWIRE_HARDENING.md` §3.8).

[package]
name = "shekyl-engine-state-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"

[package.metadata]
cargo-fuzz = true

# Isolate this package from the parent workspace on the off chance
# cargo auto-discovers it despite the `exclude` entry upstream.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
shekyl-engine-state = { path = ".." }

[[bin]]
name = "region2_parser"
path = "fuzz_targets/region2_parser.rs"
test = false
doc = false
bench = false
