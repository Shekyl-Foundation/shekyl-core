[package]
name = "shekyl-p-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PR-A persona serving loop: loopback shard server + store pin/read (2d-2 §9.5 item 3; Tor wiring is PR-B)"
publish = false

[dependencies]
# The shard store: `frozen_segment_leaf_bytes` is the serving read and
# `pin_segment` is what keeps a bonded shard's bytes across `prune_frozen`.
# `recompute_segment_r_k` is re-exported for the witness-side check the
# integration test mirrors.
shekyl-curve-tree = { path = "../shekyl-curve-tree" }
# Same async runtime surface as the SP-T3 spike's serve endpoint whose
# hardening shape this crate productionizes: net + io-util for the loopback
# listener, sync for the in-flight semaphore, time for the per-step bounds.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "time", "sync"] }
# SF-D8 countersignature: the 80-byte transcript and the ±2-block anchor
# gate are consensus constants owned by the retention crate (`pass_anchor`);
# the serve side builds the same bytes the verifier recomputes. Retention
# is a pure consensus library — it does not depend back on any serving
# crate, so this edge stays inside SF-D4's cut.
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
# `HybridSignature` is the countersignature's type and canonical codec;
# `SCHEME_DOMAIN_ATTESTATION` is the domain the signer binds under.
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# Inland clocks on the pre-sign gate (`PassSigner::own_height`,
# `anchor_within_gate`) are ordinal `BlockHeight`.
shekyl-types = { path = "../shekyl-types" }

[features]
# Exposes `TestKeySigner` — a `PassSigner` over an ephemeral, non-derived
# keypair — to this crate's integration tests and to `shekyl-p-fetch`'s
# loopback conversation test (a *dev* edge; SF-D4 forbids it on the
# shipped graph). The name announces intent: a non-derived key never
# reaches a wallet or a bonded persona.
test-signer = ["shekyl-crypto-pq/test-utils"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
# Self-dependency: integration tests build the lib without cfg(test), so the
# test signer must ride the dev graph explicitly (same shape as retention's
# `consensus-kat` unlock).
shekyl-p-serve = { path = ".", features = ["test-signer"] }

[lints]
workspace = true
