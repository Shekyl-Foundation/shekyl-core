[package]
name = "shekyl-proofs"
description = "Transaction proof and reserve proof protocol for Shekyl V3 (tx_proof, reserve_proof)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
# The signing envelope (`shekyl_network::envelope`): each proof frames what it
# signs under the network id. Already in this crate's graph through
# `shekyl-crypto-pq` (17-dependency-discipline).
shekyl-network = { path = "../shekyl-network" }
shekyl-curve-generators = { path = "../shekyl-curve-generators" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
curve25519-dalek = "4"
sha2 = "0.10"
zeroize = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror.workspace = true

[dev-dependencies]
rand = "0.8"
hex = "0.4"
proptest = "1"

[lints]
workspace = true
