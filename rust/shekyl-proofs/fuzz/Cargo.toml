[package]
name = "shekyl-proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shekyl-proofs = { path = ".." }
shekyl-crypto-pq = { path = "../../shekyl-crypto-pq" }

[[bin]]
name = "fuzz_verify_tx_proof_outbound"
path = "fuzz_targets/fuzz_verify_tx_proof_outbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_tx_proof_inbound"
path = "fuzz_targets/fuzz_verify_tx_proof_inbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_reserve_proof"
path = "fuzz_targets/fuzz_verify_reserve_proof.rs"
test = false
doc = false
bench = false

[workspace]

# fips204 0.5.0 with no conditional branch on a secret coefficient under
# `overflow-checks = true`, and with the NTT path's range hardened (the record
# is docs/benchmarks/ca3_pq_branch_sweep_20261123.md). The fork is the tag plus
# that fix, at the same version: every value the tag returned is unchanged.
# `[patch]` applies only in the root manifest being built: each fuzz workspace
# with fips204 in its lock carries this same entry, and
# scripts/ci/check_crypto_closure.py holds that one revision in every lock and every patch.
[patch.crates-io]
fips204 = { git = "https://github.com/Shekyl-Foundation/fips204", rev = "904f0bdfcd9da840373c584ca1b5fb8f3cc76668" }
