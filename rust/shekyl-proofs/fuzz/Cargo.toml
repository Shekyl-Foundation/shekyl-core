[package]
name = "shekyl-proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shekyl-proofs = { path = ".." }
shekyl-crypto-pq = { path = "../../shekyl-crypto-pq" }

[[bin]]
name = "fuzz_verify_tx_proof_outbound"
path = "fuzz_targets/fuzz_verify_tx_proof_outbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_tx_proof_inbound"
path = "fuzz_targets/fuzz_verify_tx_proof_inbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verify_reserve_proof"
path = "fuzz_targets/fuzz_verify_reserve_proof.rs"
test = false
doc = false
bench = false

[workspace]

# fips204 0.5.0 with no conditional branch on a secret coefficient under
# `overflow-checks = true` (CRYPTO_AUDIT.md section 3.2). The fork is the tag
# plus that fix, at the same version, so the arithmetic and every signature
# are unchanged. `[patch]` applies only in the root manifest being built: each
# fuzz workspace with fips204 in its lock carries this same entry, and
# scripts/ci/check_crypto_closure.py holds the revision in every lock.
[patch.crates-io]
fips204 = { git = "https://github.com/Shekyl-Foundation/fips204", rev = "072a7d68bef14c2332d4b5ebd006189a3eedb2eb" }
