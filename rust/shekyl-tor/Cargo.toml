[package]
name = "shekyl-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wallet-owned Tor supervisor: lifecycle, vanguard rotation and persona publish (2d-2 SP-T0)"
publish = false

[dependencies]
# The Tor control protocol, the SP-T0c binary pin gate and the v3 onion
# identity — lifted into their own crate because the daemon needs the same
# protocol against its own Tor instance (PWD-E9: sharing code is not crossover;
# sharing state is). The crypto edges those modules carry (hmac, sha2,
# ed25519-dalek, sha3, hex-literal, zeroize) went with them; this crate is the
# supervisor and holds none of them directly.
shekyl-tor-control = { path = "../shekyl-tor-control" }

# The supervisor loop: tokio for the incarnation timers, socket probes and
# `spawn_blocking` hash offload; kameo for the control actor handle it drives.
# Both are the workspace's established actor stack (shekyl-engine-core).
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process", "fs"] }
kameo = { workspace = true }
# OS CSPRNG for the vanguard layer-2/layer-3 rotation draws (VG-1).
getrandom = "0.2"

[dev-dependencies]
# The SP-T0c gate's bypass, for the lifecycle tests that inject an arbitrary
# (unpinned) tor via `TorBinarySource::UncheckedForTest`. A **dev**-dependency
# edge deliberately: `resolver = "2"` keeps dev-dep features out of normal
# builds, and `scripts/ci/check_test_only_features.py` asserts no non-dev edge
# in the workspace enables it. Listed alongside the normal edge above, which
# stays featureless.
shekyl-tor-control = { path = "../shekyl-tor-control", features = ["unpinned-tor-for-tests"] }
# The cookie-file reader KATs write a real 32-byte file and read it back (the
# length gate is the point); tempfile is the workspace's standard test fixture,
# already vetted and locked. The DQ-T0.4 owned-net backend also uses it for the
# hermetic Tor net's temp `DataDirectory` tree, and the SP-T0c `binary.rs` KATs
# for candidate/verify fixtures.
tempfile = "3"
# The DQ-T0.4 live harness (`tests/circuit_isolation.rs`) drives the actor and the
# serialized SOCKS dials on a tokio runtime — same feature set the crate's own
# `[dependencies]` tokio already pulls, listed here so the integration-test target
# links it directly.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
# The measurement dials with the **real** production persona usernames
# (`derive_socks_user(&PCanonicalId)`) so it proves the actual firewall identities
# land on distinct circuits — not stand-in strings. `shekyl-types` supplies the
# `PCanonicalId` newtype the derivation takes. Both are `publish = false` workspace
# siblings, and neither depends on `shekyl-tor`, so there is no dependency cycle.
shekyl-p-transport = { path = "../shekyl-p-transport" }
shekyl-types = { path = "../shekyl-types" }

[lints]
workspace = true
