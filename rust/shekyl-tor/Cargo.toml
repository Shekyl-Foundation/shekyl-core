[package]
name = "shekyl-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wallet-owned Tor integration: control-port client + lifecycle (2d-2 SP-T0)"
publish = false

[dependencies]
# SAFECOOKIE control-port authentication (control-spec §3.24): HMAC-SHA256 over
# the auth cookie + client/server nonces. The same hmac/sha2 the workspace
# crypto crates already vet (and the same minimal set the Gosling reference
# uses) — no new supply-chain surface, new internal consumers.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Structural wiping of the 32-byte control auth cookie (rule 35): it is secret
# key material — whoever holds it can drive the control port. `alloc` adds the
# `Vec<u8>` zeroize impl for the cookie-file read buffer (we read into a buffer we
# wipe rather than leaving the bytes in a dropped allocation).
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

# The control-port actor (`control::actor`): tokio socket I/O driving the sans-IO
# framer through one kameo actor. tokio + kameo are the workspace's established
# actor stack (shekyl-engine-core); futures-core is just the `Stream` trait
# `attach_stream` consumes (the read half is wrapped as a `Stream<Item = Framed>`);
# getrandom is the OS CSPRNG for the SAFECOOKIE client nonce. `process` is SP-T0b's
# managed-child launch/shutdown (`tokio::process::{Command, Child}`).
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
kameo = { workspace = true }
futures-core = "0.3"
getrandom = "0.2"
# SP-T0b managed-child shutdown: `SIGTERM` for a graceful `tor` exit (tokio/std only
# expose `SIGKILL` via `Child::kill`). The workspace's already-locked libc; the one
# `unsafe` call is a documented `kill(2)` on a pid we own.
libc = "0.2"

[dev-dependencies]
# The cookie-file reader KATs write a real 32-byte file and read it back (the
# length gate is the point); tempfile is the workspace's standard test fixture,
# already vetted and locked. The DQ-T0.4 owned-net backend also uses it for the
# hermetic Tor net's temp `DataDirectory` tree.
tempfile = "3"
# The DQ-T0.4 live harness (`tests/circuit_isolation.rs`) drives the actor and the
# serialized SOCKS dials on a tokio runtime — same feature set the crate's own
# `[dependencies]` tokio already pulls, listed here so the integration-test target
# links it directly.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
# The measurement dials with the **real** production persona usernames
# (`derive_socks_user(&PCanonicalId)`) so it proves the actual firewall identities
# land on distinct circuits — not stand-in strings. `shekyl-types` supplies the
# `PCanonicalId` newtype the derivation takes. Both are `publish = false` workspace
# siblings, and neither depends on `shekyl-tor`, so there is no dependency cycle.
shekyl-p-transport = { path = "../shekyl-p-transport" }
shekyl-types = { path = "../shekyl-types" }

[lints]
workspace = true
