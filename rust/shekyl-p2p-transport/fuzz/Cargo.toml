# `seeds/<target>/` is committed and read by every run of that target
# (the nightly workflow's `fuzz` job; locally,
#   cargo +nightly fuzz run <target> corpus/<target> seeds/<target>).
# `fuzz_read_message1`'s seed is the pinned message 1, `src/kat_m1.hex`
# as bytes. The responder refuses any length but `MESSAGE1_LEN` (1216
# bytes) first, and unseeded the fuzzer never grows an input that long:
# 80 million executions on the first nightly dispatch never left the
# length check. A crash's input joins its target's directory with the fix.

[package]
name = "shekyl-p2p-transport-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shekyl-p2p-transport = { path = ".." }

[[bin]]
name = "fuzz_read_message1"
path = "fuzz_targets/fuzz_read_message1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_read_message2"
path = "fuzz_targets/fuzz_read_message2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_open_one"
path = "fuzz_targets/fuzz_open_one.rs"
test = false
doc = false
bench = false

[workspace]

# fips204 0.5.0 with no conditional branch on a secret coefficient under
# `overflow-checks = true` (CRYPTO_AUDIT.md section 3.2). The fork is the tag
# plus that fix, at the same version, so the arithmetic and every signature
# are unchanged. `[patch]` applies only in the root manifest being built: each
# fuzz workspace with fips204 in its lock carries this same entry, and
# scripts/ci/check_crypto_closure.py holds the revision in every lock.
[patch.crates-io]
fips204 = { git = "https://github.com/Shekyl-Foundation/fips204", rev = "0663628b8d67a30c115fa2e37315dd7f1d24f447" }
