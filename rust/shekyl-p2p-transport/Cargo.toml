[package]
name = "shekyl-p2p-transport"
description = "Clearnet Noise NNhfs network pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fips203 = "=0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-noise = { path = "../shekyl-noise" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { workspace = true }

[features]
# The C5 bench times private handshake and record code. Production builds
# leave it off. `rekey-timing` is the one HKDF the bench calls on its own.
c5-bench = ["shekyl-noise/rekey-timing"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
shekyl-levin = { path = "../shekyl-levin" }
# The pinned-vector test asserts the key schedule and the rekey through the
# record layer's test accessors.
shekyl-noise = { path = "../shekyl-noise", features = ["test-support"] }

[[bench]]
name = "c5"
harness = false
required-features = ["c5-bench"]
