[package]
name = "shekyl-p2p-transport"
description = "Clearnet Noise NNhfs network pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The network id and wire prefix (`prefix.rs` re-exports them).
shekyl-network = { path = "../shekyl-network" }
fips203 = "=0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
shekyl-crypto-hash = { path = "../shekyl-crypto-hash" }
shekyl-crypto-pq = { path = "../shekyl-crypto-pq" }
shekyl-noise = { path = "../shekyl-noise" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { workspace = true }

[features]
# The C5 bench times private handshake and record code. Production builds
# leave it off. `rekey-timing` is the one HKDF the bench calls on its own.
c5-bench = ["shekyl-noise/rekey-timing"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# The instruction-count harness of `benches/c5_iai.rs`, at the version
# every other gated bench uses.
gungraun = "0.19"
rand = "0.8"
shekyl-levin = { path = "../shekyl-levin" }

[[bench]]
name = "c5"
harness = false
required-features = ["c5-bench"]

# C5's cells as instruction counts (BA-T24's per-PR arm): the handshake's
# steps, one record and one window sealed and opened, one rekey.
[[bench]]
name = "c5_iai"
harness = false
required-features = ["c5-bench"]
