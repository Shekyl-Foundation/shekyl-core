[package]
name = "shekyl-levin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Levin p2p framing layer and typed command maps (LV-2b). See docs/LEVIN_PROTOCOL.md."

[dependencies]
thiserror = { workspace = true }
shekyl-net-address = { path = "../shekyl-net-address" }
# The disclosure count the handshake and timed-sync frames are bounded by.
shekyl-peer-bounds = { path = "../shekyl-peer-bounds" }
shekyl-portable-storage = { path = "../shekyl-portable-storage" }

[dev-dependencies]
# Round-trip property tests (rule 50): builder → chunked reader → same
# message, over arbitrary payloads, commands, and chunk boundaries.
proptest = "1"
# Test-only: `tests/notify_kats.rs` asserts the hand-copied
# `ATTESTATION_WITNESS_MAX_BYTES` twin equals the retention crate's authority.
# Not a production dependency (see `payload/block.rs`).
shekyl-archival-retention = { path = "../shekyl-archival-retention" }
shekyl-p2p-transport = { path = "../shekyl-p2p-transport" }
# The regtest handshake advertises the id derived from fakechain's genesis
# pin. Dev-only: production Levin does not know which network it is on.
shekyl-rpc-types = { path = "../shekyl-rpc-types" }

[lints]
workspace = true
