[package]
name = "shekyl-levin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Levin p2p framing layer (bucket header, fragments, noise, compression). See docs/LEVIN_PROTOCOL.md."

[features]
# Mirrors the C++ HAVE_ZSTD build gate (contrib/epee/src/levin_compression.cpp):
# with the feature off, `try_compress_message` is the identity and receiving a
# COMPRESSED bucket is an error — exactly the C++ behavior without zstd.
# Default-on because the production daemon builds with HAVE_ZSTD.
default = ["zstd"]
zstd = ["dep:zstd"]

[dependencies]
thiserror = { workspace = true }
# This vendored, pinned libzstd (zstd-sys `cc`-compiles the copy in the
# crate; the non-default `pkg-config` feature is NOT enabled) is the
# binary's SINGLE zstd implementation since the compression-shim cut
# (2026-08-06): the C++ epee::levin path reaches it through the
# shekyl_levin_* FFI, the system-libzstd link and HAVE_ZSTD gate are
# deleted, and `links = "zstd"` is claimed exactly once, by zstd-sys.
# The dual-libzstd / symbol-collision question formerly parked at the
# FOLLOWUPS LV-3 entry is resolved by construction.
#
# Optional: only pulled in by the `zstd` feature above. The version is the
# single-source [workspace.dependencies] pin (decision 2026-08-06): further
# consumers are anticipated (shard serving), and one pin keeps every
# component's frames interoperable by construction.
zstd = { workspace = true, optional = true }

[dev-dependencies]
# Round-trip property tests (rule 50): builder → chunked reader → same
# message, over arbitrary payloads, commands, and chunk boundaries.
proptest = "1"

[lints]
workspace = true
