[package]
name = "shekyl-levin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Levin p2p framing layer (bucket header, fragments, noise, compression). See docs/LEVIN_PROTOCOL.md."

[features]
# Mirrors the C++ HAVE_ZSTD build gate (contrib/epee/src/levin_compression.cpp):
# with the feature off, `try_compress_message` is the identity and receiving a
# COMPRESSED bucket is an error — exactly the C++ behavior without zstd.
# Default-on because the production daemon builds with HAVE_ZSTD.
default = ["zstd"]
zstd = ["dep:zstd"]

[dependencies]
thiserror = { workspace = true }
# Compatibility with peers running the C++ stack comes from the zstd *frame
# format*, which is stable and version-independent — NOT from sharing a
# library with the C++ build. This is a different libzstd: `zstd-sys` takes
# its pkg-config branch only under its non-default `pkg-config` feature, so
# by default it `cc`-compiles the copy vendored in the crate, while the C++
# build links the system library (`CMakeLists.txt`: pkg_check_modules /
# find_library, then -DHAVE_ZSTD).
#
# Two consequences to settle at the LV-3 cutover, when this crate is first
# folded into a staticlib the daemon links: the binary would then carry two
# libzstd implementations with colliding ZSTD_* symbols, and `zstd-sys`
# declares `links = "zstd"`, which conflicts with any other crate claiming
# that key. Deciding between them (enable `pkg-config`, or keep vendored and
# isolate) needs a link graph that does not exist yet — shekyl-levin is in no
# staticlib today. Recorded in the FOLLOWUPS "Levin p2p migration" LV-3 entry.
#
# Optional: only pulled in by the `zstd` feature above.
zstd = { version = "0.13", optional = true }

[dev-dependencies]
# Round-trip property tests (rule 50): builder → chunked reader → same
# message, over arbitrary payloads, commands, and chunk boundaries.
proptest = "1"

[lints]
workspace = true
