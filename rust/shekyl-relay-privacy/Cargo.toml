[package]
name = "shekyl-relay-privacy"
description = "Daemon relay-privacy timing core: the Dandelion++ epoch/stem/fluff/embargo draws and the stem map, derived from the paper rather than inherited as constants, with feature-gated goodness-of-fit conformance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default build is the derivation + draws + stem map: integer-only at draw
# time, dependency-free, the path the daemon would eventually link. The
# `conformance` feature pulls the statistics utility and compiles the
# goodness-of-fit grading + timeline measurement machinery, which is float-
# bearing and test/diagnostic only. Same split as `shekyl-standoff`.
default = []
conformance = ["dep:shekyl-stats"]

[dependencies]
shekyl-stats = { path = "../shekyl-stats", optional = true }

[dev-dependencies]
# The conformance instruments are the point of this crate's test surface, so
# the test build always enables them.
shekyl-relay-privacy = { path = ".", features = ["conformance"] }
# TEST-ONLY, and it does not touch the daemon-linked build (the default build
# stays dependency-free). `spec_decision_matrix` claims its table is exhaustive
# over the legal input domain; the only way that claim can FAIL when the cap
# moves is to compare against the cap as the code enforces it. `MAX_INPUTS` is
# checked by `proof::verify`, which is the call the surface times, so it is the
# anchor with the shortest path to the number.
shekyl-fcmp = { path = "../shekyl-fcmp" }
# TEST-ONLY, same rule: the default build stays dependency-free. These two are
# what let `carrier::WINDOW_BYTES` be ENFORCED rather than performed. The
# window has to hold a real `NOTIFY_NEW_TRANSACTIONS` carrying a real
# transaction, so the test asks the two crates that own those facts instead of
# re-typing either — `predict_size_and_weight` for the transaction and `notify`
# for the envelope. A build-time derivation would absorb a proof-size change
# silently and shift the window; a test reds with the constant named.
shekyl-tx-weight = { path = "../shekyl-tx-weight" }
shekyl-levin = { path = "../shekyl-levin" }

[lints]
workspace = true
