---
name: "shekyl-android-3"
enable_cache: true
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "curl"
- "gperf"
- "gcc"
- "g++"
- "binutils-gold"
- "git"
- "pkg-config"
- "build-essential"
- "autoconf"
- "libtool"
- "automake"
- "faketime"
- "bsdmainutils"
- "ca-certificates"
- "python3"
- "python-is-python3"
- "cmake"
- "unzip"
remotes:
- "url": "https://github.com/Shekyl-Foundation/shekyl-core.git"
  "dir": "shekyl"
files: []
script: |

  WRAP_DIR=$HOME/wrapped
  HOSTS="aarch64-linux-android"
  FAKETIME_HOST_PROGS="clang clang++ ar nm"
  FAKETIME_PROGS="date"
  HOST_CFLAGS="-O2 -g"
  HOST_CXXFLAGS="-O2 -g"
  HOST_LDFLAGS=-static-libstdc++

  export GZIP="-9n"
  export TZ="UTC"
  export BUILD_DIR=`pwd`
  mkdir -p ${WRAP_DIR}
  if test -n "$GBUILD_CACHE_ENABLED"; then
    export SOURCES_PATH=${GBUILD_COMMON_CACHE}
    export BASE_CACHE=${GBUILD_PACKAGE_CACHE}
    export GITIAN=1
    mkdir -p ${BASE_CACHE} ${SOURCES_PATH}
  fi

  export ZERO_AR_DATE=1

  function create_global_faketime_wrappers {
  for prog in ${FAKETIME_PROGS}; do
    echo '#!/usr/bin/env bash' > ${WRAP_DIR}/${prog}
    echo "REAL=\`which -a ${prog} | grep -v ${WRAP_DIR}/${prog} | head -1\`" >> ${WRAP_DIR}/${prog}
    echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAP_DIR}/${prog}
    echo "export FAKETIME=\"$1\"" >> ${WRAP_DIR}/${prog}
    echo "\$REAL \$@" >> $WRAP_DIR/${prog}
    chmod +x ${WRAP_DIR}/${prog}
  done
  }

  function create_per-host_faketime_wrappers {
  for i in $HOSTS; do
    ABI=$i
    if expr $i : arm- > /dev/null
    then
      ABI=$i"eabi"
    fi
    NDKDIR="${BUILD_DIR}/shekyl/contrib/depends/$i/native/bin"
    for prog in ${FAKETIME_HOST_PROGS}; do
        WRAPPER=${WRAP_DIR}/${ABI}-${prog}
        echo '#!/usr/bin/env bash' > ${WRAPPER}
        echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAPPER}
        echo "export FAKETIME=\"$1\"" >> ${WRAPPER}
        echo "$NDKDIR/${ABI}-$prog \$@" >> ${WRAPPER}
        chmod +x ${WRAPPER}
    done
  done
  }

  # Faketime for depends so intermediate results are comparable
  export PATH_orig=${PATH}
  create_global_faketime_wrappers "2000-01-01 12:00:00"
  create_per-host_faketime_wrappers "2000-01-01 12:00:00"
  export PATH=${WRAP_DIR}:${PATH}

  # gcc 7+ honors SOURCE_DATE_EPOCH, no faketime needed
  export SOURCE_DATE_EPOCH=`date -d 2000-01-01T12:00:00 +%s`

  # Hardened rustup install — download-then-run, NOT `curl | sh` (mirrors
  # .github/actions/install-rust). In a pipe the line's exit status is sh's, so
  # a failed/partial curl leaves sh reading empty stdin and exiting 0: a silent
  # no-op that only surfaces later at the first rustc use (PR #236/#241). The
  # file form with an explicit failure guard aborts here instead, and --retry
  # rides transients. Pin the workspace toolchain (rust/rust-toolchain.toml) up
  # front with the minimal profile: a gitian build compiles the Rust FFI
  # (cargo build --release) and never lints, so clippy/rustfmt are omitted —
  # which also keeps the parallel `make` below from racing several cargo
  # processes to auto-install rustup's default profile into the shared
  # ~/.rustup/downloads dir ("component download failed ... could not rename",
  # the alpha.6 gitian failure). Keep 1.94.0 in lockstep with
  # rust/rust-toolchain.toml (see its bump-policy note).
  curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-connrefused -o /tmp/rustup-init.sh https://sh.rustup.rs || { echo 'FATAL: rustup-init download failed' >&2; exit 1; }
  sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.94.0
  export PATH="$HOME/.cargo/bin:$PATH"
  rustup target add aarch64-linux-android

  git config --global core.abbrev 9
  cd shekyl
  # Set the version string that gets added to the tar archive name
  version="`git describe`"
  if [[ $version == *"-"*"-"* ]]; then
    version="`git rev-parse --short=9 HEAD`"
    version="`echo $version | head -c 9`"
  fi

  BASEPREFIX=`pwd`/contrib/depends
  # Build dependencies for each host
  export TAR_OPTIONS=--mtime=2000-01-01T12:00:00
  for i in $HOSTS; do
    make ${MAKEOPTS} -C ${BASEPREFIX} HOST="${i}"
  done

  # Faketime for binaries
  export PATH=${PATH_orig}
  create_global_faketime_wrappers "${REFERENCE_DATETIME}"
  create_per-host_faketime_wrappers "${REFERENCE_DATETIME}"

  # Build in a new dir for each host
  export TAR_OPTIONS=--mtime=${REFERENCE_DATE}T${REFERENCE_TIME}
  for i in ${HOSTS}; do
    export PATH=${WRAP_DIR}:${BASEPREFIX}/${i}/native/bin:${PATH_orig}
    mkdir build && cd build
    cmake .. -DCMAKE_TOOLCHAIN_FILE=${BASEPREFIX}/${i}/share/toolchain.cmake -DCMAKE_BUILD_TYPE=Release
    make ${MAKEOPTS}
    chmod 755 bin/*
    cp ../LICENSE ../README.md ../docs/ANONYMITY_NETWORKS.md bin
    chmod 644 bin/LICENSE bin/*.md
    DISTNAME=shekyl-${i}-${version}
    mv bin ${DISTNAME}
    find ${DISTNAME}/ | sort | tar --no-recursion --owner=0 --group=0 -c -T - | bzip2 -9 > ${OUTDIR}/${DISTNAME}.tar.bz2
    cd ..
    rm -rf build
  done

