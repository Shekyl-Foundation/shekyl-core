---
name: "shekyl-linux-3"
enable_cache: true
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "curl"
- "gperf"
- "gcc"
- "g++"
- "gcc-aarch64-linux-gnu"
- "g++-aarch64-linux-gnu"
- "binutils-aarch64-linux-gnu"
- "g++-riscv64-linux-gnu"
- "binutils-gold"
- "git"
- "pkg-config"
- "build-essential"
- "autoconf"
- "libtool"
- "automake"
- "faketime"
- "bsdmainutils"
- "ca-certificates"
- "python3"
remotes:
- "url": "https://github.com/Shekyl-Foundation/shekyl-core.git"
  "dir": "shekyl"
files: []
script: |

  WRAP_DIR=$HOME/wrapped
  # riscv64-linux-gnu is switched off, not deleted (Rick, 2026-10-24): it has
  # no BINSEC decoder and no board to measure on, so CA-1's constant-time
  # record cannot cover it (docs/design/CRYPTO_AUDIT.md §1). It comes back
  # when a user asks for it and there is a way to measure it. Restoration is
  # three edits: put the host back on this line, add its row to
  # rust/xtask/matrix.toml, and drop "switched_off" from its pin row. The apt
  # toolchain stays.
  HOSTS="x86_64-linux-gnu aarch64-linux-gnu"
  FAKETIME_HOST_PROGS=""
  FAKETIME_PROGS="date"
  HOST_CFLAGS="-O2 -g"
  HOST_CXXFLAGS="-O2 -g"
  HOST_LDFLAGS=-static-libstdc++

  export GZIP="-9n"
  export TZ="UTC"
  export BUILD_DIR=`pwd`
  mkdir -p ${WRAP_DIR}
  if test -n "$GBUILD_CACHE_ENABLED"; then
    export SOURCES_PATH=${GBUILD_COMMON_CACHE}
    export BASE_CACHE=${GBUILD_PACKAGE_CACHE}
    export GITIAN=1
    mkdir -p ${BASE_CACHE} ${SOURCES_PATH}
  fi

  function create_global_faketime_wrappers {
  for prog in ${FAKETIME_PROGS}; do
    echo '#!/usr/bin/env bash' > ${WRAP_DIR}/${prog}
    echo "REAL=\`which -a ${prog} | grep -v ${WRAP_DIR}/${prog} | head -1\`" >> ${WRAP_DIR}/${prog}
    echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAP_DIR}/${prog}
    echo "export FAKETIME=\"$1\"" >> ${WRAP_DIR}/${prog}
    echo "\$REAL \$@" >> $WRAP_DIR/${prog}
    chmod +x ${WRAP_DIR}/${prog}
  done
  }

  function create_per-host_faketime_wrappers {
  for i in $HOSTS; do
    for prog in ${FAKETIME_HOST_PROGS}; do
        REAL_PROG=`which ${i}-${prog} 2>/dev/null || true`
        if [ -n "$REAL_PROG" ]; then
            echo '#!/usr/bin/env bash' > ${WRAP_DIR}/${i}-${prog}
            echo "REAL=\`which -a ${i}-${prog} | grep -v ${WRAP_DIR}/${i}-${prog} | head -1\`" >> ${WRAP_DIR}/${i}-${prog}
            echo 'export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1' >> ${WRAP_DIR}/${i}-${prog}
            echo "export FAKETIME=\"$1\"" >> ${WRAP_DIR}/${i}-${prog}
            echo "\$REAL \$@" >> $WRAP_DIR/${i}-${prog}
            chmod +x ${WRAP_DIR}/${i}-${prog}
        fi
    done
  done
  }

  # Faketime for depends so intermediate results are comparable
  export PATH_orig=${PATH}
  create_global_faketime_wrappers "2000-01-01 12:00:00"
  create_per-host_faketime_wrappers "2000-01-01 12:00:00"
  export PATH=${WRAP_DIR}:${PATH}

  EXTRA_INCLUDES_BASE=$WRAP_DIR/extra_includes
  mkdir -p $EXTRA_INCLUDES_BASE

  # gcc 11+ honors SOURCE_DATE_EPOCH, no faketime needed
  export SOURCE_DATE_EPOCH=`date -d 2000-01-01T12:00:00 +%s`

  # Hardened rustup install — download-then-run, NOT `curl | sh` (mirrors
  # .github/actions/install-rust). In a pipe the line's exit status is sh's, so
  # a failed/partial curl leaves sh reading empty stdin and exiting 0: a silent
  # no-op that only surfaces later at the first rustc use (PR #236/#241). The
  # file form with an explicit failure guard aborts here instead, and --retry
  # rides transients. Pin the workspace toolchain (rust/rust-toolchain.toml) up
  # front with the minimal profile: a gitian build compiles the release
  # binaries (`cargo xtask dist`) and never lints, so clippy/rustfmt are
  # omitted, and nothing later auto-installs a profile into the shared
  # ~/.rustup/downloads dir ("component download failed ... could not rename",
  # the alpha.6 gitian failure). Keep 1.94.0 in lockstep with
  # rust/rust-toolchain.toml (see its bump-policy note).
  curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-connrefused -o /tmp/rustup-init.sh https://sh.rustup.rs || { echo 'FATAL: rustup-init download failed' >&2; exit 1; }
  sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.94.0
  export PATH="$HOME/.cargo/bin:$PATH"
  cd shekyl
  # The Rust target of each host, from the release matrix.
  for host in $HOSTS; do
    triple=$(cd rust && cargo xtask triple --host "$host")
    rustup target add "$triple"
  done
  # The version in the archive's name is the one the binaries carry: the
  # xtask computes it once (`v<version>` at a release tag).
  version=$(cd rust && cargo xtask archive-version)

  BASEPREFIX=`pwd`/contrib/depends
  # Build dependencies for each host
  export TAR_OPTIONS=--mtime=2000-01-01T12:00:00
  for i in $HOSTS; do
    ARCH_INCLUDES="$EXTRA_INCLUDES_BASE/$i"
    if [ -d "$ARCH_INCLUDES" ]; then
      EXTRA_INCLUDES="${EXTRA_INCLUDES_BASE}:${ARCH_INCLUDES}"
    else
      EXTRA_INCLUDES="${EXTRA_INCLUDES_BASE}"
    fi
    export C_INCLUDE_PATH="$EXTRA_INCLUDES"
    export CPLUS_INCLUDE_PATH="$EXTRA_INCLUDES"
    make ${MAKEOPTS} -C ${BASEPREFIX} HOST="${i}" V=1
  done

  # Faketime for binaries
  export PATH=${PATH_orig}
  create_global_faketime_wrappers "${REFERENCE_DATETIME}"
  create_per-host_faketime_wrappers "${REFERENCE_DATETIME}"
  export PATH=${WRAP_DIR}:${PATH}

  ORIGPATH="$PATH"
  # Build in a new dir for each host
  export SOURCE_DATE_EPOCH=`date -d ${REFERENCE_DATE}T${REFERENCE_TIME} +%s`
  export TAR_OPTIONS=--mtime=${REFERENCE_DATE}T${REFERENCE_TIME}
  for i in ${HOSTS}; do
    export PATH=$HOME/.cargo/bin:${BASEPREFIX}/${i}/native/bin:${ORIGPATH}
    mkdir build && cd build
    ARCH_INCLUDES="$EXTRA_INCLUDES_BASE/$i"
    if [ -d "$ARCH_INCLUDES" ]; then
      EXTRA_INCLUDES="${EXTRA_INCLUDES_BASE}:${ARCH_INCLUDES}"
    else
      EXTRA_INCLUDES="${EXTRA_INCLUDES_BASE}"
    fi
    export C_INCLUDE_PATH="$EXTRA_INCLUDES"
    export CPLUS_INCLUDE_PATH="$EXTRA_INCLUDES"
    # The binaries and the files the archive carries, staged in bin/ with
    # their modes (rust/xtask/matrix.toml).
    (cd ../rust && cargo xtask dist --host ${i} --out ../build/bin)
    # The pinned Tor Expert Bundle (TOR_BUNDLE_DISTRIBUTION.md TB-6). It gets
    # a directory of its own, bin/tor/, because the daemon refuses a tor
    # directory that holds anything but the pinned files; the licence texts
    # and the source pointer sit beside it for the same reason. The tarball's
    # SHA-256 is checked against config/tor_pins.json before it is opened,
    # and each staged file against its own pin. A host with no bundle
    # (riscv64) stages nothing and its archive carries no tor.
    #
    # This descriptor does not use errexit — a make failure above has been
    # non-fatal for the rest of the build. These three are the release gate
    # for the bundle, so each one's status stops the descriptor on its own.
    #
    # The tarball comes from the sources cache and from nowhere else:
    # gitian-build.py fetched it there, digest-checked, before the build
    # started. --no-fetch makes a cache miss a refusal, and a build with no
    # cache at all stops here, so this step cannot go online.
    #
    # verify re-checks the staged directory and the cached tarball. A row
    # that carries upstream also ties each staged file to Tor's bytes.
    if [ -z "${SOURCES_PATH:-}" ]; then
      echo "tor bundle: no sources cache (SOURCES_PATH is unset); the bundle is not downloaded inside the build" >&2
      exit 1
    fi
    if ! python3 ../scripts/release/tor_bundle.py stage --no-fetch --host "${i}" --sources "${SOURCES_PATH}" --dest bin/tor --licenses bin/tor-licenses; then
      echo "tor bundle: stage failed for ${i}" >&2
      exit 1
    fi
    if ! TOR_DISPOSITION="$(python3 ../scripts/release/tor_bundle.py disposition --host "${i}")"; then
      echo "tor bundle: disposition failed for ${i}" >&2
      exit 1
    fi
    if [ "${TOR_DISPOSITION}" = "pinned" ]; then
      if ! python3 ../scripts/release/tor_bundle.py verify --host "${i}" --dir bin/tor --sources "${SOURCES_PATH}"; then
        echo "tor bundle: verify failed for ${i}" >&2
        exit 1
      fi
    fi
    DISTNAME=shekyl-${i}-${version}
    mv bin ${DISTNAME}
    find ${DISTNAME}/ | sort | tar --no-recursion --owner=0 --group=0 -c -T - | bzip2 -9 > ${OUTDIR}/${DISTNAME}.tar.bz2
    cd ..
    rm -rf build
  done

