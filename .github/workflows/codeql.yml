name: "CodeQL Analysis"

on:
  # Merge queue (06-branching.mdc): the same checks on the *merge result*,
  # not only the branch head — the class of failure neither PR's CI can
  # see (#771×#772, #853×#858, #878×#880). `merge_group` takes no `paths`
  # filter, so this runs on every group regardless of the PR filter above
  # or below.
  merge_group:
    types: [checks_requested]
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "30 4 * * 1"   # Every Monday at 4:30 AM UTC
  workflow_dispatch:

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  # A title or body edit is `edited` and does not change the base. It has its
  # own group so cancel-in-progress does not abort the run that edit is not
  # replacing. A base change stays in the main group and does replace it.
  group: codeql-${{ github.ref }}${{ github.event.action == 'edited' && !contains(toJSON(github.event.changes), 'base') && '-edited' || '' }}
  cancel-in-progress: true

jobs:
  # Change scope: see build.yml's `changes` job for why this is a job-level
  # `if:` and not a `paths` filter (a skipped required check still reports;
  # a filtered workflow never does). A documentation-only change does not
  # rebuild the Rust workspace for analysis; scripts/ci/change_scope.py
  # decides, and fails closed. The weekly schedule and a manual dispatch
  # carry no base, so they always analyse.
  changes:
    if: (github.event.action != 'edited' || contains(toJSON(github.event.changes), 'base'))
    name: 'Change scope (codeql)'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -u
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
          fi
          head="${{ github.sha }}"
          if [ -z "$base" ]; then
            echo "scope: ${{ github.event_name }} carries no base; analysing (fail-closed)"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/change_scope.py --base "$base" --head "$head" \
            || echo "docs_only=false" >> "$GITHUB_OUTPUT"

  analyze-rust:
    name: Analyze Rust
    needs: changes
    if: (github.event.action != 'edited' || contains(toJSON(github.event.changes), 'base')) && (needs.changes.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        # The extractor runs cargo for crate metadata. Pinned to
        # rust/rust-toolchain.toml (channel 1.94.0). Bump both together.
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          # The Rust extractor indexes source at the analyse step. A cargo
          # build in this job is untraced, and linking shekyld needs the
          # C++ remnant's archives, which only the CMake build supplies
          # (rust/shekyld/build.rs). build-mode: none is that choice,
          # declared. The C/C++ job below uses the same mode.
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  analyze-cpp:
    name: Analyze C/C++
    # Buildless C/C++ on every PR was ~the Monday job paid daily, for a
    # surface whose highs live in Rust. Weekly + dispatch keeps the
    # extractor warm without occupying a PR runner. Reopen onto PR if a
    # real `src/` high appears that buildless-on-schedule would miss.
    if: (github.event.action != 'edited' || contains(toJSON(github.event.changes), 'base')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Buildless extraction never compiles the tree, but `src/` headers
          # still #include vendored headers (lmdb.h, boost, …); keeping the
          # submodules present lets the extractor resolve those includes and
          # extract `src/` at full fidelity. External sources are dropped from
          # results via `paths-ignore` in .github/codeql/config.yml, not by
          # withholding them from the checkout.
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # Buildless C/C++ extraction (no compiler trace). This is what makes
          # `paths-ignore: external/**` effective: the config-file path filters
          # only apply to compiled languages analyzed WITHOUT a build (per the
          # CodeQL "Specifying directories to scan" docs). A trace-based build
          # would ignore `paths-ignore` and re-surface the vendored `external/`
          # highs. The consensus/crypto/amount logic that would justify a deep
          # trace-based build now lives in Rust (shekyl-units, -consensus,
          # -difficulty, -economics, -wire, -fcmp*, -crypto-pq, …), covered by
          # the separate `analyze-rust` job; C/C++ `src/` is daemon/RPC/LMDB
          # orchestration with zero open Shekyl-owned CodeQL highs. Reversion
          # (rule 21): restore a trace-based build if a real `src/` high ever
          # appears that buildless would miss, or if a substantial
          # non-migrated C++ subsystem grows.
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"

  analyze-python:
    name: Analyze Python
    # Python on every PR scanned tests/ + contrib scripts that are not
    # the consensus surface. Weekly + dispatch. Reopen onto PR if a
    # production Python entry point grows (none today).
    if: (github.event.action != 'edited' || contains(toJSON(github.event.changes), 'base')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"