name: "CodeQL Analysis"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "30 4 * * 1"   # Every Monday at 4:30 AM UTC

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        # Pinned to match rust/rust-toolchain.toml (avoids a parallel-cargo
        # auto-install race in the daemon build). Bump both together.
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          config-file: ./.github/codeql/config.yml

      - name: Build Rust workspace
        # `shekyl-randomx-differential` excluded because its `c_oracle`
        # module (and the `gen_canonical_outputs` tooling binary) link
        # against the C reference's `librandomx.a` via `randomx-v2-sys`,
        # which requires `RANDOMX_V2_INSTALL_DIR` to be set to a CMake
        # install prefix (per `docs/design/RANDOMX_V2_PHASE2G_PLAN.md`
        # §5.1.16 + §5.2.2 R5-D2). The CodeQL Rust analysis runs in a
        # bare-toolchain environment without CMake or the C library; the
        # dedicated `.github/workflows/randomx-v2-differential.yml` job
        # (per §5.5.1) configures CMake, builds the C library, and runs
        # the harness build there. CodeQL Rust analysis of the
        # differential harness is queued for V3.x once the workflow's
        # CodeQL coverage can stand up the C library at analysis time.
        run: cargo build --release --workspace --exclude shekyl-cli --exclude shekyl-engine-rpc --exclude shekyl-randomx-differential
        working-directory: rust

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  analyze-cpp:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Buildless extraction never compiles the tree, but `src/` headers
          # still #include vendored headers (lmdb.h, boost, …); keeping the
          # submodules present lets the extractor resolve those includes and
          # extract `src/` at full fidelity. External sources are dropped from
          # results via `paths-ignore` in .github/codeql/config.yml, not by
          # withholding them from the checkout.
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # Buildless C/C++ extraction (no compiler trace). This is what makes
          # `paths-ignore: external/**` effective: the config-file path filters
          # only apply to compiled languages analyzed WITHOUT a build (per the
          # CodeQL "Specifying directories to scan" docs). A trace-based build
          # would ignore `paths-ignore` and re-surface the vendored `external/`
          # highs. The consensus/crypto/amount logic that would justify a deep
          # trace-based build now lives in Rust (shekyl-units, -consensus,
          # -difficulty, -economics, -wire, -fcmp*, -crypto-pq, …), covered by
          # the separate `analyze-rust` job; C/C++ `src/` is daemon/RPC/LMDB
          # orchestration with zero open Shekyl-owned CodeQL highs. Reversion
          # (rule 21): restore a trace-based build if a real `src/` high ever
          # appears that buildless would miss, or if a substantial
          # non-migrated C++ subsystem grows.
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"