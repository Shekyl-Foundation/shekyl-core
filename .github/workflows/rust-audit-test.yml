name: ci/gh-actions/rust

# Split out of build.yml (workflow `ci/gh-actions/cli`) so the long-running,
# most-commonly-flaking Rust gate is its own workflow *run*. In GitHub Actions
# you cannot "Re-run failed jobs" until the whole run concludes; while this job
# (the longest in the CLI workflow, ~35–95m per docs/CI_TIMING_BASELINE.md) was
# bundled with the C/C++ compile_by_OS matrix, an OS-runner flake could not be
# re-run until this job finished. This job never depended on those OS builds —
# no `needs:`, no artifact download, its own Swatinem cache — so the split is
# purely a re-run-isolation change, not a graph change.
#
# Branch-protection note: required status checks are keyed by the bare job
# name plus the GitHub Actions app, not by the workflow name. The one this
# workflow reports is `rust-pass` (the `pass` job at the end), which stands
# for every job in it (ruled 2026-11-16).

on:
  push:
    # `dev` and `main`. A pull request's run tests its head merged onto the
    # `dev` of its last push; the run on `dev` tests what the merges
    # actually made, the one place two pull requests each green alone can
    # show red together (06-branching.mdc). Docs-only pushes are skipped by
    # the `changes` job below, not by a `paths` filter here: a filter would
    # suppress the required check.
    branches: [dev, main]
  pull_request:
    # `ready_for_review`: the heavy jobs below skip a draft, and run when it
    # is marked ready (ruled 2026-11-16).
    types: [opened, synchronize, reopened, ready_for_review]

# Own concurrency group (distinct from build.yml's `build-<ref>`) so same-PR
# reruns of the Rust gate supersede only each other, not the OS build run.
# Only a pull request's run is cancelled by a newer push. Every push to
# `dev` shares one ref; a merge queues behind the running `dev` run, which
# finishes, and a newer merge replaces the queued one, so a burst is
# tested at the running commit and at its newest. Cancelled, a run this
# long never finished between merges (50 of 84 from 2026-11-10 to 11-17).
# The `changes` job measures a push from the last green run, not from the
# previous push, so a replaced run's commits are still in scope
# (`scripts/ci/check_dev_push_runs_finish.py`).
concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF

jobs:
  # See build.yml's `changes` job for why this is a job-level condition rather
  # than a workflow `paths` filter: a path filter suppresses the WORKFLOW, so a
  # docs-only PR gets no check at all and branch protection waits forever for
  # `rust-pass`. A job skipped by its `if:` is accepted by `rust-pass`.
  #
  # Code inputs under docs/ (docs/design/CRYPTO_DOMAIN_REGISTRY.tsv, which
  # shekyl-crypto-pq's tests include_str!, and the test vectors) are found by
  # scripts/ci/change_scope.py from the tree, so a change to one still runs
  # this suite; its --selftest pins those cases.
  #
  # Fails closed: an uncomputable file list yields `false` and the suite runs.
  changes:
    name: 'Change scope (rust)'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # p90 0.6 min over 23 runs; the floor
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      # The Rust job's scope, decided by dependency (scripts/ci/change_scope.py):
      # whether the job runs, which packages' tests run (`all`, `none`, or the
      # changed packages, expanded below to them and their dependents), and
      # the `-p` list for the doctests.
      rust_job: ${{ steps.scope.outputs.rust_job }}
      rust_tests: ${{ steps.scope.outputs.rust_tests }}
      rust_doc_pkgs: ${{ steps.scope.outputs.rust_doc_pkgs }}
      # Whether the economics sim's narration pins run: the test scope
      # reaches the sim, or the change is to the pins' own lane script.
      sim_narrations: ${{ steps.scope.outputs.sim_narrations }}
    # `actions: read` lists this workflow's earlier runs for a push's base.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push is measured from the last commit this workflow passed
            # on, not from `before`: see scripts/ci/push_scope_base.sh. No
            # base prints nothing, and the classifier then runs everything.
            base=$(scripts/ci/push_scope_base.sh rust-audit-test.yml "${{ github.ref_name }}" "$head")
          fi

          # One classifier for every scope job: scripts/ci/change_scope.py.
          # It finds the code inputs that live under docs/ (the domain
          # registry, the test vectors) by reading the tree, and fails closed.
          # Fail closed: if the classifier does not run at all, every output
          # is written as its widest value, so no step below reads an empty one.
          python3 scripts/ci/change_scope.py --base "$base" --head "$head" \
            || printf '%s\n' docs_only=false rust_job=run rust_tests=all rust_doc_pkgs= sim_narrations=run >> "$GITHUB_OUTPUT"

  rust-audit-and-test:
    name: "Rust: audit, test, determinism"
    needs: changes
    # DEMO BASE ONLY: the Rust job cut to its scoped tests, so a scratch
    # pull request's run is minutes; the `pass` job below is unchanged.
    if: >-
      needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_job != 'skip'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: update apt
        run: apt update
      - name: install dependencies
        run: apt -y install build-essential git curl pkg-config libssl-dev valgrind libclang-dev clang
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: install Rust
        uses: ./.github/actions/install-rust
      - name: install cargo-nextest
        run: bash scripts/ci/rust_scoped_tests.sh install-nextest
      - name: cargo nextest (all workspace crates)
        working-directory: rust
        env:
          RUST_TESTS: ${{ needs.changes.outputs.rust_tests }}
        run: bash ../scripts/ci/rust_scoped_tests.sh nextest

  economics-sim-narrations:
    name: 'Economics sim: narration pins'
    needs: changes
    # The sim's narration pins (`#[ignore]`d, release build): each folds the
    # sim and compares its report with the committed fixture. A change to a
    # value the sim reads anywhere upstream moves a narration without failing
    # any test the Rust job runs: #1323 (the block-weight surge factor, 4 to
    # 3) merged green and the nightly lane stayed red for three nights
    # (ECONOMICS_SIM_PRODUCTION_REBASE.md §5.30). This job runs the pins on
    # every change to what a narration is made of (`sim_narrations` in
    # scripts/ci/change_scope.py: the consensus configuration, the economics
    # crates, the block-weight rule and the sim), on its own runner beside
    # the Rust job, so it adds runner time and no wall time. The nightly lane
    # still runs them, with the tests too long for a pull request.
    # Skipped on a draft pull request, like the Rust job (ruled 2026-11-16).
    if: >-
      needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sim_narrations == 'run'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 55  # one run, 26.7 min (#1375 at daff21237: release build 4.6, four pins 21.7); about twice it
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: install Rust
        uses: ./.github/actions/install-rust
      - name: the narration pins
        # The pin list is scripts/ci/ignored_set_economics_sim.sh's, judged
        # against the crate's ignored set before it runs.
        run: bash scripts/ci/ignored_set_economics_sim.sh --narrations

  # The one required check for this workflow: `rust-pass`
  # (scripts/ci/workflow_pass.py, ruled 2026-11-16). It needs every other
  # job but the reporter and runs whatever they did, so it reports once all
  # of them have finished: green when each succeeded or was skipped by
  # scope, red when the scope job did not succeed or any job failed or was
  # cancelled. On a draft it reports as `rust-pass (draft)`, a name
  # protection does not require, so a draft never satisfies it and a PR
  # marked ready waits for its own `rust-pass`. build.yml's `pass` job
  # carries the full reasoning; `workflow_pass.py --check` holds both.
  pass:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'rust-pass (draft)' || 'rust-pass' }}
    needs: [changes, rust-audit-and-test, economics-sim-narrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/workflow_pass.py
            scripts/ci/freshness_status.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: every job succeeded or was skipped by scope
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/workflow_pass.py --decide --scope changes
      # Brief C: a merge to `dev` that reaches this pull request's tests
      # re-tests its head against the new `dev` (freshness.yml) and reports
      # `fresh-against-dev` on the head. Absent or green passes; pending or
      # red fails, so the pull request waits for, or fixes, the re-test.
      # freshness.yml re-runs this job when it posts.
      - name: fresh against dev (absent or green)
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/freshness_status.py check "${{ github.event.pull_request.head.sha }}"

  # Every push run on `dev` reports to `report-dev-red.yml`: a red job
  # opens or threads its own tracking issue, and a job green again closes
  # its issue. `needs` lists every other job in this file, so a red in any
  # of them reports; scripts/ci/check_dev_red_reporter.py holds the list
  # and this condition to the file. Only a push run on `dev` reports: a
  # pull request's red is read on the pull request. A job past its
  # `timeout-minutes` is cancelled, not failed, and the reporter counts it
  # red. A run cancelled as a whole (a newer merge superseded it) reports
  # nothing, which `!cancelled()` leaves out.
  report-dev-red:
    needs: [changes, rust-audit-and-test, economics-sim-narrations, pass]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/report-dev-red.yml
