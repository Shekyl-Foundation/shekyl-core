name: ci/gh-actions/rust

# Split out of build.yml (workflow `ci/gh-actions/cli`) so the long-running,
# most-commonly-flaking Rust gate is its own workflow *run*. In GitHub Actions
# you cannot "Re-run failed jobs" until the whole run concludes; while this job
# (the longest in the CLI workflow, ~35–95m per docs/CI_TIMING_BASELINE.md) was
# bundled with the C/C++ compile_by_OS matrix, an OS-runner flake could not be
# re-run until this job finished. This job never depended on those OS builds —
# no `needs:`, no artifact download, its own Swatinem cache — so the split is
# purely a re-run-isolation change, not a graph change.
#
# Branch-protection note: required status checks are keyed by the bare job
# name ("Rust: audit, test, determinism") plus the GitHub Actions app, not by
# the workflow name — the "ci/gh-actions/cli /" prefix in the PR UI is display
# grouping only. Because this split keeps the job name identical, the existing
# required-check context keeps matching this job in its new workflow; no
# ruleset / branch-protection change is needed.

on:
  push:
    # `dev` and `main`. A pull request's run tests its head merged onto the
    # `dev` of its last push; the run on `dev` tests what the merges
    # actually made, the one place two pull requests each green alone can
    # show red together (06-branching.mdc). Docs-only pushes are skipped by
    # the `changes` job below, not by a `paths` filter here: a filter would
    # suppress the required check.
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]

# Own concurrency group (distinct from build.yml's `build-<ref>`) so same-PR
# reruns of the Rust gate supersede only each other, not the OS build run.
# Every push to `dev` shares one ref, so a merge cancels the run of the
# merge before it and a burst is tested once, at its newest commit. The
# `changes` job measures a push from the last green run, not from the
# previous push, so a cancelled run's commits are still in scope.
concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF

jobs:
  # See build.yml's `changes` job for why this is a job-level condition rather
  # than a workflow `paths` filter: a path filter suppresses the WORKFLOW, so a
  # docs-only PR gets no check at all and branch protection waits forever for
  # `Rust: audit, test, determinism`. A skipped job still reports.
  #
  # Code inputs under docs/ (docs/design/CRYPTO_DOMAIN_REGISTRY.tsv, which
  # shekyl-crypto-pq's tests include_str!, and the test vectors) are found by
  # scripts/ci/change_scope.py from the tree, so a change to one still runs
  # this suite; its --selftest pins those cases.
  #
  # Fails closed: an uncomputable file list yields `false` and the suite runs.
  changes:
    name: 'Change scope (rust)'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # p90 0.6 min over 23 runs; the floor
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      # The Rust job's scope, decided by dependency (scripts/ci/change_scope.py):
      # whether the job runs, which packages' tests run (`all`, `none`, or the
      # changed packages, expanded below to them and their dependents), and
      # the `-p` list for the doctests.
      rust_job: ${{ steps.scope.outputs.rust_job }}
      rust_tests: ${{ steps.scope.outputs.rust_tests }}
      rust_doc_pkgs: ${{ steps.scope.outputs.rust_doc_pkgs }}
    # `actions: read` lists this workflow's earlier runs for a push's base.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push is measured from the last commit this workflow passed
            # on, not from `before`: see scripts/ci/push_scope_base.sh. No
            # base prints nothing, and the classifier then runs everything.
            base=$(scripts/ci/push_scope_base.sh rust-audit-test.yml "${{ github.ref_name }}" "$head")
          fi

          # One classifier for every scope job: scripts/ci/change_scope.py.
          # It finds the code inputs that live under docs/ (the domain
          # registry, the test vectors) by reading the tree, and fails closed.
          # Fail closed: if the classifier does not run at all, every output
          # is written as its widest value, so no step below reads an empty one.
          python3 scripts/ci/change_scope.py --base "$base" --head "$head" \
            || printf '%s\n' docs_only=false rust_job=run rust_tests=all rust_doc_pkgs= >> "$GITHUB_OUTPUT"

  rust-audit-and-test:
    name: "Rust: audit, test, determinism"
    needs: changes
    # Skipped for a docs-only change, and for a change owned by other jobs
    # alone (a documentation gate, another workflow's job). It still
    # reports, as "skipped", so branch protection does not wait on it.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_job != 'skip'
    runs-on: ubuntu-latest
    # The six green runs under nextest (2026-11-07) took 120, 179, 180,
    # 181, 183 and 236 min, so twice the p90 passes the 360 min platform
    # cap. The `ci` profile kills a hung test at 30 min and its retry at
    # 30 more, so this bounds a hang outside the test run; 300 ends one an
    # hour early. It comes down when the test run is partitioned across
    # runners.
    timeout-minutes: 300
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: the runner's CPUs
        # Printed so the test step's wall time can be read against the
        # cores it ran on: nextest runs one test per CPU, and the runner
        # size is the platform's to change. A figure derived from this job's
        # time states the count printed here, not an assumed one.
        # awk, not grep: a line the image lacks prints nothing and does not
        # fail the job over a diagnostic.
        run: |
          echo "nproc: $(nproc)"
          awk -F': ' '/^model name/ { print "cpu: " $2; exit }' /proc/cpuinfo
          awk '/^MemTotal/ { print "memory: " $2 " " $3; exit }' /proc/meminfo
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install dependencies
        # valgrind: headers required to compile `shekyl-engine-state`'s
        # `ledger_iai` bench (`gungraun` `client_requests` / `act`).
        # libclang-dev + clang: `valgrind-requests` bindgens those
        # headers; a bare `ubuntu:24.04` container has neither
        # libclang.so nor clang. GitHub's hosted `ubuntu-latest`
        # (`ci/benchmarks`) already ships clang, so the capture job
        # stayed green while this gate failed. Still gungraun — no
        # harness swap. clippy `--all-targets` builds benches.
        run: apt -y install build-essential git curl pkg-config libssl-dev valgrind libclang-dev clang
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Full history: the golden-revision gate below diffs against the
          # merge base, which a depth-1 checkout cannot resolve.
          fetch-depth: 0
      - name: "shard-visual: golden PNGs require a RENDER_REVISION bump"
        # A modified golden means the pixel derivation changed, and a consumer
        # caching by RENDER_REVISION (the GUI wallet's cache_digest) would keep
        # serving images from the old one. The in-crate KAT cannot catch this
        # direction: the generator writes the same constant the test reads, so
        # regenerating without a bump leaves both sides agreeing. Needs the
        # diff, hence a gate rather than a test.
        # Instance of 47-gate-subject-assertion.mdc.
        run: python3 scripts/ci/check_golden_revision_bump.py
      - name: install Rust
        # Composite action (.github/actions/install-rust), after
        # checkout — see the build job's step comment.
        uses: ./.github/actions/install-rust
      - name: guard against absolute local Cargo paths
        shell: bash
        run: |
          MATCHES=""
          while IFS= read -r file; do
            HITS="$(grep -nE '/home/|/Users/|[A-Za-z]:\\\\Users\\\\' "$file" || true)"
            if [ -n "$HITS" ]; then
              MATCHES="${MATCHES}${file}\n${HITS}\n"
            fi
          done < <(find rust -type f \( -name Cargo.toml -o -path '*/.cargo/config' -o -path '*/.cargo/config.toml' \))
          if [ -n "$MATCHES" ]; then
            echo "FATAL: detected absolute local paths in Cargo manifests/config:"
            printf "%b" "$MATCHES"
            exit 1
          fi
          echo "Cargo path portability guard passed."
      # Reads `cargo metadata`, so it lives here — after install-rust — not in
      # grep-gates.yml. That job's own header says it does not need a Rust
      # toolchain; wiring a cargo-metadata gate there works only because the
      # GitHub-hosted image happens to ship cargo, the same "image has it,
      # container does not" class this job already paid for with clang.
      - name: test-only features stay on dev-dependency edges; consumer-owned features die with their consumer
        # `--selftest` first: the consumer-owned registry may be empty, and the
        # selftest is what keeps that limb from passing vacuously (rule 47).
        run: |
          python3 scripts/ci/check_test_only_features.py --selftest
          python3 scripts/ci/check_test_only_features.py
      # Same placement reason: reads `cargo metadata`. The measurement build's
      # lifted Tor spans (Rick, 2026-10-14) reach a binary only through the
      # SHEKYL_MEASUREMENT_SPANS CMake option, default OFF; no Cargo edge and
      # no release path may turn them on.
      - name: the measurement spans never reach a release build
        run: |
          python3 scripts/ci/check_measurement_spans.py --selftest
          python3 scripts/ci/check_measurement_spans.py
      # Same placement reason as the step above: this reads `cargo tree`.
      # shekyl-chain-rules (DRS-E6) must reach neither `redb` nor
      # `shekyl-chain-store` anywhere in its resolved graph, normal or dev
      # edges — the crate's compile_fail doctests see only a direct `use`, and
      # the coverage gate only its own Cargo.toml; transitive arrival through
      # an adopted crate is what this belt exists for (CHAIN_RULES_CRATE.md
      # §6.5, G1). Fails closed: a cargo failure is a failure, not an empty
      # graph; each banned name is asserted to be a real workspace package.
      - name: "chain-rules: no store handle in the resolved graph (G1)"
        run: scripts/ci/check_chain_rules_no_store.sh
      - name: verify x86_64 architecture
        run: |
          ARCH=$(uname -m)
          echo "Runner architecture: $ARCH"
          if [ "$ARCH" != "x86_64" ]; then
            echo "FATAL: expected x86_64 runner, got $ARCH"
            exit 1
          fi
      - name: verify fuzz harness inventory (smoke gate)
        shell: bash
        run: |
          REQUIRED_TARGETS=(
            rust/shekyl-fcmp/fuzz/fuzz_targets/fuzz_fcmp_proof_deserialize.rs
            rust/shekyl-fcmp/fuzz/fuzz_targets/fuzz_curve_tree_leaf_hash.rs
            rust/shekyl-fcmp/fuzz/fuzz_targets/fuzz_block_header_tree_root.rs
            rust/shekyl-fcmp/fuzz/fuzz_targets/fuzz_tx_deserialize_fcmp_type7.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_kem_decapsulate.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_bech32m_address_decode.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_multisig_verify.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_multisig_key_blob.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_multisig_sig_blob.rs
            rust/shekyl-crypto-pq/fuzz/fuzz_targets/fuzz_multisig_blob_roundtrip.rs
            rust/shekyl-wire/fuzz/fuzz_targets/fuzz_tx_extra_parse.rs
            rust/shekyl-wire/fuzz/fuzz_targets/fuzz_block_parse.rs
            rust/shekyl-wire/fuzz/fuzz_targets/fuzz_tx_parse.rs
            rust/shekyl-p2p-transport/fuzz/fuzz_targets/fuzz_read_message1.rs
            rust/shekyl-p2p-transport/fuzz/fuzz_targets/fuzz_read_message2.rs
            rust/shekyl-p2p-transport/fuzz/fuzz_targets/fuzz_open_one.rs
            rust/shekyl-noise/fuzz/fuzz_targets/fuzz_classed_opener.rs
          )
          MISSING=0
          for target in "${REQUIRED_TARGETS[@]}"; do
            if [ ! -f "$target" ]; then
              echo "FATAL: missing required fuzz harness: $target"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "Fuzz harness inventory smoke gate passed (${#REQUIRED_TARGETS[@]} targets present)."
      - uses: Swatinem/rust-cache@v2
        with:
          # Workspace at rust/ with target dir at rust/target/.
          # The fcmp fuzz workspace is excluded from that workspace, so
          # it is listed on its own line and caches rust/shekyl-fcmp/fuzz/target.
          # No CARGO_TARGET_DIR: that target must not be rust/target.
          # Swatinem auto-caches ~/.cargo/{registry,git,bin} plus the
          # workspace target/. The default cache key already mixes
          # rustc version + Cargo.lock hash + a per-job component, so
          # toolchain bumps (e.g. 1.94.0 -> 1.95.0) and lockfile-only
          # diffs (e.g. deps/bump-rand-to-0.8.6) get correctly-scoped
          # invalidation. Replaces the prior actions/cache@v5 block,
          # which had three known waste modes documented in
          # docs/CI_TIMING_BASELINE.md:
          #   - ~8m post-job upload of the entire target/ even when
          #     only a few crates changed (Swatinem skips the save when
          #     the restore hit its exact key).
          #   - No rustc-version key component (so a 1.94 -> 1.95 bump
          #     would have silently restored a 1.94-built target/).
          #   - No ~/.cargo/bin caching (cargo-audit reinstalled from
          #     source every run, ~2m30s).
          # The constant-time dynamic harness is a third workspace, under
          # docs/formal/checkct/dynamic, with its own target/ likewise.
          workspaces: |
            rust -> target
            rust/shekyl-fcmp/fuzz -> target
            rust/shekyl-wire/fuzz -> target
            docs/formal/checkct/dynamic -> target
          # Saved by push runs only (`dev`, `main`); a pull request
          # restores and never saves. A cache saved by a pull request is
          # readable by that pull request alone, and each of this job's
          # is 2.6 GB against the repository's 10 GB, so a pull
          # request's save evicts the `dev` cache every other pull
          # request restores from.
          save-if: ${{ github.event_name == 'push' }}
      - name: install cargo-audit
        # `cargo install --locked` is idempotent: on Swatinem cache
        # hits the binary is already present in ~/.cargo/bin and this
        # step exits in a few seconds rather than recompiling from
        # source. Moved here from pre-checkout so the cache restore
        # has a chance to populate ~/.cargo/bin first.
        run: cargo install cargo-audit --locked
      - name: install cargo-nextest
        # Same cache behaviour as cargo-audit above. Pinned: the runner
        # decides which tests run and what counts as a pass, so a new
        # version is a change to the gate and comes in its own commit.
        # 0.9.138 needs Rust 1.91; the workspace pins 1.94.0.
        run: cargo install cargo-nextest --locked --version 0.9.138
      - name: cargo audit
        working-directory: rust
        run: |
          # Retry wrapper: `cargo audit` fetches the RustSec advisory DB
          # from https://github.com/RustSec/advisory-db.git on every run.
          # That endpoint occasionally returns HTTP 500 under load; the
          # failure is transient and unrelated to our Cargo.lock.
          # Three attempts with backoff cover the common infra-flake window.
          # A genuine advisory hit will still fail every attempt (the audit
          # logic is deterministic given a successful DB fetch), so this
          # does not mask real findings — it only burns ~30s extra CI time
          # before re-reporting the hit on a permanent fail.
          for attempt in 1 2 3; do
            if cargo audit; then
              exit 0
            fi
            echo "cargo audit attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          echo "cargo audit failed after 3 attempts" >&2
          exit 1
      - name: cargo fmt --check (workspace)
        working-directory: rust
        # Fails CI on any unformatted Rust file. Pairs with the clippy
        # gate below; both land together in chore/workspace-fmt-clippy-
        # baseline. Pre-existing fmt debt was discharged in that PR's
        # first commit (`cargo fmt --all` over the whole workspace) and
        # the .cursor/rules/15-deletion-and-debt.mdc carve-out
        # (refined in the same commit) makes "leave the file you
        # touched fmt-clean" the going-forward expectation.
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings (workspace, all targets)
        working-directory: rust
        # Fails CI on any clippy finding (warning or error). The
        # workspace's [lints.clippy] section in rust/Cargo.toml already
        # configures many lints at deny-level (let_underscore_must_use,
        # cast_possible_truncation, uninlined_format_args, …); this
        # gate adds `-D warnings` so the remaining default-warn lints
        # (clone_on_copy, type_complexity, dead_code, …) are equally
        # enforced. `--keep-going` collects findings across the whole
        # workspace in one pass instead of stopping at the first crate's
        # first error, so reviewers see the full triage in one log.
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: "cargo clippy: gf7-hooks harness lane (shekyl-engine-core)"
        working-directory: rust
        # The GF-7 sealing seam + harness (`pscan/start.rs` SealingRunOverrides,
        # `gf7_sealing_run.rs`) are gated `cfg(all(test, feature = "gf7-hooks"))`
        # — a combination NO other lane compiles: the workspace gates above run
        # without the feature, and gf7-no-emit-guard.yml is metadata-only
        # (`cargo tree`). Without this lane a refactor of any callee the
        # harness binds (staker_wallet, DispatchConfig, PScanConfig) merges
        # green and the WI-4 §19.1 reopening-criterion re-run harness is
        # discovered broken exactly when the multi-hour re-run is demanded.
        # Clippy (not test): the harness tests are `#[ignore]`d and need a
        # live `shekyld`; type-checking all targets at `-D warnings` is the
        # compile gate. The no-emit guard's layer-3 containment is untouched:
        # this is a dev/test lane, and dev edges are deliberately in scope
        # for the feature (see gf7-no-emit-guard.yml header).
        run: cargo clippy -p shekyl-engine-core --all-targets --features gf7-hooks -- -D warnings
      - name: "cargo clippy: bench-internals lane (shekyl-engine-core)"
        working-directory: rust
        # Same defect class as the lane above, by a different mechanism. The
        # §5.3 B9 bench support (`engine/key_dispatch_bench.rs`, the
        # `__bench_internals` re-exports) is `#[cfg(feature =
        # "bench-internals")]` with no `test` alternative, and every bench
        # target that consumes it carries `required-features =
        # ["bench-internals"]` — which cargo SKIPS SILENTLY when the feature
        # is off. So the workspace `--all-targets` gate above neither compiles
        # the module nor reports that it declined to.
        #
        # PR #544 paid for that: making `OutputData`'s encrypted fields
        # `pub(crate)` updated every consumer the gates could see, and this
        # module — the one they could not — first reported the break in the
        # 10-minute bench-capture job. This lane reproduces it in seconds.
        #
        # Clippy, not test: the module declares no `#[test]`; it is fixture and
        # harness code whose only failure mode here is failing to compile.
        #
        # Subject assertion (47-gate-subject-assertion): clippy with this
        # feature is green if the module or its cfg vanishes. Assert the file
        # exists, the feature is declared, and the cfg sits on the module
        # declaration — not a doc comment inside the file. Each command is
        # unpiped (46-shell-gate-exits).
        run: |
          test -f shekyl-engine-core/src/engine/key_dispatch_bench.rs
          grep -F -q 'bench-internals = []' shekyl-engine-core/Cargo.toml
          # Accept the attribute on the declaration's own line or the line
          # before it, and any visibility. An earlier form required the
          # previous-line spelling, so `#[cfg(...)] mod key_dispatch_bench;`
          # would have failed CI for being written differently — a gate that
          # fires on formatting teaches people to route around it.
          #
          # The declaration is ANCHORED to the start of the line so that a
          # commented-out `// pub(crate) mod key_dispatch_bench;` does not
          # satisfy it. That spelling is how the module would most plausibly
          # disappear, and matching the text inside a comment would have let the
          # gate pass with its subject absent — the exact vacuity this assertion
          # exists to prevent.
          awk '
            /^[[:space:]]*(#\[cfg\(feature = "bench-internals"\)\][[:space:]]*)?(pub([[:space:]]*\([^)]*\))?[[:space:]]+)?mod[[:space:]]+key_dispatch_bench[[:space:]]*;/ {
              if ($0 ~ /#\[cfg\(feature = "bench-internals"\)\]/ ||
                  prev ~ /#\[cfg\(feature = "bench-internals"\)\]/) { found=1; exit 0 }
            }
            # Blank and comment lines do not become `prev`: a comment between
            # an attribute and its item is legal Rust and must not read as an
            # ungated module.
            !/^[[:space:]]*(\/\/.*)?$/ { prev = $0 }
            END { if (!found) { print "key_dispatch_bench missing or not cfg-gated" > "/dev/stderr"; exit 1 } }
          ' shekyl-engine-core/src/engine/mod.rs
          cargo clippy -p shekyl-engine-core --all-targets --features bench-internals -- -D warnings
      # The probe sheet is a PRE-REGISTRATION: it records which probes exist
      # and which decision each failure revisits. That only means something if
      # the probes it names are implemented.
      #
      # Nothing else checks it. A deleted `#[test]` still compiles and still
      # passes CI — unlike a deleted function it produces no error anywhere —
      # which is exactly how P-14, the bounds check guarding an out-of-bounds
      # read on an attacker-supplied SACL, was lost in PR #523 and caught only
      # by a reviewer.
      #
      # Runs on Linux: it is a pure text comparison, and the drift can land on
      # any commit rather than only ones that reach a Windows runner.
      - name: "WP: probe sheet and probe suite agree"
        run: python3 scripts/ci/check_probe_registry.py

      - name: rustdoc -D warnings (persona serving path)
        working-directory: rust
        # These crates' docs carry load-bearing security contracts (shekyl-tor-control-wallet's
        # trust gate, §3c supervisor posture and pin-time/runtime split;
        # shekyl-p-serve's wire-indistinguishability invariants; shekyl-p-host's
        # custody boundary and endpoint-lifetime invariant), and reviews here
        # repeatedly turned up public→private intra-doc links that only a
        # `-D warnings` doc build catches. Each crate joins this list in the PR
        # that lands it, while it is known clean — retrofitting a gate over
        # accumulated warnings is the task that never happens. Still scoped
        # rather than `--workspace` because other crates carry pre-existing
        # rustdoc warnings; widening to the whole workspace is a separate
        # hygiene task, tracked in FOLLOWUPS.
        #
        # `shekyl-crypto-pq` is here though it is not on the serving path: its
        # module docs state the hybrid schemes' contracts, and it joined when
        # hybrid scheme 3 landed and its eight older warnings were cleared.
        #
        # `shekyl-onion-key` and `shekyl-heap-secret` joined with the onion
        # split. The keypair's contract and the buffer's contract are these
        # docs, and both were clean when they landed.
        #
        # `shekyl-hasher` joined when it landed: its crate docs are the
        # hashing actor's contract (the cap, the queue, the lending types,
        # and why it has no end for `Node::ended`).
        #
        # `shekyl-tor-status` joined when it landed: its docs state the wire
        # contract every client of the Tor status reads.
        #
        # `shekyl-win-sec` is deliberately NOT here: it is `cfg(windows)` and
        # compiles to nothing on this runner, so documenting it would gate an
        # empty crate and pass forever. Its rustdoc gate runs on the Windows
        # job in build.yml, where its docs exist.
        run: >-
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --lib
          -p shekyl-tor-control-wallet -p shekyl-tor-control-client -p shekyl-p-serve -p shekyl-p-host
          -p shekyl-operator-alarm -p shekyl-economics -p shekyl-store-codec
          -p shekyl-capped-stream -p shekyl-crypto-pq -p shekyl-miner -p shekyl-hash-budget
          -p shekyl-hasher
          -p shekyl-node -p shekyl-chain-sync -p shekyl-chain-sync-runtime
          -p shekyl-onion-key -p shekyl-heap-secret -p shekyl-tor-status
      - name: build shekyl-fcmp crate
        working-directory: rust
        run: cargo build --locked -p shekyl-fcmp
      - name: compile the shekyl-fcmp fuzz harnesses
        # The inventory step only checks the files exist. This is a separate
        # workspace, so `cargo check --workspace` does not see it
        # (rust/Cargo.toml exclude: a stable workspace check must not resolve
        # libfuzzer-sys). This job is the exception: the four harnesses are
        # the API-drift gate for shekyl-fcmp, and libfuzzer-sys 0.4 typechecks
        # on the pinned stable toolchain. The lockfile is the fuzz workspace's
        # own. Placed after the cache so the registry restore is already warm.
        # No CARGO_TARGET_DIR: this workspace must not share rust/target.
        # Its own target/ is the second cache workspace above.
        run: cargo check --locked --manifest-path rust/shekyl-fcmp/fuzz/Cargo.toml
      - name: compile the shekyl-wire fuzz harnesses
        # The wire parsers that read untrusted bytes: the block, the
        # transaction and tx_extra. Same shape as the fcmp step above: its
        # own workspace and lockfile, type-checked on the pinned stable
        # toolchain as the API-drift gate; running them needs nightly.
        run: cargo check --locked --manifest-path rust/shekyl-wire/fuzz/Cargo.toml
      - name: compile the shekyl-multisig fuzz harnesses
        # The multisig envelope, payload and intent decoders read bytes a
        # group member's file carries. Same shape as the fcmp and wire steps:
        # its own workspace and lockfile, type-checked on the pinned stable
        # toolchain as the API-drift gate (rule 47: a fuzz crate nothing
        # compiles cannot see its own drift); running them needs nightly.
        run: cargo check --locked --manifest-path rust/shekyl-multisig/fuzz/Cargo.toml
      - name: "constant-time dynamic harness: fmt, clippy, tests"
        # docs/formal/checkct/dynamic is its own workspace (its own lockfile
        # pins the audited crypto-bigint) on the shipped toolchain (its
        # rust-toolchain.toml; check_checkct_toolchain.py keeps it equal to
        # rust/'s), so the workspace gates above do not see it. Its tests
        # hold the row table's invariants and check that every row name a
        # committed record under docs/formal/checkct/results cites is still
        # a row or a listed retired one, so a rename cannot strand a record.
        # change_scope.py reads this step's working-directory: a change to
        # the crate or to those records is not docs-only. Own target/, no
        # CARGO_TARGET_DIR (cached as a workspace above).
        working-directory: docs/formal/checkct/dynamic
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: build the workspace test binaries
        id: nextest-build
        working-directory: rust
        # Its own step so the job's step times say how much of the test
        # phase is compiling and how much is running. The same selection as
        # the run below, which then finds every binary built.
        #
        # `shekyl-randomx-differential` is excluded because its `c_oracle`
        # module links against the C reference's `librandomx.a` via
        # `randomx-v2-sys`, which requires the `RANDOMX_V2_INSTALL_DIR` env
        # var to point at a CMake-built install prefix (per
        # `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §5.1.16 + §5.2.2 R5-D2).
        # The `rust-audit-and-test` job does not configure CMake or build
        # the C library; that work lives in the dedicated
        # `.github/workflows/randomx-v2-differential.yml` workflow (per
        # §5.5.1 + R1-D12), which builds the C library and runs
        # `cargo test -p shekyl-randomx-differential` with the env var set.
        # This step asserts every crate that builds in the bare-Rust
        # environment passes; the differential harness asserts under its
        # own substrate-correct environment.
        run: cargo nextest run --locked --profile ci --no-run --workspace --exclude shekyl-randomx-differential
      - name: cargo nextest (all workspace crates)
        working-directory: rust
        # nextest runs each test in its own process and runs tests from
        # every test binary at once. `cargo test` ran the binaries one
        # after another, so the step lasted as long as their sum. Same
        # tests, same exclusions as the build above; `--profile ci` is in
        # `.config/nextest.toml` (no fail-fast, one retry, slow tests named
        # and killed at 30 min, JUnit timings).
        #
        # The scope job names the changed packages; the run is every test
        # of those packages and of every package that depends on them
        # (`rdeps`, dev-dependencies included), so a changed fixture runs
        # its consumers' tests. The build above stays the whole workspace,
        # so the features each crate compiles with are the full run's.
        # `none` is a job that runs for its gate steps alone (a changed
        # script it executes); the test steps are skipped, not run empty. A
        # scoped expression that selects no test passes: the selection was
        # the decision, and a package name that no longer exists fails the
        # expression instead.
        if: ${{ needs.changes.outputs.rust_tests != 'none' }}
        env:
          RUST_TESTS: ${{ needs.changes.outputs.rust_tests }}
        run: |
          set -u
          if [ "$RUST_TESTS" = all ]; then
            echo "scope: every workspace test"
            cargo nextest run --locked --profile ci --workspace --exclude shekyl-randomx-differential
          else
            expr=""
            for pkg in $RUST_TESTS; do expr="${expr:+$expr + }rdeps($pkg)"; done
            echo "scope: $expr"
            cargo nextest run --locked --profile ci --workspace --exclude shekyl-randomx-differential \
              --no-tests=pass -E "$expr"
          fi
      - name: doctests (workspace crates in scope)
        working-directory: rust
        # nextest does not run doctests. They run whether or not a test
        # above failed, so one run reports both; only a failed build skips
        # them, since they would fail on the same error. The scope's `-p`
        # list is the reverse closure of the changed packages, cut to those
        # with a library target (`cargo test --doc` refuses the others).
        if: ${{ !cancelled() && steps.nextest-build.outcome == 'success' && needs.changes.outputs.rust_tests != 'none' }}
        env:
          RUST_TESTS: ${{ needs.changes.outputs.rust_tests }}
          RUST_DOC_PKGS: ${{ needs.changes.outputs.rust_doc_pkgs }}
        run: |
          set -u
          if [ "$RUST_TESTS" = all ]; then
            cargo test --locked --doc --workspace --exclude shekyl-randomx-differential
          elif [ -z "$RUST_DOC_PKGS" ]; then
            echo "scope: no package in scope has a library target; no doctests"
          else
            echo "scope: cargo test --doc $RUST_DOC_PKGS"
            cargo test --locked --doc $RUST_DOC_PKGS
          fi
      - name: report flaky and slow tests
        # Flaky tests (failed, then passed on the retry) to the job summary
        # and as warnings on the pull request; then the slowest tests and
        # binaries, which size the partition of the run. Report only: the
        # run's own exit status is the verdict. It fails when there is no
        # JUnit file to read, so a run that wrote none cannot read as clean;
        # under a scope, a selection nextest recorded as empty is reported
        # as "0 tests", not refused.
        if: ${{ !cancelled() && steps.nextest-build.outcome == 'success' && needs.changes.outputs.rust_tests != 'none' }}
        env:
          RUST_TESTS: ${{ needs.changes.outputs.rust_tests }}
        run: python3 scripts/ci/nextest_report.py rust/target/nextest/ci/junit.xml --scope "$RUST_TESTS"
      - name: upload the test timings (JUnit)
        # Each test's time from the nextest run above, kept for the slow
        # tests to be named and the step to be partitioned by them.
        if: ${{ !cancelled() && needs.changes.outputs.rust_tests != 'none' }}
        uses: actions/upload-artifact@v6
        with:
          name: rust-nextest-junit
          path: rust/target/nextest/ci/junit.xml
          if-no-files-found: warn
          # A re-run of the job uploads under the same name.
          overwrite: true
      - name: "BA-T5 floor probe smoke: the ignored probe still serves whole responses"
        working-directory: rust
        # The floor probe (`shekyl-p-serve/tests/ba_t5_floor_probe.rs`) is
        # `#[ignore]`d, so it ran nowhere and broke silently when #1015
        # changed the body framing. One run of its smallest mode over
        # loopback with a scratch store: two whole fetches per shard size
        # and one isolated phase pass, a few seconds. It asserts only what
        # the probe already asserts of itself — every response is whole and
        # exactly the length its head declares. Not a benchmark: its numbers
        # are a CI runner's and are discarded with the store. The trap
        # removes that store when the probe fails: the job's shell runs
        # with `-e`, so a later `rm` would not.
        #
        # `--ignored` on a binary whose test lost `#[ignore]` or `#[test]`
        # reports `running 0 tests` and exits 0. The harness's own list is
        # the subject (rule 47). This job runs in the ubuntu container,
        # whose shell is `sh`: a bash `$'\n'` case pattern stays the two
        # characters and rejects a list that contains the probe. The list
        # is a file, and the probe is one exact line of it (rule 46). The
        # harness also prints a summary, so the match is the line, not the
        # whole listing. `grep -c` exits 1 when the count is zero, which
        # `-e` would abort before the message; `|| true` keeps that count.
        run: |
          store=$(mktemp -d)
          listed=$(mktemp)
          trap 'rm -rf "$store" "$listed"' EXIT
          cargo test --locked -p shekyl-p-serve --test ba_t5_floor_probe -- --list --ignored >"$listed"
          probe_lines=$(grep -c '^ba_t5_floor_probe: test$' "$listed" || true)
          if [ "${probe_lines:-0}" -ne 1 ]; then
            echo "the floor probe is not among the ignored tests" >&2
            cat "$listed" >&2
            exit 1
          fi
          BAT5_STORE="$store" BAT5_MODE=phase BAT5_N=2 BAT5_PHASE_N=1 BAT5_LABEL=ci \
            cargo test --locked -p shekyl-p-serve --test ba_t5_floor_probe -- --ignored --nocapture
      - name: "Nightly ignored sets: each crate's ignored tests agree with its lane's list"
        # The nightly ignored-set lanes judge `--list --ignored` in their
        # scripts. `--check` is that judgement and then stops. The listing
        # is the debug build the workspace tests above compiled. The nightly
        # lists release (the trybuild lane debug, its header says why) and
        # runs the tests. Each script keeps its own rule.
        run: |
          bash scripts/ci/ignored_set_chain_ingest.sh --check
          bash scripts/ci/ignored_set_chain_store.sh --check
          bash scripts/ci/ignored_set_economics_sim.sh --check
          bash scripts/ci/ignored_set_hasher.sh --check
          bash scripts/ci/ignored_set_staking_sim.sh --check
          bash scripts/ci/ignored_set_trybuild.sh --check
          bash scripts/ci/ignored_set_wire.sh --check
      - name: "shard-visual-x86-smoke"
        working-directory: rust
        # Option (c) of `docs/V3_SHARD_VISUALIZATION.md` "Where the bound is
        # enforced" (Performance targets, amended 2026-09-06). This catches
        # GROSS render regressions early on the machine CI already has; it
        # CANNOT bound the Pi 4 floor (GAP-7: x86:A72 per-term ratios
        # 3.86x-12x with one axis changing sign, so no scaling factor
        # exists). The floor itself is re-run by trigger, option (a).
        #
        # Deliberately named a smoke check, not a budget or performance
        # gate, so the step name cannot overclaim; and the binary prints the
        # same disclaimer on PASS as on FAIL, because a green line reads as
        # "performance is fine" to every human and every dashboard while a
        # design-doc paragraph three files away does not travel with the
        # checkmark.
        #
        # --release is mandatory (the binary refuses debug: a debug-profile
        # latency measurement is meaningless). Thresholds are x86-derived
        # and live beside the floor ones in the example source.
        run: cargo run --locked --release -p shekyl-shard-visual --example budget_matrix -- x86-smoke
      - name: "cargo clippy: test-only features off, as production builds them (lib only)"
        working-directory: rust
        # The crates `check_test_only_features.py` governs each carry a
        # feature that exists only on a dev edge. The workspace-wide clippy
        # above unifies features across every target it builds, so a
        # dev-edge feature is *on* in that run and the production shape of
        # these crates is never linted: an import or helper that only the
        # gated item uses is unused in production and invisible above
        # (#990 review: `std::time::Duration` in shekyl-p-host/src/signer.rs).
        # `--lib` with no `--all-targets` builds no dev target, so no dev
        # edge's features apply. The package list is the TEST_ONLY table in
        # `check_test_only_features.py`. `check_production_lint_lane.py`
        # (the grep-gates job, which has PyYAML; this container does not)
        # parses this step and fails if the `-p` set here is not the set of
        # TEST_ONLY owners, if cargo is passed anything but `--locked`,
        # `--lib` and `-p` (a dev target or a `--features` flag would put
        # the test feature back on the lib), if clippy is passed anything
        # but `-D warnings`, or if this step carries any key but `name`,
        # `working-directory`, `run`. Add a row there and a `-p` here in
        # the same commit.
        run: cargo clippy --locked -p shekyl-chain-ingest -p shekyl-chain-rules -p shekyl-chain-store -p shekyl-chain-sync-runtime -p shekyl-curve-tree -p shekyl-mempool -p shekyl-draw-rng -p shekyl-p-host -p shekyl-p2p-session -p shekyl-relay-privacy -p shekyl-tor-control-client -p shekyl-wire --lib -- -D warnings
      - name: "shekyl-mempool: the policy build the economics sim links (no default features)"
        working-directory: rust
        # The economics sim depends on shekyl-mempool with
        # `default-features = false`: the `policy` module alone, no store
        # (ECONOMICS_SIM_PRODUCTION_REBASE.md, ESR-17). Every other dependent
        # turns `pool` on, and the workspace runs above unify features, so
        # none of them builds the crate the sim links. This lane lints and
        # tests that build: a pool-only item reached from `policy`, or a
        # test target that needs the pool without requiring the feature,
        # fails here.
        run: |
          cargo clippy --locked -p shekyl-mempool --no-default-features --all-targets -- -D warnings
          cargo test --locked -p shekyl-mempool --no-default-features
      - name: shekyl-standoff conformance suite (x86_64 only)
        working-directory: rust
        # `shekyl-standoff`'s conformance grading + negative controls
        # (`tests/conformance_grading.rs`) are gated behind the `conformance`
        # feature, so the default-feature workspace-wide test above does NOT
        # compile or run them. Run them explicitly here so the chi-square /
        # order-balance / serial-independence grader and its triangular-trap
        # negative control are exercised in CI (ARCHIVAL_FIREWALL_GATE6.md
        # §10.12). x86_64 only by design: these are float goodness-of-fit
        # probes, and float is not bit-identical across arches — the
        # cross-arch guarantee is the integer golden vector run under qemu in
        # depends.yml, not these probes (which pass by margin, not by
        # determinism). The aarch64 lane deliberately builds default features
        # only for the same reason.
        run: cargo test --locked -p shekyl-standoff --features conformance
      - name: shekyl-engine-core conformance suite — StakeEngine RNG self-cert (x86_64 only)
        working-directory: rust
        # S6 (ARCHIVAL_BOND_S6_CERTIFY_DRAW_PLAN.md): `shekyl-engine-core`'s
        # `conformance` feature wires `shekyl-standoff`'s `certify_draw` grader
        # into `StakeEngine::on_start` over the production `OsRngGapAdapter`, so
        # the staker actor fail-stops on a non-conformant CSPRNG. It is NOT in the
        # default feature set (the grader is float + pulls `shekyl-stats`;
        # production stays float-free), so the workspace-wide test above does not
        # compile or run it. Run it explicitly here. x86_64 only by the same
        # reason as the standoff lane above — the grade is a float goodness-of-fit,
        # not bit-identical across arches; a module-level `compile_error!` in
        # `stake_engine.rs` rejects the `conformance` feature on non-x86 targets so
        # the skip is loud, never a silent false "conformance passed".
        #
        # The whole crate again, not only the three `s6_self_cert` tests the
        # feature adds: with the feature on, every wallet open that prepares
        # a stake engine waits on the self-cert (`observe_stake_self_cert`
        # in `lifecycle/assemble.rs`), and this run is the only one that
        # executes that wait. `--lib --tests` leaves out the doctests, which
        # the feature does not change and the workspace step already ran.
        run: cargo test --locked -p shekyl-engine-core --features conformance --lib --tests
      - name: "FN-DSA vectors with the AVX2 paths compiled out"
        working-directory: rust
        # The pinned `fn-dsa` crate dispatches to AVX2 at run time on x86_64,
        # and this runner has AVX2, so the workspace test above pins the
        # scheme-3 vectors on the AVX2 code only. `no_avx2` on the four
        # sub-crates compiles that dispatch out and leaves the baseline x86_64
        # (SSE2) path, which is what an x86_64 machine without AVX2 runs. The
        # vectors must give the same bytes on it: signing is floating point,
        # and a signer that disagreed with itself across paths over one
        # message would be giving two signatures over one hashed point. Cargo
        # refuses the build if a sub-crate stops offering the feature, so the
        # step cannot pass by ceasing to select the path
        # (`docs/design/FN_DSA_HYBRID.md` §3, `FND-6`).
        run: >-
          cargo test --locked -p shekyl-crypto-pq
          --features fn-dsa-comm/no_avx2,fn-dsa-kgen/no_avx2,fn-dsa-sign/no_avx2,fn-dsa-vrfy/no_avx2
          --test kat_fn_dsa_hybrid_v1
      - name: "Gate 2: shekyl-pow-randomx debug-vs-release equivalence"
        # Per `docs/design/RANDOMX_V2_PHASE2C_PLAN.md` §5.11.3 R4:
        # Rust integer-overflow semantics differ between debug (panic)
        # and release (wrapping). The verifier ships release. Any 2c
        # arithmetic that accidentally uses `+`/`*` where it should use
        # `wrapping_add`/`wrapping_mul` is invisible to debug-mode
        # `cargo test` but produces a different hash for overflow
        # inputs in release. The T1-T8 spec-vector tests (commit 7)
        # contain byte-equality assertions against fork-generated
        # fixtures; re-running them under `--release` asserts that
        # release-profile output matches debug-profile output (both
        # match the fork). Any divergence fails the PR.
        #
        # Cost: ~50 s additional CI wall-clock (measured on the
        # i9-11950H reference machine; CI hardware likely differs).
        # The §5.11.3 cost estimate was ~30 s under the planned ~200 ms
        # per-`Cache::derive` budget; R0-D12 (see
        # `docs/design/RANDOMX_V2_PHASE2C_PLAN.md` §14 + `BENCH_RESULTS.md`)
        # measured ~341 ms median, which inflates T1''s 100-iteration
        # determinism property test from ~26 s → ~34 s and pushes total
        # release-test wall-clock to ~47 s. The cost increase is
        # acceptable: T1'/T2'/T3'–T8' determinism properties are
        # plan-doc-mandated per §5.11.1 with an explicit reopening
        # criterion that names the audits-are-clean-so-compress anti-
        # pattern, i.e. "remove the non-determinism source, not the
        # property test." Acceptable for the consensus-split-bug class
        # this gate catches.
        working-directory: rust
        run: cargo test --locked --release -p shekyl-pow-randomx
      - name: "CI grep gate: no direct dalek_ff_group 0.4 usage"
        working-directory: rust
        run: |
          # Design intent (see docs/FOLLOWUPS.md "dalek-ff-group version isolation"):
          #
          # The workspace carries two dalek-ff-group versions:
          #   0.5.x — used directly by shekyl crates
          #   0.4.x — pulled transitively by vendored serai/ciphersuite internals
          #
          # Direct dalek_ff_group usage in our source is allowed (must resolve
          # to 0.5). The informational grep below prints matches for visibility
          # but does NOT fail — legitimate 0.5 usage is expected.
          #
          # The structural check below asserts that none of our crates pull
          # 0.4 as a *normal* (non-dev, non-build) dependency. If upstream
          # ciphersuite upgrades to 0.5, this gate can be removed entirely.
          DIRECT=$(grep -rn 'dalek_ff_group' --include='*.rs' \
                   shekyl-*/src 2>/dev/null \
                   | grep -v '^\s*//' || true)
          if [ -n "$DIRECT" ]; then
            echo "Files referencing dalek_ff_group directly (must all resolve to 0.5):"
            echo "$DIRECT"
          fi
          # Fail if any shekyl crate has a normal dependency on the 0.4 line
          for crate in shekyld shekyl-fcmp shekyl-crypto-pq shekyl-proofs shekyl-tx-builder shekyl-scanner shekyl-daemon-rpc; do
            if cargo tree -p "$crate" --edges normal 2>/dev/null \
               | grep 'dalek-ff-group v0\.4'; then
              echo "FATAL: $crate has a normal (non-dev) dependency on dalek-ff-group 0.4"
              exit 1
            fi
          done
          echo "PASS: all shekyl crates isolated from dalek-ff-group 0.4"
      - name: determinism check (build twice, compare hashes)
        working-directory: rust
        run: |
          cargo build --locked --release -p shekyld
          sha256sum target/release/shekyld > /tmp/build1.sha256
          cargo clean -p shekyld --release
          cargo build --locked --release -p shekyld
          sha256sum target/release/shekyld > /tmp/build2.sha256
          echo "=== Build 1 ===" && cat /tmp/build1.sha256
          echo "=== Build 2 ===" && cat /tmp/build2.sha256
          diff /tmp/build1.sha256 /tmp/build2.sha256 || (echo "FATAL: non-deterministic Rust build" && exit 1)
          echo "Determinism check PASSED"
      - name: "rust-cache post-run ENOENT workaround (Swatinem/rust-cache#144)"
        # Swatinem/rust-cache@v2's post-run cleanup walker
        # (src/cleanup.ts cleanProfileTarget) treats any subdirectory
        # of `target/` named `tests` as a kaos/macrotest/trybuild
        # nested-workspace layout and recursively cleans both
        # `tests/target/` and `tests/trybuild/`. The recursive
        # cleanTargetDir calls are NOT awaited, so async ENOENT
        # rejections on missing paths escape the synchronous
        # try/catch and surface as `##[error]ENOENT: opendir
        # rust/target/tests/target` annotations in the job summary.
        #
        # The error is non-fatal (the action continues, the job
        # concludes success), but the annotation pollutes the run
        # summary and obscures real errors. Upstream issue:
        #   https://github.com/Swatinem/rust-cache/issues/144 (open
        #   since 2023, no merged fix)
        #
        # Why we hit it: rust/shekyl-logging/tests/trybuild.rs uses
        # dtolnay/trybuild, which creates rust/target/tests/trybuild/.
        # We do NOT use kaos/macrotest, so rust/target/tests/target/
        # never gets created. Swatinem's walker tries it anyway.
        #
        # Workaround: pre-create the empty directory so the action's
        # opendir call succeeds (and finds nothing to clean). Cache
        # cost: a single empty directory entry, negligible.
        #
        # Removal condition: when Swatinem/rust-cache merges either
        # the proposed `if (e.code === "ENOENT") continue;` patch or
        # adds `await` to the recursive cleanTargetDir calls in
        # cleanProfileTarget, this step can be deleted in the same
        # PR that bumps the action pin.
        if: always()
        run: mkdir -p rust/target/tests/target

  # A red push run on `dev` opens or threads a tracking issue
  # (`report-dev-red.yml`). `needs` lists every other job in this file, so
  # a red in any of them reports; scripts/ci/check_dev_red_reporter.py
  # holds the list and this condition to the file. Only a push run on
  # `dev` reports: a pull request's red is read on the pull request. A job
  # past its `timeout-minutes` is cancelled, not failed, and `failure()`
  # does not see it, so the condition reads each needed job's result: a
  # failed or cancelled one reports, unless the whole run was cancelled
  # (a newer merge superseded it), which `!cancelled()` leaves out.
  report-dev-red:
    needs: [changes, rust-audit-and-test]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/report-dev-red.yml
