name: ci/gh-actions/cli

on:
  push:
    # `main` only. PRs are covered by `pull_request` (the merge commit into
    # the base — the stronger signal). A push-to-dev trigger used to
    # double-run this workflow on every merge (~the OS matrix plus the
    # Ubuntu test rebuild). Branches without a PR get CI by opening a
    # draft PR. The weekly Arch / MSYS2 matrix lives in
    # `.github/workflows/weekly-os.yml`.
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The below variables reduce repetitions across similar targets
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ARCH="default" (not "native") ensures, that a different execution host can execute binaries compiled elsewhere.
  BUILD_DEFAULT_LINUX: 'cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=ON -D CMAKE_BUILD_TYPE=Release && cmake --build build --target all'
  APT_INSTALL_LINUX: 'apt -y install build-essential cmake libboost-all-dev miniupnpc graphviz doxygen libunwind8-dev pkg-config libssl-dev libsodium-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler ccache git curl'
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
    ccache --max-size=150M
    ccache --set-config=compression=true

jobs:
  lint-rust-debug-macros:
    name: 'Lint: no debug macros in production Rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: reject eprintln!/dbg!/println! in production Rust
        run: |
          # Strip line-comments (`//`, `///`, `//!`) before grepping so
          # doc-comments referencing the macros for *educational* reasons
          # — e.g. `/// would print bytes via dbg!() calls` — do not trip
          # the lint. The script's intent is "no debug-macro *invocations*
          # in production code"; a literal call requires `macro!(` and is
          # uneditable through comment text. False negatives from a
          # `dbg!(` substring inside a string literal are accepted as a
          # contrived corner case.
          # `*/src/bin/*` excluded because tooling binaries (e.g.
          # `shekyl-randomx-differential::src/bin/gen_canonical_outputs.rs`,
          # per `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §5.1.5) emit
          # operator-facing diagnostics + canonical Rust source on stdout;
          # the lint's "no debug macros in production Rust" framing is
          # designed against library code, not CLI tools whose contract is
          # to print. The exclusion is the same shape as `main.rs` (also
          # excluded above): binary-target source whose `println!` /
          # `eprintln!` calls are part of the documented surface.
          # `tests.rs` and any file under a `src/**/tests/` directory are
          # excluded: these are test modules gated at the parent via
          # `#[cfg(test)] mod tests;`, so the file itself carries no in-file
          # `#[cfg(test)]` marker for the scan below to key on and would
          # otherwise be scanned as production. The `#[cfg(test)] mod tests;`
          # declaration is the out-of-file equivalent of the in-file
          # `#[cfg(test)]` gate the scan already honors; both mean "test code,
          # debug macros allowed". The scan keys on BOTH the outer `#[cfg(test)]`
          # (gating a lower test module/fn) and the module-level inner
          # `#![cfg(test)]` (whole-file test modules, e.g. the engine's
          # `regtest_e2e.rs` harness) — so such files self-declare as test code and
          # need no per-name exclusion here.
          FOUND=0
          for f in $(find rust/shekyl-*/src -name '*.rs' \
                     ! -name 'build.rs' ! -name 'main.rs' ! -path '*/examples/*' \
                     ! -path '*/src/bin/*' \
                     ! -name 'tests.rs' ! -path '*/tests/*' \
                     ! -path '*/shekyl-cli/*'); do
            TEST_LINE=$(grep -n '#!\?\[cfg(test)\]' "$f" | head -1 | cut -d: -f1)
            if [ -n "$TEST_LINE" ]; then
              HITS=$(head -n "$((TEST_LINE - 1))" "$f" \
                     | sed 's|//.*||' \
                     | grep -n 'eprintln!(\|dbg!(\|println!(' || true)
            else
              HITS=$(sed 's|//.*||' "$f" \
                     | grep -n 'eprintln!(\|dbg!(\|println!(' || true)
            fi
            if [ -n "$HITS" ]; then
              echo "$f:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "FATAL: debug macros in production Rust (above #[cfg(test)])"
            exit 1
          fi
          echo "No debug macros in production Rust — OK"
      - name: enforce RandomX FPU rounding primitive scope
        run: scripts/ci/check_randomx_fpu_rounding.sh
      - name: enforce RandomX crate-level isolation invariants
        run: scripts/ci/check_randomx_crate_invariants.sh
      - name: reject BOOST_FOREACH in C++
        run: |
          HITS=$(grep -rn 'BOOST_FOREACH' src/ tests/ --include='*.cpp' --include='*.h' --include='*.hpp' || true)
          if [ -n "$HITS" ]; then
            echo "FATAL: BOOST_FOREACH found — use range-based for loops:"
            echo "$HITS"
            exit 1
          fi
          echo "No BOOST_FOREACH — OK"
      - name: reject direct POSIX-header includes in src/
        run: |
          # The three POSIX headers owned by src/common/compat.h:
          #   unistd.h, dlfcn.h, sys/mman.h
          # Every new site should #include "common/compat.h" instead of
          # repeating the _WIN32 / _MSC_VER guard dance inline.
          #
          # Allow-list (files whose direct include has an architectural
          # reason — OS-specific arms, vendored ref10 code, or compat.h
          # itself). Keep this list tight; prefer migrating new sites.
          ALLOW='^(src/common/compat\.h|src/common/compat/glibc_compat\.cpp|src/common/password\.cpp|src/cryptonote_basic/miner\.cpp|src/crypto/random\.c|src/crypto/oaes_lib\.c|src/crypto/crypto_ops_builder/randombytes\.c|src/crypto/slow-hash\.c):'
          HITS=$(grep -rnE '^[[:space:]]*#include[[:space:]]*<(unistd|dlfcn|sys/mman)\.h>' \
                 src/ --include='*.c' --include='*.cpp' --include='*.h' --include='*.hpp' \
                 | grep -vE "$ALLOW" || true)
          if [ -n "$HITS" ]; then
            echo "FATAL: direct POSIX-header include — use #include \"common/compat.h\":"
            echo "$HITS"
            exit 1
          fi
          echo "No unguarded POSIX-header includes outside compat.h — OK"

  build-macos:
    name: 'macOS (brew)'
    runs-on: macOS-latest
    env:
      CCACHE_TEMPDIR: /tmp/.ccache-temp
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: guard against absolute local Cargo paths
        run: |
          MATCHES=""
          while IFS= read -r file; do
            HITS="$(grep -nE '/home/|/Users/|[A-Za-z]:\\\\Users\\\\' "$file" || true)"
            if [ -n "$HITS" ]; then
              MATCHES="${MATCHES}${file}\n${HITS}\n"
            fi
          done < <(find rust -type f \( -name Cargo.toml -o -path '*/.cargo/config' -o -path '*/.cargo/config.toml' \))
          if [ -n "$MATCHES" ]; then
            echo "FATAL: detected absolute local paths in Cargo manifests/config:"
            printf "%b" "$MATCHES"
            exit 1
          fi
          echo "Cargo path portability guard passed."
      - uses: actions/cache@v5
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ccache-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-build-
      - uses: ./.github/actions/set-make-job-count
      - name: install dependencies
        run: |
          brew uninstall cmake
          brew update
          # No system zstd: Levin compression is the Rust-pinned vendored
          # libzstd inside the linked shekyl image (PR #411). Installing a
          # host libzstd would reintroduce the dual-lib story we deleted.
          brew install --quiet cmake boost hidapi openssl libpgm miniupnpc libunwind-headers protobuf abseil ccache
      # Pinned to match rust/rust-toolchain.toml (avoids a parallel-cargo
      # auto-install race in the daemon build). Bump both together.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: build
        run: |
          ${{env.CCACHE_SETTINGS}}
          make -j${{env.MAKE_JOB_COUNT}}

  # Windows MSYS2 and Arch Linux moved to `.github/workflows/weekly-os.yml`.
  # PR Windows coverage is the MSVC daemon job below (the only runner that
  # can compile `shekyl-win-sec`); depends.yml still cross-compiles Win64
  # when contrib/depends changes. Two Windows compiles on every PR was the
  # third of three (MSVC + MSYS2 + depends Win64).

  build-ubuntu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Ubuntu LTS (Boost >= 1.74). Compile-only —
          # the test job consumes the 24.04 artifact (same Release
          # BUILD_TESTS=ON tree) rather than rebuilding twice.
          - name: Ubuntu 22.04
            container: ubuntu:22.04
            pack_ctest: false

          - name: Ubuntu 24.04
            container: ubuntu:24.04
            pack_ctest: true
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
        CCACHE_TEMPDIR: /tmp/.ccache-temp
        CCACHE_DIR: ~/.ccache
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install build dependencies
        run: ${{env.APT_INSTALL_LINUX}}
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: install Rust
        # Composite action (.github/actions/install-rust): the one
        # hardened download-then-run recipe, installing the
        # rust-toolchain.toml pin + components up front so the daemon
        # build's parallel cargos (cmake -j over BuildRust targets)
        # find the toolchain present instead of racing to auto-install
        # it (which corrupts ~/.rustup/downloads). Must come AFTER
        # checkout — a `./`-referenced local action does not exist on
        # the runner until the repo is checked out.
        uses: ./.github/actions/install-rust
      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.container }}-build-${{ github.sha }}
          restore-keys: ccache-${{ matrix.container }}-build-
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{env.CCACHE_SETTINGS}}
          ${{env.BUILD_DEFAULT_LINUX}}
      # Pack the CTest tree for the 24.04 test job. Same shape as
      # economics-c2a-prime.yml: Release defaults BUILD_SHARED_LIBS OFF
      # (CMakeLists.txt), so test binaries are statically linked against
      # in-tree libraries and the tar can drop *.o / *.a / CMakeFiles.
      # They still need SYSTEM libraries (boost, ssl, sodium, unwind)
      # that the test job installs. CMake bakes absolute paths into
      # CTestTestfile.cmake; both jobs use container ubuntu:24.04 +
      # actions/checkout, so github.workspace is `/__w/shekyl-core/shekyl-core`
      # on both sides. tests/data/ is repo-tracked — the test job reads
      # it from checkout, not this tarball.
      - name: Pack CTest tree
        if: matrix.pack_ctest
        run: |
          tar --exclude='**/CMakeFiles' --exclude='**/*.o' --exclude='**/*.a' \
            -czf ubuntu-24.04-ctest.tar.gz build/
      - name: Verify CTest artifact
        if: matrix.pack_ctest
        shell: bash
        run: |
          set -euo pipefail
          listing="$(tar tzf ubuntu-24.04-ctest.tar.gz)"
          if ! grep -qx 'build/CTestTestfile.cmake' <<< "$listing"; then
            echo "FATAL: ubuntu-24.04-ctest.tar.gz missing build/CTestTestfile.cmake" >&2
            echo "tar tf (first 40 entries):" >&2
            head -40 <<< "$listing" >&2
            exit 1
          fi
          # Fail closed if the GNU tar excludes above silently missed
          # (rule 47: absence of CTestTestfile is not the only signal;
          # CMakeFiles/*.o/*.a must also be absent). Same exclude set
          # as economics-c2a-prime.yml; this assertion is the check
          # that they took effect, not a rewrite of the pack command.
          leaked="$(grep -E '(^|/)CMakeFiles(/|$)|\.(o|a)$' <<< "$listing" || true)"
          if [ -n "$leaked" ]; then
            echo "FATAL: ubuntu-24.04-ctest.tar.gz still contains CMakeFiles/*.o/*.a" >&2
            echo "$leaked" | head -20 >&2
            exit 1
          fi
          echo "OK: artifact contains CTestTestfile.cmake and excludes CMakeFiles/*.o/*.a"
      - uses: actions/upload-artifact@v4
        if: matrix.pack_ctest
        with:
          name: ubuntu-24.04-ctest
          path: ubuntu-24.04-ctest.tar.gz
          retention-days: 1

  test-ubuntu:
    name: "Ubuntu 24.04 (tests)"
    needs: build-ubuntu
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
      # Setting up a loop device (losetup) requires additional capabilities.
      # tests/create_test_disks.sh
      options: --privileged
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install runtime + test dependencies
        # No compiler, no cmake rebuild, no Rust. APT_INSTALL_LINUX is the
        # same package set the 24.04 build job used, so the DT_NEEDED
        # system libraries the statically-linked-against-in-tree binaries
        # still require are present. Python packages are for functional
        # tests that ctest launches.
        run: |
          ${{env.APT_INSTALL_LINUX}}
          apt install -y python3-requests python3-psutil python3-monotonic python3-deepdiff
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-ctest
      - name: Unpack CTest tree
        run: tar -xzf ubuntu-24.04-ctest.tar.gz
      - name: create dummy disk drives for testing
        run: tests/create_test_disks.sh >> $GITHUB_ENV
      - name: tests
        env:
          CTEST_OUTPUT_ON_FAILURE: ON
        # ctest, not `cmake --build --target test`: the latter would
        # notice unpacked timestamps and try to rebuild. The build job
        # already compiled everything.
        run: ctest --test-dir build --output-on-failure

  build-windows-msvc:
    name: 'Windows (MSVC, daemon)'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Pinned to match rust/rust-toolchain.toml (avoids a parallel-cargo
      # auto-install race in the daemon build). Bump both together.
      #
      # `components: clippy` is required for the WP-W1 clippy step below: the
      # action installs a minimal toolchain, and without it the step dies with
      # "'cargo-clippy.exe' is not installed for the toolchain". Declared here
      # rather than in rust-toolchain.toml on purpose — that file explains why
      # it carries no components (parallel cargo processes would race to
      # auto-install into a shared dir during the daemon build).
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      # WP-W1: the Windows security crate must compile for Windows, and this
      # is the only runner where that can be BLOCKING — the Linux boxes have no
      # C cross-compiler, so anything whose graph reaches `ring` (i.e. anything
      # that can speak HTTPS) cannot be cross-checked there.
      #
      # `shekyl-win-sec` itself has no such dependency and is verified locally
      # too (cargo check --target x86_64-pc-windows-gnu), so a failure here is a
      # real regression, not an environment artifact.
      - name: "WP-W1: shekyl-win-sec compiles for Windows"
        shell: pwsh
        working-directory: rust
        # `--features test-utils` because the probe suite needs it, and
        # `--all-targets` builds that suite: without the feature this step
        # fails on a missing `sid_for_testing`, which is exactly how it
        # failed on the first run of this PR. The clippy step below always
        # had the feature; this one did not, so local verification and CI
        # were not running the same thing.
        run: cargo check --locked -p shekyl-win-sec --features test-utils --all-targets

      # Clippy for a WINDOWS target, which the workspace gate on Linux cannot
      # do: this crate is cfg(windows), so the Linux run sees an empty crate
      # and passes. That is not hypothetical — the first Windows-target clippy
      # run on this code found 18 errors including a genuine SOUNDNESS bug (a
      # `Vec<u8>` buffer cast to a `TOKEN_USER`, which needs 8-byte alignment).
      # A gate that cannot see its subject is the defect this round keeps
      # finding; this is the fix for it.
      - name: "WP-W1: clippy -D warnings (Windows target)"
        shell: pwsh
        working-directory: rust
        run: cargo clippy --locked -p shekyl-win-sec --features test-utils --all-targets -- -D warnings

      # The rustdoc gate for this crate lives HERE, not in rust-audit-test.yml's
      # persona-serving list, and the reason is the point: that list runs on
      # Linux, where `shekyl-win-sec` compiles to nothing. Adding it there would
      # document an empty crate and pass forever — a gate checking nothing,
      # which is precisely the defect the preceding follow-up round existed to
      # remove. Its docs carry the WP-D4/WP-D5 security contracts and the safety
      # arguments for every `unsafe` block, so they are worth gating; they just
      # have to be gated where they exist.
      - name: "WP-W1: rustdoc -D warnings (shekyl-win-sec)"
        shell: pwsh
        working-directory: rust
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --lib -p shekyl-win-sec

      # The pre-registered probes (docs/design/WINDOWS_WALLET_PROBE_SHEET.md).
      # BLOCKING, and that is the point of writing them down first: each probe
      # carries a prediction made before any Windows machine ran it, and the
      # sheet names the DECISION a failure revisits. A red here is a finding
      # about the design, not a flaky test.
      #
      # `-CiOnly` skips exactly the two probes §3 pre-declares as needing an
      # interactive logon. It is a switch rather than auto-detection so a CI run
      # cannot silently skip more than was pre-registered — the skips are
      # printed and are not passes.
      - name: "WP probes: pre-registered Windows behaviour"
        shell: pwsh
        run: ./scripts/ci/windows_probe.ps1 -CiOnly

      # WP-W5 SCOUTING STEP — informational by design, and NOT a gate.
      #
      # `WINDOWS_WALLET_SUPPORT.md` §7 plans one deliberate run whose only job
      # is to drain the remaining Windows error list, because §2's blocking
      # surface was produced by grep and a compile stops at the first error per
      # crate. This is that run, made continuous and cheap rather than
      # one-shot.
      #
      # It does not fail the build, and that is a decision rather than an
      # oversight: the port is incomplete on purpose (WP-D10 keeps the build
      # gate on until WP-W5), so a red here would mean "still unported", which
      # is already known and recorded. WP-W5 flips `continue-on-error` off in
      # the same slice that makes it pass — that flip is the gate, and until
      # then this step's output is read by a human, not by CI.
      #
      # What it observes as of WP-W2: the `cfg(windows)` arms of
      # `shekyl-wallet-rpc` and `shekyl-cli` — the named-pipe listener seam
      # and the verified dial — which no Linux box can compile (their graphs
      # reach `ring`), plus the two end-to-end tests, which run in the same
      # step regardless of whether the check or each other passed (see
      # REPORTING below). Coverage as of the rotation fix: BOTH end-to-end
      # tests have now executed here. The wallet-rpc half found the
      # mandatory-lock bug (WINDOWS_WALLET_PROBE_SHEET.md §4.3), and the
      # shekyl-cli half first ran green on 2026-08-24 once the run-everything
      # change stopped the step aborting before it. They are informational
      # for the same reason as the check and end the same way — WP-W5 turns
      # the wallet test lane blocking.
      #
      # `shekyl-engine-file` joined the list with that rotation fix, and the
      # reason is the point: it owns the atomic write, the keys-file lock and
      # password rotation — every Windows-specific file primitive the wallet
      # has — and it was covered by NOTHING here. The two crates above only
      # reach it through the RPC surface, so `rotate_password` failing on
      # Windows for every wallet arrived as an opaque `-32603` from a
      # lifecycle test rather than as the four red tests in the crate that
      # actually owns the defect. A crate whose whole job is platform file
      # behaviour is the last one that should be tested only by proxy.
      #
      # REPORTING (2026-08-21). A `continue-on-error` step shows
      # `conclusion: success` on the run page whatever its command did; the
      # first real Windows-only wallet bug (the mandatory keys-file lock,
      # WINDOWS_WALLET_PROBE_SHEET.md §4.3) was found ~8,000 log lines deep
      # under a green tick. So: every command runs regardless of the earlier
      # ones (a compile stops at the first error per crate; this step must
      # not stop at the first error per command), each exit code lands in a
      # table on the job summary, and the step fails — still non-blocking —
      # when any of them did. Exit codes are read directly from
      # $LASTEXITCODE, never through a pipe (rule 46).
      - name: "WP-W5 scouting: remaining Windows errors + pipe e2e (informational)"
        shell: pwsh
        working-directory: rust
        continue-on-error: true
        run: |
          # Commands are argument arrays invoked through the call operator,
          # not strings through Invoke-Expression: no quoting to reason about,
          # and nothing that becomes code execution if an argument ever stops
          # being a constant. The step's exit is the FIRST non-zero code — with
          # run-everything semantics the earliest failure is the informative
          # one (a failed check makes the test results moot); every command's
          # own code is in the table regardless.
          #
          # A non-zero cargo exit is DATA here, not an error: it has to reach
          # $LASTEXITCODE and the table. The daemon-binary step below records
          # that on this runner $PSNativeCommandUseErrorActionPreference has
          # promoted expected non-zero native exits into terminating errors
          # before $LASTEXITCODE could be read; under $ErrorActionPreference
          # 'Stop' (the Actions pwsh default) that would end this block at
          # the first failing command and skip the remaining commands, the
          # table, the summary and the explicit exit. Turning the preference
          # off for this block is the direct control; `cmd /c` isolation
          # would work too but would put the commands back into strings.
          $PSNativeCommandUseErrorActionPreference = $false
          $results = @()
          $first_failure = 0
          foreach ($argv in @(
            @('cargo', 'check', '--locked', '-p', 'shekyl-engine-core', '-p', 'shekyl-wallet-rpc', '-p', 'shekyl-cli'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-engine-file'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-wallet-rpc', '--test', 'http_get_version'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-cli', '--test', 'rpc_session_e2e')
          )) {
            $shown = $argv -join ' '
            Write-Host "::group::$shown"
            & $argv[0] @($argv[1..($argv.Length - 1)])
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            $results += [pscustomobject]@{ Command = $shown; Exit = $code }
            if ($code -ne 0 -and $first_failure -eq 0) { $first_failure = $code }
          }
          $lines = @('## WP-W5 scouting (informational, Windows)', '', '| Command | Exit |', '|---|---|')
          foreach ($r in $results) {
            $mark = if ($r.Exit -eq 0) { 'PASS' } else { "FAIL ($($r.Exit))" }
            $lines += "| ``$($r.Command)`` | $mark |"
          }
          $lines += ''
          $lines += 'Non-blocking until WP-W5 flips it; a FAIL here is a finding to read, not a flake to rerun.'
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $results | Format-Table -AutoSize | Out-String | Write-Host
          exit $first_failure

      - name: restore vcpkg cache
        uses: actions/cache/restore@v5
        id: vcpkg-cache
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\archives
          key: vcpkg-x64-windows-static-${{ hashFiles('.github/workflows/build.yml', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-x64-windows-static-
      - name: install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg\archives,readwrite
        run: |
          vcpkg install --triplet x64-windows-static --overlay-ports="${{ github.workspace }}/vcpkg-overlay/ports" boost openssl libsodium libusb lmdb
      - name: save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\installed
            C:\vcpkg\archives
          key: vcpkg-x64-windows-static-${{ hashFiles('.github/workflows/build.yml', 'vcpkg-overlay/**') }}
      - name: configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTATIC=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_TESTS=OFF `
            -DSTACK_TRACE=OFF `
            -DUSE_DEVICE_TREZOR=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
      # Daemon only. The C++ wallet stack was deleted at Phase 5, and the
      # Rust wallet binaries are not built for Windows targets — see
      # docs/design/WINDOWS_WALLET_SUPPORT.md. The Windows wallet gap is
      # neither caused nor widened here: the `wallet` target built a binary
      # that has not shipped since the C1/C2 install cutover (#500). Slice
      # WP-W5 of that design round owns renaming this job back.
      - name: build daemon
        shell: pwsh
        run: |
          cmake --build build --config Release --target daemon --parallel 2
      - name: smoke-test daemonizer removal
        shell: pwsh
        # After the V3.1 daemonizer removal, shekyld.exe must (a) link
        # cleanly on MSVC without the src/daemonizer/ subsystem, (b) run
        # without invoking the removed POSIX fork() / Windows SCM code
        # paths, and (c) intercept the retired CLI flags via
        # src/common/removed_flags.{h,cpp}.
        #
        # The removed-flag assertions cover shekyld alone. They used to
        # cover the C++ wallet-rpc too, but that binary is deleted (its
        # name and install slot went to the Rust shekyl-wallet-rpc in the
        # C1/C2 cutover). They cannot transfer to the Rust binary: the
        # migration message they grep for comes from
        # src/common/removed_flags.{h,cpp}, and clap answers "unexpected
        # argument" instead. The shim's wallet-side caller
        # (src/wallet/wallet_args.cpp) was deleted with wallet2 at Phase 5,
        # so shekyld is now the shim's only caller.
        #
        # No wallet binary is checked on Windows because none is built
        # there — `BuildRust.cmake` skips them, tracked in docs/FOLLOWUPS.md
        # under "Rust wallet stack: no Windows support". Not because the
        # stack is Unix-only: that stopped being true on 2026-08-25, when
        # both binaries were observed compiling and linking for
        # x86_64-pc-windows-msvc with their end-to-end tests passing. What
        # is unverified is the CMake path, staging, install and archive
        # layout, so WP-W5 removes the gate deliberately rather than as a
        # side effect. This job is the daemon's MSVC gate until then. --help
        # exits 0 after printing the option list, which exercises the full
        # argument-parsing + logger-init path without waiting on a network
        # port. --detach is expected to exit nonzero with the V3.1
        # migration message; grepping the message pins the shim so a
        # future regression ("unknown option --detach") fails CI loudly
        # rather than shipping as a user-visible downgrade. The checks
        # are intentionally Windows-only because POSIX fork / Windows SCM
        # behaviors diverge at exactly this boundary.
        run: |
          # Native invocations go through `cmd /c` rather than PowerShell's `&`
          # operator. The previous two iterations of this step hit PowerShell
          # gotchas (array-vs-scalar -notmatch on 2>&1 output, then
          # $PSNativeCommandUseErrorActionPreference turning expected-nonzero
          # exits into terminating errors before $LASTEXITCODE could be read).
          # cmd.exe has none of that behavior — exit code is just the exit
          # code, stderr merges to the file via `2>&1` without any ErrorRecord
          # elevation. PowerShell is reduced to "inspect $LASTEXITCODE" and
          # "Select-String on a file," which are the well-behaved parts.
          $ErrorActionPreference = 'Stop'
          $daemon = 'build\bin\Release\shekyld.exe'

          function Assert-HelpOk([string]$exe, [string]$label) {
            cmd /c "`"$exe`" --help > NUL 2>&1"
            if ($LASTEXITCODE -ne 0) {
              throw "$label --help failed with exit $LASTEXITCODE"
            }
          }

          function Assert-RemovedFlag([string]$exe, [string]$label, [string]$flag) {
            $outFile = New-TemporaryFile
            try {
              cmd /c "`"$exe`" $flag > `"$outFile`" 2>&1"
              $exit = $LASTEXITCODE
              $out  = Get-Content -Raw -LiteralPath $outFile
              if ($exit -eq 0) {
                throw "$label $flag unexpectedly succeeded; output: $out"
              }
              if ($out -notmatch 'was removed in V3\.1') {
                throw "$label $flag did not produce the V3.1 migration message; output: $out"
              }
            } finally {
              Remove-Item -LiteralPath $outFile -ErrorAction SilentlyContinue
            }
          }

          Assert-HelpOk $daemon 'shekyld'
          Assert-RemovedFlag $daemon 'shekyld' '--detach'

          # Both Assert-RemovedFlag calls deliberately leave $LASTEXITCODE
          # nonzero — that's exactly what we're asserting on. GitHub Actions'
          # pwsh shell wrapper is literally:
          #     pwsh -Command ". '$script'; if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }"
          # so a script that returns successfully but leaves $LASTEXITCODE=1
          # behind (from the last native command) gets miscategorized as a
          # failed step. Reset explicitly. Any earlier failure fires `throw`
          # inside the Assert-* helpers, which aborts before we get here, so
          # this only runs on genuine success.
          exit 0

  source-archive:
    name: "source archive"
    # Required status check on `main` (ruleset 15215246). Keep it on the
    # release PR (base = main) and on pushes to main. Drop it from every
    # PR into `dev` — gitian on tags is the release archive; this job was
    # ~1 min itself but occupied a runner in the same pool as the 15-workflow
    # PR fan-out.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install dependencies
        run: apt install -y git python3-pip
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: archive
        run: |
          pip install git-archive-all
          # Restrict `git describe` to release tags (`v*`). Otherwise the
          # `archive/<branch>-<date>` annotated tags created by the
          # branch-archival policy in `.cursor/rules/06-branching.mdc` rule 5
          # become the closest reachable tag once they land on a commit
          # ancestor of the branch under test, and `VERSION` ends up
          # containing a `/` (e.g. `shekyl-archive/<branch>-<date>`), which
          # makes `git-archive-all` write to a non-existent directory and
          # fails the job with `[Errno 2] No such file or directory`.
          export VERSION="shekyl-$(git describe --match 'v*')"
          export OUTPUT="$VERSION.tar"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          git-archive-all --prefix "$VERSION/" --force-submodules "$OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.OUTPUT }}
          path: ${{ env.OUTPUT }}
