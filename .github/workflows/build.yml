name: ci/gh-actions/cli

on:
  push:
    # `dev` and `main`. A pull request's run tests its head merged onto the
    # `dev` of its last push; the run on `dev` tests what the merges
    # actually made, the one place two pull requests each green alone can
    # show red together (06-branching.mdc). Branches without a PR get CI
    # by opening a draft PR. The weekly Arch / MSYS2 matrix lives in
    # `.github/workflows/weekly-os.yml`.
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]

# Superseded-run cancellation (the house pattern the other workflows cite).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
# Every push to `dev` shares one ref, so a merge cancels the run of the
# merge before it and a burst is tested once, at its newest commit. The
# `changes` job measures a push from the last green run, not from the
# previous push, so a cancelled run's commits are still in scope.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The below variables reduce repetitions across similar targets
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ARCH="default" (not "native") ensures, that a different execution host can execute binaries compiled elsewhere.
  BUILD_DEFAULT_LINUX: 'cmake -S . -B build -D ARCH="default" -D CMAKE_BUILD_TYPE=Release && cmake --build build --target all'
  # clang + libclang-dev: the live-daemon gates step runs
  # `cargo test -p shekyl-engine-core --lib`, and lib tests build the crate's
  # dev-dependencies -- which include gungraun with `client_requests`, whose
  # `valgrind-requests` build script runs bindgen. bindgen needs libclang AND
  # clang's own resource headers (a bare container fails with
  # "stdbool.h file not found" otherwise). GitHub-hosted runners ship clang,
  # which is why the Rust workflow never needed this; these jobs run in bare
  # ubuntu containers, which do not.
  APT_INSTALL_LINUX: 'apt -y install build-essential cmake git curl clang libclang-dev'
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF

jobs:
  # Change scope, computed once and consumed by every job below.
  #
  # WHY THIS EXISTS RATHER THAN A `paths-ignore` ON THE WORKFLOW. A path filter
  # suppresses the WORKFLOW, so on a docs-only PR no check is created at all --
  # and branch protection waits forever for a context nobody will report. That
  # is a required check that CANNOT PASS: loud, but a hard deadlock. A job-level
  # `if:` instead produces a check that reports "skipping", which protection
  # accepts -- the same shape `codeql.yml`'s `analyze-python` already relies
  # on for another required context in this repo.
  #
  # No third-party action: `git diff` against the base does this, and a
  # change-detection action would be a new supply-chain surface in CI (rule 17).
  #
  # FAILS CLOSED. If the file list cannot be computed for any reason, the output
  # is `false` and every job runs. A wrong `true` silently skips the real matrix
  # on a source change; a wrong `false` costs runner minutes. Only one of those
  # merges broken code.
  changes:
    name: 'Change scope'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # p90 0.6 min over 23 runs; the floor
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    # `actions: read` lists this workflow's earlier runs for a push's base.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push is measured from the last commit this workflow passed
            # on, not from `before`: see scripts/ci/push_scope_base.sh. No
            # base prints nothing, and the classifier then runs everything.
            base=$(scripts/ci/push_scope_base.sh build.yml "${{ github.ref_name }}" "$head")
          fi

          # The classifier is scripts/ci/change_scope.py: it fails closed
          # (docs_only=false) on anything it cannot decide, and a crash of the
          # script itself also writes false, so a broken scope runs everything
          # rather than skipping the jobs that need this one.
          python3 scripts/ci/change_scope.py --base "$base" --head "$head" \
            || echo "docs_only=false" >> "$GITHUB_OUTPUT"

  lint-rust-debug-macros:
    name: 'Lint: no debug macros in production Rust'
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # p90 0.4 min over 17 runs; the floor
    steps:
      - uses: actions/checkout@v5
      - name: reject eprintln!/dbg!/println! in production Rust
        run: |
          # Strip line-comments (`//`, `///`, `//!`) before grepping so
          # doc-comments referencing the macros for *educational* reasons
          # — e.g. `/// would print bytes via dbg!() calls` — do not trip
          # the lint. The script's intent is "no debug-macro *invocations*
          # in production code"; a literal call requires `macro!(` and is
          # uneditable through comment text. False negatives from a
          # `dbg!(` substring inside a string literal are accepted as a
          # contrived corner case.
          # `*/src/bin/*` excluded because tooling binaries (e.g.
          # `shekyl-randomx-differential::src/bin/gen_canonical_outputs.rs`,
          # per `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §5.1.5) emit
          # operator-facing diagnostics + canonical Rust source on stdout;
          # the lint's "no debug macros in production Rust" framing is
          # designed against library code, not CLI tools whose contract is
          # to print. The exclusion is the same shape as `main.rs` (also
          # excluded above): binary-target source whose `println!` /
          # `eprintln!` calls are part of the documented surface.
          # `tests.rs` and any file under a `src/**/tests/` directory are
          # excluded: these are test modules gated at the parent via
          # `#[cfg(test)] mod tests;`, so the file itself carries no in-file
          # `#[cfg(test)]` marker for the scan below to key on and would
          # otherwise be scanned as production. The `#[cfg(test)] mod tests;`
          # declaration is the out-of-file equivalent of the in-file
          # `#[cfg(test)]` gate the scan already honors; both mean "test code,
          # debug macros allowed". The scan keys on BOTH the outer `#[cfg(test)]`
          # (gating a lower test module/fn) and the module-level inner
          # `#![cfg(test)]` (whole-file test modules, e.g. the engine's
          # `regtest_e2e.rs` harness) — so such files self-declare as test code and
          # need no per-name exclusion here.
          FOUND=0
          for f in $(find rust/shekyl-*/src -name '*.rs' \
                     ! -name 'build.rs' ! -name 'main.rs' ! -path '*/examples/*' \
                     ! -path '*/src/bin/*' \
                     ! -name 'tests.rs' ! -path '*/tests/*' \
                     ! -path '*/shekyl-cli/*'); do
            TEST_LINE=$(grep -n '#!\?\[cfg(test)\]' "$f" | head -1 | cut -d: -f1)
            if [ -n "$TEST_LINE" ]; then
              HITS=$(head -n "$((TEST_LINE - 1))" "$f" \
                     | sed 's|//.*||' \
                     | grep -n 'eprintln!(\|dbg!(\|println!(' || true)
            else
              HITS=$(sed 's|//.*||' "$f" \
                     | grep -n 'eprintln!(\|dbg!(\|println!(' || true)
            fi
            if [ -n "$HITS" ]; then
              echo "$f:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "FATAL: debug macros in production Rust (above #[cfg(test)])"
            exit 1
          fi
          echo "No debug macros in production Rust — OK"
      - name: enforce RandomX FPU rounding primitive scope
        run: scripts/ci/check_randomx_fpu_rounding.sh
      - name: enforce RandomX crate-level isolation invariants
        run: scripts/ci/check_randomx_crate_invariants.sh

  build-macos:
    name: 'macOS (brew)'
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macOS-latest
    timeout-minutes: 45  # p90 20.4 min over 13 runs
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: guard against absolute local Cargo paths
        run: |
          MATCHES=""
          while IFS= read -r file; do
            HITS="$(grep -nE '/home/|/Users/|[A-Za-z]:\\\\Users\\\\' "$file" || true)"
            if [ -n "$HITS" ]; then
              MATCHES="${MATCHES}${file}\n${HITS}\n"
            fi
          done < <(find rust -type f \( -name Cargo.toml -o -path '*/.cargo/config' -o -path '*/.cargo/config.toml' \))
          if [ -n "$MATCHES" ]; then
            echo "FATAL: detected absolute local paths in Cargo manifests/config:"
            printf "%b" "$MATCHES"
            exit 1
          fi
          echo "Cargo path portability guard passed."
      - uses: ./.github/actions/set-make-job-count
      - name: install dependencies
        run: |
          brew uninstall cmake
          brew update
          brew install --quiet cmake
      # Pinned to match rust/rust-toolchain.toml (avoids a parallel-cargo
      # auto-install race in the daemon build). Bump both together.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: build
        run: make -j${{env.MAKE_JOB_COUNT}}
      # The Mach-O half of the hardening gate (MH_PIE, no executable stack,
      # no LC_RPATH) on the three staged Rust binaries; otool is Xcode's.
      # The Makefile's build directory carries the OS and the branch name
      # (`build/Darwin/<branch>/release`), so the staged directory is found,
      # and the gate itself fails on a path that is not a file.
      - name: binary hardening on the staged binaries (otool)
        run: |
          staged=$(find build -type f -name shekyld -path '*/release/bin/*' -print -quit)
          if [ -z "$staged" ]; then echo "no staged shekyld under build/" >&2; exit 1; fi
          bindir=$(dirname "$staged")
          scripts/ci/check_binary_hardening.sh "$bindir/shekyld" "$bindir/shekyl-cli" "$bindir/shekyl-wallet-rpc"

  # Windows MSYS2 and Arch Linux moved to `.github/workflows/weekly-os.yml`.
  # PR Windows coverage is the MSVC daemon job below (the only runner that
  # can compile `shekyl-win-sec`); depends.yml still cross-compiles Win64
  # when contrib/depends changes. Two Windows compiles on every PR was the
  # third of three (MSVC + MSYS2 + depends Win64).

  build-ubuntu:
    name: ${{ matrix.name }}
    needs: changes
    # NO JOB-LEVEL `if:` HERE, deliberately, and it is not an oversight.
    #
    # `Ubuntu 22.04` and `Ubuntu 24.04` are required contexts and they come from
    # `${{ matrix.name }}`. A job-level `if:` is evaluated BEFORE the matrix
    # expands, so a skipped job has no `matrix.name` to interpolate and cannot
    # emit checks under those names — protection would keep waiting, which is
    # the very deadlock this workflow change exists to remove. The other jobs
    # here carry literal names and gate at the job level safely; this one must
    # run so the legs exist, and gates its WORK at the step level instead.
    #
    # Cost on a docs-only PR: two runner allocations that finish in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 90  # p90 44.7 min over 15 runs (the 24.04 leg)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu LTS builds and checks the binaries;
          # the live-daemon and symbol gates run on 24.04 alone.
          - name: Ubuntu 22.04
            container: ubuntu:22.04
            live_gates: false

          - name: Ubuntu 24.04
            container: ubuntu:24.04
            live_gates: true
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: set apt conf
        if: needs.changes.outputs.docs_only != 'true'
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        if: needs.changes.outputs.docs_only != 'true'
        run: apt update
      - name: install build dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: ${{env.APT_INSTALL_LINUX}}
      - name: configure git
        if: needs.changes.outputs.docs_only != 'true'
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          submodules: recursive
      - name: install Rust
        if: needs.changes.outputs.docs_only != 'true'
        # Composite action (.github/actions/install-rust): the one
        # hardened download-then-run recipe, installing the
        # rust-toolchain.toml pin + components up front so the daemon
        # build's parallel cargos (cmake -j over BuildRust targets)
        # find the toolchain present instead of racing to auto-install
        # it (which corrupts ~/.rustup/downloads). Must come AFTER
        # checkout — a `./`-referenced local action does not exist on
        # the runner until the repo is checked out.
        uses: ./.github/actions/install-rust
      - uses: ./.github/actions/set-make-job-count
        if: needs.changes.outputs.docs_only != 'true'
      - name: build
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: ${{env.BUILD_DEFAULT_LINUX}}
      # Armed #[ignore]d regtest_e2e gates against the shekyld just built.
      # Runs here rather than in the test job because that job installs no
      # Rust by design, and here the binary and the toolchain already coexist.
      #
      # 14 gates, each <= ~3.5 min, ~20 min total (measured 2026-09-08 local
      # Release; a runner is slower). The two heavy consensus gates (depth-3
      # spend, emission claim; 13 + 19 min) run nightly instead — GATE_LANE=
      # slow in nightly-live-daemon-slow.yml, same script, red pushed to a
      # tracking issue (the visibility route #660's ruling required of any
      # cost tier). Either way this is not the critical path: depends.yml
      # (74-113 min) and randomx (90 min) already run longer, concurrently.
      # Binary isolation on the shekyld this job just linked (Release,
      # --gc-sections). Cron in randomx-v2-differential.yml still runs
      # the same script; this is the per-PR copy so a production
      # reference of the PoW test setter cannot merge on a green source
      # grep alone. nm is binutils, pulled in by build-essential.
      - name: symbol isolation on linked daemon (nm)
        if: matrix.live_gates && needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: scripts/ci/check_randomx_symbol_isolation.sh build/bin/shekyld
      # The hardening the link flags claim, read off the staged ELF binaries
      # (PIE, non-executable stack, full RELRO, no run path). The three are
      # Rust binaries built by one cargo invocation; no CMake flag list
      # reaches them, so the result is what is asserted. readelf is binutils.
      - name: binary hardening on the staged binaries (readelf)
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: scripts/ci/check_binary_hardening.sh build/bin/shekyld build/bin/shekyl-cli build/bin/shekyl-wallet-rpc
      # The C++ removal's end state (Rick, 2026-11-06), on what this job
      # built: the staged shekyld needs no C++ runtime and holds no C++
      # symbol. The tree half (no first-party C or C++ tracked, no CMake
      # target compiling any) runs in the grep gates. Selftest first, so a
      # gate that cannot fail is caught before it passes.
      - name: the daemon holds no C++ (no C++ runtime, no C++ symbol)
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          python3 scripts/ci/check_no_first_party_c.py --selftest
          python3 scripts/ci/check_no_first_party_c.py --binary build/bin/shekyld
      - name: live-daemon gates
        if: matrix.live_gates && needs.changes.outputs.docs_only != 'true'
        # `shell: bash`: the job's default shell in this container is dash,
        # which rejects `set -o pipefail` outright — the script dies on line
        # 1 before running anything.
        shell: bash
        run: scripts/ci/run_live_daemon_gates.sh

  build-windows-msvc:
    name: 'Windows (MSVC, daemon)'
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 180  # p90 89.2 min over 13 runs
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Pinned to match rust/rust-toolchain.toml (avoids a parallel-cargo
      # auto-install race in the daemon build). Bump both together.
      #
      # `components: clippy` is required for the WP-W1 clippy step below: the
      # action installs a minimal toolchain, and without it the step dies with
      # "'cargo-clippy.exe' is not installed for the toolchain". Declared here
      # rather than in rust-toolchain.toml on purpose — that file explains why
      # it carries no components (parallel cargo processes would race to
      # auto-install into a shared dir during the daemon build).
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      # Every Rust step below builds into rust/target, the CMake daemon
      # build included (cmake/BuildRust.cmake sets CARGO_TARGET_DIR there),
      # so one workspace entry covers the job. Without a cache each run
      # compiled the dependency graph cold, once per profile and feature
      # set. Saved by push runs only: a pull request's save is readable by
      # that pull request alone and evicts the `dev` cache the others
      # restore from (rust-audit-test.yml's cache step).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          save-if: ${{ github.event_name == 'push' }}
      # WP-W1: the Windows security crate must compile for Windows, and this
      # is the only runner where that can be BLOCKING — the Linux boxes have no
      # C cross-compiler, so anything whose graph reaches `ring` (i.e. anything
      # that can speak HTTPS) cannot be cross-checked there.
      #
      # `shekyl-win-sec` itself has no such dependency and is verified locally
      # too (cargo check --target x86_64-pc-windows-gnu), so a failure here is a
      # real regression, not an environment artifact.
      - name: "WP-W1: shekyl-win-sec compiles for Windows"
        shell: pwsh
        working-directory: rust
        # `--features test-utils` because the probe suite needs it, and
        # `--all-targets` builds that suite: without the feature this step
        # fails on a missing `sid_for_testing`, which is exactly how it
        # failed on the first run of this PR. The clippy step below always
        # had the feature; this one did not, so local verification and CI
        # were not running the same thing.
        run: cargo check --locked -p shekyl-win-sec --features test-utils --all-targets

      # Clippy for a WINDOWS target, which the workspace gate on Linux cannot
      # do: this crate is cfg(windows), so the Linux run sees an empty crate
      # and passes. That is not hypothetical — the first Windows-target clippy
      # run on this code found 18 errors including a genuine SOUNDNESS bug (a
      # `Vec<u8>` buffer cast to a `TOKEN_USER`, which needs 8-byte alignment).
      # A gate that cannot see its subject is the defect this round keeps
      # finding; this is the fix for it.
      - name: "WP-W1: clippy -D warnings (Windows target)"
        shell: pwsh
        working-directory: rust
        run: cargo clippy --locked -p shekyl-win-sec --features test-utils --all-targets -- -D warnings

      # The rustdoc gate for this crate lives HERE, not in rust-audit-test.yml's
      # persona-serving list, and the reason is the point: that list runs on
      # Linux, where `shekyl-win-sec` compiles to nothing. Adding it there would
      # document an empty crate and pass forever — a gate checking nothing,
      # which is precisely the defect the preceding follow-up round existed to
      # remove. Its docs carry the WP-D4/WP-D5 security contracts and the safety
      # arguments for every `unsafe` block, so they are worth gating; they just
      # have to be gated where they exist.
      - name: "WP-W1: rustdoc -D warnings (shekyl-win-sec)"
        shell: pwsh
        working-directory: rust
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --lib -p shekyl-win-sec

      # Clippy on a Windows target, every lane the Linux gate runs
      # (`rust-audit-test.yml`, `multisig-feature.yml`), with the same
      # commands. The Linux gate never compiles a `cfg(windows)` arm, and
      # before this step only `shekyl-win-sec` and `shekyl-tor-control-client`
      # were linted here: a Windows sweep for #1293 found eight crates
      # failing `-D warnings` and every `--all-targets` lane failing to build
      # (gungraun's `client_requests`, now `cfg(unix)`). Every lane runs
      # whatever the earlier ones did, its exit read from $LASTEXITCODE
      # (rule 46), and the step exits with the first failure. The
      # `shekyl-win-sec` step above keeps its `test-utils` lane.
      - name: "clippy -D warnings, the Linux gate's lanes (Windows target)"
        shell: pwsh
        working-directory: rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $first_failure = 0
          foreach ($argv in @(
            @('--workspace', '--all-targets', '--keep-going'),
            @('-p', 'shekyl-engine-core', '--all-targets', '--features', 'gf7-hooks'),
            @('-p', 'shekyl-engine-core', '--all-targets', '--features', 'bench-internals'),
            @('-p', 'shekyl-chain-ingest', '-p', 'shekyl-chain-rules', '-p', 'shekyl-chain-store', '-p', 'shekyl-chain-sync-runtime', '-p', 'shekyl-curve-tree', '-p', 'shekyl-mempool', '-p', 'shekyl-draw-rng', '-p', 'shekyl-p-host', '-p', 'shekyl-p2p-session', '-p', 'shekyl-tor-control-client', '-p', 'shekyl-wire', '--lib'),
            @('-p', 'shekyl-engine-core', '-p', 'shekyl-fcmp', '-p', 'shekyl-fcmp-proofs', '--features', 'multisig', '--all-targets', '--keep-going'),
            @('-p', 'shekyl-multisig', '--all-targets', '--keep-going')
          )) {
            $shown = 'cargo clippy --locked ' + ($argv -join ' ') + ' -- -D warnings'
            Write-Host "::group::$shown"
            cargo clippy --locked @argv -- -D warnings
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            Write-Host "$shown -> exit $code"
            if ($code -ne 0 -and $first_failure -eq 0) { $first_failure = $code }
          }
          exit $first_failure

      # TB-7 part 2 on Windows. Clippy for this crate's Windows code is in
      # the workspace step above.
      #
      # `the_managed_launch_environment_is_exact` reads `Command::get_envs`,
      # which lists variables the builder set and cannot see `env_clear`.
      # The proof that the child inherits nothing else, and that `SystemRoot`
      # is `GetSystemWindowsDirectoryW` rather than the parent's value, is
      # `managed_tor_child_inherits_no_environment`: it re-executes with a
      # poisoned `SystemRoot` and reads the environment the shim received.
      #
      # `--exact` plus "1 passed": a renamed test matches nothing and cargo
      # exits 0, which is not a pass.
      - name: "TB-7: the managed launch environment pair list"
        shell: pwsh
        working-directory: rust
        run: |
          # As in the WP-W5 step below: a non-zero cargo exit must reach
          # $LASTEXITCODE and the printed output, not end the block first.
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked -p shekyl-tor-control-client --lib -- control::launch::tests::the_managed_launch_environment_is_exact --exact *> tb7-env.out
          $rc = $LASTEXITCODE
          Get-Content tb7-env.out
          if ($rc -ne 0) { exit $rc }
          if (-not (Select-String -Path tb7-env.out -Pattern 'test result: ok\. 1 passed' -Quiet)) {
            Write-Error "the TB-7 environment pair-list test did not run"
            exit 1
          }

      - name: "TB-7: the managed tor inherits no environment"
        shell: pwsh
        working-directory: rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked -p shekyl-tor-control-client --lib -- control::launch::tests::managed_tor_child_inherits_no_environment --exact *> tb7-inherit.out
          $rc = $LASTEXITCODE
          Get-Content tb7-inherit.out
          if ($rc -ne 0) { exit $rc }
          if (-not (Select-String -Path tb7-inherit.out -Pattern 'test result: ok\. 1 passed' -Quiet)) {
            Write-Error "the TB-7 inheritance test did not run"
            exit 1
          }

      # TSR-Q7 on Windows: the launch module's tests compiled for Windows,
      # among them the loopback control pair (`ControlPair::new`, which
      # accepts only its own connect) and the spawn that marks tor's end
      # inheritable under the spawn lock (the environment test above spawns
      # through it). Floor = the module's Windows test count (6), so a test
      # that is cfg'd away or renamed fails here instead of passing as
      # nothing run.
      - name: "TSR-Q7: the launch module's tests (Windows)"
        shell: pwsh
        working-directory: rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked -p shekyl-tor-control-client --lib -- control::launch::tests:: *> tsr-q7-launch.out
          $rc = $LASTEXITCODE
          Get-Content tsr-q7-launch.out
          if ($rc -ne 0) { exit $rc }
          $passed = Select-String -Path tsr-q7-launch.out -Pattern 'test result: ok\. (\d+) passed' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $passed -or $passed -lt 6) {
            Write-Error "the launch module ran $passed tests on Windows; the floor is 6"
            exit 1
          }

      # DC-F39 / DC-F40 / DC-F42 (DAEMON_CONFIG_CUTOVER.md §11): the daemon
      # crates' tests on MSVC, the RPC crate among them (review 3 §3). Nothing ran them here before, and the first Windows
      # run found a lib test that did not link (link.exe resolves every
      # symbol an object references before it discards anything, where GNU
      # ld and lld drop the unreferenced ones) and nine tests whose fixtures
      # assumed `/` paths and LF line ends. BLOCKING, with a floor per lib
      # test binary so a crate whose tests were cfg'd away or filtered out
      # fails here instead of passing as nothing run (rule 47). shekyl-process's
      # `dc_q21_a_fault_ends_with_its_code` writes a scratch per-application
      # `LocalDumps` policy under HKLM for its own binary (DC-F44) and so
      # needs an elevated session, which this runner is; it refuses with the
      # reason, never skips, when it is not.
      - name: "DC-F39: the daemon crates' tests link and pass on MSVC"
        shell: pwsh
        working-directory: rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked -p shekyl-options -p shekyl-daemon-config -p shekyl-daemon -p shekyl-daemon-rpc -p shekyl-process --no-fail-fast *> daemon-crates.out
          $rc = $LASTEXITCODE
          Get-Content daemon-crates.out
          if ($rc -ne 0) { exit $rc }
          # A floor is per test binary, keyed by its name under deps\. The
          # libs are the crates' own; shekyl-process's lib tests are all Unix
          # (core limits, dumpable, procctl), so its Windows floor is the
          # integration test that faults a child under hardening. Windows
          # counts at the p2p cutover (2026-11-05): options 31, daemon 44,
          # daemon-config 63, daemon-rpc 180,
          # dc_q21_a_fault_ends_with_its_code 4. shekyl-cli, which took
          # daemon-rpc's console tests (R8), is covered by the Rust workspace
          # job, not this MSVC link step.
          $floors = @{ 'shekyl_options-' = 25; 'shekyl_daemon-' = 30; 'shekyl_daemon_config-' = 60; 'shekyl_daemon_rpc-' = 170; 'dc_q21_a_fault_ends_with_its_code-' = 4 }
          $lines = Get-Content daemon-crates.out
          foreach ($binary in $floors.Keys) {
            $at = ($lines | Select-String -Pattern ("Running .*\\deps\\" + [regex]::Escape($binary)) | Select-Object -First 1).LineNumber
            if (-not $at) { Write-Error "no test binary ran for $binary"; exit 1 }
            # This binary's own block: up to the next binary's Running line
            # or cargo's Doc-tests header, so a missing result is never read
            # off what follows. Case-sensitive: Select-String ignores case by
            # default, and libtest's own "running N tests" line is the
            # block's second.
            $next = ($lines[$at..($lines.Length - 1)] | Select-String -CaseSensitive -Pattern '^\s*(Running|Doc-tests) ' | Select-Object -First 1).LineNumber
            $end = if ($next) { $at + $next - 2 } else { $lines.Length - 1 }
            $result = $lines[$at..$end] | Select-String -Pattern 'test result: ok\. (\d+) passed' | Select-Object -First 1
            if (-not $result) { Write-Error "no passing result line in the $binary tests"; exit 1 }
            $passed = [int]$result.Matches[0].Groups[1].Value
            if ($passed -lt $floors[$binary]) {
              Write-Error "the $binary tests passed $passed on Windows; the floor is $($floors[$binary])"
              exit 1
            }
          }

      # The pre-registered probes (docs/design/WINDOWS_WALLET_PROBE_SHEET.md).
      # BLOCKING, and that is the point of writing them down first: each probe
      # carries a prediction made before any Windows machine ran it, and the
      # sheet names the DECISION a failure revisits. A red here is a finding
      # about the design, not a flaky test.
      #
      # `-CiOnly` skips exactly the two probes §3 pre-declares as needing an
      # interactive logon. It is a switch rather than auto-detection so a CI run
      # cannot silently skip more than was pre-registered — the skips are
      # printed and are not passes.
      - name: "WP probes: pre-registered Windows behaviour"
        shell: pwsh
        run: ./scripts/ci/windows_probe.ps1 -CiOnly

      # WP-W5 SCOUTING STEP — informational by design, and NOT a gate.
      #
      # `WINDOWS_WALLET_SUPPORT.md` §7 plans one deliberate run whose only job
      # is to drain the remaining Windows error list, because §2's blocking
      # surface was produced by grep and a compile stops at the first error per
      # crate. This is that run, made continuous and cheap rather than
      # one-shot.
      #
      # It does not fail the build, and that is a decision rather than an
      # oversight: the port is incomplete on purpose (WP-D10 keeps the build
      # gate on until WP-W5), so a red here would mean "still unported", which
      # is already known and recorded. WP-W5 flips `continue-on-error` off in
      # the same slice that makes it pass — that flip is the gate, and until
      # then this step's output is read by a human, not by CI.
      #
      # What it observes as of WP-W2: the `cfg(windows)` arms of
      # `shekyl-wallet-rpc` and `shekyl-cli` — the named-pipe listener seam
      # and the verified dial — which no Linux box can compile (their graphs
      # reach `ring`), plus the two end-to-end tests, which run in the same
      # step regardless of whether the check or each other passed (see
      # REPORTING below). Coverage as of the rotation fix: BOTH end-to-end
      # tests have now executed here. The wallet-rpc half found the
      # mandatory-lock bug (WINDOWS_WALLET_PROBE_SHEET.md §4.3), and the
      # shekyl-cli half first ran green on 2026-08-24 once the run-everything
      # change stopped the step aborting before it. They are informational
      # for the same reason as the check and end the same way — WP-W5 turns
      # the wallet test lane blocking.
      #
      # `shekyl-engine-file` joined the list with that rotation fix, and the
      # reason is the point: it owns the atomic write, the keys-file lock and
      # password rotation — every Windows-specific file primitive the wallet
      # has — and it was covered by NOTHING here. The two crates above only
      # reach it through the RPC surface, so `rotate_password` failing on
      # Windows for every wallet arrived as an opaque `-32603` from a
      # lifecycle test rather than as the four red tests in the crate that
      # actually owns the defect. A crate whose whole job is platform file
      # behaviour is the last one that should be tested only by proxy.
      #
      # REPORTING (2026-08-21). A `continue-on-error` step shows
      # `conclusion: success` on the run page whatever its command did; the
      # first real Windows-only wallet bug (the mandatory keys-file lock,
      # WINDOWS_WALLET_PROBE_SHEET.md §4.3) was found ~8,000 log lines deep
      # under a green tick. So: every command runs regardless of the earlier
      # ones (a compile stops at the first error per crate; this step must
      # not stop at the first error per command), each exit code lands in a
      # table on the job summary, and the step fails — still non-blocking —
      # when any of them did. Exit codes are read directly from
      # $LASTEXITCODE, never through a pipe (rule 46).
      - name: "WP-W5 scouting: remaining Windows errors + pipe e2e (informational)"
        shell: pwsh
        working-directory: rust
        continue-on-error: true
        run: |
          # Commands are argument arrays invoked through the call operator,
          # not strings through Invoke-Expression: no quoting to reason about,
          # and nothing that becomes code execution if an argument ever stops
          # being a constant. The step's exit is the FIRST non-zero code — with
          # run-everything semantics the earliest failure is the informative
          # one (a failed check makes the test results moot); every command's
          # own code is in the table regardless.
          #
          # A non-zero cargo exit is DATA here, not an error: it has to reach
          # $LASTEXITCODE and the table. The daemon-binary step below records
          # that on this runner $PSNativeCommandUseErrorActionPreference has
          # promoted expected non-zero native exits into terminating errors
          # before $LASTEXITCODE could be read; under $ErrorActionPreference
          # 'Stop' (the Actions pwsh default) that would end this block at
          # the first failing command and skip the remaining commands, the
          # table, the summary and the explicit exit. Turning the preference
          # off for this block is the direct control; `cmd /c` isolation
          # would work too but would put the commands back into strings.
          $PSNativeCommandUseErrorActionPreference = $false
          $results = @()
          $first_failure = 0
          foreach ($argv in @(
            @('cargo', 'check', '--locked', '-p', 'shekyl-engine-core', '-p', 'shekyl-wallet-rpc', '-p', 'shekyl-cli'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-engine-file'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-wallet-rpc', '--test', 'http_get_version'),
            @('cargo', 'test', '--locked', '-p', 'shekyl-cli', '--test', 'rpc_session_e2e')
          )) {
            $shown = $argv -join ' '
            Write-Host "::group::$shown"
            & $argv[0] @($argv[1..($argv.Length - 1)])
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            $results += [pscustomobject]@{ Command = $shown; Exit = $code }
            if ($code -ne 0 -and $first_failure -eq 0) { $first_failure = $code }
          }
          $lines = @('## WP-W5 scouting (informational, Windows)', '', '| Command | Exit |', '|---|---|')
          foreach ($r in $results) {
            $mark = if ($r.Exit -eq 0) { 'PASS' } else { "FAIL ($($r.Exit))" }
            $lines += "| ``$($r.Command)`` | $mark |"
          }
          $lines += ''
          $lines += 'Non-blocking until WP-W5 flips it; a FAIL here is a finding to read, not a flake to rerun.'
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $results | Format-Table -AutoSize | Out-String | Write-Host
          exit $first_failure

      - name: configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_BUILD_TYPE=Release
      # Daemon only: the Rust wallet binaries are not built for Windows
      # targets — see docs/design/WINDOWS_WALLET_SUPPORT.md. Slice WP-W5 of
      # that design round owns renaming this job back.
      - name: build daemon
        shell: pwsh
        # The link gate is the script: shekyld exists, and the link log
        # has no LNK4098.
        run: |
          pwsh -NoProfile -File scripts/ci/msvc_static_crt.ps1 -Stage link
      # The PE half of the hardening gate on the linked daemon: PE32+ and
      # DllCharacteristics with DYNAMIC_BASE, HIGH_ENTROPY_VA and NX_COMPAT
      # (DAEMON_CONFIG_CUTOVER.md DC-Q21). The runner image's LLVM supplies
      # llvm-readobj; the script also reads dumpbin's shape inside a
      # developer shell. `/GS` leaves no header mark and is not read here.
      - name: binary hardening on the linked daemon (PE headers)
        shell: bash
        run: scripts/ci/check_binary_hardening.sh build/bin/Release/shekyld.exe
      - name: smoke-test daemon boot and stop
        shell: pwsh
        # The daemon's runtime gate on Windows: boot the built shekyld.exe
        # offline on regtest with a fresh data directory and a free RPC port,
        # wait until it answers get_info, ask it to stop over RPC, and assert
        # it exits 0 within a timeout having created its chain store
        # (scripts/ci/daemon_boot_stop_smoke.ps1, which asserts each of its
        # subjects: rule 47).
        #
        # It replaces the daemonizer-removal smoke test (Rick, 2026-10-14).
        # That step re-proved the link the build step already proves,
        # asserted that a deleted code path did nothing, and pinned the
        # removed_flags shim the daemon-configuration cutover deletes
        # (DAEMON_CONFIG_CUTOVER.md, DC-Q4); its --help check returned
        # before the logger was initialised, so it exercised less than its
        # comment claimed.
        #
        # The cutover extends this job on the same daemon: the Rust main()
        # and its one stop path; a second daemon on the same data directory
        # refused by the lock; a config directory whose access list grants
        # Users write refused with exit 2; another network's data directory
        # refused by the marker; and a daemon in its own process group sent
        # Ctrl-Break takes its one stop path (Rick, 2026-10-22). RT-W14 later
        # adds a service-manager case (install, start, SERVICE_RUNNING, stop).
        run: |
          pwsh -NoProfile -File scripts/ci/daemon_boot_stop_smoke.ps1 -Daemon 'build\bin\Release\shekyld.exe'

  source-archive:
    name: "source archive"
    # Required status check on `main` (ruleset 15215246). Keep it on the
    # release PR (base = main) and on pushes to main. Drop it from every
    # PR into `dev` — gitian on tags is the release archive; this job was
    # ~1 min itself but occupied a runner in the same pool as the 15-workflow
    # PR fan-out.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15  # not timed: runs only toward main; about 1 min (comment above)
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install dependencies
        run: apt install -y git python3-pip
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: archive
        run: |
          pip install git-archive-all
          # Restrict `git describe` to release tags (`v*`). Otherwise the
          # `archive/<branch>-<date>` annotated tags created by the
          # branch-archival policy in `.cursor/rules/06-branching.mdc` rule 5
          # become the closest reachable tag once they land on a commit
          # ancestor of the branch under test, and `VERSION` ends up
          # containing a `/` (e.g. `shekyl-archive/<branch>-<date>`), which
          # makes `git-archive-all` write to a non-existent directory and
          # fails the job with `[Errno 2] No such file or directory`.
          export VERSION="shekyl-$(git describe --match 'v*')"
          export OUTPUT="$VERSION.tar"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          git-archive-all --prefix "$VERSION/" --force-submodules "$OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.OUTPUT }}
          path: ${{ env.OUTPUT }}

  # A red push run on `dev` opens or threads a tracking issue
  # (`report-dev-red.yml`). `needs` lists every other job in this file, so
  # a red in any of them reports; scripts/ci/check_dev_red_reporter.py
  # holds the list and this condition to the file. Only a push run on
  # `dev` reports: a pull request's red is read on the pull request. A job
  # past its `timeout-minutes` is cancelled, not failed, and `failure()`
  # does not see it, so the condition reads each needed job's result: a
  # failed or cancelled one reports, unless the whole run was cancelled
  # (a newer merge superseded it), which `!cancelled()` leaves out.
  report-dev-red:
    needs: [changes, lint-rust-debug-macros, build-macos, build-ubuntu, build-windows-msvc, source-archive]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/report-dev-red.yml
