#
# LV-1 — Levin wire-constant parity gate.
#
# `rust/shekyl-levin` claims byte-identity with the C++ `epee::levin` oracle
# in four places (crate docs, crate README, docs/CHANGELOG.md, the
# IMPLEMENTATION_INDEX LV row), and every wire constant it holds is a
# hand-copy of a C++ definition. Nothing else in CI puts the two side by
# side: `cmake/BuildRust.cmake` builds only `-p shekyl-ffi` and
# `-p shekyl-daemon-image`, so the C++ build never sees this crate. This gate
# is the catcher — same shape as the MSW F-1 cross-language constant KAT.
#
# Cheap by construction (grep + shell arithmetic, no toolchain), so it can be
# triggered on both sides' constant-owning files without cost.

name: ci/levin-constant-parity

on:
  pull_request:
    # A single anchored list, aliased into `push` below, so the two event
    # triggers cannot drift apart. Both sides of the comparison must trigger
    # it: a C++-only change is exactly the drift this gate exists to catch,
    # and so is a Rust-only one.
    paths: &paths
      - "contrib/epee/include/net/levin_base.h"
      - "contrib/epee/include/net/levin_compression.h"
      - "rust/shekyl-levin/**"
      - "scripts/ci/check_levin_constant_parity.sh"
      - ".github/workflows/levin-constant-parity.yml"
  push:
    branches: [dev]
    paths: *paths

concurrency:
  group: levin-constant-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  levin-constant-parity:
    name: "LV-1: levin wire-constant parity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check C++/Rust Levin constant parity
        run: ./scripts/ci/check_levin_constant_parity.sh
