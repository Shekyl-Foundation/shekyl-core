name: vendored crypto content

# Content-integrity gate for the vendored crypto subtree (rust/shekyl-oxide/crypto/):
# fails if any tracked file there differs from the checked-in manifest. Catches
# in-place edits to the pristine, genesis-frozen, externally-review-scoped crypto that
# bypass the fork workflow — the failure mode that let the `divisors` drift land
# undetected (there was no automated local-content check; the staleness canary only
# compares commit hashes). Pure sha256, no toolchain — fast; runs on every push/PR.
#
# This is the "gate everyone assumed existed" from docs/design/SHEKYL_OXIDE_UNVENDOR.md
# §5/§6 (Track A, A1), in its drift-from-snapshot form; it upgrades to byte-exact-vs-pin
# once A0 re-syncs the subtree to a clean fork baseline.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  crypto-content:
    name: vendored crypto matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: verify vendored crypto content
        run: scripts/ci/check_vendored_crypto_manifest.sh --check
