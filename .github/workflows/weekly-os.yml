name: ci/weekly-os

# Arch Linux + Windows MSYS2. These used to sit on every non-docs PR in
# `build.yml` next to Ubuntu 22.04/24.04 and Windows MSVC. PR coverage is
# Ubuntu 22.04 compile + Ubuntu 24.04 build+test + macOS + Windows MSVC
# (the only runner that can compile `shekyl-win-sec`). Arch still carries
# the gcc-16 `libstdc++.so` workaround; MSYS2 is a third Windows compile
# on top of MSVC + depends Win64. Both stay as a weekly canary, not a
# merge gate.
#
# Reopen onto the PR matrix if: a distro-specific compile break lands on
# `dev` that Ubuntu 24.04 / MSVC would not have caught, and the weekly
# run is how it was found.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: weekly-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_DEFAULT_LINUX: 'cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=ON -D CMAKE_BUILD_TYPE=Release && cmake --build build --target all'
  CCACHE_SETTINGS: |
    ccache --max-size=150M
    ccache --set-config=compression=true

jobs:
  build-windows-msys2:
    name: 'Windows (MSYS2)'
    runs-on: windows-latest
    env:
      CCACHE_TEMPDIR: C:\Users\runneradmin\.ccache-temp
      CCACHE_DIR: C:\Users\runneradmin\.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\.ccache
          key: ccache-${{ runner.os }}-weekly-msys2-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-weekly-msys2-
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-toolchain make mingw-w64-x86_64-cmake mingw-w64-x86_64-ccache mingw-w64-x86_64-boost mingw-w64-x86_64-openssl mingw-w64-x86_64-libsodium mingw-w64-x86_64-hidapi mingw-w64-x86_64-protobuf mingw-w64-x86_64-abseil-cpp mingw-w64-x86_64-libusb mingw-w64-x86_64-rust git
      - uses: ./.github/actions/set-make-job-count
      - name: build
        run: |
          ${{env.CCACHE_SETTINGS}}
          make release-static-win64 -j${{env.MAKE_JOB_COUNT}}

  build-arch:
    name: 'Arch Linux'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: install dependencies
        run: pacman -Syyu --noconfirm base-devel git cmake boost boost-libs openssl libsodium readline gtest python3 doxygen graphviz hidapi libusb protobuf abseil-cpp rust
      # WORKAROUND (2026-07-10, Arch gcc 16.1.1-3): the gcc-libs →
      # libgcc/libstdc++ package split dropped the `libstdc++.so` symlink
      # from GCC's internal search dir (which now carries only
      # `libstdc++.a`, files dated 2026-07-09). ld stops at the first
      # search dir containing the library in either form and the internal
      # dir precedes /usr/lib, so every `-lstdc++` link silently goes
      # STATIC — colliding with the dynamic-only `__cxa_throw` hook in
      # `src/common/stack_trace.cpp` ("multiple definition of
      # `__cxa_throw`", first seen linking shekyl-gen-ssl-cert).
      # Reproduced distro-side with zero Shekyl code: on this image,
      # `ldd` on a g++ hello-world shows no libstdc++ dependency at all.
      # Restoring the symlink reinstates the historical layout; `ln -sf`
      # is a no-op once Arch ships it again. REMOVE when a stock
      # container passes `ldd`-shows-dynamic-libstdc++ (the sanity check
      # below fails loudly if the workaround itself ever stops working).
      - name: restore dynamic libstdc++ (Arch gcc 16.1.1-3 packaging regression)
        run: |
          for d in /usr/lib/gcc/x86_64-pc-linux-gnu/*/; do
            if [ -f "$d/libstdc++.a" ] && [ ! -e "$d/libstdc++.so" ]; then
              ln -sf /usr/lib/libstdc++.so "$d/libstdc++.so"
              echo "restored $d/libstdc++.so -> /usr/lib/libstdc++.so"
            fi
          done
          printf '#include <string>\nint main(){ return std::string("x").size() == 1 ? 0 : 1; }\n' > /tmp/dynlink_check.cpp
          g++ /tmp/dynlink_check.cpp -o /tmp/dynlink_check
          ldd /tmp/dynlink_check | grep -q 'libstdc++\.so' \
            || { echo '::error::libstdc++ still links statically after the symlink workaround'; exit 1; }
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: ${{env.BUILD_DEFAULT_LINUX}}
