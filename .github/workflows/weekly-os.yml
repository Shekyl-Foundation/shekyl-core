name: ci/weekly-os

# Arch Linux + Windows MSYS2. These used to sit on every non-docs PR in
# `build.yml` next to Ubuntu 22.04/24.04 and Windows MSVC. PR coverage is
# Ubuntu 22.04 and 24.04 + macOS + Windows MSVC (the only runner that can
# compile `shekyl-win-sec`). MSYS2 is a third Windows build on top of MSVC
# + depends Win64. Both stay as a weekly canary, not a merge gate.
#
# Reopen onto the PR matrix if: a distro-specific compile break lands on
# `dev` that Ubuntu 24.04 / MSVC would not have caught, and the weekly
# run is how it was found.

on:
  schedule:
    - cron: "19 6 * * 1"   # Mondays 06:19 UTC
  workflow_dispatch:

concurrency:
  group: weekly-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The release build for the machine's triple (rust/xtask/matrix.toml's
  # native row). It refuses a rustc other than rust/rust-toolchain.toml's
  # channel, so each leg installs that channel through rustup rather than
  # building with the distribution's own rust.
  BUILD_NATIVE: 'cd rust && cargo xtask build --out ../build/bin'
  PINNED_TOOLCHAIN: 'rustup toolchain install "$(sed -n "s/^channel = \"\(.*\)\"$/\1/p" rust/rust-toolchain.toml)" --profile minimal'

jobs:
  build-windows-msys2:
    name: 'Windows (MSYS2)'
    runs-on: windows-latest
    timeout-minutes: 45  # p90 22.0 min over 8 runs
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-rustup git
      # rustup's default host on Windows is MSVC, even inside MSYS2. This leg
      # exists to build with MinGW, so it names that host and then checks it:
      # an MSVC build here would pass and test nothing this job is for.
      - name: install the pinned Rust for MinGW
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          ${{env.PINNED_TOOLCHAIN}}
      - name: the toolchain is MinGW's
        run: |
          verbose=$(cd rust && rustc -vV)
          case "$verbose" in
            *"host: x86_64-pc-windows-gnu"*) echo "rustc host is x86_64-pc-windows-gnu" ;;
            *) echo "::error::this leg builds with MinGW, and rustc is: $verbose"; exit 1 ;;
          esac
      - name: build
        run: ${{env.BUILD_NATIVE}}

  build-arch:
    name: 'Arch Linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # p90 29.6 min over 8 runs
    container:
      image: archlinux:latest
    steps:
      - name: install dependencies
        run: pacman -Syyu --noconfirm base-devel git python3 rustup
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: install the pinned Rust
        run: ${{env.PINNED_TOOLCHAIN}}
      - name: build
        run: ${{env.BUILD_NATIVE}}
