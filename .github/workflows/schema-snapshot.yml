#
# Wire-schema guard — commit 3.4 of the mid-rewire hardening pass
# (`docs/MID_REWIRE_HARDENING.md` §3.4), extended to the daemon chain
# store by DRS-E1 increment 2 (`docs/design/DAEMON_REDB_STORE.md` §11.1).
#
# Converts the `block_version` discipline from cultural invariant to
# mechanical check. Two jobs, one trigger:
#
#   pull_request → dev
#     - assert-snapshots:       runs the `schema_snapshot` tests in
#                               `shekyl-engine-state` and the
#                               `codec_snapshot` tests in
#                               `shekyl-chain-store`. Fails with a
#                               unified diff if any persisted block's
#                               postcard wire schema, or any chain-store
#                               canonical codec's fixture encodings,
#                               drift from the committed `.snap`.
#     - enforce-version-bump:   cross-checks the PR diff. Wallet: if any
#                               `.snap` under `rust/shekyl-engine-state/
#                               schemas/` changed, the matching version
#                               constant in the paired source file
#                               (`WALLET_LEDGER_FORMAT_VERSION`,
#                               `LEDGER_BLOCK_VERSION`, …) must have
#                               changed in the same PR. Chain store: if
#                               ANY `.snap` under `rust/shekyl-chain-store/
#                               schemas/` changed, `SCHEMA_VERSION` in
#                               `src/codec/schema_version.rs` must have.
#                               Fails otherwise.
#
# Rationale: a `.snap` change means the on-disk wire format changed.
# Consumers depend on the version constant to recognize incompatible
# bundles — letting a schema drift land without a version bump is a
# silent data corruption risk (see `docs/MID_REWIRE_HARDENING.md` §3.4
# and `.cursor/rules/42-serialization-policy.mdc`). For the chain store
# the codec is also the digest's fold input, so a silent codec move is a
# consensus-oracle move.

name: ci/schema-snapshot

on:
  pull_request:
    branches: [dev]
    paths:
      - "rust/shekyl-engine-state/**"
      - "rust/shekyl-chain-store/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - ".github/workflows/schema-snapshot.yml"

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  group: schema-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assert-snapshots:
    name: "Assert committed schema snapshots"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust): the one
        # hardened download-then-run recipe, installing the
        # rust-toolchain.toml pin up front (the inline form installed
        # a floating stable that rust-toolchain.toml then overrode per
        # cargo invocation anyway).
        uses: ./.github/actions/install-rust

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-schema-snapshot-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-schema-snapshot-

      - name: Run schema_snapshot tests
        working-directory: rust
        run: |
          # The snapshot test machinery lives in
          # `shekyl-engine-state/src/schema_snapshot.rs`. Filtering by
          # module name keeps this job fast and isolates the failure
          # signal from unrelated unit tests.
          cargo test -p shekyl-engine-state schema_snapshot --no-fail-fast

      - name: Run chain-store codec_snapshot tests
        working-directory: rust
        run: |
          # The chain store's counterpart lives in
          # `shekyl-chain-store/src/codec/snapshot_tests.rs`: one `.snap`
          # of fixture encodings per `Canonical` codec, plus meta-tests
          # that every impl has a snapshot and that this workflow gates
          # the crate (`workflow_gates_this_crate` reads this file).
          cargo test -p shekyl-chain-store codec_snapshot --no-fail-fast

  enforce-version-bump:
    name: "Enforce paired block_version bump"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so we can diff against the merge base of
          # the PR against `dev`. `fetch-depth: 0` is the idiomatic
          # GitHub Actions way to get that.
          fetch-depth: 0

      - name: Compute paired-change verdict
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Snapshot → source-file + version-constant pairing. This list and
          # the committed `schemas/*.snap` are kept in sync by the meta-test
          # `version_bump_registry_covers_every_snapshot` in
          # `rust/shekyl-engine-state/src/schema_snapshot.rs`: it fails loudly
          # (in the assert-snapshots job) if this array and the snapshot set
          # diverge, so a new type can't add a snapshot without its pairing
          # entry — that's what makes this second registry safe. Must also match
          # `docs/MID_REWIRE_HARDENING.md` §3.4.
          #
          # Each entry: <snap-stem>|<source-file>|<version-constant>
          PAIRS=(
            "wallet_ledger|rust/shekyl-engine-state/src/wallet_ledger.rs|WALLET_LEDGER_FORMAT_VERSION"
            "ledger_block|rust/shekyl-engine-state/src/ledger_block.rs|LEDGER_BLOCK_VERSION"
            "bookkeeping_block|rust/shekyl-engine-state/src/bookkeeping_block.rs|BOOKKEEPING_BLOCK_VERSION"
            "tx_meta_block|rust/shekyl-engine-state/src/tx_meta_block.rs|TX_META_BLOCK_VERSION"
            "sync_state_block|rust/shekyl-engine-state/src/sync_state_block.rs|SYNC_STATE_BLOCK_VERSION"
            "staking_block|rust/shekyl-engine-state/src/staking_block.rs|STAKING_BLOCK_VERSION"
            "pscan_cursor|rust/shekyl-engine-state/src/pscan_cursor.rs|PSCAN_CURSOR_VERSION"
            "pscan_state|rust/shekyl-engine-state/src/pscan_state.rs|PSCAN_STATE_VERSION"
            "pending_post_block|rust/shekyl-engine-state/src/pending_post_block.rs|PENDING_POST_VERSION"
            "send_journal_block|rust/shekyl-engine-state/src/send_journal_block.rs|SEND_JOURNAL_BLOCK_VERSION"
          )

          # The PR's full diff, source-relative. `git diff --name-only
          # A...B` gives changes on the PR branch since it forked from
          # base, which is what we want for "did this PR touch X?".
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "Files changed in this PR:"
          echo "${CHANGED}" | sed 's/^/  /'
          echo

          FAIL=0
          for entry in "${PAIRS[@]}"; do
            IFS='|' read -r stem src const <<< "${entry}"
            snap="rust/shekyl-engine-state/schemas/${stem}.snap"

            if echo "${CHANGED}" | grep -Fxq "${snap}"; then
              echo "::group::${stem}: snapshot changed, checking paired version bump"
              echo "  snapshot:  ${snap}"
              echo "  source:    ${src}"
              echo "  constant:  ${const}"

              if ! echo "${CHANGED}" | grep -Fxq "${src}"; then
                echo "::error file=${snap}::${snap} changed but ${src} was not touched"
                echo "  FATAL: snapshot drift without a paired change to the"
                echo "  source file that owns ${const}."
                FAIL=1
                echo "::endgroup::"
                continue
              fi

              # The source file is touched — confirm the version constant's
              # line actually moved. We look at the unified diff, filtered
              # to lines that declare the constant (`pub const <NAME>: …`).
              # A bump produces matched `-` / `+` lines; if the only hunks
              # touching this file leave the constant-declaration line
              # unchanged, we reject.
              DIFF=$(git diff "${BASE_SHA}...${HEAD_SHA}" -- "${src}")
              if ! echo "${DIFF}" \
                   | grep -E "^[-+]pub const ${const}\s*:" \
                   > /dev/null; then
                echo "::error file=${src}::${const} constant not bumped alongside ${snap}"
                echo "  FATAL: ${src} changed but the declaration line of"
                echo "  ${const} is untouched. A snapshot change is a wire"
                echo "  format change; bump the constant in the same commit."
                FAIL=1
                echo "::endgroup::"
                continue
              fi

              echo "  OK: ${const} declaration line is part of the diff."
              echo "::endgroup::"
            fi
          done

          # Chain store (DRS-E1 increment 2). One version constant covers
          # every codec, because the store rebuilds rather than migrates
          # (`DAEMON_REDB_STORE.md` §11.1(a)): if ANY snapshot under the
          # crate's schemas/ directory changed, SCHEMA_VERSION must have
          # moved in the same PR. No per-codec registry to keep in sync —
          # the crate's `every_canonical_impl_has_a_snapshot` meta-test
          # guarantees the snapshot set is the codec set.
          CS_SNAP_DIR="rust/shekyl-chain-store/schemas/"
          CS_SRC="rust/shekyl-chain-store/src/codec/schema_version.rs"
          CS_CONST="SCHEMA_VERSION"
          CS_TOUCHED=$(echo "${CHANGED}" | grep -F "${CS_SNAP_DIR}" | grep -E '\.snap$' || true)
          if [ -n "${CS_TOUCHED}" ]; then
            echo "::group::chain-store: codec snapshot(s) changed, checking ${CS_CONST} bump"
            echo "${CS_TOUCHED}" | sed 's/^/  snapshot:  /'
            echo "  source:    ${CS_SRC}"
            echo "  constant:  ${CS_CONST}"
            if ! echo "${CHANGED}" | grep -Fxq "${CS_SRC}"; then
              echo "::error file=${CS_SRC}::chain-store codec snapshot changed but ${CS_SRC} was not touched"
              echo "  FATAL: a canonical codec moved without a paired ${CS_CONST} bump."
              FAIL=1
            elif ! git diff "${BASE_SHA}...${HEAD_SHA}" -- "${CS_SRC}" \
                   | grep -E "^[-+]pub const ${CS_CONST}\s*:" > /dev/null; then
              echo "::error file=${CS_SRC}::${CS_CONST} constant not bumped alongside a chain-store codec snapshot"
              echo "  FATAL: ${CS_SRC} changed but the declaration line of"
              echo "  ${CS_CONST} is untouched. A codec change moves the stored"
              echo "  bytes AND the digest fold; bump in the same commit."
              FAIL=1
            else
              echo "  OK: ${CS_CONST} declaration line is part of the diff."
            fi
            echo "::endgroup::"
          fi

          if [ "${FAIL}" -ne 0 ]; then
            cat <<'EOF'

          One or more persisted-block schema changes landed without a
          matching version-constant bump. See
          `docs/MID_REWIRE_HARDENING.md` §3.4 for the required pairing,
          and `.cursor/rules/42-serialization-policy.mdc` for the policy
          rationale. To fix:

            1. Decide whether the schema change is intentional.
            2. If yes, bump the paired `*_VERSION` / `*_FORMAT_VERSION`
               constant in the same PR and regenerate the snapshot:
                 UPDATE_SNAPSHOTS=1 cargo test -p shekyl-engine-state \
                   schema_snapshot
               For the chain store, bump `SCHEMA_VERSION` in
               `rust/shekyl-chain-store/src/codec/schema_version.rs` and:
                 UPDATE_SNAPSHOTS=1 cargo test -p shekyl-chain-store \
                   codec_snapshot
            3. If no, revert the change to the block struct / codec.

          EOF
            exit 1
          fi

          echo "All touched schemas are paired with their version-constant bumps."
