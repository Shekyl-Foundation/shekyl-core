name: cs2-long-run

# The chain-sync floor measurement (CS-Q11). Not a pull-request gate:
# nothing here is required for merge, and it does not run on
# `merge_group`. The runner is the floor device (a Pi 4; rule 76).
#
# It records what loopback can measure, and nothing a network decides:
# - the owner's cost per header, apart from RandomX, at 5,000 to 50,000
#   headers, for the header sync and the connect;
# - the hash rate per slot: header proofs through the executor under one
#   slot of the hasher budget and under every slot, with the branch cache
#   built first and timed on its own;
# - the body phase: each captured corpus synced over loopback from two
#   honest peers, through the owner, the entry and the store.
# Every step builds `--release`: a test build leaves all but RandomX
# unoptimised, and the figure would measure the debug model. The rate
# floor and the spans in flight are measured after the cutover, on
# regtest over a real Tor path, not here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    runs-on: [self-hosted, linux, aarch64]
    steps:
      - uses: actions/checkout@v5
      - name: owner cost per header
        working-directory: rust
        # A filter that matches nothing runs zero tests and exits 0, so the
        # binary's own list is the subject (rule 47): the test is one exact
        # line of it, read from a file (rule 46), before it runs.
        run: |
          listed=$(mktemp)
          trap 'rm -f "$listed"' EXIT
          cargo test --release -p shekyl-chain-sync --features cs2-long-run --lib -- --list >"$listed"
          found=$(grep -c '^long_run::owner_cost_per_header: test$' "$listed" || true)
          if [ "${found:-0}" -ne 1 ]; then
            echo "long_run::owner_cost_per_header is not among the tests" >&2
            cat "$listed" >&2
            exit 1
          fi
          cargo test --release -p shekyl-chain-sync --features cs2-long-run --lib -- --exact long_run::owner_cost_per_header --nocapture
      - name: hash rate per slot
        working-directory: rust
        # A filter that matches nothing runs zero tests and exits 0, so the
        # binary's own list is the subject (rule 47): the test is one exact
        # line of it, read from a file (rule 46), before it runs.
        run: |
          listed=$(mktemp)
          trap 'rm -f "$listed"' EXIT
          cargo test --release -p shekyl-p2p-harness --features cs2-long-run --test chain_sync_long_run -- --list >"$listed"
          found=$(grep -c '^hash_rate_per_slot: test$' "$listed" || true)
          if [ "${found:-0}" -ne 1 ]; then
            echo "hash_rate_per_slot is not among the tests" >&2
            cat "$listed" >&2
            exit 1
          fi
          cargo test --release -p shekyl-p2p-harness --features cs2-long-run --test chain_sync_long_run -- --exact hash_rate_per_slot --nocapture
      - name: body phase on the captured corpora
        working-directory: rust
        # A filter that matches nothing runs zero tests and exits 0, so the
        # binary's own list is the subject (rule 47): the test is one exact
        # line of it, read from a file (rule 46), before it runs.
        run: |
          listed=$(mktemp)
          trap 'rm -f "$listed"' EXIT
          cargo test --release -p shekyl-p2p-harness --features cs2-long-run --test chain_sync_long_run -- --list >"$listed"
          found=$(grep -c '^body_phase_on_the_captured_corpora: test$' "$listed" || true)
          if [ "${found:-0}" -ne 1 ]; then
            echo "body_phase_on_the_captured_corpora is not among the tests" >&2
            cat "$listed" >&2
            exit 1
          fi
          cargo test --release -p shekyl-p2p-harness --features cs2-long-run --test chain_sync_long_run -- --exact body_phase_on_the_captured_corpora --nocapture
