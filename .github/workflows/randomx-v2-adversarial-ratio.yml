# Phase 2h T6 adversarial-ratio measurement workflow.
#
# Per `docs/design/RANDOMX_V2_PHASE2H_PLAN.md` Round 1 R1-D7 sub-A
# close: T6 (`worst_case_ratio` in
# `rust/shekyl-randomx-differential/tests/worst_case_ratio.rs`) lands
# in a **new dedicated workflow** rather than the existing
# `randomx-v2-differential.yml` because T6 runs heavy measurement
# (~100 samples per recipe per side ≈ 40 s on the C4 corpus; grows
# with corpus size). Dedicated workflow keeps the gate's status
# separable from the always-on differential workflow.
#
# ## Trigger cadence (R1-D7 Sub-A, amended by the test-regime
# ## hardening runtime-mode change, 2026-07)
#
# M3 change-class citation (this file's own discipline, below):
# **cadence change** + **toolchain-pin change** + **recipe dedup**.
# Original R1-D7 Sub-A disposition: `workflow_dispatch`-only
# pre-genesis, because "the constants are still drifting (recipes
# being added, RUNNER_NOISE_MARGIN being baselined)". Substrate
# evidence that the premise expired: the recipe set has been stable
# since Phase 2h C5, RUNNER_NOISE_MARGIN is baselined against the
# committed ubuntu-latest runner class, and the PR #79 substrate
# closure that made ratios load-bearing landed 2026-05-26. The
# test-regime audit (maintainer-ratified benchmark review,
# 2026-07-03) found the practical effect was an armed gate with no
# automated trigger — "T6 runs nightly" lived in doc comments while
# the only trigger was manual — and directed the verification-DoS
# gate onto a cron. Weekly (Tuesday 06:00 UTC, staggered clear of
# the Monday mutants/codeql/oxide cluster and the daily 05:00
# structural cron); `workflow_dispatch` retained. Post-genesis the
# release-gate trigger still lands per the §11 history row.
#
# ## Post-PR-#79 substrate note (FOLLOWUP closed)
#
# Originally Phase 2h C7 close paired this workflow's T6-execution
# step with `if: false` until the V3.0
# `shekyl-pow-randomx::compute_hash`-divergence-from-C-reference
# FOLLOWUP closed: T6's `mode_adversarial_ratio` orchestrator
# invokes the same `(seedhash, data)` → hash path the divergence
# affected, and ratio-interpretation requires the Rust and C paths
# to be doing semantically equivalent work. The FOLLOWUP closed on
# `dev` via PR #79 (`989610cac`, 2026-05-26; root cause:
# `RANDOMX_FLAG_V2` missing at `randomx_create_vm`); PR #78's
# post-rebase commit (`c71ce2413`) extended the same fix to
# `COracleSession::from_raw_for_testing` (the constructor
# `mode_adversarial_ratio` consumes). T6's ratio measurements are
# now semantically load-bearing; the `if: false` gate has been
# lifted in this PR.
#
# T6 itself remains `#[ignore]`-gated at the test layer for
# runtime-cost reasons unrelated to the FOLLOWUP — per-recipe
# sample cost (~40 s) keeps T6 outside the per-PR cadence budget
# per R1-D6 close Reframe 2. The `--ignored` flag below is
# accordingly retained.
#
# ## Runner pin
#
# `ubuntu-latest` per R1-D7 Sub-C: runner class is committed
# substrate. The `RUNNER_NOISE_MARGIN` constant in
# `rust/shekyl-randomx-differential/src/adversarial_canonical_outputs.rs`
# is baselined against this runner class via the pre-implementation
# noise-baseline pass; runner-class change triggers re-baselining
# per R1-D7 Sub-C close.
#
# ## M3 PR-template discipline (R1-D7 Sub-B)
#
# Per R1-D7 Sub-B close: workflow file modifications are gate-
# determining substrate. The M3 PR-template review pass treats
# `.github/workflows/randomx-v2-*.yml` changes the same as
# canonical-output changes. Every modification to this file cites
# the change class (recipe addition, runner-class change, cadence
# change, FOLLOWUP-closure activation, diagnostic format change)
# and the substrate evidence justifying it.

name: randomx-v2-adversarial-ratio

on:
  schedule:
    # Weekly T6 adversarial-ratio gate; see the cadence-amendment
    # citation above.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      samples_per_recipe:
        description: 'Samples per recipe (default: SAMPLE_BUDGET_PER_RECIPE from adversarial_canonical_outputs.rs)'
        required: false
        default: ''
        type: string

# Schedule and dispatch runs never share a group (github.run_id):
# both use github.ref == refs/heads/dev, and a cancel-in-progress
# collision would silently swallow a running measurement — a
# canceled run fires no alarm (house lesson from
# randomx-v2-differential.yml's concurrency fix on PR #236).
concurrency:
  group: randomx-v2-adversarial-ratio-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  # Same install-prefix convention as randomx-v2-differential.yml;
  # the harness `randomx-v2-sys/build.rs` reads
  # `RANDOMX_V2_INSTALL_DIR` for the link path.
  RANDOMX_V2_BUILD_DIR: ${{ github.workspace }}/build-randomx-v2
  RANDOMX_V2_INSTALL_DIR: ${{ github.workspace }}/build-randomx-v2/install

jobs:
  adversarial-ratio:
    # Pre-genesis: `workflow_dispatch` only per R1-D7 Sub-A close.
    # Post-genesis a release-gate trigger is added.
    name: 't6: cargo test --ignored worst_case_ratio'
    runs-on: ubuntu-latest
    # T6 runtime ≈ 40 s on the C4 corpus + ~3 min C-reference build
    # + ~2 min Rust compile. 30 minutes covers the C4 size; future
    # corpus expansions may need an amendment per R1-D7 Sub-A close.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust): pins the
        # rust-toolchain.toml channel. Replaces `dtolnay/rust-toolchain
        # @stable` — the exact moving-ref the repo's own toolchain
        # discipline bans (it installed the wrong channel for the
        # 1.94.0 pin in build.yml's history, and a mutable ref is a
        # supply-chain + reproducibility risk). Latency RATIOS are
        # toolchain-sensitive; a silently-moving stable would shift
        # the measurement substrate under the baselined noise margin.
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        # Composite action (.github/actions/build-randomx-v2-ref):
        # byte-identical librandomx.a by construction across every
        # consuming lane. R1-D7 Sub-A's "duplication is intentional"
        # rationale was about decoupled ACTIVATION surfaces (this
        # workflow's triggers/failure status stay independent), which
        # a shared build recipe does not couple — it only prevents the
        # recipes drifting apart, which would put the ratio gate on a
        # differently-configured oracle than the differential gates.
        uses: ./.github/actions/build-randomx-v2-ref
      - name: cargo test --ignored t6_worst_case_ratio
        working-directory: rust
        # Post-PR-#79 + c71ce2413 substrate closure: T6 activates on
        # `workflow_dispatch` (and post-genesis release-gate, when
        # added per R1-D7 Sub-A close). The previous `if: false`
        # gate paired with the V3.0 verifier-divergence FOLLOWUP
        # has been lifted; T6 itself retains its test-layer
        # `#[ignore]` attribute for runtime-cost reasons unrelated
        # to the FOLLOWUP (per-recipe sample cost ≈40 s, outside
        # per-PR budget per R1-D6 close Reframe 2), so the
        # `--ignored` flag below is retained.
        #
        # `--release` is required: T6 measures latency, and debug-
        # mode `compute_hash` runs are ~50× slower than release —
        # the ratio numbers would be debug-mode-skewed nonsense
        # without `--release`.
        #
        # `--nocapture` propagates the `T6_OBSERVATION:` +
        # `T6_CLAIM_2_TRACKING:` JSON-line records to the workflow
        # log for the regression-tracking dashboard harvester
        # (R1-D6 close Reframe 3).
        #
        # `T6_SAMPLES_PER_RECIPE` env var carries the
        # `samples_per_recipe` workflow_dispatch input through to
        # T6's `mode_adversarial_ratio::run` call (PR #78 Round-3
        # Copilot finding F10 / comment 3307323165). An empty
        # value (the input's `default: ''`) means "use the
        # `SAMPLE_BUDGET_PER_RECIPE` default"; a non-empty value
        # overrides the per-recipe sample count for the dispatch
        # run.
        env:
          T6_SAMPLES_PER_RECIPE: ${{ github.event.inputs.samples_per_recipe }}
        run: |
          cargo test --release --locked -p shekyl-randomx-differential \
            --test worst_case_ratio -- --ignored --nocapture
