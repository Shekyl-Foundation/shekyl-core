# FFI signature gate — the hand-written declarations in
# src/shekyl/shekyl_ffi.h must agree with the Rust definitions they name.
# C linkage erases types, so this drift compiles and links today and is UB
# at runtime; the gate closes it by generating a declarations-only header
# from each gated Rust source file (cbindgen, version-pinned — output varies
# across versions) and compiling them with the hand-written header in one
# TU, where extern "C" redeclaration rules turn any disagreement into a
# conflicting-declaration compile error. Mechanism note and the negative
# controls run at introduction: scripts/ci/ffi_signature_gate.cpp.
#
# Scope is the file list in the gate script (SURFACES): the relay surface
# and the tx_extra codec with the coinbase writer. A second limb compares
# every struct the header defines against its #[repr(C)] twin (LAYOUTS):
# member names in order, size, alignment, and each member's offset and
# type. Mechanism note and controls: scripts/ci/ffi_layout_gate.cpp.
# Full-surface generation is blocked on a named cbindgen limitation
# (cross-crate constant re-exports); docs/FOLLOWUPS.md tracks the extension.
#
# Structure mirrors grep-gates.yml: single job, single runner,
# superseded-run cancellation.

name: ci/ffi-signatures

on:
  # Merge queue (06-branching.mdc): the same checks on the *merge result*,
  # not only the branch head — the class of failure neither PR's CI can
  # see (#771×#772, #853×#858, #878×#880). `merge_group` takes no `paths`
  # filter, so this runs on every group regardless of the PR filter above
  # or below.
  merge_group:
    types: [checks_requested]
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      # Every Rust export is an operand: the gate also checks that each
      # header declaration names one.
      - "rust/**/*.rs"
      - "src/shekyl/shekyl_ffi.h"
      - "scripts/ci/check_ffi_signatures.sh"
      - "scripts/ci/cbindgen-ffi-signatures.toml"
      - "scripts/ci/ffi_signature_gate.cpp"
      - "scripts/ci/cbindgen-ffi-layouts.toml"
      - "scripts/ci/cbindgen-ffi-bounds.toml"
      - "scripts/ci/ffi_layout_gate.py"
      - "scripts/ci/ffi_layout_gate.cpp"
      - ".github/workflows/ffi-signatures.yml"

concurrency:
  group: ffi-signatures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-ffi-signatures:
    name: "FFI signature gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version-pinned: cbindgen's generated output differs across versions,
      # and the gate compares generated output against a hand-written header.
      # Pin lives in the gate script (--print-pin) so install and check cannot
      # drift. `cargo install --locked` is the house idiom (rust-audit-test.yml).
      - name: Install cbindgen (pinned)
        run: cargo install cbindgen --version "$(scripts/ci/check_ffi_signatures.sh --print-pin)" --locked

      - name: Run FFI signature gate
        run: scripts/ci/check_ffi_signatures.sh
