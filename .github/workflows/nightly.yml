name: nightly/proptest-exhaustive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run."
        type: choice
        options:
          - all
          - proptest-exhaustive
          - store-ignored
          - economics-sim-ignored
          - staking-sim-ignored
          - chain-ingest-ignored
          - hasher-ignored
          - wire-ignored
          - trybuild-ignored
          - bench-full
          - producer-gate
        default: all
      ref:
        description: "Run over this one ref (a branch or a commit) in place of main and dev. For proving a lane on a branch."
        required: false
        default: ""
      report:
        description: "Open or thread a tracking issue for a red leg, as a scheduled run does. For proving the reporter."
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # No lane here caches cargo's registry or `rust/target`. On the
  # 2026-11-07 schedule all ten legs missed their cache, restore keys
  # included, and seven saved a multi-GB `rust/target` anyway: the
  # repository's caches sit over the 10 GB quota, so by the next night
  # GitHub has evicted what a lane saved. The saves only pushed the
  # per-PR jobs' caches out, which are the ones that hit. A lane builds
  # from source; a nightly has the time and a PR does not.
  plan:
    # Which legs run tonight (scripts/ci/nightly_skip.py): a leg whose key
    # (the commit it tests, this file, the toolchain pin, the pinned test
    # chains, the runner image) matches a scheduled run in the last week
    # where it passed is skipped, and the summary names that run. Fuzzing,
    # property tests with no fixed seed and anything whose verdict is about
    # an outside host are never skipped; a dispatch runs
    # every leg it selects. If this job does not succeed, every planned job
    # falls back to its full matrix (its `matrix` expression): the failure
    # runs more, never less.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # API reads only: the last week's scheduled runs, their jobs and keys
    permissions:
      actions: read
      contents: read
    outputs:
      store-ignored: ${{ steps.plan.outputs['store-ignored'] }}
      producer-gate: ${{ steps.plan.outputs['producer-gate'] }}
      economics-sim-ignored: ${{ steps.plan.outputs['economics-sim-ignored'] }}
      staking-sim-ignored: ${{ steps.plan.outputs['staking-sim-ignored'] }}
      chain-ingest-ignored: ${{ steps.plan.outputs['chain-ingest-ignored'] }}
      hasher-ignored: ${{ steps.plan.outputs['hasher-ignored'] }}
      wire-ignored: ${{ steps.plan.outputs['wire-ignored'] }}
      trybuild-ignored: ${{ steps.plan.outputs['trybuild-ignored'] }}
      bench-full: ${{ steps.plan.outputs['bench-full'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/nightly_skip.py
            scripts/ci/check_workflows_parse.py
            .github/workflows/nightly.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: plan tonight's legs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_REF: ${{ inputs.ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: python3 scripts/ci/nightly_skip.py --plan --workflow .github/workflows/nightly.yml
      - name: the keys, for the nights after
        uses: actions/upload-artifact@v6
        with:
          name: nightly-keys
          path: nightly-keys.json
          retention-days: 8

  proptest-exhaustive:
    if: ${{ !inputs.job || inputs.job == 'all' || inputs.job == 'proptest-exhaustive' }}
    # Scheduled workflows always execute from the default branch (main), so the
    # schedule picks up whichever version of this file is on main. The matrix
    # below makes each scheduled run cover both active branches in parallel.
    # A dispatch that names the `ref` input runs one leg over that ref in
    # their place, in every job the dispatch runs, which is how a lane is
    # shown red on a branch before it merges.
    # While tuning this job we may be ahead on dev, and workflow_dispatch with
    # ref=dev can exercise the newer config before it lands on main.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.ref && format('[{0}]', toJSON(inputs.ref)) || '["main","dev"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust): the one
        # hardened download-then-run recipe, installing the
        # rust-toolchain.toml pin up front (the inline `-y` form
        # installed a floating stable that rust-toolchain.toml then
        # overrode per cargo invocation anyway). Resolved from the
        # checked-out `ref` above, so each matrix branch uses its own
        # copy.
        uses: ./.github/actions/install-rust

      - name: Run proptest (200 000 cases)
        working-directory: rust
        env:
          PROPTEST_CASES: "200000"
          BRANCH: ${{ matrix.branch }}
        run: |
          START=$(date +%s)
          cargo test --locked --release -p shekyl-crypto-pq --test prop_round_trip -- --nocapture 2>&1
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "::notice::Proptest completed on ${BRANCH} in ${ELAPSED}s (budget 180m)"

      - name: Run timing-engine model (8 192 cases)
        working-directory: rust
        env:
          PROPTEST_CASES: "8192"
        run: |
          set -eu
          list=$(cargo test --locked --release -p shekyl-timing-engine --lib -- --list)
          printf '%s\n' "$list" | grep -qx 'model::random_ops_match_a_scanned_reference: test'
          cargo test --locked --release -p shekyl-timing-engine --lib -- --exact model::random_ops_match_a_scanned_reference --nocapture

      - name: Run the hasher core's model (8 192 cases)
        # The per-PR run is proptest's default case count. The test's
        # name is asserted first, so a rename cannot make this step pass
        # over nothing (rule 47).
        working-directory: rust
        env:
          PROPTEST_CASES: "8192"
        run: |
          set -eu
          list=$(cargo test --locked --release -p shekyl-hasher --lib -- --list)
          printf '%s\n' "$list" | grep -qx 'core::tests::random_sequences_hold_the_invariants_quiesce_to_the_list_and_grant_every_request: test'
          cargo test --locked --release -p shekyl-hasher --lib -- --exact core::tests::random_sequences_hold_the_invariants_quiesce_to_the_list_and_grant_every_request --nocapture

  store-ignored:
    name: store-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'store-ignored') && needs.plan.outputs['store-ignored'] != '{"include":[]}' }}
    # The chain store's `#[ignore]`d set: the two benches
    # (`weights_read_bench`, `slash_scan_bench`, which starts from the
    # forged shard-fill chain) and the RT-W10 harness. This job is the
    # lane that invokes them: an `#[ignore]`d test no scheduled lane runs is
    # a deleted test with a comment on it, and before this job none ran the
    # store's: `slash_scan_bench`'s default persona count overran epoch 0,
    # and `weights_read_bench`'s block was refused by CEN-B4 and then CEN-F18
    # — two rows that landed after the bench was written — for as long as
    # nobody ran them (both found and fixed on PR #1003). The bench figures
    # a shared runner prints decide nothing (rule 76: the floor device does);
    # what the lane asserts is that every ignored test still builds a chain
    # its own constants admit. Budget: the weights bench at its 100 000-block
    # default is about half an hour in release on a workstation, the slash
    # bench 25 s, plus the release build.
    #
    # Same matrix as above. The schedule runs main's copy of this file over
    # both branches, but the set is read from the checked-out ref's
    # scripts/ci/ignored_set_chain_store.sh, so each leg is judged by its
    # own tree; `workflow_dispatch` with `ref` proves one branch's set.
    # The per-PR Rust job runs this script with `--check` and stops after
    # that judgement.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['store-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache the hosted test chains, by their pins
        # CHAIN_FORGE.md §10.4 (CF-4a): keyed by the pin file, so a runner
        # pulls each pinned digest once; the fetch checks every layer
        # against the pin whether it pulled or found it here.
        uses: actions/cache@v5
        with:
          path: |
            rust/shekyl-chain-forge/chains/*/hosted
            ${{ runner.temp }}/shekyl-oras
          key: test-chains-${{ hashFiles('rust/shekyl-chain-forge/chains/hosted.toml') }}

      - name: Run the chain store's ignored set
        # The set and its assertions are scripts/ci/ignored_set_chain_store.sh,
        # in the tree under test: each branch judges itself (the header says
        # why the list no longer lives here).
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_chain_store.sh

  producer-gate:
    name: producer-gate (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'producer-gate') && needs.plan.outputs['producer-gate'] != '{"include":[]}' }}
    # The bundle producer's gate (`SO-D12` increment 4c,
    # `ARCHIVAL_SETTLEMENT_WRITER.md` §16.11): a bundle the producer made is
    # admitted by the bundle verifier (CEN-J29 to J37) on a driven chain and
    # connects, with its support-stream twin: the producer's path end to
    # end, so a lane runs them every night. They are
    # `#[ignore]`d because they fill a shard with real proofs and mine long
    # epochs; the script runs exactly them, in release, after asserting
    # each is in the ignored listing.
    #
    # Same matrix as above; the script is read from the checked-out ref.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['producer-gate'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache the hosted test chains, by their pins
        # CHAIN_FORGE.md §10.4 (CF-4a): keyed by the pin file, so a runner
        # pulls each pinned digest once; the fetch checks every layer
        # against the pin whether it pulled or found it here.
        uses: actions/cache@v5
        with:
          path: |
            rust/shekyl-chain-forge/chains/*/hosted
            ${{ runner.temp }}/shekyl-oras
          key: test-chains-${{ hashFiles('rust/shekyl-chain-forge/chains/hosted.toml') }}

      - name: Run the bundle producer's gate
        # The subject and its assertion are scripts/ci/producer_gate.sh, in
        # the tree under test.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/producer_gate.sh

  economics-sim-ignored:
    name: economics-sim-ignored (${{ matrix.branch }}, ${{ matrix.sim_lane }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'economics-sim-ignored') && needs.plan.outputs['economics-sim-ignored'] != '{"include":[]}' }}
    # The economics sim's `#[ignore]`d set, one job per lane
    # (scripts/ci/ignored_set_economics_sim.sh names each lane's tests):
    #   pins    the narrations against their committed fixtures (the
    #           `--stage2` pair, ESR-10's, EUP-4 prep 2's and the J x G
    #           grid's nightly scopes), the steady control's pins, and the
    #           secret draw at ESR-11's timing on ESR-13's loop;
    #   reader  the per-mode reader test,
    #           `baseline::tests::every_declared_reader_moves_its_report`.
    # Each (branch, lane) leg is its own job on its own runner with its own
    # timeout, so one slow test cannot cut the others and a test that grows
    # shows in its own lane.
    #
    # Measured one test at a time on a 16-vCPU build host at dev 46f266ac08
    # (2026-11-22), wall seconds: the reader test 4 273 of the set's 9 007;
    # the three `--stage2` pins 1 402, 839 and 727, each on one thread; the
    # EUP-4 pair 558 and 532; ESR-10's pair 241 and 227; the J x G slice 177;
    # ESR-11's set 31. In one job the set ran 6 111 to 8 001 s on dev over
    # 2026-11-17 to 11-20 against 180 minutes, and main's leg (07c8abba5f)
    # passed in 10 299 s one night and was cut at 10 817 s the next on the
    # same commit. The script stamps every line of its output with the UTC
    # time it arrived, so a cut leg names the test still running.
    #
    # ESR-10's split (ECONOMICS_SIM_PRODUCTION_REBASE.md §5.29): its full
    # narration, every cell on both w_ref arms over all nine scenarios, is
    # 144 folds of 60 years, about 85 CPU-minutes, and this job already runs
    # 80-120 minutes on dev against its 180. Nightly runs every cell on both
    # arms on the baseline and the stuffing attack
    # (esr10_nightly_narration_matches_the_committed_fixture); the full set
    # runs on demand (esr10_narration_matches_the_committed_fixture, named
    # on demand in the script below). EUP-4 prep 2's instruments (§5.32) are
    # split the same way: the nightly scope here
    # (eup4_nightly_narration_matches_the_committed_fixture), the full
    # --eup4 narration on demand (eup4_narration_matches_the_committed_fixture,
    # about 18 minutes on 16 threads). The J x G grid (§5.33) is split the
    # same way: its nightly slice here
    # (jg_grid_nightly_narration_matches_the_committed_fixture), the full
    # grid on demand on a fleet host (jg_grid_narration_matches_the_committed_fixture,
    # about 28 000 fold-years). An instrument's mode reads the fold's
    # fields, and refuses a cell whose report equals its baseline's when it
    # runs. Before it none
    # did: on PR #1009 the sim's share calls moved onto a function that is
    # zero at height 0 (783053554), both narrations drifted, and CI stayed
    # green until a fresh clone ran the tests by hand two commits later
    # (e3d0931d77).
    #
    # The crate's regeneration helpers WRITE the committed fixtures and are
    # never run here; the script names them so the set is exact.
    #
    # Same matrix as above, crossed with the lanes. The schedule runs
    # main's copy of this file over both branches, but the set is read from
    # the checked-out ref's scripts/ci/ignored_set_economics_sim.sh, so each
    # leg is judged by its own tree; `workflow_dispatch` with `ref` proves
    # one branch's set. The per-PR Rust job runs this script with `--check`
    # and stops after that judgement.
    #
    # A leg runs its lane only where the CHECKED-OUT revision has it, as
    # nightly-live-daemon-slow.yml does: a dispatch from a branch whose
    # matrix names a lane the other branch's script does not know would
    # fail there as an unknown argument and open a tracking issue for
    # nothing. The step after checkout asks the checked-out tree:
    #   - does its script have the lane's `--<lane>)` arm? Yes: the leg runs.
    #   - if not, does its own copy of this file name the lane, as
    #     `"sim_lane":"<lane>"` in the planner's fallback matrix (or in the
    #     `sim_lane: [...]` list of a revision from before the planner)? Yes:
    #     the revision claims a lane it cannot run, and the leg is RED. No:
    #     the revision predates the lane; the leg ends green with a notice
    #     that says so, and builds nothing.
    # The skip ends by itself when the lane reaches the other branch. The
    # probe reads text, so the fallback matrix stays on one line and the
    # script's arms stay `--<lane>)`.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One line: the lane probe below reads `"sim_lane":"<lane>"` from the
      # checked-out copy of this file.
      matrix: ${{ fromJSON(needs.plan.outputs['economics-sim-ignored'] || '{"include":[{"branch":"main","sim_lane":"pins"},{"branch":"main","sim_lane":"reader"},{"branch":"dev","sim_lane":"pins"},{"branch":"dev","sim_lane":"reader"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: does this revision have the ${{ matrix.sim_lane }} lane
        # See the job's comment: run where the checked-out script has the
        # lane, red where the checked-out workflow names a lane its script
        # lacks, a visible skip where the revision predates the lane.
        id: lane
        env:
          LANE: ${{ matrix.sim_lane }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          script=scripts/ci/ignored_set_economics_sim.sh
          workflow=.github/workflows/nightly.yml
          [ -f "$script" ] || {
            echo "::error::$BRANCH has no $script: the economics sim's ignored set has no runner"
            exit 1
          }
          if grep -Eq "^[[:space:]]*--${LANE}\)" "$script"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$workflow" ] && grep -Eq "\"sim_lane\":\"${LANE}\"|^[[:space:]]*sim_lane:[[:space:]]*\[[^]]*\b${LANE}\b" "$workflow"; then
            echo "::error::$BRANCH names the $LANE lane in $workflow, but its $script has no '--$LANE)' arm: the lane cannot run"
            exit 1
          fi
          echo "::notice title=$LANE lane not on $BRANCH::$BRANCH predates the economics sim's $LANE lane (neither its $script nor its $workflow names it). This leg ran nothing. It runs once the lane reaches $BRANCH."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.lane.outputs.run == 'true'
        uses: ./.github/actions/install-rust

      - name: Run the economics sim's ${{ matrix.sim_lane }} lane
        if: steps.lane.outputs.run == 'true'
        # The set, the helpers and their assertions are
        # scripts/ci/ignored_set_economics_sim.sh, in the tree under test:
        # each branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
          LANE: ${{ matrix.sim_lane }}
        run: bash scripts/ci/ignored_set_economics_sim.sh "--$LANE"

  staking-sim-ignored:
    name: staking-sim-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'staking-sim-ignored') && needs.plan.outputs['staking-sim-ignored'] != '{"include":[]}' }}
    # The staking sim's `#[ignore]`d set: the five-seed L11/L13 pins on both
    # reward arms (EUP-3 check half). The registered plateau arm is the check
    # half's falsifier; the production arm is the default the documents
    # quote. No lane ran either before this job. The set is read from the
    # checked-out ref's scripts/ci/ignored_set_staking_sim.sh, as the
    # economics sim's is, so each leg is judged by its own tree. About 35 s
    # in release on a 16-core workstation; the budget is for a 4-vCPU runner
    # building the workspace's dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['staking-sim-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Run the staking sim's ignored tests
        # The set and its assertions are scripts/ci/ignored_set_staking_sim.sh,
        # in the tree under test: each branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_staking_sim.sh

  chain-ingest-ignored:
    name: chain-ingest-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'chain-ingest-ignored') && needs.plan.outputs['chain-ingest-ignored'] != '{"include":[]}' }}
    # The chain-ingest crate's `#[ignore]`d set: the scenarios that fill
    # shards with real proofs (the emission claims, the levered slash chain,
    # the join, the pool-shim posts), the miner over real RandomX, the
    # captured-chain replay under the production proof-of-work boundary, and the
    # measurements (the switch at the genesis cap, the miner's rate, the H19
    # batch cost). This job is the lane that invokes them. Before it none
    # did: their ignore strings named a "live lane" no workflow ran, and its
    # first run (DRS-X PR 3e) found five red on dev: the switch-timing tests
    # asserted an alt table the death rule (0999f8726) had since emptied, and
    # the five-block miner test never pinned the seed the miner requires
    # (e1c39b882). Budget: 44 minutes on a loaded 16-core workstation; 240
    # for a 4-vCPU runner.
    # The figures a shared runner prints decide nothing (rule 76); what the
    # lane asserts is that every ignored test still passes.
    #
    # Same matrix as above. The set is read from the checked-out ref's
    # scripts/ci/ignored_set_chain_ingest.sh, so each leg is judged by its
    # own tree; `workflow_dispatch` with `ref` proves one branch's set.
    # The per-PR Rust job runs this script with `--check` and stops after
    # that judgement.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['chain-ingest-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache the hosted test chains, by their pins
        # CHAIN_FORGE.md §10.4 (CF-4a): keyed by the pin file, so a runner
        # pulls each pinned digest once; the fetch checks every layer
        # against the pin whether it pulled or found it here.
        uses: actions/cache@v5
        with:
          path: |
            rust/shekyl-chain-forge/chains/*/hosted
            ${{ runner.temp }}/shekyl-oras
          key: test-chains-${{ hashFiles('rust/shekyl-chain-forge/chains/hosted.toml') }}

      - name: Run the chain-ingest ignored set
        # The set and its assertions are scripts/ci/ignored_set_chain_ingest.sh,
        # in the tree under test: each branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_chain_ingest.sh

  hasher-ignored:
    name: hasher-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'hasher-ignored') && needs.plan.outputs['hasher-ignored'] != '{"include":[]}' }}
    # The hasher's `#[ignore]`d set (scripts/ci/ignored_set_hasher.sh): the
    # core's property test driven through the real shell, with threads and
    # hundreds of real 256 MiB RandomX derives
    # (docs/design/RANDOMX_CACHE_ACTOR.md §8). It catches what the per-PR
    # core test cannot see: a lost wake-up, a lease kept past its return, a
    # deadlock between the hasher's lock and the budget. Budget: 172 s on a
    # loaded 16-core workstation; 60 minutes for a 4-vCPU runner.
    #
    # Same matrix as above. The set is read from the checked-out ref's
    # script, so each leg is judged by its own tree. The per-PR Rust job
    # runs the script with `--check` and stops after that judgement.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['hasher-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Run the hasher ignored set
        # The set and its assertions are scripts/ci/ignored_set_hasher.sh,
        # in the tree under test: each branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_hasher.sh

  wire-ignored:
    name: wire-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'wire-ignored') && needs.plan.outputs['wire-ignored'] != '{"include":[]}' }}
    # shekyl-wire's `#[ignore]`d set: the RT-W10 listed-tx parse harness,
    # run with RT_W10_OUT unset so it writes a few samples to a scratch
    # directory and removes it (the run proves the harness works; its
    # figures come from the floor device), and the input-cap measurement
    # (BA-I30). This job is the lane that invokes them. Before it none did.
    #
    # The crate's fixture and vector writers WRITE committed files and are
    # never run here; the script names them so the set is exact.
    #
    # Same matrix as above. The set is read from the checked-out ref's
    # scripts/ci/ignored_set_wire.sh, so each leg is judged by its own tree;
    # `workflow_dispatch` with `ref` proves one branch's set.
    runs-on: ubuntu-latest
    # Not yet timed: a release build of shekyl-wire's test targets and two
    # tests of seconds each. Size it from the first runs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['wire-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Run shekyl-wire's ignored tests
        # The set, the helpers and their assertions are
        # scripts/ci/ignored_set_wire.sh, in the tree under test: each
        # branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_wire.sh

  trybuild-ignored:
    name: trybuild-ignored (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'trybuild-ignored') && needs.plan.outputs['trybuild-ignored'] != '{"include":[]}' }}
    # The trybuild harnesses of shekyl-chain-rules, shekyl-mempool and
    # shekyl-crypto-pq: programs compiled as a downstream crate whose whole
    # stderr must match a snapshot (the brand gate on `validate`, the pool
    # verdict that never connects, the output field that cannot be built
    # unencrypted). trybuild builds the programs in a cargo project of its
    # own, where each crate's dependency tree compiles again, about 19
    # minutes per tree on this runner, and the workspace's profile does not
    # reach it. The four tests left the per-PR Rust job on 2026-11-09 and
    # this job is the lane that runs them. The set is read from the
    # checked-out ref's scripts/ci/ignored_set_trybuild.sh (its header says
    # what each test guards and why mempool's travel with chain-rules'), so
    # each leg is judged by its own tree. The per-PR Rust job runs the
    # script with `--check` and stops after that judgement.
    runs-on: ubuntu-latest
    # 22 minutes on the first dispatched run (2026-11-10, run 42741303959:
    # the harness builds 3.5 min, chain-rules' tree 555 s, mempool's 544 s,
    # crypto-pq 31 s reusing them). About three times that, for a cold
    # registry and a slow runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['trybuild-ignored'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Run the trybuild harnesses' ignored tests
        # The set and its assertions are scripts/ci/ignored_set_trybuild.sh,
        # in the tree under test: each branch judges itself.
        env:
          BRANCH: ${{ matrix.branch }}
        run: bash scripts/ci/ignored_set_trybuild.sh

  bench-full:
    name: bench-full (${{ matrix.branch }})
    needs: [plan]
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'bench-full') && needs.plan.outputs['bench-full'] != '{"include":[]}' }}
    # The block path's instruction counts on blocks at the weight limit:
    # `shekyl-chain-ingest` `benches/block_path_full_iai.rs`, the capture
    # script's nightly set. The shapes are DAEMON_REDB_STORE.md §1.3a.7's,
    # each block filled to the limit in force, and a full block is too
    # long for a pull request: forming the 45 spends of the smallest shape
    # is 17.1 billion instructions, about twenty minutes of callgrind on a
    # workstation, and the connect and pop rows each pay a form in setup.
    # A pull request counts a block of four transactions of each shape;
    # this job counts the full blocks every night, and `bench-full-drift`
    # compares the counts with the night before.
    #
    # Same matrix as above; the set is read from the checked-out ref's
    # scripts/bench/capture_rust_baseline.sh, so each leg is judged by its
    # own tree.
    runs-on: ubuntu-latest
    # 33 minutes on the first dispatched run (2026-11-13, run 43332252269:
    # twelve functions, each a form of a full block under callgrind or one
    # in its setup). About three times that, for a cold registry and a
    # slow runner.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['bench-full'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          submodules: recursive
          # The steps below run the checked-out ref's code. It gets no
          # credential to find in .git/config.
          persist-credentials: false

      - name: install apt deps
        run: |
          bash scripts/ci/drop_runner_chrome_apt_source.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valgrind build-essential pkg-config libssl-dev python3 jq

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: install gungraun-runner
        run: cargo install gungraun-runner --version '=0.19.4' --locked

      - name: Capture the nightly set
        env:
          BENCH_SET: nightly
          OUT_JSON: ${{ runner.temp }}/bench-full/shekyl_rust_v0.json
          OUT_IAI_SNAP: ${{ runner.temp }}/bench-full/shekyl_rust_v0.iai.snapshot
        run: |
          mkdir -p "${RUNNER_TEMP}/bench-full"
          ./scripts/bench/capture_rust_baseline.sh

      - name: Artifact name for this branch
        id: artifact
        env:
          BRANCH: ${{ matrix.branch }}
        # A ref may hold a slash; an artifact name may not.
        run: echo "name=bench-full-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload tonight's capture
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ runner.temp }}/bench-full/shekyl_rust_v0.json
            ${{ runner.temp }}/bench-full/shekyl_rust_v0.iai.snapshot
          # The next night compares with this one; a month covers a run of
          # red nights.
          retention-days: 30
          if-no-files-found: error

  bench-full-drift:
    name: bench-full-drift (${{ matrix.branch }})
    # It follows bench-full's planned legs: it compares tonight's capture
    # with the one before, so it runs exactly where bench-full ran.
    if: ${{ !cancelled() && (!inputs.job || inputs.job == 'all' || inputs.job == 'bench-full') && needs.plan.outputs['bench-full'] != '{"include":[]}' }}
    # Tonight's full-block counts against the capture before tonight's of
    # the same branch, through compare.py's thresholds
    # (scripts/bench/nightly_drift.sh). A row past its fail threshold, or a
    # row gone, is a red night. The comparison is with the night before,
    # whatever it concluded, so a count moved on purpose is red once and is
    # then the figure the next night is held to.
    #
    # Its own job: it holds `actions: read`, to list and fetch the earlier
    # artifact, and the capture job above holds no token at all.
    needs: [plan, bench-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs['bench-full'] || '{"include":[{"branch":"main"},{"branch":"dev"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha || matrix.branch }}
          persist-credentials: false

      - name: Artifact name for this branch
        id: artifact
        env:
          BRANCH: ${{ matrix.branch }}
        run: echo "name=bench-full-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Download tonight's capture
        id: tonight
        # `needs` is every leg of the capture, and this leg runs when
        # another branch's capture failed. When this branch's own capture
        # failed there is no artifact: that leg of `bench-full` is the red
        # and its report, and this leg has nothing to compare.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/tonight

      - name: Compare with the capture before tonight's
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.artifact.outputs.name }}
          DOWNLOADED: ${{ steps.tonight.outcome }}
        run: |
          if [ "$DOWNLOADED" != "success" ]; then
            echo "::notice::no ${NAME} capture tonight: the bench-full leg for this branch did not upload one, and is the red to read"
            exit 0
          fi
          bash scripts/bench/nightly_drift.sh "$NAME" "${RUNNER_TEMP}/tonight/shekyl_rust_v0.json"

  report-red:
    # A nightly tier without a route to a human "joins a silence"
    # (`run_live_daemon_gates.sh` header, PR #660): these lanes exist
    # because unrun ignored tests rotted unreported, and a red nobody reads
    # is the same silence one hop later. For each red leg of the lanes in
    # `needs` this opens a tracking issue, or comments on the open one so
    # repeats thread.
    #
    # Its own job, with the only write permission in this workflow: the
    # lanes above run the code of the ref they check out, and no job that
    # does that holds a token that can write. This job checks out nothing.
    #
    # Scheduled runs report. A dispatched run reports only when asked
    # (`report`): the person who dispatched it is reading it.
    #
    # It runs on every such run not cancelled as a whole, red or green: a
    # leg past its `timeout-minutes` ends `cancelled`, not `failure`, and is
    # red (scripts/ci/nightly_red.py names it a timeout). On `failure()`
    # alone, 2026-11-21's economics-sim-ignored legs, cut at 180 minutes on
    # both branches, opened no issue. A run a newer one superseded reports
    # nothing. nightly_red.py --check holds `needs` and this condition.
    needs: [plan, proptest-exhaustive, store-ignored, economics-sim-ignored, staking-sim-ignored, chain-ingest-ignored, hasher-ignored, wire-ignored, trybuild-ignored, bench-full, bench-full-drift, producer-gate]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10  # p90 0.1 min over 22 runs; the floor
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # The classifier and this file, at the run's own commit: merged code,
      # so the job that can write runs nothing a review has not passed.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/nightly_red.py
            scripts/ci/check_workflows_parse.py
            .github/workflows/nightly.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: the red legs, a timeout among them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/nightly_red.py --run "${{ github.run_id }}" \
            --workflow .github/workflows/nightly.yml > "$RUNNER_TEMP/red.json"
          cat "$RUNNER_TEMP/red.json"
      - uses: actions/github-script@v8
        env:
          RED: ${{ runner.temp }}/red.json
        with:
          script: |
            const lanes = {
              'plan': {
                title: 'nightly planner RED',
                lines: [
                  'The `plan` job (`nightly_skip.py --plan`) failed. Every planned job ran its full fallback matrix, `main` and `dev`, so no leg was skipped tonight; a dispatched run with `ref` ran `main` and `dev` in place of that ref.',
                  'The run uploaded no keys, so the next scheduled run relies on none of tonight\'s passes. The job\'s log names the step that failed.',
                ],
              },
              'proptest-exhaustive': {
                title: 'nightly proptest-exhaustive RED',
                lines: [
                  'The `proptest-exhaustive` job failed. It runs `shekyl-crypto-pq`\'s `prop_round_trip` at 200 000 cases, the timing engine\'s model (`model::random_ops_match_a_scanned_reference`) and the hasher core\'s model at 8 192 cases each, in release.',
                  'A failure names its shrunk case in the log: keep it as a regression case beside the property before fixing the code.',
                ],
              },
              'chain-ingest-ignored': {
                title: 'nightly chain-ingest ignored set RED',
                lines: [
                  'The `chain-ingest-ignored` job (shekyl-chain-ingest `--ignored`: the real-proof scenarios, the miner, the captured-chain replay and the measurements) failed.',
                  'If the job stopped before running anything, the crate\'s ignored set and the lane\'s list disagree (the error names each test): a new `#[ignore]` is added to `scripts/ci/ignored_set_chain_ingest.sh` or stops being ignored; a listed test that was renamed, deleted or un-ignored is corrected there.',
                ],
              },
              'hasher-ignored': {
                title: 'nightly hasher ignored set RED',
                lines: [
                  'The `hasher-ignored` job (shekyl-hasher `--ignored`: the core\'s property test driven through the real shell, with threads and real RandomX derives) failed.',
                  'A hang or a timeout is a lost wake-up or a deadlock between the hasher\'s lock and the budget; a strong-count assertion at a free is a lease that kept its cache past its return; more than three places seen is the cap broken in the shell, not the core.',
                  'If the job stopped before running anything, the crate\'s ignored set and the lane\'s list disagree (the error names each test): decide in `scripts/ci/ignored_set_hasher.sh`.',
                ],
              },
              'store-ignored': {
                title: 'nightly chain-store ignored set RED',
                lines: [
                  'The `store-ignored` job (shekyl-chain-store `--ignored`: the real-spend shard-boundary deletion test, the two benches and the RT-W10 coinbase harness) failed.',
                  'Either an ignored test no longer builds a chain its constants admit, or the boundary test\'s deletions disagree with the calendar.',
                ],
              },
              'producer-gate': {
                title: 'nightly bundle producer gate RED',
                lines: [
                  'The `producer-gate` job failed. It runs `bundle_producer_gate_tests::a_produced_bundle_is_admitted_and_connects` and its support-stream twin `a_produced_support_bundle_is_admitted_and_connects` in `shekyl-chain-ingest` (SO-D12 increments 4c and 4b item 3): a produced bundle admitted by the queue and by the bundle verifier, and connected, on a driven chain.',
                  'If the job stopped before running anything, the test was renamed or un-ignored: point `scripts/ci/producer_gate.sh` at it.',
                ],
              },
              'wire-ignored': {
                title: 'nightly wire ignored tests RED',
                lines: [
                  'The `wire-ignored` job failed. It runs two `#[ignore]`d tests of `shekyl-wire`: `rt_w10_listed_tx_parse` (the RT-W10 harness, with `RT_W10_OUT` unset) and `the_input_caps_cost_is_measured_not_inherited` (BA-I30).',
                  'If the job stopped before running anything, the crate\'s ignored set changed: decide in `scripts/ci/ignored_set_wire.sh` whether the new test is run or is a helper.',
                ],
              },
              'staking-sim-ignored': {
                title: 'nightly staking-sim ignored tests RED',
                lines: [
                  'The `staking-sim-ignored` job failed. It runs two `#[ignore]`d tests of `shekyl-staking-sim`: `l11_l13_five_seed_pins` (the registered plateau arm, the EUP-3 check half\'s falsifier) and `l11_l13_five_seed_production_pins` (the production arm).',
                  'A pin that moved is a sim change: predict it in `docs/design/STAKER_ARCHIVAL_SIM.md`, then re-pin; otherwise the sim drifted from its record.',
                  'If the job stopped before running anything, the crate\'s ignored set changed: decide in `scripts/ci/ignored_set_staking_sim.sh` whether the new test is run.',
                ],
              },
              'economics-sim-ignored': {
                title: 'nightly economics-sim ignored tests RED',
                lines: [
                  'A leg of the `economics-sim-ignored` job failed. Each leg runs one lane of `scripts/ci/ignored_set_economics_sim.sh` on one branch; the leg\'s name says which. The `pins` lane runs the `#[ignore]`d narration pins of `shekyl-economics-sim` (the `--stage2` pair, ESR-10\'s, EUP-4 prep 2\'s and the J x G grid\'s nightly scopes), the steady control\'s pins and the ESR-11 timing set; the `reader` lane runs `baseline::tests::every_declared_reader_moves_its_report` (a field a mode declares as read that does not move its report fails by name).',
                  'If a narration drifted and the sim change is intended: record it in `ECONOMICS_SIM_PRODUCTION_REBASE.md` and regenerate with the pin\'s `regen_*` helper under `SHEKYL_PINNED_REGEN_DECISION` citing that entry; otherwise the sim drifted from its record.',
                  'If a leg timed out, its log stamps each line with the UTC time: the tests with no `... ok` line were still running. Compare with the measurements in nightly.yml\'s economics-sim-ignored comment before raising the budget.',
                  'If a leg stopped before running anything, the crate\'s ignored set changed (decide in `scripts/ci/ignored_set_economics_sim.sh` whether the new test is run, is a regeneration helper or runs on demand), or the branch names a lane its script lacks.',
                ],
              },
              'trybuild-ignored': {
                title: 'nightly trybuild ignored tests RED',
                lines: [
                  'The `trybuild-ignored` job failed. It runs the four `#[ignore]`d trybuild tests of `shekyl-chain-rules`, `shekyl-mempool` and `shekyl-crypto-pq`: programs compiled as a downstream crate whose whole stderr must match a snapshot (the brand gate on `validate`, the pool verdict that cannot connect and the pool internals that are not public, the output field that cannot be built unencrypted).',
                  'A mismatch is read as the harness\'s doc comment says: an E0046 means a stub fell behind a trait, fix the stub; a reworded diagnostic after a toolchain bump is regenerated with `TRYBUILD=overwrite` after reading it; a different error at the guarded call, or none, is a finding against the crate, not a snapshot to refresh.',
                  'If the job stopped before running anything, a trybuild target\'s ignored set changed: decide in `scripts/ci/ignored_set_trybuild.sh` whether the new test is run here.',
                ],
              },
              'bench-full': {
                title: 'nightly full-block bench capture RED',
                lines: [
                  'The `bench-full` job failed. It captures the block path\'s instruction counts on blocks at the weight limit (`shekyl-chain-ingest` `benches/block_path_full_iai.rs`, the nightly set of `scripts/bench/capture_rust_baseline.sh`).',
                  'A panic in a bench\'s setup is a stale fixture: a consensus change refused a committed block. `every_block_path_fixture_replays` fails on the same change in the default lane; rewrite the fixtures with `regenerate_block_path_fixtures`.',
                ],
              },
              'bench-full-drift': {
                title: 'nightly full-block bench DRIFT',
                lines: [
                  'The `bench-full-drift` job failed: a full-block row moved past its fail threshold against the capture before this one, or a row is gone (`scripts/bench/nightly_drift.sh`; the job log lists every row with its change).',
                  'Find the merge that moved it among the commits between the two revisions the log names. A move that was intended needs no fix here: the next night compares with this one. A move nobody intended is a regression in the block path at full weight that the four-transaction rows of the per-PR capture did not show.',
                ],
              },
            };
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const legs = JSON.parse(fs.readFileSync(process.env.RED, 'utf8'));
            if (legs.length === 0) {
              core.notice('No red leg in this run.');
              return;
            }
            // A leg is routed by its job's id (nightly_red.py's `key`), never
            // by parsing its name: a job with no matrix, `plan` among them,
            // has no values in its name. A matrix leg's values follow the id
            // in its name, `<job> (<values>)`, and are read as data; nothing
            // here evaluates them. A red leg of a job this table does not
            // name fails this job by name: it would otherwise reach no one
            // (nightly_red.py --check holds the table to `needs`).
            const red = [];
            for (const leg of legs) {
              if (!lanes[leg.key]) {
                core.setFailed(`report-red has no lane for the red leg "${leg.name}": add it to the table`);
                continue;
              }
              const prefix = `${leg.key} (`;
              const values = leg.name.startsWith(prefix) && leg.name.endsWith(')')
                ? leg.name.slice(prefix.length, -1)
                : '';
              red.push([leg, leg.key, values]);
            }
            // Exact-title match over open issues, not text search: the search
            // API's in:title is a substring match and lags on freshly created
            // issues, which would fork the thread on back-to-back nightly reds.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const [leg, lane, values] of red) {
              const title = values ? `${lanes[lane].title} (${values})` : lanes[lane].title;
              // A timeout is named as one, so nobody reads it as a test
              // failure; the lane's own lines are for a leg that failed.
              const what = {
                'failed': lanes[lane].lines,
                'timed out': [`The leg timed out after ${leg.minutes} minutes, its \`timeout-minutes\`. This is not a test failure: the leg ran out of time. Read the log for the test it was in when it was cut.`],
                'cancelled': [`The leg was cancelled after ${leg.minutes} minutes, short of its ${leg.limit}-minute limit: not a timeout, and not a test failure. Read the log for what stopped it.`],
              }[leg.kind];
              const body = [
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                `Leg: [${leg.name}](${leg.url}): ${leg.kind}`,
                ...what,
              ].join('\n');
              const existing = open.find((i) => !i.pull_request && i.title === title);
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            }
