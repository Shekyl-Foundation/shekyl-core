            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            // A leg is named `<job> (<branch>)`. The branch is read from the
            // name as data; nothing here evaluates it.
            const red = jobs
              .filter((job) => job.conclusion === 'failure')
              .map((job) => /^(\S+) \((.+)\)$/.exec(job.name))
              .filter((m) => m && lanes[m[1]]);
            if (red.length === 0) {
              core.setFailed('report-red ran and found no red leg of a lane it reports: a job was renamed, or the run failed somewhere this job does not read.');
              return;
            }
            // Exact-title match over open issues, not text search: the search
            // API's in:title is a substring match and lags on freshly created
            // issues, which would fork the thread on back-to-back nightly reds.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const [, lane, leg] of red) {
              const [branch, target] = lanes[lane].perTarget ? leg.split(', ') : [leg, null];
              const title = `${lanes[lane].title} (${leg})`;
              const crash = [];
              if (lanes[lane].crashArtifact) {
                const name = `fuzz-crash-${lane}-${branch.replace(/\//g, '_')}-${target.replace(/\//g, '_')}`;
                const found = artifacts.find((a) => a.name === name);
                crash.push(found
                  ? `Crash input: [${name}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${found.id})`
                  : 'Crash input: none uploaded (the leg was red without a crash).');
              }
              const body = [
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                `Branch: ${branch}`,
                ...(target ? [`${lanes[lane].perTarget}: ${target}`] : []),
                ...crash,
                ...lanes[lane].lines,
              ].join('\n');
              const existing = open.find((i) => !i.pull_request && i.title === title);
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            }
