#
# The `merge-ready` commit status: the owning lane's "done", enforced
# (ruled 2026-11-19; scripts/ci/merge_ready.py has the whole contract). It
# is a signal to the merger, not a second test run (ruled 2026-11-23).
#
# The owning lane applies the `merge-ready` label when review and validation
# are complete: every check on the current head has concluded (not only the
# required ones), its fleet and local runs for that head are done, and its
# review threads are resolved. This workflow keeps the `merge-ready` status,
# the required check, true to it. Without the label the status is pending
# (`waiting`), never red and never skipped. A push takes the label off with
# a comment, so a label never vouches for a head it did not see. The label
# going on is checked against every check run and status on the head; all
# concluded green with no open review thread: `ready`. A check still running
# or red, an open review thread or a draft takes it off again, with a comment
# naming each. So does a head that does not merge with the newest `dev`, or
# whose fuzz lockfiles disagree with the workspace lock there: a few seconds,
# files only, no test. A merge into `dev` changes nothing here.
#
# The status, not a job, is the required check: a skipped job counts as a
# pass to protection (06-branching.mdc), and a head with no status at all is
# blocked as "expected". Every head gets one from its own `opened`,
# `reopened` or `synchronize` run, which no condition skips; a label or an
# unlabel of another label runs nothing and leaves the status as it is, so
# it does not cancel a label check in progress.
# `pull_request`, not `pull_request_target`: the latter takes its workflow
# from the default branch, which is `main`. A fork's run holds no write
# token and posts nothing, so a fork's pull request stays blocked; this
# repository has none.
#
# Runs per event: seconds (API calls), up to SETTLE_SECONDS more when the
# labelling itself started a check.

name: ci/merge-ready

on:
  # Every event that changes the head, the draft state or the labels. No
  # base filter (scripts/ci/check_pr_event_triggers.py).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Not named `merge-ready`: a ruleset's required check matches a check run
  # and a commit status by name alike, and this job always ends green.
  label-check:
    name: merge-ready label check
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'merge-ready'
    # The newest event decides: an older label check of the same pull
    # request is cancelled.
    concurrency:
      group: merge-ready-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # The Foundation's gate runner, not a hosted one: on the hosted pool
    # this seconds-long check queued 15 to 60 minutes behind the Rust jobs,
    # and the label waited with it. It takes one job per throwaway
    # container, with no route to the Foundation's own network; a fork's
    # run waits for a maintainer's approval first. While it is down the
    # job queues and nothing turns the status green.
    runs-on: [self-hosted, shekyl-gate]
    timeout-minutes: 5  # API calls, and at most SETTLE_SECONDS of waiting
    permissions:
      # actions: the head's workflow runs, so a pull_request run a newer
      # pull_request run of the same workflow replaced on this head is not
      # judged (merge_ready.py superseded_suites, SUPERSEDING_EVENTS), and
      # a review bot's run is known by its path
      # (review_job_suites; its review is read with pull-requests).
      actions: read
      # checks: the head's check runs, and the annotation that says a newer
      # run of a concurrency group replaced one (replaced_cancels).
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # The scripts alone, from the base branch as it is now: never the
      # pull request's own copy, so a pull request cannot change its judge,
      # and never the event's merge commit, which GitHub may not have
      # refreshed since the base moved (#1489 was judged by a script two
      # merges old). The workflow file itself is still the merge's.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: |
            scripts/ci/merge_ready.py
            scripts/ci/check_fuzz_inventory.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          # The label event's time: a check that was already running then
          # refuses the label at once, without the settle wait.
          LABELLED_AT: ${{ github.event.pull_request.updated_at }}
          # The fuzz inventory on the head merged with this base's newest
          # commit, once the label's other checks hold.
          BASE: ${{ github.base_ref }}
          FUZZ_INVENTORY: "true"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/merge_ready.py run
