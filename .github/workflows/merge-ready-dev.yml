#
# A merge to `dev` re-tests the labelled pull requests it reaches (ruled
# 2026-11-19; scripts/ci/merge_ready.py has the status).
#
# Two pull requests each re-tested against the same `dev` at their labels,
# then merged back to back, were never tested together (#1425 and #1426).
# So on each push to `dev`:
#   merges   (seconds) scripts/ci/merge_ready_overlap.py --plan reads every
#            open pull request carrying the `merge-ready` label whose label
#            passed its check, and judges each against the push: the tests
#            both reach. Each one reached goes back to pending,
#            `re-testing` naming the merge; the rest are untouched, with no
#            run. A pull request without the label is never touched.
#   re-test  merge-ready-retest.yml, one per pull request reached: the head
#            merged with the newest `dev`, on the tests it shares with
#            everything merged since it was last ready. `ready`, or `red`
#            with the label taken off and the failing tests named.
#
# Each push gets its own run, ungrouped (scripts/ci/check_dev_push_runs_finish.py):
# a replaced run would leave its merge unjudged, and the merges job is
# seconds. One re-test per pull request runs at a time, the newest
# (merge-ready-retest.yml's group); it covers what the one it cancelled
# would have.

name: ci/merge-ready-dev

on:
  push:
    # DEMO BASE ONLY: the scratch base stands in for dev.
    branches: [dev, ci-scratch/merge-ready-demo-base]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merges:
    name: which labelled pull requests the merge reaches
    runs-on: ubuntu-latest
    timeout-minutes: 10  # API calls, one fetch, one dependency graph read
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/merge_ready_overlap.py --plan --base "$BASE" --before "$BEFORE"

  retest:
    # Named by the pull request: the report finds its re-test job as
    # `#<pr> / re-test`.
    name: '#${{ matrix.pr }}'
    needs: merges
    if: needs.merges.outputs.legs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.merges.outputs.legs) }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/merge-ready-retest.yml
    with:
      pr: ${{ matrix.pr }}
      head: ${{ matrix.head }}
      base: ${{ github.ref_name }}
      dev: ${{ github.sha }}
      since: ${{ matrix.since }}
      merged: ${{ matrix.merged }}
