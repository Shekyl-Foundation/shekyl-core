name: ci/gh-actions/depends-aarch64-kats

# ARM v8 qemu KATs for the four cross-arch-deterministic primitives
# (reward-arithmetic, standoff integer golden vector, archival_p derive,
# the FN-DSA hybrid signature).
# Extracted from depends.yml so a wallet-only PR does not stand up the
# six-target `make depends` matrix (~124 billed minutes) to run these.
#
# The full cross-compile matrix is `.github/workflows/depends.yml`
# (contrib/depends path-filtered on PR; nightly otherwise).

on:
  # Merge queue (06-branching.mdc): the same checks on the *merge result*,
  # not only the branch head — the class of failure neither PR's CI can
  # see (#771×#772, #853×#858, #878×#880). `merge_group` takes no `paths`
  # filter, so this runs on every group regardless of the PR filter above
  # or below.
  merge_group:
    types: [checks_requested]
    branches: [dev]
  pull_request:
    paths:
      - 'rust/shekyl-archival-retention/**'
      - 'rust/shekyl-standoff/**'
      - 'rust/shekyl-crypto-pq/**'
      # Scheme 3's preimage is `cshake256_64` from this crate
      # (`hybrid_combiner::preimage`). A change here moves the signed bytes
      # on every architecture; the aarch64 KAT is the pin that they match.
      - 'rust/shekyl-crypto-hash/**'
      - 'rust/Cargo.lock'
      # The FN-DSA fixture the crypto-pq KAT reads lives outside the crate.
      - 'docs/test_vectors/FN_DSA_HYBRID_V1_KAT.json'
      - '.github/workflows/depends-aarch64-kats.yml'
  workflow_dispatch:

concurrency:
  group: depends-aarch64-kats-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF

jobs:
  aarch64-kats:
    name: "ARM v8 qemu KATs"
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
    - name: set apt conf
      run: ${{env.APT_SET_CONF}}
    - name: install dependencies
      run: apt update; apt -y install build-essential cmake pkg-config python3 g++-aarch64-linux-gnu qemu-user-static git curl ca-certificates
    - name: configure git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive
    - name: install Rust
      uses: ./.github/actions/install-rust
      with:
        components: ''
    - name: add Rust cross target
      run: rustup target add aarch64-unknown-linux-gnu
    - name: archival KAT tests run under aarch64 (qemu-user)
      run: |
        . "$HOME/.cargo/env"
        cd rust
        # Execute the cross-compiled tests under qemu so the reward-arithmetic
        # determinism golden vectors are verified bit-identical on aarch64, not
        # just compiled (REWARD_EMISSION_VIN_PLAN.md §9, M-1 half (b)).
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64-static
        export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
        cargo test --locked -p shekyl-archival-retention \
          --target aarch64-unknown-linux-gnu
        # `shekyl-standoff` default features only: the integer funding-seam
        # standoff golden vector (`tests/golden_vector.rs`) is the cross-arch
        # bit-identical guarantee (ARCHIVAL_FIREWALL_GATE6.md §10.12). The
        # `conformance` float goodness-of-fit probes are deliberately NOT built
        # here — float is not bit-identical across arches (the same reason
        # reward-arithmetic is pure-integer), so they stay x86-only and the
        # lane's guarantee is scoped to the integer (spread, bond_first)
        # sequence.
        cargo test --locked -p shekyl-standoff \
          --target aarch64-unknown-linux-gnu
        # `archival_p` is the third cross-arch-deterministic primitive (after
        # reward-arithmetic and the standoff draw). A divergent bit on aarch64
        # means an ARM-phone user cannot recover their own bond, so the
        # ARCHIVAL_P_DERIVE_V1 KAT (+ corpus freeze self-check) must run under
        # qemu, not just compile. Scoped to the KAT binary so the slow
        # ML-KEM/ML-DSA keygen path runs only for the pinned vectors; the
        # p_canonical_id cross-check is exercised via the
        # shekyl-archival-retention run above (it depends on archival_p).
        cargo test --locked -p shekyl-crypto-pq \
          --target aarch64-unknown-linux-gnu \
          --test kat_archival_p_derive_v1
        # The FN-DSA hybrid (scheme 3) is the fourth. Its key generation and
        # verification are integer-only and must agree across architectures;
        # its signing uses hardware f64, and a deterministic Falcon signer
        # that rounds differently on two machines can emit two signatures
        # over one hashed point. The same fixture the x86_64 workspace test
        # reads is reproduced here byte for byte, signing included. qemu's
        # floating point is a software IEEE-754 model: this shows the aarch64
        # code path computes the same values, not what a physical core does
        # (docs/design/FN_DSA_HYBRID.md §3).
        cargo test --locked -p shekyl-crypto-pq \
          --target aarch64-unknown-linux-gnu \
          --test kat_fn_dsa_hybrid_v1
