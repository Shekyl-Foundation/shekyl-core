# Scratch probe for #1414 on #1415 (closed unmerged): does a job skipped by
# its `if` report under its evaluated `name`?
name: zz-draft-name-probe
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  gate:
    name: probe gate
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  skip-by-if:
    name: ${{ github.event.pull_request.draft && 'Probe A (draft - not run)' || 'Probe A' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  skip-by-needs:
    name: ${{ github.event.pull_request.draft && 'Probe B (draft - not run)' || 'Probe B' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  skip-by-if-after-needs:
    name: ${{ github.event.pull_request.draft && 'Probe C (draft - not run)' || 'Probe C' }}
    needs: gate
    if: ${{ always() && !github.event.pull_request.draft && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  scope:
    name: probe scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      work: ${{ steps.w.outputs.work }}
    steps:
      - id: w
        run: echo "work=none" >> "$GITHUB_OUTPUT"
  runs-reading-needs:
    name: ${{ needs.scope.outputs.work == 'none' && 'Probe D' || 'Probe D (not none)' }}
    needs: scope
    if: needs.scope.outputs.work == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  runs-plain-expression:
    name: ${{ 'Probe E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
  skipped-reading-needs:
    name: ${{ 'Probe F' }}
    needs: scope
    if: needs.scope.outputs.work == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
