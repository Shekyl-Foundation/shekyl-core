# Phase 2g RandomX v2 differential-harness CI gates.
#
# Per `docs/design/RANDOMX_V2_PHASE2G_PLAN.md` §5.5.1-§5.5.3 + §5.5.6
# + §6.6/§6.7.5 + §6.8 cadence:
#
# * Per-PR + push (dev/main) + workflow_dispatch + every scheduled cron:
#   `structural-validate` — builds the C reference's `librandomx.a` via
#   the submodule's own CMakeLists, then runs the Rust workspace's
#   structural gates against the differential harness crate
#   (`cargo fmt --check`, `cargo clippy -D warnings`, `cargo test`).
#   Covers T9, T10, T11, T13, T14, T15, T17 (per §6 test plan) plus
#   the merge-blocking runtime mode, wired by the test-regime
#   hardening runtime-mode change: `--mode=correctness` (three-leg
#   rust == C == canonical) per-PR at per-PR sizing and full-size on
#   the daily cron. The modes' original deferral condition — the V3.0
#   `compute_hash` divergence — closed via PR #79 (989610cac), but per
#   §6.8 the cadence was never re-wired until the test-regime audit
#   flagged the gap (armed-gate instance four: a real gate no
#   automation ran). T6 lives in randomx-v2-adversarial-ratio.yml.
#
# * Daily cron + opt-in dispatch (`runtime_modes` input):
#   `runtime-modes` — the §6.8 nightly-cadence runtime gates in a job
#   of their own, on BOTH active branches (main + dev matrix, house
#   pattern: nightly.yml): `--mode=concurrent` (T7 concurrent
#   byte-equality + T8 RSS ceiling) and `--mode=latency` (T5, ≤3.0×
#   in-mode gate). Isolated from structural-validate so the disclosed
#   likeliest-to-red T5 tripwire (green at 1.817× on the committed
#   runner class, 2026-07-04; see the latency step) cannot abort the
#   merge-blocking gates, and opt-in on dispatch so a parity-recovery
#   dispatch can still produce a green run while the T5 budget
#   question is open.
#
# * Weekly cron (`0 6 * * 1`): `cargo-mutants` per §5.5.6 + §4.6 M2.
#   Mutation-tests the harness + verifier under the §1.4 sole-consumer
#   discipline. Skip-list discipline lives in `.cargo/mutants.toml`.
#
# * Daily cron / weekly full sweep / dispatch: `full-parity` — the
#   Phase 3a C-full-dataset vs Rust-light parity gate + post-link nm
#   symbol isolation (test-regime hardening PR-1; see the job comment).
#
# * Per-PR + push + daily cron + dispatch: `native-arm` — verifier +
#   T2 + all 1024 canonical pins + the three-leg `--mode=correctness`
#   (rust == arm-built C == canonical) on a native aarch64 runner
#   (test-regime hardening PR-2; first CI executions of the FPCR arch
#   surface and of the correctness mode).
#
# Path-filtered triggers per the R1-D12 close: per-PR job runs on
# every PR by default but is skipped for PRs that touch only `docs/`,
# `*.md`, or non-RandomX surfaces (positive `paths:` filter, which is
# the inversion of `build.yml`'s `paths-ignore:` filter pin per the
# §3.x R1-D12 path-filtered per-PR trigger discussion). The positive
# filter is justified here because the differential-harness scope is
# narrower than the workspace-wide CI (a positive filter is brittle
# *for the workspace-wide gate* per R1-D12; for the harness-scoped
# gate, the positive filter is the substrate-correct shape).
#
# Runner pin: `ubuntu-latest` per R1-D12 + F5 (4 vCPU / 16 GB RAM
# verified at Round 1 close; cron schedules staggered from existing
# `nightly.yml` 03:00 UTC + `codeql.yml` Monday 04:30 UTC to avoid
# resource collisions).
#
# Cron offset: `0 5 * * *` for daily structural-validate runs;
# `0 6 * * 1` for the weekly cargo-mutants run.

name: randomx-v2-differential

on:
  push:
    # dev/main only: PR branches are covered by the pull_request event.
    # An unrestricted push trigger double-runs on PR pushes, and fires
    # spuriously on merge-from-dev pushes (the push diff is computed
    # against the previous branch tip, so it matches paths the PR never
    # touched).
    branches: [dev, main]
    paths:
      - 'rust/shekyl-randomx-differential/**'
      - 'rust/randomx-v2-sys/**'
      - 'rust/shekyl-pow-randomx/**'
      - 'external/randomx-v2/**'
      - 'external/CMakeLists.txt'
      - 'scripts/ci/check_randomx_crate_invariants.sh'
      - '.github/actions/install-rust/**'
      - '.github/actions/build-randomx-v2-ref/**'
      - '.github/workflows/randomx-v2-differential.yml'
      - '.github/workflows/randomx-v2-adversarial-ratio.yml'
      - '.cargo/mutants.toml'
  pull_request:
    paths:
      - 'rust/shekyl-randomx-differential/**'
      - 'rust/randomx-v2-sys/**'
      - 'rust/shekyl-pow-randomx/**'
      - 'external/randomx-v2/**'
      - 'external/CMakeLists.txt'
      - 'scripts/ci/check_randomx_crate_invariants.sh'
      - '.github/actions/install-rust/**'
      - '.github/actions/build-randomx-v2-ref/**'
      - '.github/workflows/randomx-v2-differential.yml'
      - '.github/workflows/randomx-v2-adversarial-ratio.yml'
      - '.cargo/mutants.toml'
  schedule:
    # Daily structural-validate at 05:00 UTC. Staggered from existing
    # `nightly.yml` (03:00 UTC) + `shekyl-oxide-divergence.yml`
    # (Mon 04:00 UTC) + `codeql.yml` (Mon 04:30 UTC).
    - cron: "0 5 * * *"
    # Weekly `cargo-mutants` on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      parity_scope:
        description: >-
          Parity-sweep scope for the full-parity job: "daily" runs the
          19-dataset subset; "full" runs the whole 1024-pin sweep. The
          manual "full" option exists so a dropped/failed Monday cron can
          be re-run on demand — without it the full sweep's only trigger
          is a schedule GitHub may delay or skip.
        type: choice
        options:
          - daily
          - full
        default: daily
      run_mutants:
        description: >-
          Also run the weekly cargo-mutants job (T18) on this dispatch.
          Off by default: until the re-scope lands, that job exceeds
          the 6-hour hosted-runner ceiling and is guaranteed to red, so
          an unrelated dispatch must not spend a runner on it (MR-F6).
        type: boolean
        default: false
      checkout_ref:
        description: >-
          Git ref the matrix lanes check out, instead of the matrix
          branch. Exists so a lane can be REHEARSED on a feature branch
          before it first runs unattended: the matrix jobs otherwise
          hardcode `ref: <matrix.branch>`, so dispatching against a
          feature branch runs that branch's workflow file but checks
          out main/dev — which do not contain the code under test, so
          the run reds for a reason unrelated to the wiring. Leave
          empty for normal operation. No T-A11 exposure: any dispatch
          is `operator-supplied` by construction and can never be cited
          as coverage.
        type: string
        default: ''
      rotation_index:
        description: >-
          Replay a specific rotating-lane index. Leave empty for a
          normal run (the scheduled lane derives its own index from
          the date). A value here is a REPLAY of an already-explored
          index, and the harness banner labels it `operator-supplied`
          so a green replay cannot be cited as a green sweep (§4.5
          T-A11). The corresponding input set is reconstructable by
          anyone from the integer alone, so the choice is auditable
          rather than trusted.
        type: string
        default: ''
      runtime_modes:
        description: >-
          Also run the runtime-modes job (T5 latency + T7/T8
          concurrent) on this dispatch. Off by default so a
          parity-recovery dispatch (parity_scope=full) stays scoped to
          the parity gate and doesn't spend a runtime-modes runner.
          Turn on to measure the committed-runner-class T5 number on
          demand (recorded baseline: 1.817×, 2026-07-04 — see
          LATENCY_RATIO_BUDGET in mode_latency.rs).
        type: boolean
        default: false

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
#
# Schedule and manual-dispatch runs are keyed on `github.run_id` (i.e.
# never share a group): schedule events fire ONLY on the default branch
# (`refs/heads/main` — verify with `git ls-remote --symref origin HEAD`),
# so a scheduled run's `github.ref` is the SAME ref a push-to-main run
# uses, and a plain ref-keyed group would let a main push land mid-cron
# and CANCEL the multi-hour parity / mutants run; a second
# `workflow_dispatch` would likewise cancel a running one. A canceled
# run never fires the alarm a failed run would; that is the
# armed-gate-with-no-trigger failure mode reborn as a race.
concurrency:
  group: randomx-v2-differential-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  # `external/randomx-v2/` is configured as a self-contained CMake
  # project per its own `CMakeLists.txt`; the install prefix is
  # `<workspace>/build-randomx-v2/install`. The parent project's
  # `external/CMakeLists.txt` `ExternalProject_Add` wrapper is the
  # production CMake wiring (per §5.4); the CI workflow takes a
  # narrower path because the workspace-CMake configure step requires
  # Boost + OpenSSL + ~ a dozen other C++ dependencies that the
  # harness build itself does not need.
  RANDOMX_V2_BUILD_DIR: ${{ github.workspace }}/build-randomx-v2
  RANDOMX_V2_INSTALL_DIR: ${{ github.workspace }}/build-randomx-v2/install

jobs:
  structural-validate:
    # Per-PR + push + workflow_dispatch + daily cron. Always runs (no
    # `if:` filter) because the structural gates are merge-blocking
    # and cadence-independent. The mutants job's `if:` filter
    # (below) keeps the weekly mutation run from triggering this
    # job's full setup twice on Monday at 06:00 UTC.
    name: 'structural: build + cargo test (T9-T15, T17) + 3-leg correctness'
    runs-on: ubuntu-latest
    # 120 sized for the cron path (the heaviest: debug suite + T2 +
    # full-size 32×32 serial three-leg correctness; the arm lane prices
    # its release-only subset at ~75+ min on 4 vCPU). The 10–20 min T5
    # latency mode lives in the parallel runtime-modes job and the pins
    # step is skipped on the cron, so this fits with margin — measure
    # the first crons before tightening.
    timeout-minutes: 120
    if: github.event_name != 'schedule' || github.event.schedule == '0 5 * * *'
    env:
      # Runtime-mode sizing: per-PR/push/dispatch events run the R1-D4
      # §F2 per-PR subset (16×8 = 128 pairs); the daily 05:00 cron (the
      # only schedule that reaches this job, per the `if:` above) runs
      # full nightly sizing (32×32 = 1024). Same fail-safe shape as
      # full-parity's label selector.
      CORRECTNESS_SEEDHASHES: ${{ github.event_name == 'schedule' && '32' || '16' }}
      CORRECTNESS_DATA_PER_SEEDHASH: ${{ github.event_name == 'schedule' && '32' || '8' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust): reproducible,
        # third-party-action-free install of the channel pinned by
        # rust/rust-toolchain.toml, download-then-run form. This file's
        # inline copies were already hardened on PR #236; the composite
        # consolidates that one proven recipe so future edits (toolchain
        # bumps, flag changes) happen once. The runtime-mode change
        # completed the repo-wide sweep: zero inline rustup installs
        # remain — every workflow uses this composite (cross-target
        # sites add a separate `rustup target add` step, the
        # depends.yml pattern).
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        # `ubuntu-latest` images carry CMake by default, but we pin
        # Ninja explicitly because the submodule's CMakeLists builds
        # ~50 translation units and Ninja's parallelism is materially
        # faster than the default Makefile generator on the 4-vCPU
        # runner. Cost: a few seconds of `apt install`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        # Composite action (.github/actions/build-randomx-v2-ref): one
        # recipe for every lane — the rationale (out-of-band submodule
        # build, T15 fork-pin binding) lives in the action.
        uses: ./.github/actions/build-randomx-v2-ref
      - name: cargo fmt --check (harness + sys)
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings (harness + sys)
        working-directory: rust
        # Targeted at the two new crates. The workspace-wide clippy
        # gate runs in `rust-audit-test.yml`'s `rust-audit-and-test` job; this
        # narrower invocation re-runs clippy against the harness in
        # the substrate-correct environment (with
        # `RANDOMX_V2_INSTALL_DIR` set, so `gen_canonical_outputs`
        # and the harness binary link successfully under clippy's
        # `cargo check` phase).
        run: |
          cargo clippy --locked -p shekyl-randomx-differential -p randomx-v2-sys --all-targets -- -D warnings
      - name: cargo test (harness lib + integration)
        working-directory: rust
        # Covers T9 (corpus-determinism), T10 (adversarial pin),
        # T11 (failure_output schema), T13 (crate-invariant script),
        # T14 (sole consumer), T15 (fork-pin SHA), T17 (invocation
        # banner). The §6.7.5/§6.8 runtime-mode deferral is CLOSED:
        # the amendment it anticipated is `--mode=correctness` per-PR
        # + cron below, `--mode=latency` (T5) + `--mode=concurrent`
        # (T7/T8) in the runtime-modes job, and T6 in
        # randomx-v2-adversarial-ratio.yml (weekly).
        #
        # T2 (`adversarial_corpus_byte_equality`) was originally
        # `#[ignore]`-gated behind the V3.0 verifier-divergence
        # FOLLOWUP (closed on `dev` by PR #79, 989610cac, 2026-05-26)
        # so the default debug-mode `cargo test` invocation below
        # skipped it. PR #78's post-rebase commit (`c71ce2413`)
        # extended PR #79's `RANDOMX_FLAG_V2` fix to
        # `COracleSession::from_raw_for_testing` and lifted T2's
        # `#[ignore]` attribute. T2 now runs as part of the dedicated
        # release-mode step below; the default step retains its
        # original scope (unit + invariant tests; T2 runs once,
        # release-mode, in the dedicated step to keep its observed
        # runtime aligned with R1-D6 close Reframe 2's
        # `T2_PER_PR_BUDGET_MS` budget — debug-mode RandomX is
        # multi-minute slow without JIT).
        # canonical_pins_full is likewise skipped here and run in its
        # own release-mode step below: 1024 interpreted light hashes
        # are minutes in release and hours in debug. The skip string is
        # the shared PREFIX of the test fn and the --test target name,
        # so a rename that breaks the pairing shows up on both sides.
        run: |
          cargo test --locked -p shekyl-randomx-differential -p randomx-v2-sys \
            -- --skip t2_adversarial_corpus_byte_equality \
               --skip canonical_pins_full
      - name: cargo test --release T2 adversarial_corpus_byte_equality
        working-directory: rust
        # Per-PR release-mode T2 invocation (post-PR-#79 FOLLOWUP
        # closure + PR #78 post-rebase `c71ce2413` operational close).
        # Runs T2 against the Phase 2h C4 starter corpus (~10 s
        # release-mode wall on `ubuntu-latest`-class hardware via the
        # PR #78 C7 base-cache amortization, fits R1-D6 close
        # Reframe 2's `T2_PER_PR_BUDGET_MS` budget). Per Phase 2h
        # R1-D7 sub-A close, T2 lands in this existing workflow (not
        # a new dedicated workflow), inheriting the
        # `randomx-v2-differential.yml` per-PR + push cadence.
        run: |
          cargo test --release --locked -p shekyl-randomx-differential \
            --test adversarial_corpus_byte_equality
      - name: cargo test --release canonical pins (rust leg, 1024 pins)
        # Skipped on the cron: at the cron's full 32×32 sizing the
        # correctness step below re-derives the identical
        # rust-vs-canonical leg over the same corpus (strict superset),
        # so running the pins here would pay the 32 cache derives +
        # 1024 hashes twice in one job. Per-PR it is NOT redundant —
        # per-PR correctness runs only the 16×8 subset.
        if: github.event_name != 'schedule'
        working-directory: rust
        # Full 1024-pin re-check of the Rust verifier against the
        # committed canonical table (rust-vs-canonical leg only; no C
        # oracle). Added with the native-aarch64 lane (test-regime
        # hardening PR-2) and run on x86_64 too so BOTH shipping arches
        # re-verify every pin per PR — before this step, the pin table's
        # only per-PR consumers were subset/shape tests. Release-mode
        # dedicated step per the T2 house pattern (~2-5 min; debug would
        # be hours). The three-leg runtime differential remains the
        # runtime-mode wiring change's scope.
        run: |
          cargo test --release --locked -p shekyl-randomx-differential \
            --test canonical_pins_full
      - name: three-leg correctness mode (rust == C == canonical)
        working-directory: rust
        # F1-HIGH fix (test-regime audit): the flagship three-leg
        # differential ran in NO workflow. The §6.8 deferral's blocking
        # condition (the V3.0 compute_hash divergence) closed via PR #79
        # and the 1024-pair three-leg was re-verified manually once —
        # but nothing re-wired the cadence the file header specified,
        # leaving the pin table's only automated consumer the weekly
        # mutants run. Merge-blocking per-PR at per-PR sizing; full
        # nightly sizing on the daily cron (sizing env above). The mode
        # enforces its own verdict (nonzero exit on any leg
        # disagreement). Its first CI-wired execution was the
        # native-arm lane (PR #239); this is the x86 cadence.
        run: |
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin shekyl-randomx-differential -- \
            --mode=correctness \
            --random-corpus-seedhashes="$CORRECTNESS_SEEDHASHES" \
            --random-corpus-data-per-seedhash="$CORRECTNESS_DATA_PER_SEEDHASH"
      - name: cargo test --features test-internals (verifier)
        working-directory: rust
        # Per §5.3.3 R5-D1: the verifier crate's
        # `cache_block_bytes_for_testing` accessor is gated behind
        # the `test-internals` feature and is exercised exclusively
        # by the differential harness. The structural gate runs
        # `cargo test --features test-internals` once to confirm
        # the feature-gated build compiles cleanly and the verifier
        # crate's own tests still pass under the feature (no
        # production code path branches on `test-internals`, per
        # §5.6 + R1-D10 (b) close).
        run: cargo test --locked -p shekyl-pow-randomx --features test-internals
      - name: extended crate-invariant script
        # Per §5.5.4 + R1-D13 + the C10 script extension: assert
        # the workspace-wide crate-isolation invariants extend to
        # `randomx-v2-sys` (Pattern C exempt — FFI shim) and
        # `shekyl-randomx-differential` (Pattern A + B + C
        # enforced; harness scope per §5.5.4 row).
        run: scripts/ci/check_randomx_crate_invariants.sh

  runtime-modes:
    # The §6.8 nightly-cadence runtime gates (T5 latency, T7/T8
    # concurrent) in a job of their own, per the post-wiring review
    # round:
    #
    # * Isolation: measurement gates live apart from the structural
    #   job so ANY latency red (T5 is green on the committed runner
    #   class — 1.817× recorded 2026-07-04 — but it is a tripwire and
    #   tripwires fire) cannot abort the merge-blocking gates ordered
    #   after it (test-internals, crate invariants).
    # * Cadence: daily 05:00 cron, plus dispatch ONLY when the
    #   `runtime_modes` input is set — a parity-recovery dispatch
    #   (parity_scope=full) must be able to produce a green run while
    #   the T5 budget question is open.
    # * Branch coverage: schedule events fire on the default branch
    #   (main) only, so without a matrix this cron would never measure
    #   dev, where verifier work lands first. Both active branches are
    #   checked out per the nightly.yml house pattern.
    #
    # Step-order pin: concurrent runs BEFORE latency — latency is the
    # likeliest-to-red step (it is the calibrated tripwire), and any
    # step ordered after it would be skipped on that red (the exact
    # masking this job exists to remove).
    name: 'cron: runtime modes — T7/T8 concurrent + T5 latency (${{ matrix.branch }})'
    runs-on: ubuntu-latest
    # Setup + release compile ≈ 15 min, concurrent ≈ 5–10 min, latency
    # ≈ 10–20 min; 90 leaves shared-runner margin — measure the first
    # crons before tightening.
    timeout-minutes: 90
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.runtime_modes)
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]
    steps:
      - uses: actions/checkout@v5
        with:
          # Same rehearsal override as the rotating lane: this job had
          # the identical limitation — a dispatch could not exercise a
          # change to it on the branch carrying that change, because
          # the ref is pinned to the matrix branch. Default unchanged,
          # so scheduled runs behave exactly as before.
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || matrix.branch }}
          submodules: recursive
      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust); see the
        # structural-validate job's step comment.
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        uses: ./.github/actions/build-randomx-v2-ref
      - name: concurrent mode (T7 byte-equality + T8 RSS ceiling)
        working-directory: rust
        # First CI wiring of `--mode=concurrent` (the last runtime mode
        # of the §6.7.5/§6.8 deferral, shipped in Phase 2g as
        # mode_concurrent.rs but wired into no workflow until this
        # job): 4+1 workers × 256 hashes each over the per-PR-size
        # random corpus against a capacity-2 CacheStore — T7 asserts
        # cross-worker determinism plus rust/C byte-equality, T8
        # asserts the (workers+1)×256 MiB + 128 MiB (×1.10) RSS
        # ceiling (R1-D9 F4 Round-3 amendment; the original 640 MiB
        # slot-only pin failed every daily cron 2026-07-08 →
        # 2026-08-08 at a flat ~1035 MiB drift plateau — see
        # rss_ceiling_bytes in mode_concurrent.rs) via /proc/self/statm
        # (Linux runner, so the T8 leg is live, not the cross-platform
        # no-op). The daemon verifies blocks on multiple threads: a
        # divergence here is a plausible REAL consensus finding —
        # halt and escalate per RANDOMX_V2_PHASE3_PLAN.md §7.3, do not
        # rerun-until-green.
        run: |
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin shekyl-randomx-differential -- --mode=concurrent
      - name: latency mode (T5 gate, rust/C ratio)
        working-directory: rust
        # The ≤3.0× LATENCY_RATIO_BUDGET gate, enforced in-mode over
        # interleaved same-process samples (the RATIO is immune to the
        # shared-runner noise that makes absolute wall-clock CI gates
        # flake-theater); rust/C hash equivalence is asserted before
        # timing. 1024 samples ≈ 10–20 min.
        #
        # RECORDED BASELINE (2026-07-04, first executions): committed
        # runner class 1.817× — the budget HOLDS with ~39% headroom;
        # the earlier "expected red" state came from dev-hardware
        # readings (~3.1×), which the drift-check showed are a
        # hardware artifact, not a regression. The canonical record +
        # triage policy live on `LATENCY_RATIO_BUDGET` in
        # rust/shekyl-randomx-differential/src/mode_latency.rs —
        # update THAT doc when the state changes, not a copy here. A
        # red HERE (the committed runner class) is a real tripwire
        # hit: never rerun-until-green, never a silent budget bump.
        run: |
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin shekyl-randomx-differential -- --mode=latency

  mutants:
    # Weekly cargo-mutants run per §5.5.6 + §4.6 M2 (Round-3
    # substrate-completeness amendment). Mutation testing is
    # nightly-only (not per-PR) per the F5 budget — `cargo mutants`
    # against the harness + verifier surfaces is multi-hour work; the
    # weekly cadence balances substrate signal against runner cost.
    #
    # Skip-list discipline lives in `.cargo/mutants.toml`
    # (`exclude_globs` for the tooling binaries + canonical-output
    # data file per §5.5.6 row). Each entry in the skip list is a
    # substrate-anchored carve-out; new skip-list entries require a
    # §5.5.6-row plan-doc amendment.
    #
    # RESTORED 2026-08: this job's header (name/runs-on/timeout/if +
    # checkout) was accidentally severed by 5736453c8's T5-step
    # simplification, which orphaned the job's remaining steps into
    # the tail of runtime-modes. The severed state (a) left T18 with
    # NO trigger — the Monday 06:00 cron ran no mutants job at all
    # (armed-gate instance five) — and (b) would have run multi-hour
    # mutation work inside runtime-modes' 90-minute timeout on every
    # daily cron had T8 not been failing first.
    name: 'weekly: cargo-mutants (T18)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # MR-F6: `&&` binds tighter than `||`, so the previous condition
    # parsed as `(schedule && monday) || dispatch` — EVERY dispatch,
    # including an unrelated parity-recovery or lane-rehearsal one,
    # spent a 6-hour runner on a run that is guaranteed to red until
    # the T18 re-scope lands. The job's only execution ever (run
    # 31346130482) was in fact a dispatch. Now gated on an explicit
    # boolean input, the same shape `runtime_modes` already uses, with
    # the schedule arm parenthesised so precedence is stated rather
    # than relied on.
    #
    # Fixed here rather than filed because it directly obstructs the
    # rehearsal mechanism this PR adds: dispatching to exercise the
    # rotating lane would otherwise launch this job too.
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.run_mutants)
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust); see the
        # structural-validate job's step comment.
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        uses: ./.github/actions/build-randomx-v2-ref
      - name: Install cargo-mutants
        # `cargo install --locked` is idempotent: on workflow re-run
        # the binary is already present in `~/.cargo/bin`. The
        # `--locked` flag pins against `cargo-mutants`' own
        # `Cargo.lock`; absent that pin a transitive dep can shift
        # the binary's behavior between runs.
        run: cargo install cargo-mutants --locked
      - name: cargo mutants (harness + verifier)
        working-directory: rust
        # Per `.cargo/mutants.toml`: invokes mutation testing across
        # `shekyl-randomx-differential` + `shekyl-pow-randomx` with
        # the skip-list discipline. T18 asserts that survival rate
        # is bounded by the skip-list; new survivors require either
        # (a) a §5.5.6-row plan-doc amendment justifying the skip
        # addition, or (b) a verifier/harness-side change that
        # collapses the survivor.
        #
        # `--in-place` runs mutations inline rather than in a
        # parallel worktree; the runner's 14 GB SSD is tight for
        # multi-worktree mutation runs at workspace scale.
        #
        # canonical_pins_full is skipped here for the same
        # reason structural-validate's debug step skips it: mutants
        # runs the suite in DEBUG once per mutant, and 1024 interpreted
        # hashes are hours in debug — the baseline alone would eat the
        # 360-minute cap. Mutation coverage of the verifier's hashing
        # is already carried by the rest of the suite; the pins test's
        # job is arch parity, not mutant killing. (First `--` = cargo
        # test args, second = test-binary args.)
        run: cargo mutants --package shekyl-randomx-differential --package shekyl-pow-randomx --in-place -- -- --skip canonical_pins_full

  verdict-ratchet:
    # MR-DQ-2 (per-PR leg) + re-scope item 3, converged
    # (RANDOMX_V2_MUTATION_REGIME.md §6.6, §7.5 item 3).
    #
    # Mutation testing scoped to the harness's VERDICT FUNCTIONS, not
    # to whole modules. §6.6 measured why: at module scope the
    # survivors are dominated by orchestration reachable only through
    # live sessions — the API-shape artifacts MR-F10 predicted — while
    # the verdict functions kill 11/11. Narrow scope, real signal.
    #
    # WHAT THIS ASSERTS, both halves (§7.5 item 3):
    #   1. the verdicts stay MUTATION-REACHABLE — i.e. they remain
    #      functions returning Result, never bare assertion macros.
    #      Per MR-F12 cargo-mutants does not mutate macro invocations,
    #      so a verdict rewritten as `assert_eq!` drops out of coverage
    #      WITHOUT CHANGING A SINGLE NUMBER;
    #   2. their negative tests stay LOAD-BEARING.
    # It makes no T-A9 claim (MR-F11).
    #
    # Cost: 11 mutants in 36 s measured locally, ~58 s on the
    # committed runner class — it finishes inside the structural job's
    # measured 31-44 min many times over, so per-PR is free in
    # wall-clock terms.
    #
    # PATHS FILTERING is inherited, not re-declared: the workflow-level
    # positive `pull_request: paths:` filter (R1-D12) already means an
    # unrelated PR never triggers this workflow at all, so it never
    # pays the C-reference build. The structural job relies on exactly
    # the same mechanism and carries no filter of its own.
    name: 'pr: verdict mutation ratchet (T18)'
    runs-on: ubuntu-latest
    # Dominated by the C-reference build and the cargo build, not by
    # the 36 s ratchet itself.
    timeout-minutes: 30
    if: github.event_name != 'schedule' || github.event.schedule == '0 5 * * *'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        uses: ./.github/actions/build-randomx-v2-ref
      - name: Install cargo-mutants
        # VERSION-PINNED per MR-F7: `--locked` pins the tool's own
        # dependency tree, not the tool. Every behaviour this gate
        # depends on — which constructs are mutation sites, `--re`
        # matching, the default test scoping — can shift on a release
        # day, and an unpinned bump would move the mutant count under
        # a gate whose whole job is to notice that count changing.
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Assert the ratchet's subject exists
        working-directory: rust
        # THE GATE MUST ASSERT ITS OWN SUBJECT EXISTS (§13). `--re`
        # matches mutant NAMES, so renaming a verdict function silently
        # empties the population and the ratchet then reports a clean
        # green over nothing — the exact failure shape this round was
        # opened to catch, reproduced inside its own fix. The floor is
        # a pin: raising it is fine when a verdict is added, lowering
        # it requires deleting one deliberately.
        #
        # `wc -l < file` is a redirect, not a pipe, so no verdict
        # travels through a pipeline (rule 46).
        run: |
          set -euo pipefail
          cargo mutants --package shekyl-randomx-differential \
            --re 'verdict' --list > verdict-mutants.txt
          count=$(wc -l < verdict-mutants.txt)
          echo "verdict-scoped mutants: ${count}"
          cat verdict-mutants.txt
          if [ "${count}" -lt 11 ]; then
            echo "FATAL: expected at least 11 verdict-scoped mutants, found ${count}." >&2
            echo "  A verdict was renamed, deleted, or rewritten as a bare assertion" >&2
            echo "  macro (MR-F12: macros are not mutation sites). The ratchet would" >&2
            echo "  otherwise report a clean green over an empty population." >&2
            exit 1
          fi
      - name: Verdict mutation ratchet
        working-directory: rust
        # Verdict unpiped per rule 46; cargo-mutants exits non-zero on
        # any surviving mutant.
        #
        # A survivor here means a harness negative test stopped being
        # load-bearing — NOT a consensus finding. Fix the test (or the
        # verdict), do not add a skip-list entry without the §4.6 M2
        # substrate-anchored justification and a FOLLOWUPS cite.
        run: |
          set -euo pipefail
          cargo mutants --package shekyl-randomx-differential \
            --re 'verdict' --in-place --profile release \
            -- -- --skip canonical_pins_full
      - name: Upload ratchet diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-ratchet-failure-${{ github.run_id }}
          path: |
            rust/verdict-mutants.txt
            rust/mutants.out/
          retention-days: 30

  rotating:
    # The exploring differential lane (RANDOMX_V2_MUTATION_REGIME.md
    # §7.5 item 2). Every other differential lane re-verifies the same
    # 1024 pinned pairs; this one derives a fresh input set per
    # rotation index and runs rust-vs-C over inputs the project has
    # never tested.
    #
    # COVERAGE CLAIM, stated in full because the short version gets
    # miscredited: this lane advances the EXPLORED boundary, never the
    # PINNED one. It bites against spec-non-equivalence on inputs
    # outside the pinned corpus; it does NOT grow the regression corpus
    # absent a finding, and does NOT prove spec-equivalence at any
    # sizing. The pinned corpus grows only through the §7.9 MR-R3
    # promotion path — divergence, halt, root-cause, fix, THEN promote
    # against the fixed build. Never at discovery: at discovery
    # rust != c and neither leg is authoritative.
    #
    # Branch matrix per the house pattern (runtime-modes) and MR-F3:
    # schedule events fire on the default branch only, so without a
    # matrix this cron would never exercise dev, where verifier work
    # lands first.
    #
    # BOTH LEGS GET THE SAME INDEX, deliberately. The index is resolved
    # once per run and shared, so main and dev explore identical
    # inputs — which is what makes "diverged on dev, clean on main"
    # immediately informative about the delta between them. Giving each
    # branch its own index to "double throughput" is the plausible-
    # sounding optimisation that would silently destroy that
    # comparison: two lanes exploring disjoint inputs can never tell
    # you which branch is responsible for a divergence. Written down
    # because nothing in the code prevents it.
    #
    # NO SCHEDULED EXECUTION UNTIL THIS REACHES main. Schedule events
    # use the DEFAULT branch's workflow file, so while this job exists
    # only on dev it has no cron. Every pre-main run is therefore a
    # dispatch, and every dispatch is `operator-supplied` by
    # construction — so the EXPLORED BOUNDARY DOES NOT ADVANCE AT ALL
    # before the main merge, and no pre-main green may be credited as
    # coverage. A run history full of green operator-supplied rows
    # reads like coverage to anyone who was not here; it is not.
    name: 'cron: rotating differential lane (${{ matrix.branch }})'
    runs-on: ubuntu-latest
    # Measured DIRECTLY at the sizing this job runs — 32x32 = 1024
    # pairs in 515 s on the measurement box — rather than extrapolated
    # from a smaller run. The earlier extrapolation (128 pairs in 69 s,
    # scaled ~8x) landed close, but it scaled through a factor that is
    # not uniform: seedhashes go 8->32 (4x, on Argon2d cache derives)
    # while pairs go 128->1024 (8x, on hashes), so the agreement was
    # reassurance rather than derivation. At the ~1.58x runner factor
    # (RANDOMX_V2_MUTATION_REGIME.md §2.2.1) that is ~13.6 min. 40
    # leaves margin without becoming a place a hang can hide.
    #
    # FIRST REHEARSAL (run 32214326519, 2026-08-19): the whole job —
    # C-reference build, cargo build and the rotation — took 8-9 min
    # per leg, i.e. the ~13.6 min projection for the rotation ALONE
    # was conservative. Recorded rather than re-tuned: the 1.58x factor
    # was derived from a debug test-suite baseline and evidently does
    # not transfer uniformly to this workload either, which is the same
    # lesson as the extrapolation it replaced. 40 stays.
    timeout-minutes: 40
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.rotation_index != '')
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # `checkout_ref` lets a dispatch rehearse this lane on a
          # feature branch. Without it the first-ever execution of any
          # change to this job is unattended, on both matrix legs at
          # once, on a lane whose documented posture is halt-and-
          # escalate — so a wiring defect would arrive dressed as a
          # plausible consensus finding, which is the response you
          # least want to train on a false alarm.
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || matrix.branch }}
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure + build randomx-v2 C reference
        uses: ./.github/actions/build-randomx-v2-ref
      - name: Resolve rotation index
        id: rotation
        # Computed ONCE here and consumed by the run step, per §7.9
        # MR-R1: a lane straddling midnight UTC that re-derived the
        # index mid-run would emit a banner index that does not
        # describe all of its own inputs — a record that lies while
        # looking complete.
        #
        # Schedule runs take days-since-epoch, so consecutive days
        # explore different inputs and the sequence is reconstructable
        # from a date alone. A dispatch supplies its own index, which
        # is a REPLAY and is labelled as such: an operator-chosen index
        # must never be citable as routine coverage (§4.5 T-A11).
        run: |
          set -euo pipefail
          # Provenance is bound to the EVENT, not to whether an index
          # input happens to be empty. Keying it on input-emptiness
          # would be correct only while the job's `if:` refuses a
          # dispatch with no index — an invariant held by a different
          # expression thirty lines away, with nothing asserting the
          # coupling. Relax that condition later ("let dispatch do a
          # fresh sweep too" is an obvious future request) and a
          # manual run would be labelled schedule-derived: exactly the
          # §4.5 T-A11 laundering the label exists to prevent. Bound
          # this way the label is true by construction however the
          # `if:` evolves.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            provenance="schedule-derived"
          else
            provenance="operator-supplied"
          fi
          if [ -n "${{ inputs.rotation_index }}" ]; then
            index="${{ inputs.rotation_index }}"
          else
            index=$(( $(date -u +%s) / 86400 ))
          fi
          echo "index=${index}"           >> "$GITHUB_OUTPUT"
          echo "provenance=${provenance}" >> "$GITHUB_OUTPUT"
          echo "rotation index ${index} (${provenance})"
      - name: rotating mode (fresh inputs vs the C oracle)
        working-directory: rust
        # 32 x 32 = 1024 pairs the project has never tested, matching
        # the pinned lane's nightly sizing so the two are comparable.
        #
        # The verdict is NOT piped (rule 46): a `| tee` pipeline exits
        # with tee's status under `bash -e` without pipefail, which
        # would make this gate structurally incapable of failing. The
        # binary writes to a log via redirection and the exit code is
        # the step's own.
        #
        # A divergence here is a plausible REAL consensus finding:
        # halt and escalate per RANDOMX_V2_PHASE3_PLAN.md §7.3. Under a
        # rotating seed that needs saying twice — re-running on a later
        # index WOULD come back green. Replay the recorded
        # (seedhash, data) pair from the failure record instead.
        run: |
          set -euo pipefail
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin shekyl-randomx-differential -- \
            --mode=rotating \
            --rotation-index=${{ steps.rotation.outputs.index }} \
            --rotation-provenance=${{ steps.rotation.outputs.provenance }} \
            --random-corpus-seedhashes=32 \
            --random-corpus-data-per-seedhash=32 \
            > "rotating-${{ matrix.branch }}.log" 2>&1
      - name: Surface the lane's own record
        if: always()
        # The run step redirects to a log (rule 46: the verdict must
        # not travel through a `tee`), which means that on a GREEN run
        # nothing the harness printed reaches the job log — the
        # artifact only uploads `if: failure()`. So a lane that checked
        # 1024 pairs and a lane that checked ZERO would look
        # identical: the same green tick, the same absent output.
        #
        # That is §13 in this job: a clean signal that does not
        # evidence its own subject. `always()` so the record appears on
        # success and failure alike, and the banner's rotation binding
        # is readable without downloading an artifact.
        run: cat "rust/rotating-${{ matrix.branch }}.log"
      - name: Upload divergence forensics
        if: failure()
        uses: actions/upload-artifact@v4
        # FORENSICS, not recovery — the division matters and §7.9 MR-R1
        # records which half may be lost. The *inputs* are
        # reconstructable from the rotation index alone, forever, with
        # no artifact and no retention window; that is why the seed is
        # derived rather than drawn. What the artifact carries is the
        # *observed outputs on this runner at this toolchain state* —
        # both hashes, both cache SHAs, the harness version and the
        # fork pin — which are NOT reconstructable, and which are the
        # whole investigation when a divergence later fails to
        # reproduce locally.
        with:
          name: randomx-rotating-${{ matrix.branch }}-idx${{ steps.rotation.outputs.index }}-failure-${{ github.run_id }}
          path: rust/rotating-${{ matrix.branch }}.log
          retention-days: 90

  full-parity:
    # Phase 3a Hole-1 gate wiring (RandomX v2 test-regime hardening F1):
    # the C **full-dataset** (miner mode) vs Rust **light-cache**
    # (verifier) parity harness — `tests/randomx_v2_parity/` — existed
    # since the Phase 3 cutover but was wired into ZERO workflows: an
    # armed gate no automation ever ran. This job is its trigger.
    #
    # Cron-only, not per-PR: every exercised seed allocates and
    # initializes a ~2 080 MiB dataset (minutes each, 19–35 datasets per
    # run), on top of a full C++ daemon build — far outside the per-PR
    # budget. Daily (05:00 cron + workflow_dispatch) runs the
    # `randomx_v2_full_parity_daily` subset (genesis + canonical +
    # miner-KAT + corpus seeds 0–15, mirroring the Phase 2g per-PR seed
    # subset); the Monday 06:00 cron runs the full
    # `randomx_v2_full_parity` sweep (all 32 corpus seeds = all 1024
    # canonical pins re-checked under C-full-dataset).
    #
    # Unlike structural-validate (which builds only the C reference
    # out-of-band), this job needs the parent CMake project — the parity
    # harness links cryptonote_core + the Rust FFI — so it mirrors
    # build.yml's Ubuntu container recipe (apt list + pinned-Rust install
    # + ccache). CMake must stay single-config here (default Makefiles /
    # Ninja with an explicit CMAKE_BUILD_TYPE): external/CMakeLists.txt
    # FATAL_ERRORs on multi-config generators under
    # BUILD_RANDOMX_V2_MINER_LIB=ON by design — do not "fix" that guard.
    #
    # The job also runs the binary symbol-isolation gate on the linked
    # daemon (scripts/ci/check_randomx_symbol_isolation.sh): the daemon
    # build is already paid for here, and this is the only workflow that
    # builds one on a cadence.
    name: 'cron: full-dataset parity gate + symbol isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
        CCACHE_TEMPDIR: /tmp/.ccache-temp
        CCACHE_DIR: ~/.ccache
    env:
      # Daily subset ONLY for the cadences that mean it (the 05:00 daily
      # cron, and manual dispatch unless parity_scope=full); everything
      # else falls through to the FULL sweep. Fail-safe direction: if the
      # weekly cron is ever retimed, the retimed run no longer
      # string-matches anything and runs the FULL sweep — over-testing
      # loudly — instead of the inverted ternary's failure mode, where a
      # retimed weekly silently degrades to the daily subset and the
      # 1024-pin sweep never runs again. (A retimed DAILY cron also falls
      # through to full: louder and slower, but never silent
      # under-coverage. A dropped Monday cron is recoverable via
      # dispatch with parity_scope=full.)
      #
      # The `inputs.*` reference is guarded behind the event_name check:
      # the inputs context is only populated for workflow_dispatch, and
      # this expression is the load-bearing cadence selector — it must
      # not depend on how an empty context dereferences on cron events.
      PARITY_CTEST_LABEL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.parity_scope == 'full') || (github.event_name == 'schedule' && github.event.schedule != '0 5 * * *')) && 'randomx_v2_full_parity' || 'randomx_v2_full_parity_daily' }}
    steps:
      - name: set apt conf
        # Mirrors build.yml APT_SET_CONF (kept in sync manually; this
        # workflow already mirrors build.yml's Rust-install block the
        # same way).
        run: |
          tee -a /etc/apt/apt.conf.d/80-custom << EOF
          Acquire::Retries "3";
          Acquire::http::Timeout "120";
          Acquire::ftp::Timeout "120";
          EOF
      - name: update apt
        run: apt update
      - name: install build dependencies
        # Mirrors build.yml APT_INSTALL_LINUX.
        run: apt -y install build-essential cmake libboost-all-dev miniupnpc graphviz doxygen libunwind8-dev pkg-config libssl-dev libsodium-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler ccache git curl
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: install Rust toolchain
        # Composite action (.github/actions/install-rust); see the
        # structural-validate job's step comment. Must come AFTER
        # checkout: a `./`-referenced local action does not exist on
        # the runner until the repo is checked out (the inline `run:`
        # it replaced had no such dependency).
        uses: ./.github/actions/install-rust
      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-ubuntu:24.04-full-parity-${{ github.sha }}
          restore-keys: ccache-ubuntu:24.04-full-parity-
      - uses: ./.github/actions/set-make-job-count
      - name: build daemon + parity harness + miner-KAT tool
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ccache --max-size=150M
          ccache --set-config=compression=true
          cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=ON -D CMAKE_BUILD_TYPE=Release -D BUILD_RANDOMX_V2_MINER_LIB=ON
          cmake --build build --target daemon randomx-v2-full-parity randomx-v2-miner-kat
      - name: symbol isolation on linked daemon (nm)
        run: scripts/ci/check_randomx_symbol_isolation.sh build/bin/shekyld
      - name: generate parity corpus
        # Deterministic (fixed ChaCha20 seed): byte-identical on every
        # run at the same corpus revision; the per-PR structural gate
        # pins its SHA-256. Consumes the C reference the parent CMake
        # build just produced (randomx-v2-sys links librandomx.a).
        working-directory: rust
        # Runtime $GITHUB_WORKSPACE, NOT the ${{ github.workspace }}
        # template: inside a container job the template interpolates
        # the HOST path (/home/runner/work/...), which does not exist
        # in the container (the work tree is mounted at /__w/...) —
        # the first hosted execution of this job died exactly there
        # (dispatch run 28690002177: "No such file or directory"
        # creating the corpus). The env var is container-correct.
        run: |
          export RANDOMX_V2_INSTALL_DIR="$GITHUB_WORKSPACE/build/external/randomx-v2-install"
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin gen-parity-corpus -- \
            --out "$GITHUB_WORKSPACE/build/tests/randomx_v2_parity/parity_corpus.dat"
      - name: run parity gate (ctest -L ${{ env.PARITY_CTEST_LABEL }})
        # Serial (ctest default): each test allocates a ~2 080 MiB
        # dataset; parallel invocations would multiply peak memory.
        # --no-tests=error: zero matched tests is a wiring failure, not
        # a pass — this job exists because the gate had no trigger.
        working-directory: build
        run: ctest -L "$PARITY_CTEST_LABEL" --output-on-failure --no-tests=error

  native-arm:
    # Native aarch64 lane (test-regime hardening PR-2 / audit F5): the
    # verifier ships on exactly two arches (fpu_rounding.rs: x86_64
    # MXCSR, aarch64 FPCR) and until this job only x86_64 had ever
    # executed in CI. NATIVE arm silicon, deliberately NOT qemu — qemu
    # softfloat would mask a real FP-rounding divergence, and RandomX
    # is FP-rounding-sensitive (every program flips rounding modes via
    # CFROUND; fpu_rounding.rs swaps mode bits 1 and 2 between the two
    # encodings).
    #
    # What runs here and why:
    #   - uname guard: the lane must FAIL if the runner is not actually
    #     aarch64 (a silently-substituted x86 runner would turn this
    #     into an armed gate testing nothing).
    #   - C reference build: compiles the fork's a64 paths (v2 FE-mix +
    #     prefetch tweaks verified present at source and in a local
    #     cross-build at PR-2; this step is the continuous proof).
    #   - verifier crate tests (release): first native-arm execution of
    #     the interpreter/unit suite.
    #   - T2 (release): the 8 adversarial recipes byte-equal across
    #     Rust-light and the ARM-BUILT C oracle (both interpreted;
    #     c_oracle passes no JIT flag).
    #   - canonical pins (release): all 1024 committed pins re-derived
    #     on FPCR silicon by the portable single-leg test.
    #   - three-leg --mode=correctness (release): rust == arm-built C ==
    #     canonical over the same 1024 — the lane's strongest gate,
    #     covering the arm C reference on every pin, not just T2's 8
    #     recipes.
    # fmt/clippy/invariants are arch-independent and already gate on
    # x86; not repeated here.
    #
    # TRIAGE POSTURE (decided in advance, per the F5 finding): a
    # divergence on this lane is a plausible REAL consensus finding —
    # the two shipping arches disagreeing on a consensus hash — NOT
    # lane flakiness. Halt and escalate per RANDOMX_V2_PHASE3_PLAN.md
    # §7.3 discipline; start at fpu_rounding.rs mode encoding. Do not
    # rerun-until-green, do not mark flaky.
    #
    # Cadence: per-PR + push (same paths filter as the workflow) +
    # daily cron + dispatch — an arch divergence should block the
    # introducing PR, not surface at the next cron.
    name: 'native-arm: verifier + T2 + 1024 pins + 3-leg correctness (aarch64/FPCR)'
    runs-on: ubuntu-24.04-arm
    # 120 rather than 90: release compile + C build + verifier tests +
    # T2 + pins + the SERIAL three-leg correctness mode sum to ~75+ min
    # on a 4-vCPU runner; measure the first runs before tightening.
    timeout-minutes: 120
    if: github.event_name != 'schedule' || github.event.schedule == '0 5 * * *'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: verify aarch64 architecture
        run: |
          ARCH=$(uname -m)
          echo "Runner architecture: $ARCH"
          if [ "$ARCH" != "aarch64" ]; then
            echo "FATAL: expected aarch64 runner, got $ARCH — this lane exists to execute the FPCR arch surface; on any other arch it tests nothing" >&2
            exit 1
          fi
      - name: Install Rust toolchain
        # Composite action (.github/actions/install-rust); rustup-init
        # resolves the aarch64 host triple itself.
        uses: ./.github/actions/install-rust
      - name: Install CMake + Ninja
        # cmake is listed explicitly (unlike the x86 jobs, which lean on
        # ubuntu-latest carrying it): the arm image is a separate build
        # and this lane must not die at `cmake: command not found`
        # before its actual checks run. Idempotent if preinstalled.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure + build randomx-v2 C reference (aarch64)
        # Composite action: the SAME recipe as the x86 lanes by
        # construction — on this runner it produces the arm
        # librandomx.a (a64 JIT asm + v2 tweaks) that randomx-v2-sys
        # links for T2.
        uses: ./.github/actions/build-randomx-v2-ref
      - name: cargo test --release verifier crate (native arm)
        working-directory: rust
        run: cargo test --release --locked -p shekyl-pow-randomx
      - name: cargo test --release T2 adversarial_corpus_byte_equality (native arm)
        working-directory: rust
        run: |
          cargo test --release --locked -p shekyl-randomx-differential \
            --test adversarial_corpus_byte_equality
      - name: cargo test --release canonical pins (rust leg, 1024 pins, native arm)
        working-directory: rust
        run: |
          cargo test --release --locked -p shekyl-randomx-differential \
            --test canonical_pins_full
      - name: three-leg correctness mode (rust == C-arm == canonical, 1024 pins)
        working-directory: rust
        # The harness binary's --mode=correctness at nightly sizing: the
        # strictly stronger check for THIS lane, because it also walks
        # the ARM-BUILT C reference against every pin (T2 covers only
        # the 8 adversarial recipes on that surface). Verified locally
        # at this exact invocation before wiring (exit 0,
        # seedhashes_checked=32, random_pairs_checked=1024). The x86
        # per-PR/nightly cadences for the runtime modes remain the
        # runtime-mode wiring change's scope — this step wires the mode
        # only where the lane's premise needs it.
        run: |
          cargo run --release --locked -p shekyl-randomx-differential \
            --bin shekyl-randomx-differential -- \
            --mode=correctness \
            --random-corpus-seedhashes=32 \
            --random-corpus-data-per-seedhash=32
