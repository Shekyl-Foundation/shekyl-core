#
# SCRATCH MEASUREMENT, not a gate. It runs only on a push to its own
# scratch branch and never lands on `dev`.
#
# The question it answers: what does the workspace test run cost, and does
# it pass, on FreeBSD in a VM on a GitHub-hosted runner? The answer is
# compared with a scheduled run on an estate FreeBSD host that reports by
# issue. The commands are the Linux Rust job's own
# (scripts/ci/rust_scoped_tests.sh with RUST_TESTS=all: the nextest `ci`
# profile, `--locked`, the same exclusion), on the pinned toolchain.
#
# The workspace is copied into the VM (rsync), then into the home of an
# unprivileged test user, who builds and runs the tests; the target lives
# on the VM's own disk, outside the workspace, so only fbsd-results/ comes
# back. Memory headroom (free + inactive + laundry, and swap use) is
# sampled every 30 s into fbsd-results/memory.log.
# An NFS-shared workspace does not work: cargo cannot take its lock on
# Cargo.lock there ("No locks available"). Timings are stamped per phase
# into fbsd-results/timings.txt and uploaded with the logs.

name: FreeBSD hosted measurement (scratch)

on:
  push:
    branches: ['ci-scratch/freebsd-hosted-measure']

permissions:
  contents: read

jobs:
  measure:
    name: FreeBSD 14.4 VM, workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: the runner
        run: |
          echo "nproc: $(nproc)"
          awk -F': ' '/^model name/ { print "cpu: " $2; exit }' /proc/cpuinfo
          awk '/^MemTotal/ { print "memory: " $2 " " $3; exit }' /proc/meminfo
          ls -l /dev/kvm
          df -h /
          date -u +"runner-start %Y-%m-%dT%H:%M:%SZ %s"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: the forged test chain, fetched on the runner
        # scripts/ci/fetch_test_chain.py maps only Linux and macOS, and the
        # oras pin has no freebsd_amd64 checksum, so inside the VM it
        # refuses. It writes into the tree, which is copied into the VM.
        run: python3 scripts/ci/fetch_test_chain.py shard-fill

      - name: stamp before the VM
        run: |
          mkdir -p fbsd-results
          echo "vm-step-start $(date -u +%Y-%m-%dT%H:%M:%SZ) $(date +%s)" >> fbsd-results/timings.txt

      - name: FreeBSD VM
        # v1.6.0, pinned by commit.
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: '14.4'
          mem: 12288
          sync: rsync
          copyback: true
          sync-time: true
          disable-cache: true
          prepare: |
            # ca_root_nss: cargo's TLS finds no CA bundle in the base image.
            pkg install -y bash ca_root_nss curl git python3 rsync
            # The tests run as an unprivileged user: root passes checks a
            # user's process cannot (P2_NOTRACE, file modes, memlock).
            pw useradd -n shekyltest -m -s /bin/sh -c 'unprivileged test user'
          run: |
            # The action runs this under `sh -e`: each phase's status is
            # captured with `|| rc=$?`, so a failure is recorded, not fatal.
            set -u
            W=$(pwd)
            R="$W/fbsd-results"
            mkdir -p "$R"
            stamp() { echo "$1 $(date -u +%Y-%m-%dT%H:%M:%SZ) $(date +%s)" >> "$R/timings.txt"; }
            stamp vm-run-start
            {
              uname -a
              sysctl kern.vm_guest hw.ncpu hw.physmem hw.usermem hw.model vm.max_user_wired
              swapinfo -k
              df -h
              mount
              su -l shekyltest -c 'id; ulimit -a'
            } > "$R/vm-facts.txt" 2>&1
            cat "$R/vm-facts.txt"
            # Headroom, not just `fre`: on UFS the page cache sits in the
            # inactive queue and is reclaimable, so free + inactive +
            # laundry is what a new allocation can have; swap use is the
            # sign it ran out.
            (
              ps=$(sysctl -n vm.stats.vm.v_page_size)
              while :; do
                set -- $(sysctl -n vm.stats.vm.v_free_count vm.stats.vm.v_inactive_count vm.stats.vm.v_laundry_count)
                sw=$(swapinfo -k | awk 'NR>1 { u += $3 } END { print u + 0 }')
                echo "$(date +%s) free_mb=$(( $1 * ps / 1048576 )) inact_mb=$(( $2 * ps / 1048576 )) laundry_mb=$(( $3 * ps / 1048576 )) avail_mb=$(( ($1 + $2 + $3) * ps / 1048576 )) swap_used_kb=$sw"
                sleep 30
              done
            ) > "$R/memory.log" 2>&1 &
            sampler=$!

            # A copy of the workspace the test user owns (the action's
            # workspace is under /root, mode 0700).
            T=/home/shekyltest
            rsync -a "$W/" "$T/ws/" --exclude fbsd-results
            mkdir -p "$T/results"
            chown -R shekyltest "$T/ws" "$T/results"
            cat > "$T/phases.sh" <<'PHASES'
            set -u
            R=$HOME/results
            stamp() { echo "$1 $(date -u +%Y-%m-%dT%H:%M:%SZ) $(date +%s)" >> "$R/timings.txt"; }
            git config --global --add safe.directory '*'
            export CARGO_TARGET_DIR="$HOME/fbsd-target"
            export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
            export PATH="$CARGO_HOME/bin:$PATH"

            stamp toolchain-start
            curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-all-errors -o /tmp/rustup-init.sh https://sh.rustup.rs
            tc_rc=0
            sh /tmp/rustup-init.sh -y --default-toolchain 1.94.0 --profile minimal --no-modify-path > "$R/toolchain.log" 2>&1 || tc_rc=$?
            nx=cargo-nextest-0.9.138-x86_64-unknown-freebsd.tar.gz
            curl -sSfL --retry 3 --retry-all-errors -o "/tmp/$nx" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.138/$nx"
            if [ "$(sha256 -q "/tmp/$nx")" != 406f4372a1dce83774c47970687c06556781c078cd7c69c193bb617b265e7daf ]; then
              echo "nextest tarball hash mismatch" | tee -a "$R/toolchain.log"
              tc_rc=1
            fi
            tar -xzf "/tmp/$nx" -C "$CARGO_HOME/bin"
            stamp toolchain-end
            echo "toolchain rc=$tc_rc" >> "$R/timings.txt"
            [ "$tc_rc" -eq 0 ] || exit 0

            cd "$HOME/ws/rust"
            stamp build-start
            build_rc=0
            cargo nextest run --locked --profile ci --no-run --workspace --exclude shekyl-randomx-differential > "$R/build.log" 2>&1 || build_rc=$?
            stamp build-end
            echo "build rc=$build_rc" >> "$R/timings.txt"
            echo "--- build.log tail"; tail -n 40 "$R/build.log"
            du -sk "$CARGO_TARGET_DIR" >> "$R/target-size.txt" 2>&1

            test_rc=skipped
            doc_rc=skipped
            if [ "$build_rc" -eq 0 ]; then
              stamp test-start
              # rust_scoped_tests.sh's `nextest` with RUST_TESTS=all, minus
              # its chain fetch (done on the runner, above).
              test_rc=0
              cargo nextest run --locked --profile ci --no-fail-fast --workspace --exclude shekyl-randomx-differential > "$R/test.log" 2>&1 || test_rc=$?
              stamp test-end
              echo "--- test.log tail"; tail -n 60 "$R/test.log"
              find "$CARGO_TARGET_DIR/nextest" -name junit.xml -exec cp {} "$R/junit.xml" \;
              stamp doctest-start
              doc_rc=0
              RUST_TESTS=all bash ../scripts/ci/rust_scoped_tests.sh doctests > "$R/doctest.log" 2>&1 || doc_rc=$?
              echo "--- doctest.log tail"; tail -n 20 "$R/doctest.log"
              stamp doctest-end
            fi
            echo "test rc=$test_rc doctest rc=$doc_rc" >> "$R/timings.txt"
            PHASES
            stamp user-phases-start
            su -l shekyltest -c "sh $T/phases.sh" || echo "phases script rc=$?" >> "$R/timings.txt"
            # The user's stamps and statuses join the root's, in order.
            if [ -f "$T/results/timings.txt" ]; then
              cat "$T/results/timings.txt" >> "$R/timings.txt"
              rm "$T/results/timings.txt"
            else
              echo "the user phases wrote no timings" >> "$R/timings.txt"
            fi
            stamp user-phases-end
            kill "$sampler" || true
            cp -R "$T/results/." "$R/"
            grep -E '^ +(TRY [0-9]+ )?FAIL \[|^ +Summary \[|tests run:' "$R/test.log" || true
            awk '{ split($5, a, "="); if (min == "" || a[2] + 0 < min) { min = a[2] + 0; at = $0 } } END { print "least available: " at }' "$R/memory.log" | tee -a "$R/timings.txt"
            cat "$R/timings.txt"
            # The step succeeds so the action copies fbsd-results/ back (it
            # copies nothing after a failed step); the verdict step below
            # reads the statuses recorded in timings.txt.

      - name: stamp after the VM
        if: always()
        run: echo "vm-step-end $(date -u +%Y-%m-%dT%H:%M:%SZ) $(date +%s)" >> fbsd-results/timings.txt

      - name: verdict
        run: |
          cat fbsd-results/timings.txt
          grep -qx 'toolchain rc=0' fbsd-results/timings.txt
          grep -qx 'build rc=0' fbsd-results/timings.txt
          grep -qx 'test rc=0 doctest rc=0' fbsd-results/timings.txt

      - name: results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: freebsd-hosted-measure
          path: fbsd-results/
          retention-days: 14
