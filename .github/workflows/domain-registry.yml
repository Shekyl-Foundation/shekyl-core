# SA-3b — cryptographic domain-separation registry gate.
#
# Keeps docs/design/CRYPTO_DOMAIN_REGISTRY.tsv in lockstep with the code for
# *registered* rows: comment-stripped row-presence + exact `const <name>:`
# binding (value change, rename, move, deletion) plus comment-stripped
# entry-point count-pins for always-domain entry points (cSHAKE; FROST
# transcript labels; FROST ciphersuite ID/CONTEXT) plus a frozen-doc
# cross-check (every frozen-inherited row has its consequence entry in
# docs/FROZEN_DOMAIN_SEPARATORS.md — which is why that doc is a trigger path).
# Does NOT auto-detect new unregistered domains in general-purpose mechanisms
# (HKDF/Blake2b/keccak/SHA3-256) — that is a review duty; see the gate header
# and CBOM §3. Cheap (ripgrep only). Anchors on the mechanism call site /
# registered literal, not the `shekyl/` prefix.
#
# Triggered on all of rust/** (not a narrow crate list): the domain census spans
# ~13 crates, so a call site added in an unlisted crate would slip past a
# narrower trigger — an armed gate with no trigger, the exact hole this round
# closes. The gate is ripgrep-only, so scanning on any Rust change is cheap.

name: ci/domain-registry

on:
  pull_request:
    paths: &paths
      - "rust/**"
      - "docs/design/CRYPTO_DOMAIN_REGISTRY.tsv"
      - "docs/FROZEN_DOMAIN_SEPARATORS.md"
      - "scripts/ci/domain_registry_gate.sh"
      - ".github/workflows/domain-registry.yml"
  push:
    branches: [dev]
    paths: *paths

concurrency:
  group: domain-registry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain-registry:
    name: "SA-3b: domain-registry gate"
    runs-on: ubuntu-latest
    # Bounded so an unreachable package mirror costs minutes, not the
    # 6-hour hosted-runner ceiling. On 2026-08-18 three small gates in
    # this repo each sat SIX HOURS on an `apt-get update` stall against
    # archive.ubuntu.com and were killed without ever running their
    # check; the failure then presented as "gate failed" when the gate
    # had not run at all. A short timeout keeps a red attributable to
    # the gate's own subject.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version
      - name: Run domain-registry gate
        run: scripts/ci/domain_registry_gate.sh
