#
# Unbounded device-read gate.
#
# Runs `scripts/ci/check_unbounded_device_read.sh`: no `fs::read` /
# `read_to_string` on a `/dev/...` literal, because those read to EOF and a
# character device never reaches one.
#
# This gate exists because the discipline was ALREADY WRITTEN DOWN and violated
# anyway. `rust/shekyl-cli/src/commands/signing.rs` names `/dev/urandom` as the
# hazard and fixes it with `File::take(cap + 1)`; `fs::read("/dev/urandom")` was
# then committed in another crate, grew to ~107 GB RSS on a 125 GB box, was
# SIGKILLed by the OOM killer, and cost four measurement sessions that were each
# misattributed to teardown, storage, or a slow network.
#
# Prose at one site did not stop a violation at another. That is the argument
# for enforcement rather than another note (same family as gf7-no-emit and the
# pending-post write-path guard).

name: ci/unbounded-device-read

on:
  # No `branches:` filter: an unbounded device read can be introduced on any
  # branch, and a `branches: [dev]` filter would let one merge up through a
  # feature branch with the gate never firing on the offending diff.
  pull_request:
    # The script greps ALL of `rust/`, so the trigger is that wide: the point is
    # to catch a new site in any crate, and a narrow path list would skip the
    # job on precisely those PRs.
    paths:
      - "rust/**"
      - "scripts/ci/check_unbounded_device_read.sh"
      - ".github/workflows/unbounded-device-read.yml"

concurrency:
  group: unbounded-device-read-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-unbounded-device-read:
    name: "Unbounded /dev read grep gate"
    runs-on: ubuntu-latest
    # Bounded so an unreachable package mirror costs minutes rather than the
    # 6-hour hosted-runner ceiling — three small gates in this repo each sat six
    # hours on an `apt-get update` stall and were killed without ever running,
    # which then presented as "gate failed" when the gate had not run at all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ripgrep is load-bearing; the script's `command -v rg` precondition fails
      # closed without it. `ubuntu-latest` ships without `rg`.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Run unbounded device-read check
        run: scripts/ci/check_unbounded_device_read.sh
