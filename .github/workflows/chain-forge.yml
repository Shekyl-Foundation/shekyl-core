name: chain-forge

# The chain forge's determinism check (CHAIN_FORGE.md §9, CF-1c): a forged
# chain is a known answer, so the same plan at the same commit must give the
# same bytes on every machine that forges it. Each leg forges the small plan
# (rust/shekyl-chain-forge/plans/small.toml) twice, in two processes that
# differ in thread count, working directory, time zone and locale, and holds
# both to the blocks.txt and manifest committed in chains/small/. Two legs
# that both match the tree match each other.
#
# - x86_64 on GitHub's hosted `ubuntu-24.04`; aarch64 on the hosted
#   `ubuntu-24.04-arm`. The Pi 4 floor device (rule 76) is aarch64 too; its
#   run is fleet evidence recorded with the increment, not a CI leg.
# - The seeded primitives first (seconds): when the legs disagree, that step
#   names the primitive.
# - Each ignored test runs through scripts/ci/ignored_set_chain_forge.sh,
#   which holds the crate's ignored set exact and runs one subject by its
#   exact name.
# - Cost (measured at CF-1c): one forging of the small plan is about 29
#   CPU-minutes, 228 s on a 16-vCPU build VM. On the hosted runners the two
#   forgings took 316 s and 281 s (x86_64) and 204 s and 145 s (aarch64), a
#   whole leg 14.7 and 11.2 minutes. That is over the five minutes a leg
#   that runs on every pull request may take, so the x86_64 leg runs
#   on every pull request in scope and the aarch64 leg nightly and on a pull
#   request that touches the crypto beneath the chain's bytes
#   (shekyl-crypto-pq, shekyl-fcmp, shekyl-tx-builder).
# - Nightly, at dev's HEAD (§9): both legs, and on x86_64 the forged-chain
#   test (the identity test's four locks and the receipt tamper test), the
#   negative controls (each source of randomness drawn from the OS, the chain
#   must differ), and the producer audit (two processes at the plan's spread,
#   then the live settlement comparison). A red nightly reaches `report-dev-red`.
# - The hosted chains (§10.4, CF-4a). Nightly, both legs forge the shard-fill
#   plan in two processes at dev's HEAD and hold it to its committed
#   blocks.txt and to every layer its pin in chains/hosted.toml names: red
#   means a merged change moved the chain without re-publishing it. And
#   `hosted-pull` pulls every pinned digest fresh and checks each layer
#   (scripts/ci/fetch_test_chain.py --all --fresh): red means the cache is
#   gone or damaged. The fetch script's selftest runs in `scope` on every
#   pull request in scope. Cost (CF-4a, 2026-11-18): one shard-fill forging
#   is 257 s on a 16-vCPU build VM, about 6 minutes on the hosted x86_64
#   runner and about 4 on aarch64, so the regeneration is nightly only; the
#   pull check is under a minute.
#
# Scope: the Rust tree and `config/`, because a forged chain's bytes depend
# on the consensus rules, the store, the driver and the crypto beneath them,
# and on the economics and consensus JSON the build reads. Not a required
# check, so the `paths` filter suppressing the workflow on other changes
# waits on nothing.

on:
  push:
    branches: [dev, main]
    paths:
      - 'rust/**'
      - 'config/**'
      - '.github/workflows/chain-forge.yml'
      - '.github/actions/install-rust/**'
      - 'scripts/ci/fetch_test_chain.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'config/**'
      - '.github/workflows/chain-forge.yml'
      - '.github/actions/install-rust/**'
      - 'scripts/ci/fetch_test_chain.py'
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

# A scheduled or dispatched run is its own group: a push landing mid-night
# must not cancel the nightly whose red is the issue.
# A push run on `dev` is never cancelled once it runs (ruled 2026-11-19):
# one runs and one waits, and a newer push replaces the waiting one, so the
# run that finishes covers every merge since the last (06-branching.mdc).
concurrency:
  group: chain-forge-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  # Nightly forges dev's HEAD (§9); every other event its own ref.
  FORGE_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

jobs:
  scope:
    name: "chain forge: does the change touch the crypto beneath a chain"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crypto: ${{ steps.diff.outputs.crypto }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        # A pull request's own diff against its base. Fails closed: a diff
        # that cannot be computed counts as touching the crypto.
        run: |
          crypto=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"); then
              crypto=true
            elif printf '%s\n' "$files" | grep -qE '^rust/shekyl-(crypto-pq|fcmp|tx-builder)/'; then
              crypto=true
            fi
          fi
          echo "crypto=$crypto" >> "$GITHUB_OUTPUT"
          echo "the change touches the crypto beneath a chain: $crypto"
      - name: the fetch script refuses what it must (selftest)
        run: python3 scripts/ci/fetch_test_chain.py --selftest

  x86_64:
    name: "chain forge: determinism (x86_64)"
    runs-on: ubuntu-24.04
    # The nightly adds the producer plan: two forgings of about 6,000 blocks,
    # then the live settlement comparison. 300 covers that on top of the
    # small plan. A pull request runs only the small plan.
    timeout-minutes: 300
    steps:
      - name: the runner
        # The architecture this leg claims, checked, and the cores its
        # times are read against.
        run: |
          echo "uname -m: $(uname -m)"
          echo "nproc: $(nproc)"
          test "$(uname -m)" = "x86_64"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FORGE_REF }}
          submodules: recursive
      - name: install Rust
        uses: ./.github/actions/install-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: chain-forge-x86_64
      - name: the seeded primitives give x86_64's answers
        working-directory: rust
        run: cargo test --locked --release -p shekyl-chain-forge --test primitives_across_architectures
      - name: the small plan, forged in two processes, is the committed chain
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::the_small_plan_forges_the_same_bytes_in_two_processes
      - name: the forged chain is regtest's alone, and refuses a tampered receipt (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run forged_chain::the_small_plan_is_regtests_alone_and_refuses_a_tampered_receipt
      - name: each source of randomness, drawn from the OS, moves the chain (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::each_source_drawn_from_the_os_moves_the_chain
      - name: the producer plan forges the same bytes in two processes (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::the_producer_plan_forges_the_same_bytes_in_two_processes
      - name: a live producer run settles as the planned one (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run producer_audit::a_live_producer_run_settles_as_the_planned_one
      - name: the shard-fill plan forges its pinned hosted chain (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::the_shard_fill_plan_forges_its_pinned_chain_in_two_processes

  aarch64:
    name: "chain forge: determinism (aarch64)"
    needs: scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.scope.outputs.crypto == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: the runner
        run: |
          echo "uname -m: $(uname -m)"
          echo "nproc: $(nproc)"
          test "$(uname -m)" = "aarch64"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FORGE_REF }}
          submodules: recursive
      - name: install Rust
        uses: ./.github/actions/install-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: chain-forge-aarch64
      - name: the seeded primitives give x86_64's answers
        working-directory: rust
        run: cargo test --locked --release -p shekyl-chain-forge --test primitives_across_architectures
      - name: the small plan, forged in two processes, is the committed chain
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::the_small_plan_forges_the_same_bytes_in_two_processes
      - name: the shard-fill plan forges its pinned hosted chain (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/ignored_set_chain_forge.sh --run determinism::the_shard_fill_plan_forges_its_pinned_chain_in_two_processes

  hosted-pull:
    name: "chain forge: every pinned hosted chain still pulls and matches"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FORGE_REF }}
      - name: pull every pinned digest fresh, and check each layer against its pin
        run: python3 scripts/ci/fetch_test_chain.py --all --fresh

  report-dev-red:
    needs: [scope, x86_64, aarch64, hosted-pull]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/report-dev-red.yml
