# Does shekyl-gui-wallet still build against this branch?
#
# The desktop wallet path-depends on `rust/*` crates from this repository
# (`shekyl-engine-core`, `shekyl-engine-file`, `shekyl-rpc-transport`, …) and
# builds against `dev`. It is an out-of-workspace consumer: `cargo check`
# here cannot see it, so "no callers in the workspace" is not "no callers",
# and a change that compiles cleanly in this repo can still break the wallet.
#
# It did. On 2026-08-23 four separate changes from this repository had
# accumulated in the GUI unnoticed — a deleted `WalletFile::verify_password`
# (removed on the stated ground that the crate had no consumer outside the
# workspace), a new `StakePosture` parameter, three new `FirstStakeError`
# variants, and a new `StakingReadView` field. Each was found by a person
# reading a diff, weeks late, instead of by the pull request that made it.
#
# This job runs the wallet's own drift check against *this* branch, so the
# change that would break it fails here first. It is not a substitute for
# the GUI's CI; it is the direction that was missing.
name: ci/gh-actions/gui-drift

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/gui-drift.yml'
  push:
    branches: [dev, main]
    paths:
      - 'rust/**'
      - '.github/workflows/gui-drift.yml'

concurrency:
  group: gui-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gui-builds-against-core:
    name: shekyl-gui-wallet builds against this branch
    # The wallet repository owns the recipe (system libraries, toolchain,
    # what "builds" means for a Tauri crate); this repository owns only the
    # ref to test it against. One definition, called from both sides.
    # Pinned to the wallet's `dev`, where `core-drift.yml` lives (merged in
    # shekyl-gui-wallet#14). That repository's default branch is `main`, so
    # the wallet's own schedule/dispatch entries into that workflow stay
    # dormant until dev reaches main — this call does not, because it names
    # the ref it wants.
    uses: Shekyl-Foundation/shekyl-gui-wallet/.github/workflows/core-drift.yml@dev
    with:
      core_repository: ${{ github.repository }}
      # The MERGE ref on a pull request, not the branch head. The wallet
      # builds against core's `dev`, so testing a branch tip asks "does the
      # wallet build against this branch *as if dev did not exist*" — and any
      # branch opened before a core API the wallet now uses fails on its
      # absence. PR #544 hit exactly that: 24 commits behind dev, it failed on
      # `network_posture`, which #542 had already added to dev and the wallet
      # already consumes. That is a spurious red wearing a real drift's
      # clothes, and a check that cries wolf gets ignored precisely when it is
      # right.
      #
      # `refs/pull/N/merge` is head merged into base — what would actually
      # land — and GitHub publishes it as a real ref, verified fetchable by
      # name (`git fetch --depth 1 origin refs/pull/544/merge`). It is absent
      # for a conflicting pull request, which cannot reach this workflow
      # anyway: GitHub does not run checks on one.
      #
      # Two consequences worth knowing. The run summary now names the merge
      # ref rather than a branch, and that SHA is ephemeral — GitHub recomputes
      # it on every push and drops it when the pull request closes, so the
      # durable pointer to what was tested is the pull request number, not the
      # SHA. And the called workflow's concurrency group keys on this value, so
      # per-pull-request refs stop two branches from cancelling each other's
      # runs the way two same-named refs could.
      #
      # One line deliberately: in a folded scalar (`>-`) a more-indented
      # continuation is kept literal rather than folded, so wrapping this
      # expression embeds newlines inside `${{ }}`. Observed while writing it.
      core_ref: "${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref_name }}"
