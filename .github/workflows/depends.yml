name: ci/gh-actions/depends

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
  workflow_dispatch:

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  group: depends-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
    ccache --max-size=150M
    ccache --set-config=compression=true

jobs:
  build-cross:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
        CCACHE_TEMPDIR: /tmp/.ccache-temp
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          # Deferred targets -- re-enable when there is user demand:
          # - name: "RISCV 64bit"
          #   host: "riscv64-linux-gnu"
          #   packages: "python3 gperf g++-riscv64-linux-gnu"
          #   rust_target: "riscv64gc-unknown-linux-gnu"
          #
          # 32-bit targets (armv7, i686) permanently retired in v3.1.0-alpha.5
          # (Chore #3). See docs/CHANGELOG.md "Retired 32-bit build targets"
          # for the PQC constant-time security argument that makes this
          # retirement load-bearing rather than cosmetic.
          - name: "ARM v8"
            host: "aarch64-linux-gnu"
            packages: "python3 gperf g++-aarch64-linux-gnu qemu-user-static"
            rust_target: "aarch64-unknown-linux-gnu"
          - name: "Win64"
            host: "x86_64-w64-mingw32"
            packages: "cmake python3 g++-mingw-w64-x86-64"
            rust_target: "x86_64-pc-windows-gnu"
          - name: "x86_64 Linux"
            host: "x86_64-unknown-linux-gnu"
            packages: "gperf cmake libdbus-1-dev libharfbuzz-dev"
            rust_target: ""
          - name: "Cross-Mac x86_64"
            host: "x86_64-apple-darwin11"
            packages: "cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python3-dev python3-setuptools-git libtinfo5 clang"
            rust_target: "x86_64-apple-darwin"
            osx_sdk: "11.1"
          - name: "Cross-Mac aarch64"
            host: "aarch64-apple-darwin11"
            packages: "cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python3-dev python3-setuptools-git libtinfo5 clang"
            rust_target: "aarch64-apple-darwin"
            osx_sdk: "11.1"
          - name: "x86_64 Freebsd"
            host: "x86_64-unknown-freebsd"
            packages: "clang-14 libc++-14-dev libc++abi-14-dev gperf cmake libdbus-1-dev libharfbuzz-dev"
            rust_target: "x86_64-unknown-freebsd"
    name: ${{ matrix.toolchain.name }}
    steps:
    - name: set apt conf
      run: ${{env.APT_SET_CONF}}
    - name: install dependencies
      run: apt update; apt -y install build-essential libtool cmake autotools-dev automake pkg-config python3 gperf bsdmainutils curl git ca-certificates unzip ccache ${{ matrix.toolchain.packages }}
    - name: configure git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
# Most volatile cache
    - name: ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.toolchain.host }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.toolchain.host }}-
# Less volatile cache
    - name: depends cache
      uses: actions/cache@v5
      with:
        path: contrib/depends/built
        key: depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
        restore-keys: |
          depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
          depends-${{ matrix.toolchain.host }}-
# Static cache
    - name: OSX SDK cache
      if: ${{ matrix.toolchain.osx_sdk }}
      uses: actions/cache@v5
      with:
        path: contrib/depends/sdk-sources
        key: sdk-${{ matrix.toolchain.host }}-${{ matrix.toolchain.osx_sdk }}
        restore-keys: sdk-${{ matrix.toolchain.host }}-
    - name: prepare w64-mingw32
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' }}
      run: |
        update-alternatives --set ${{ matrix.toolchain.host }}-g++ $(which ${{ matrix.toolchain.host }}-g++-posix)
        update-alternatives --set ${{ matrix.toolchain.host }}-gcc $(which ${{ matrix.toolchain.host }}-gcc-posix)
    - name: install Rust
      run: |
        # Install the toolchain pinned by rust/rust-toolchain.toml up front (and add
        # the cross target to *it*), so the daemon build's parallel cargos use the
        # pinned 1.94 instead of racing to auto-install it. Bump in sync with the file.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0 --profile minimal
        . "$HOME/.cargo/env"
        if [ -n "${{ matrix.toolchain.rust_target }}" ]; then
          rustup target add ${{ matrix.toolchain.rust_target }}
        fi
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: archival KAT tests run under aarch64 (qemu-user)
      if: matrix.toolchain.host == 'aarch64-linux-gnu'
      run: |
        . "$HOME/.cargo/env"
        cd rust
        # Execute the cross-compiled tests under qemu so the reward-arithmetic
        # determinism golden vectors are verified bit-identical on aarch64, not
        # just compiled (REWARD_EMISSION_VIN_PLAN.md §9, M-1 half (b)).
        # qemu-user-static is installed via this lane's matrix `packages` list in
        # the "install dependencies" step (the container runs as root; no sudo).
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64-static
        export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
        cargo test --locked -p shekyl-archival-retention \
          --target aarch64-unknown-linux-gnu
        # `shekyl-standoff` default features only: the integer funding-seam
        # standoff golden vector (`tests/golden_vector.rs`) is the cross-arch
        # bit-identical guarantee (ARCHIVAL_FIREWALL_GATE6.md §10.12). The
        # `conformance` float goodness-of-fit probes are deliberately NOT built
        # here — float is not bit-identical across arches (the same reason
        # reward-arithmetic is pure-integer), so they stay x86-only and the
        # lane's guarantee is scoped to the integer (spread, bond_first)
        # sequence.
        cargo test --locked -p shekyl-standoff \
          --target aarch64-unknown-linux-gnu
        # `archival_p` is the third cross-arch-deterministic primitive (after
        # reward-arithmetic and the standoff draw). A divergent bit on aarch64
        # means an ARM-phone user cannot recover their own bond, so the
        # ARCHIVAL_P_DERIVE_V1 KAT (+ corpus freeze self-check) must run under
        # qemu, not just compile. Scoped to the KAT binary so the slow
        # ML-KEM/ML-DSA keygen path runs only for the pinned vectors; the
        # p_canonical_id cross-check is exercised via the
        # shekyl-archival-retention run above (it depends on archival_p).
        cargo test --locked -p shekyl-crypto-pq \
          --target aarch64-unknown-linux-gnu \
          --test kat_archival_p_derive_v1
    - name: build
      run: |
        ${{env.CCACHE_SETTINGS}}
        make depends target=${{ matrix.toolchain.host }} -j4
    - uses: actions/upload-artifact@v6
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' || matrix.toolchain.host == 'x86_64-apple-darwin11' || matrix.toolchain.host == 'aarch64-apple-darwin11' || matrix.toolchain.host == 'x86_64-unknown-linux-gnu' || matrix.toolchain.host == 'aarch64-linux-gnu' }}
      with:
        name: ${{ matrix.toolchain.name }}
        path: |
          build/${{ matrix.toolchain.host }}/release/bin/shekyl-cli*
          build/${{ matrix.toolchain.host }}/release/bin/shekyld*
