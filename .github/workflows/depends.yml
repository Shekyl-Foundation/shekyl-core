name: ci/gh-actions/depends

on:
  # No `merge_group:` trigger, deliberately (06-branching.mdc, the merge
  # queue): `merge_group` takes no `paths` filter, so this would run six
  # cross-compiles (~124 billed minutes) on every merge group; the depends
  # tree is not the cross-lane surface the queue exists to test.
  pull_request:
    # Which legs a pull request runs is scripts/ci/depends_legs.py's (the
    # `legs` job below): all six when the depends tree, the Makefile, this
    # workflow or that script changes; the MinGW leg alone when a change can
    # alter how an executable links (a CMakeLists.txt, cmake/, a C header
    # under src/shekyl/, or a Rust crate that defines a C export; Rick,
    # 2026-10-19); none otherwise. These paths only wake the selector:
    # `rust/**` is wide because which crates define an export is read from
    # the tree, not listed here. Unrelated PRs used to pay ~124 billed
    # minutes for six cross-compiles. ARM v8 qemu KATs live in
    # depends-aarch64-kats.yml (path-filtered to the three
    # cross-arch-deterministic crates).
    paths:
      - 'contrib/depends/**'
      - 'Makefile'
      - '.github/workflows/depends.yml'
      - 'scripts/ci/depends_legs.py'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'src/shekyl/**'
      - 'rust/**'
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC — the rest of the matrix
  workflow_dispatch:

# Superseded-run cancellation (house pattern: economics-c2a-prime.yml).
# Without a concurrency group, every push to an open PR stacks a full new
# run behind the old one — with the shared runner pool, repeated pushes
# queue out ALL runners (measured: ~80% of CI wait). `github.ref` is
# unique per PR (refs/pull/N/merge), so only same-PR runs supersede.
concurrency:
  group: depends-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
    ccache --max-size=150M
    ccache --set-config=compression=true

jobs:
  # The legs this run takes, as a matrix (scripts/ci/depends_legs.py). It
  # fails closed: anything it cannot decide runs every leg.
  legs:
    name: 'Depends legs'
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: legs
        shell: bash
        run: |
          set -u
          python3 scripts/ci/depends_legs.py --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" \
            || python3 -c 'import json; print("legs=" + json.dumps(json.load(open("contrib/depends/ci-toolchains.json")), separators=(",", ":")))' >> "$GITHUB_OUTPUT"

  build-cross:
    needs: legs
    if: needs.legs.outputs.legs != '[]'
    runs-on: ubuntu-latest
    # A nightly red reaches a human: the on-failure step opens or comments
    # on a tracking issue (the slow-gate nightly's route).
    permissions:
      contents: read
      issues: write
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
        CCACHE_TEMPDIR: /tmp/.ccache-temp
    strategy:
      fail-fast: false
      matrix:
        # The legs are contrib/depends/ci-toolchains.json, chosen by the
        # `legs` job. Deferred: RISC-V 64-bit (riscv64-linux-gnu,
        # g++-riscv64-linux-gnu, riscv64gc-unknown-linux-gnu), re-enabled when
        # there is user demand. 32-bit targets (armv7, i686) were permanently
        # retired in v3.1.0-alpha.5 (Chore #3); see docs/CHANGELOG.md
        # "Retired 32-bit build targets" for the PQC constant-time security
        # argument that makes this retirement load-bearing rather than
        # cosmetic.
        toolchain: ${{ fromJSON(needs.legs.outputs.legs) }}
    name: ${{ matrix.toolchain.name }}
    steps:
    - name: set apt conf
      run: ${{env.APT_SET_CONF}}
    - name: install dependencies
      run: apt update; apt -y install build-essential libtool cmake autotools-dev automake pkg-config python3 gperf bsdmainutils curl git ca-certificates unzip ccache ${{ matrix.toolchain.packages }}
    - name: configure git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
# Most volatile cache
    - name: ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.toolchain.host }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.toolchain.host }}-
# Less volatile cache
    - name: depends cache
      uses: actions/cache@v5
      with:
        path: contrib/depends/built
        key: depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
        restore-keys: |
          depends-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*') }}
          depends-${{ matrix.toolchain.host }}-
# Static cache
    - name: OSX SDK cache
      if: ${{ matrix.toolchain.osx_sdk }}
      uses: actions/cache@v5
      with:
        path: contrib/depends/sdk-sources
        key: sdk-${{ matrix.toolchain.host }}-${{ matrix.toolchain.osx_sdk }}
        restore-keys: sdk-${{ matrix.toolchain.host }}-
    - name: prepare w64-mingw32
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' }}
      run: |
        update-alternatives --set ${{ matrix.toolchain.host }}-g++ $(which ${{ matrix.toolchain.host }}-g++-posix)
        update-alternatives --set ${{ matrix.toolchain.host }}-gcc $(which ${{ matrix.toolchain.host }}-gcc-posix)
    - name: install Rust
      # Composite action (.github/actions/install-rust) with no extra
      # components — identical to the inline form this replaces (pinned
      # 1.94.0, --profile minimal, GITHUB_PATH append, hardened
      # download-then-run): one definition to bump on a toolchain
      # change. Installed up front so the daemon build's parallel
      # cargos use the pin instead of racing to auto-install it.
      uses: ./.github/actions/install-rust
      with:
        components: ''
    - name: add Rust cross target
      # Separate step ON PURPOSE: the composite's GITHUB_PATH append
      # only takes effect for subsequent steps, which is exactly what
      # the old block's `. "$HOME/.cargo/env"` worked around in-block.
      if: ${{ matrix.toolchain.rust_target }}
      run: rustup target add ${{ matrix.toolchain.rust_target }}
    - name: build
      run: |
        ${{env.CCACHE_SETTINGS}}
        make depends target=${{ matrix.toolchain.host }} -j4
    - uses: actions/upload-artifact@v6
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' || matrix.toolchain.host == 'x86_64-apple-darwin11' || matrix.toolchain.host == 'aarch64-apple-darwin11' || matrix.toolchain.host == 'x86_64-unknown-linux-gnu' || matrix.toolchain.host == 'aarch64-linux-gnu' }}
      with:
        name: ${{ matrix.toolchain.name }}
        path: |
          build/${{ matrix.toolchain.host }}/release/bin/shekyl-cli*
          build/${{ matrix.toolchain.host }}/release/bin/shekyld*
          build/${{ matrix.toolchain.host }}/release/bin/shekyl-mdb-copy*
    - name: notify on a nightly red
      # A nightly leg that fails is pushed at a human, not left to be
      # noticed (Rick, 2026-10-19): it opens a tracking issue, or comments on
      # the open one so repeats thread. The slow-gate nightly's route
      # (nightly-live-daemon-slow.yml): github-script, because this job runs
      # in a container without the GitHub CLI, and an exact-title match over
      # open issues, because the search API's in:title lags and would fork
      # the thread on back-to-back reds.
      if: failure() && github.event_name == 'schedule'
      uses: actions/github-script@v8
      with:
        script: |
          const title = `nightly depends cross-build RED (${{ matrix.toolchain.name }})`;
          const body = [
            `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            'Leg: ${{ matrix.toolchain.name }} (${{ matrix.toolchain.host }})',
            'The release cross-build for this target failed on the nightly run of dev.',
          ].join('\n');
          const open = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          });
          const existing = open.find((i) => !i.pull_request && i.title === title);
          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
          }
