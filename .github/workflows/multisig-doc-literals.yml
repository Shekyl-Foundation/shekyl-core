# P0-n — V3.1 multisig Phase 0.
#
# Doc-literal grep gate: cap fossils (`n_total > 7`,
# `MAX_MULTISIG_PARTICIPANTS = 7`, any `k-of-n` over MSW-G = 5) and
# pqc_auth fee-oracle drift (`5385`, oracle is `pqc_auth_weight()` =
# 5389). Cheap (ripgrep only) — split out of `multisig-feature.yml` so a
# docs-only change runs just this gate, not the F-6 cargo lane.
#
# The gate scans the design carrier / tracking index / FOLLOWUPS (they
# are no longer excluded wholesale); genuinely-historical lines carry an
# inline `doc-literal-gate-allow` marker. See
# `scripts/ci/check_multisig_doc_literals.sh`.

name: ci/multisig-doc-literals

on:
  pull_request:
    # A single anchored list, aliased into `push` below, so the two event
    # triggers cannot drift apart.
    paths: &paths
      - "docs/**"
      - "scripts/ci/check_multisig_doc_literals.sh"
      - ".github/workflows/multisig-doc-literals.yml"
      # C-1: constant-owning files. A bump to a cap/blob constant here
      # must re-scan the docs, else stale cap/fee prose lands with the
      # gate silent — an armed gate with no trigger. (The gate itself is
      # pinned to MSW-G = 5; a change to these files is the signal to
      # re-check that the prose still matches the constant.)
      - "rust/shekyl-crypto-pq/**"
      - "rust/shekyl-wire/**"
      - "rust/shekyl-address/**"
      # The multisig ceremony crate (MS-5). It does not own the cap/fee
      # constants today (those stay in crypto-pq — referenced, never restated),
      # but it is where multisig-specific bounds and ceremony prose will live;
      # a constant or a doc-literal landing here must re-scan the docs. Same
      # C-1 symmetry as the constant-owning crates above.
      - "rust/shekyl-multisig/**"
      - "src/cryptonote_config.h"
  push:
    branches: [dev]
    paths: *paths

concurrency:
  group: multisig-doc-literals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p0n-doc-literals:
    name: "P0-n: multisig doc-literal gate"
    runs-on: ubuntu-latest
    # Bounded so an unreachable package mirror costs minutes, not the
    # 6-hour hosted-runner ceiling. On 2026-08-18 three small gates in
    # this repo each sat SIX HOURS on an `apt-get update` stall against
    # archive.ubuntu.com and were killed without ever running their
    # check; the failure then presented as "gate failed" when the gate
    # had not run at all. A short timeout keeps a red attributable to
    # the gate's own subject.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version
      - name: Run P0-n gate
        run: scripts/ci/check_multisig_doc_literals.sh
