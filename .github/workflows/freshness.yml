#
# A merge to `dev` marks the open pull requests it can break stale, and the
# `merge-next` label re-tests one (Brief C, ruled 2026-11-19).
#
# A pull request's CI runs on its head merged onto the `dev` of its last
# push. When another pull request merges first, the one still open was
# never tested against it, and each green alone can be red together
# (#1404 and #1409, #1425 and #1426, #1440 and #1447).
#
# On a push to `dev`:
#   overlap  (seconds) scripts/ci/freshness_overlap.py judges every open,
#            non-draft pull request from this repository: one the merge's
#            changes share a test with is stale. A draft is tested by its
#            own run when it is marked ready; a fork is not re-tested here,
#            since its code would run with `dev`'s tokens.
#   mark     sets `fresh-against-dev` on each such head
#            (scripts/ci/freshness_status.py): `stale`, which fails
#            `rust-pass`, with one comment per pull request naming the
#            merges and crates; or `re-testing` when the pull request
#            carries the `merge-next` label.
#   re-test  freshness-retest.yml, for each labelled one only.
#
# On the `merge-next` label (a `pull_request` event, so the workflow comes
# from the pull request's merge with `dev`; every write-token job checks out
# `dev`'s scripts by SHA): the same jobs for that pull request alone, when
# its head is not fresh. A re-test runs the tests both the pull request and
# every merge since it was last fresh reach; when there are none, the head
# goes green without a run. GitHub does not start a `pull_request` run for a
# pull request that conflicts with `dev`: a labelled head that conflicts
# stays stale until it merges `dev`.
#
# The label event cannot be `pull_request_target` or a dispatch: both take
# the workflow from the default branch, which is `main`, and this workflow
# lives on `dev`.
#
# Limits. One re-test per pull request at a time, the newest
# (freshness-retest.yml's concurrency group `freshness-pr-<N>`), so the
# re-tests running at once are at most the labelled pull requests: expected
# peak 1 to 2, the pull requests next in line to merge. There is no
# `max-parallel`: GitHub applies it within one run, each push is its own
# run, and a re-test it held back would enter its group late and cancel a
# newer one. Which status stands is decided by `dev`'s order, not by arrival
# (freshness_status.py).
#
# Each push gets its own run, unsuperseded: the overlap and mark jobs are
# seconds, and a stale mark per merge is what makes the next one cumulative.

name: ci/freshness

on:
  push:
    branches: [dev, ci-scratch/brief-c-demo-base]
  # No base filter (scripts/ci/check_pr_event_triggers.py): the overlap
  # job's condition takes a pull request on `dev` only.
  pull_request:
    types: [labeled]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  overlap:
    name: which open pull requests the merge reaches
    if: >-
      github.event_name == 'push'
      || (github.event.label.name == 'merge-next'
          && (github.base_ref == 'dev' || github.base_ref == 'ci-scratch/brief-c-demo-base')
          && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # API calls, one fetch, one dependency graph read
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      dev: ${{ steps.plan.outputs.dev }}
      marks: ${{ steps.plan.outputs.marks }}
      retests: ${{ steps.plan.outputs.retests }}
    steps:
      # `dev` itself: the pushed commit, or on the label the branch's tip
      # now (a `pull_request` run's own commit is the pull request's merge).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            python3 scripts/ci/freshness_overlap.py --plan --base "$BASE" --pr "$PR"
          else
            python3 scripts/ci/freshness_overlap.py --plan --base "$BASE" --before "$BEFORE"
          fi

  mark:
    name: mark the stale and re-tested heads
    needs: overlap
    if: needs.overlap.outputs.marks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.overlap.outputs.dev }}
          sparse-checkout: scripts/ci/freshness_status.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          FRESHNESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEV: ${{ needs.overlap.outputs.dev }}
          MARKS: ${{ needs.overlap.outputs.marks }}
        run: python3 scripts/ci/freshness_status.py mark

  retest:
    # Named by the pull request: the report finds its re-test job as
    # `#<pr> / re-test` (freshness_status.py).
    name: '#${{ matrix.pr }}'
    needs: [overlap, mark]
    # Whatever `mark` did: a head it marked before failing still gets its
    # re-test and a final status, and a report posts only where this run's
    # status is the head's newest.
    if: always() && needs.overlap.result == 'success' && needs.overlap.outputs.retests != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.overlap.outputs.retests) }}
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/freshness-retest.yml
    with:
      pr: ${{ matrix.pr }}
      head: ${{ matrix.head }}
      dev: ${{ needs.overlap.outputs.dev }}
      since: ${{ matrix.since }}
      merged: ${{ matrix.merged }}
      crates: ${{ join(matrix.crates, ', ') }}
      rust_tests: ${{ matrix.rust_tests }}
      rust_doc_pkgs: ${{ matrix.rust_doc_pkgs }}
