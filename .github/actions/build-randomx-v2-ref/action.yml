name: 'build-randomx-v2-ref'
description: >-
  Build the fork-pinned external/randomx-v2 C reference out-of-band and
  stage it in the randomx-v2-sys layout
  (`$RANDOMX_V2_INSTALL_DIR/lib/librandomx.a` + `include/randomx.h`), with
  scripts/build_randomx_v2_ref.sh: the commands a developer runs too.

  One definition on purpose: this recipe runs on x86_64 AND aarch64
  lanes, and the native-arm lane's premise is that every lane builds an
  identically-configured library — drifting copies are how one lane
  silently ends up measuring a differently-built oracle. The harness's
  audit-against-actual-code discipline (§4.5 T-A11 + §4.3) holds so long as
  the library is built from the fork-pinned submodule SHA (verified at
  runtime by T15: randomx-v2-sys fork-pin-sha == submodule HEAD).

  Requires: repo checked out (local action), a C/C++ compiler and the
  submodule's build tools installed, and RANDOMX_V2_BUILD_DIR /
  RANDOMX_V2_INSTALL_DIR in the environment.
runs:
  using: 'composite'
  steps:
    - name: build randomx-v2 C reference
      shell: bash
      run: scripts/build_randomx_v2_ref.sh
