[[run]]
device = "the floor device (Raspberry Pi 4, Cortex-A72)"
basis = "timing"
record = "docs/benchmarks/rt_p4_mlkem_decaps_timing_20261121_message.md"
commit = "7297b5cfbc"
target = "aarch64-unknown-linux-gnu"
toolchain = "1.94.0"
rustflags = []

[run.profile_release]
panic = "abort"
overflow-checks = true

[[run]]
device = "the maintainer's Windows laptop (Intel Core i9-11950H, Tiger Lake)"
basis = "timing"
record = "docs/benchmarks/rt_p4_mlkem_decaps_timing_20261121_message.md"
commit = "7297b5cfbc"
target = "x86_64-pc-windows-msvc"
toolchain = "1.94.0"
rustflags = ["-C", "target-feature=+crt-static"]

[run.profile_release]
panic = "abort"
overflow-checks = true
