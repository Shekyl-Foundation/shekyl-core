#
# RT-P4's attested build: what each registered run that met RT-P4 was built
# with (RPC_CHANNEL.md §9 RT-P4 and §13 RT-W9, standing check; RT-O22,
# ruled 2026-10-11; widened 2026-10-22 to every flag source).
#
# scripts/ci/check_rt_p4_standing.py compares the recognised snapshot with
# this file. An unrecognised key is not by itself a re-run. Drift is a
# recognised setting that differs, and the message names the device and
# what to run. An entry outside its key set is invalid, and the scan
# continues with the other entries.
#
# An entry rests on one of two kinds of evidence (`basis`, ruled 2026-10-25):
#   timing       a registered RT-P4 run on the device; `record` names it.
#   disassembly  a build whose decapsulation code is identical, by
#                disassembly, to an attested timing run's
#                (`identical_to_record`, `identical_to_commit`). The
#                comparison is committed (`comparison`) and pinned by its
#                SHA-256 (`comparison_sha256`). A build whose decapsulation
#                code differs needs a timing run.
#
# Both entries are timing runs under the 2026-10-25 pass line
# (invalid-vs-invalid differing only in the decrypted message), registered
# 2026-11-21 and run on the commit that carries the registration,
# 7297b5cfbc (rt_p4_mlkem_decaps_timing_20261121_message.md): the floor
# device a second Raspberry Pi 4 (its binary cross-built for aarch64 with the
# same toolchain and no rustflags), the laptop with +crt-static from
# rust/.cargo/config.toml. Both passed. The valid-against-invalid difference
# the laptop shows is information under those lines, accepted by the
# maintainer at the figures that record states (2026-11-21).
#
# What `rustflags` leaves out, and why:
#   - cmake/BuildRust.cmake gives a cross build `CARGO_TARGET_<T>_RUSTFLAGS`
#     made of `-C link-arg=` values. They change the link, not the code, and
#     the gate holds every `-C` in that file to `link-arg=`; anything else
#     there is unrecognised.
#   - The gate reads files. A RUSTFLAGS set in a build machine's environment
#     is outside it (it would also replace the config's flags); the build
#     sets none for an MSVC target.
#
# [crates] is the decapsulation closure of fips203, one table for every
# run: each crate in the measured image, pinned by version and checksum.
# Three cuts, each a crate that is not object code on that path (the
# committed disassembly is fips203, subtle, keccak, sha3, zeroize):
#   - `rand_core` and `cpufeatures` are leaves. They are pinned and not
#     expanded. `rand_core`'s only edge is `getrandom`, fips203's
#     `default-rng` feature; decapsulation takes no RNG. `cpufeatures`'s
#     edge is `libc`, FFI declarations; the detection logic is in
#     cpufeatures.
#   - A `*_derive` crate is a leaf for the same reason: the macro is part
#     of the build, and its host crates are not part of the image.
#   - `version_check` is generic-array's build script. It is not pinned.
# A crate outside this closure does not drift the attestation. A new edge
# that is none of these cuts does.
#
# [[unmeasured]] names a target that carries rustflags and has no run.
# `aarch64-pc-windows-msvc` carries the same `+crt-static` as the attested
# x86_64 MSVC target. RT-P4 has no aarch64 Windows run.
#
# Fields of a run. A key outside this set is invalid:
#   device               the measured machine, by role
#   basis                timing | disassembly
#   record               the record carrying the evidence
#   commit               the commit the evidence's binary was built from
#   target               the target triple
#   identical_to_record  (disassembly) the timing run's record
#   identical_to_commit  (disassembly) the timing run's commit
#   comparison           (disassembly) the committed comparison
#   comparison_sha256    (disassembly) its SHA-256
#   toolchain            rust/rust-toolchain.toml [toolchain] channel
#   rustflags            the recognised rustflags for `target`
#   profile_release      the recognised keys of [profile.release]

