#
# Measurement ledger: one row per constant whose value is justified by a
# measured cost or latency. Read by `scripts/ci/check_measurement_ledger.py`,
# which fails when a row's stated status disagrees with git. Its header says
# what each status means and how a failure is cleared; `README.md` beside
# this file says how to add a row.
#
# A constant binds what is true of that value alone:
#
#   defined_in / needle   where the constant lives and the text that states
#                         its value. A changed value fails the row.
#   measured_by           the tracked benchmark(s) in `tracked_set` that
#                         produce the number.
#   capture / capture_rev the evidence in the tree and the revision of the
#                         code it was taken on. `rev_source` says where the
#                         revision comes from when the capture does not
#                         record one.
#   path_set              the `[[path_set]]` whose spec is the code the
#                         constant budgets. Several constants name one path
#                         set when they share one cost, and that cost is
#                         acknowledged once.
#
# A path set is heard once. `stale_through` lists the commits to its spec
# a stale constant has heard, each with a note on what the change does to
# the cost; a commit that is in none of their histories fails every stale
# constant on that path set until its author adds an entry. `cleared` is
# the same list for a current constant, with `reason` in place of `note`.
# A stale constant does not read `cleared`. Entries are a set: name your
# own commit, in any order.
#
# The only edit that retires a stale constant is a capture, under the same
# name, whose revision contains that constant's `stale_since`.
#
# `[[toolchain]]` holds one acknowledgment per change to `toolchain_file`,
# for the whole ledger. It is owed while any constant is current across the
# change, because a compiler bump is on no path set's spec and moves them
# all. A toolchain entry names the commit that touched the pin (`commit`).
# A path-set entry names a commit whose history the path set has heard
# (`through`). Those are different facts and stay different keys.
#
# NOT IN THIS LEDGER, by class, so that an absent constant can be told from a
# forgotten one (the register is section 4 of the tracked-set document):
#
#   re-measured by CI on every run   the RandomX latency-ratio bounds; the
#                                    key-dispatch ratio. A capture cannot go
#                                    stale when there is none.
#   derived from rows that are here  `ADOPTED_PROPAGATION_TIMEOUT_SECS`, from
#                                    the transit, fluff-return and verify
#                                    cells.
#   Tor's protocol, not device work  `P2P_ANON_FAILED_ADDR_FORGET_SECONDS`,
#                                    `P2P_DEFAULT_SOCKS_CONNECT_TIMEOUT`
#                                    (BA-Q13).
#   ruled as resting on no           `CHALLENGE_RESPONSE_BLOCKS`.
#   measurement
#   a ruling that left no constant   the weight-window read shape; the
#                                    slash-scan placement.
#   named by the design, not yet a   the write-stall deadline; the clearnet
#   number                           accept-rate bound; the inbound ceiling.
#                                    Each gets a row when it gets a value.
#
# Where a capture records no revision, `capture_rev` is the last commit on
# this history BEFORE the day the run started, so that anything merged on or
# after that day reads as newer. The bound errs toward stale, which is the
# direction that gets looked at.

tracked_set = "docs/design/BENCHMARK_ALIGNMENT.md"
toolchain_file = "rust/rust-toolchain.toml"

