# --- gated rows: the daemon's block path ------------------------------
#
# A gated row is a bench the capture script runs
# (`scripts/bench/capture_rust_baseline.sh`: `BENCHES` on a pull request
# and on the push to `dev`, `NIGHTLY_BENCHES` every night), named
# `<crate>::<gungraun-target>`. It has no capture to go stale, because the
# gate re-measures it on every run; it is here for its path set, the code
# whose change can move its counts.

# The spec names the crates whose code the rows enter. It is not the list of
# everything they call: the capture's scope reaches a row through the
# reverse closure over linked dependencies, so a change confined to a crate
# these link (the curve crates, the hash crate, the hybrid combiner) puts a
# listed crate in the closure and runs the row. The classifier's selftest
# holds that for two such crates.
