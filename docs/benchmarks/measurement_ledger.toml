  { through = "29d3d75860", note = "Send and receive instants leave the connection board and sit on the byte tally, so a new second no longer republishes every row. That republish was outside the dial, handshake, and gap waits. A direct clearnet connect counts only when the peer refuses it. Not re-measured." },
  { through = "34567c4930", note = "The byte stamp is monotonic and taken when the socket reads or writes, instead of a unix millisecond when the rate gate grants a chunk. Before the first byte the mark is admission on that clock. The dial, handshake, and gap waits are unchanged. Not re-measured." },
