[[path_set]]
id = "serve-floor-verdict"
spec = [
  "rust/shekyl-p-serve/src",
  ":(exclude,glob)rust/shekyl-p-serve/src/*_tests.rs",
  "rust/shekyl-engine-core/src/engine/stake_engine/body_store_actor.rs",
]
stale_through = [
  { through = "155e85a130", note = "PR #995. Its code commit, bfcf46c092, is arm B of the same capture: every line of the verdict was read on it beside arm A and holds there, with an abandoned full segment at 3.8 ms against 3.9. The two commits after it reword doc comments in delivery.rs and serve.rs and change no code." },
  { through = "01aa01fd31", note = "SH-2 (PR #990): a doc comment on PServeEndpoint::bind in serve.rs, which no longer names the deleted NoResidentKey. No code changed; the verdict's arms are untouched." },
  { through = "9cb164d28e", note = "SH-2 (PR #990): the six serve counters become one clonable ServeCounterReader the endpoint owns; the accept loop increments the same atomics and the getters delegate. The verdict is over what an abandoned request costs the serve path, and no read, hash, sign or socket operation on that path is added, removed or reordered; the counter stores it already made are the same stores." },
  { through = "8238319ac3", note = "SH-2 review (PR #990): ServeCounterReader moves from serve.rs into serve_counters.rs. The accept loop holds one crate-private writer and clones it into each connection; that clone copies all six arcs, where the connection previously cloned the four it increments. The floor verdict is what an abandoned request costs, and no read, hash, sign or socket operation on that path is added, removed or reordered. The two extra arc clones are not part of the verdict's arms." },
  { through = "112a9a62bf", note = "SH-2 review (PR #990): the public module docs in serve_counters.rs no longer link the crate-private writer, which rustdoc -D warnings rejects. Doc text only; no executable code changed, and the verdict's arms are untouched." },
  { through = "24f769906", note = "SF-D8 amendment (PR #1015): the body streams unframed. What leaves the serve path is the RF-D4 frame header — one ~20-byte hasher update and one small write per response; the body length now comes from the provider. The verdict is what an abandoned request costs over one that serves nothing, and on that path no read, hash pass over the body, signature or socket operation is added, removed or reordered. The verdict is bound to W, which this commit does not change." },
  { through = "11a2d409f", note = "Doc comment in provider.rs on what a leaf-segment body is refused as. No executable code changed; the verdict's arms are untouched." },
  { through = "8ed51316e", note = "StoreShardProvider reads the sealed body store: each chunk is an AEAD open where the floor capture read a frozen segment. One decrypt per chunk is added on the serve path. Not measured." },
  { through = "dc40167ad", note = "A doc comment in provider.rs: content-length is fixed from the meta row before any chunk byte, and a later chunk authentication failure can only close the stream. No read, hash, sign or socket operation changed. The key check this commit adds is at store open, off this path." },
  { through = "976c7d0564", note = "p-serve (976c7d0564): the write-stall bound counts only waits the peer causes. write_bounded tries the socket on every poll, arms the 30 s clock only when a poll finds no room and clears it on progress; a starved serving task that finds the socket writable is never charged. Chunk size, read, digest and sign are untouched, so a served response costs what it did; the change moves only the cut a starved task could suffer, and the next floor block should show zero cuts. Not re-measured." },
  { through = "8eb6b3bea8", note = "p-serve (8eb6b3bea8): the stall bound is a timeout around each write, the bytes the socket will take, in place of a sleep beside one poll of the slice. Same rule: bytes accepted start the clock over, and a poll that finds the socket writable writes however late it is. Tests fail if the timeout wraps write_all again. Chunk size, read, digest and sign are unchanged, so a served response costs what it did. Not re-measured." },
  { through = "9a0fab2a41", note = "FND-21 (PR #1049), two commits. The first adds test fixtures under src/wire_pin and no code. The second makes the signer trait const-generic over the envelope width; the serve loop takes the width from its signer where it read one constant. The verdict is over what an abandoned request costs before the envelope, and nothing ahead of the envelope changed: the head, the reads and the fold are the same calls in the same order, and the live scheme's response is byte-identical to fixtures captured before the change. Not measured." },
  { through = "37b8beb1b8", note = "FND-21 follow-up (PR #1049): sign_receipt_transcript pairs a transcript with the receipt domain. sign_pass_transcript is the same one line. The live serve loop still signs with the identity key and does not call the new function; the test receipt signer changes are behind cfg(test) and the test-signer feature. The verdict is what an abandoned request costs before the envelope, and no read, hash, sign or socket operation on that path is added, removed or reordered. The receipt-key changes in engine-core are off this path set. Not measured." },
  { through = "e8740ab466", note = "PR #1049 review: the doc comment of sign_receipt_transcript in countersign.rs states that the function is STAGED, who makes it live and its falsifier. Doc comment only; the verdict's arms are untouched." },
  { through = "45a115cc3f", note = "p-serve (45a115cc3f): the write-stall tests move into serve_stall_tests.rs, and write_bounded's writer parameter is renamed from W to S so W stays the envelope width. The stall bound is the same timeout around each write. Chunk size, read, digest and sign are unchanged, so a served response costs what it did. Not re-measured." },
  { through = "be38532e2b", note = "Two unused type aliases (IdentityPassKey, IdentityPassSigner) and their re-export deleted from shekyl-p-serve; shekyl-p-fetch gains PassVerifyingKey::WITHIN_WIDEST, a compile-time assertion that a scheme's envelope is within the widest, evaluated in max_response_len as a unit constant. No read, hash, signature or socket operation on the serve or fetch path is added, removed or reordered, and nothing runs at run time that did not before. Not re-measured." },
  { through = "08af7470a1", note = "The pass transcript opens with a stream byte, so a served response signs 113 bytes where it signed 112, and a header that does not decode is refused before the store. A valid economy header is the previous 72 bytes with a leading zero. The floor verdict prices an abandoned request, which never reaches the signature; the extra byte is on the header check ahead of the body. Not re-measured." },
  { through = "1871825227", note = "The module comment in serve.rs states that 73-byte header and 113-byte transcript. No executable code changed, so a served response costs what it did at 08af7470a1. Not re-measured." },
  { through = "efa02f64b", note = "The served identity pin is regenerated from the same seeds, so the signature covers the 113-byte transcript 08af7470a1 already signs. Fixture bytes only. No read, hash, sign or socket operation on the serve path changed. Not re-measured." },
  { through = "24ef80f60c", note = "The serve provider reads a held shard through HeldShardSource. A served body asks the body-store actor once to open and once per chunk; the endpoint's blocking thread waits, and the actor does the redb read and the AEAD open. An abandoned request that never opens a shard does not pay that hop. The floor probe's BodyStore source still reads in process. A response's bytes are unchanged. Not re-measured; the rows stay stale from the sealed-body decrypt." },
  { through = "d85697a328", note = "The body-store actor leaves the engine runtime for its own one-worker runtime, sk-body-store, whose threads lower themselves to serving nice before they take work. The redb read and the chunk decrypt of a served body run there for the whole session. The endpoint thread still only waits. Not re-measured; the rows stay stale." },
  { through = "ec931d5858", note = "Only test files and the identity wire-pin fixtures changed: the fixtures were re-recorded because the derived persona keys moved (NI-R7). No serving code changed. Not re-measured." },
  { through = "a867b6840c", note = "Test fixtures only: the p-fetch and p-serve identity wire pins (src/wire_pin/*.hex) re-recorded because the derivation salt name_id || purpose moved the pinned persona keys. No serve or fetch code changed, no cost moved. Not re-measured." },
]

