  { through = "d5d908bc76", note = "The link budget drops its activity clock. The copy holds a direction lease so abort releases the byte stamp, and the connector seals the session once before aborting the other half. The clock and the clearnet tests moved to their own modules. Dial, handshake, and gap waits are unchanged. Not re-measured." },
