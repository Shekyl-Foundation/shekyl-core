[[path_set]]
id = "serve-floor-verdict"
spec = [
  "rust/shekyl-p-serve/src",
  ":(exclude,glob)rust/shekyl-p-serve/src/*_tests.rs",
]
cleared = [
  { through = "155e85a130", reason = "PR #995. Its code commit, bfcf46c092, is arm B of the same capture: every line of the verdict was read on it beside arm A and holds there, with an abandoned full segment at 3.8 ms against 3.9. The two commits after it reword doc comments in delivery.rs and serve.rs and change no code." },
  { through = "01aa01fd31", reason = "SH-2 (PR #990): a doc comment on PServeEndpoint::bind in serve.rs, which no longer names the deleted NoResidentKey. No code changed; the verdict's arms are untouched." },
  { through = "9cb164d28e", reason = "SH-2 (PR #990): the six serve counters become one clonable ServeCounterReader the endpoint owns; the accept loop increments the same atomics and the getters delegate. The verdict is over what an abandoned request costs the serve path, and no read, hash, sign or socket operation on that path is added, removed or reordered; the counter stores it already made are the same stores." },
  { through = "8238319ac3", reason = "SH-2 review (PR #990): ServeCounterReader moves from serve.rs into serve_counters.rs. The accept loop holds one crate-private writer and clones it into each connection; that clone copies all six arcs, where the connection previously cloned the four it increments. The floor verdict is what an abandoned request costs, and no read, hash, sign or socket operation on that path is added, removed or reordered. The two extra arc clones are not part of the verdict's arms." },
  { through = "112a9a62bf", reason = "SH-2 review (PR #990): the public module docs in serve_counters.rs no longer link the crate-private writer, which rustdoc -D warnings rejects. Doc text only; no executable code changed, and the verdict's arms are untouched." },
]

[[path_set]]
id = "archival-serve-fetch"
spec = [
  "rust/shekyl-p-serve/src",
  ":(exclude,glob)rust/shekyl-p-serve/src/*_tests.rs",
  "rust/shekyl-p-fetch/src",
  ":(exclude,glob)rust/shekyl-p-fetch/src/*_tests.rs",
]
stale_through = [
  { through = "765d6991ba", note = "PR #969 (dev, 2026-10-05): the pass-digest audit bound to its types — a rewritten doc comment in served_frame.rs and pass_anchor.rs and a new test in delivery.rs. No production code path changed, so no cost moved. Heard here by the next branch to merge it, since the gate landed between the two." },
  { through = "cd51261ab2", note = "PR #954: the serve path reads each shard twice and digests it per response, and the client digests what it received. Serve cost rose by 78 ms of CPU per response on the floor, and throughput at 8 in flight halved (docs/benchmarks/sfd8_serve_cost_floor_device_20261005.md; BA-G1)." },
  { through = "b5e7dbfed5", note = "PR #961: both serve reads fold through one framed digest. No read or hash pass is added or removed; not measured." },
  { through = "bfbd0d915c", note = "The serve path reads each shard once and digests it once, where #954 read and digested twice; the signature is made after the send. An invalid request is refused before the store is consulted. Measured on the floor device at 7c9140f297: 67.2 ms per response against 102.7 ms on the two-read tree and 24.6 ms before the digest (docs/benchmarks/sfd8_serve_cost_floor_device_20261005.md, run 3). The constants stay stale: the run prices the serve path over loopback and does not re-run the readings they rest on." },
  { through = "c5e45d4a54", note = "A bare 503 for a store, tip or key fault; one can_sign call before the body; a refusal trailer written when the signer fails after it; the client compares the envelope to the trailer and types the 503. A good read gains the can_sign call and one envelope comparison and nothing else. Not measured; the run-3 arm predates it." },
  { through = "096c742626", note = "Doc comments only, in shekyl-p-fetch error.rs and shekyl-p-host host.rs. No executable serve or fetch code changed." },
  { through = "2bc0b9fd61", note = "Three commits on the single-pass serve. The pre-flight is PassKey::ready(shard_id, anchor_height) with no default, in place of can_sign: still one call before the body. A signing failure after the body increments its own counter in place of the pooled one. The response writer takes any AsyncWrite so a test can stand a sink in for the socket; TcpStream is the only production caller. No read, hash or sign is added, removed or moved. Not measured." },
  { through = "f7740a762b", note = "Review follow-up in provider.rs: the test-only counting body counts chunks yielded rather than calls. Compiled only under cfg(test); no shipped code path changed and no cost moved." },
  { through = "bb9ce3a8c8", note = "BA-T3 seam: three blocking-pool closures in serve.rs become named functions and the 200 head is rendered by one; three bench-only compositions are added behind a feature that is not on the shipped graph. No read, hash or sign is added, removed or reordered, and a seam test holds the composition to the endpoint on bytes and on counts of opens, chunk reads and signatures. This is the commit that adds the gate; its first counts are in the manifest, section 12." },
  { through = "ac52a7a35d", note = "Review follow-up: the fold of a chunk into the delivery digest becomes one function, fold_chunk, called by write_response and by the bench compositions. Same reads, same hash, same order, still on the thread it ran on; BA-T3 moved by a few hundred instructions in 191 million." },
  { through = "ead1aa0799", note = "Review follow-up: the endpoint's accept loop moves into one function so a test-only constructor can pin the accepted sockets' send buffer; the production bind is unchanged and pins nothing. A doc comment in countersign.rs is corrected. No read, hash, sign or socket option changes on the shipped path." },
  { through = "01aa01fd31", note = "SH-2 (PR #990): a doc comment on PServeEndpoint::bind in serve.rs, which no longer names the deleted NoResidentKey. No executable serve or fetch code changed in this crate; the key the host binds is shekyl-engine-core's and its cost (one actor round-trip per sign) is on the serving task's path, not this set's." },
  { through = "bfcf46c092", note = "The delivery-digest fold moves from the async executor into the blocking-pool hop that reads the chunk (read_and_fold). The instruction count is unchanged by design, same work on a different thread, so BA-T3 cannot see what this change is for; it moved by 0.007 % on a full response for a different reason, the digest state travelling through each hop by value. The evidence for or against the move is the floor: BA-T5, executor wake lateness at eight in flight with this commit as one arm. Not yet measured." },
  { through = "9a01008b42", note = "Review follow-up: doc comments in delivery.rs and serve.rs reworded to the guarantee the types give. No code changed; no cost moved." },
  { through = "155e85a130", note = "Review follow-up: a doc comment in delivery.rs says which part of the digest moved off the executor. No code changed; no cost moved." },
  { through = "9cb164d28e", note = "SH-2 (PR #990): the six serve counters in serve.rs move from loose Arc<AtomicU64> locals into one clonable ServeCounterReader the endpoint owns and hands out; the accept loop increments the same atomics it did, and the endpoint's count getters delegate to the reader. Reads of the counters happen on the serving task's health probe, off this path. No read, hash, sign or socket operation is added, removed or reordered on the shipped serve path; not measured." },
  { through = "8238319ac3", note = "SH-2 review (PR #990): ServeCounterReader moves from serve.rs into serve_counters.rs. The accept loop holds one crate-private writer and clones it into each connection; that clone copies all six arcs, where the connection previously cloned the four it increments. Increments stay a relaxed fetch_add of one on the same six atomics at the same events. No read, hash, sign or socket operation is added, removed or reordered on the shipped serve path. Not measured." },
  { through = "112a9a62bf", note = "SH-2 review (PR #990): the public module docs in serve_counters.rs no longer link the crate-private writer, which rustdoc -D warnings rejects. Doc text only. No read, hash, sign or socket operation changed. Not measured." },
]

