  { through = "01aa01fd31", note = "SH-2 (PR #990): a doc comment on PServeEndpoint::bind in serve.rs, which no longer names the deleted NoResidentKey. No executable serve or fetch code changed in this crate; the key the host binds is shekyl-engine-core's and its cost (one actor round-trip per sign) is on the serving task's path, not this set's." },
  { through = "bfcf46c092", note = "The delivery-digest fold moves from the async executor into the blocking-pool hop that reads the chunk (read_and_fold). The instruction count is unchanged by design, same work on a different thread, so BA-T3 cannot see what this change is for; it moved by 0.007 % on a full response for a different reason, the digest state travelling through each hop by value. The evidence for or against the move is the floor: BA-T5, executor wake lateness at eight in flight with this commit as one arm. Not yet measured." },
