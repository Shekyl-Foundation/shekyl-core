  { through = "5089df9db", reason = "RT-W9 close-out F4: Poly1305 wipes its state when dropped and HMAC-BLAKE2s writes its digests to wiped arrays. The handshake makes a few dozen HMAC and AEAD calls, each now ending in a wipe of tens of bytes: nanoseconds against RT-P6s 2,163.8 us. The constant is not moved." },
