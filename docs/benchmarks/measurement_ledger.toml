  { through = "976c7d0564", note = "p-serve (976c7d0564): the write-stall bound counts only waits the peer causes. write_bounded tries the socket on every poll, arms the 30 s clock only when a poll finds no room and clears it on progress; a starved serving task that finds the socket writable is never charged. Chunk size, read, digest and sign are untouched, so a served response costs what it did; the change moves only the cut a starved task could suffer, and the next floor block should show zero cuts. Not re-measured." },
  { through = "8eb6b3bea8", note = "p-serve (8eb6b3bea8): the stall bound is a timeout around each write, the bytes the socket will take, in place of a sleep beside one poll of the slice. Same rule: bytes accepted start the clock over, and a poll that finds the socket writable writes however late it is. Tests fail if the timeout wraps write_all again. Chunk size, read, digest and sign are unchanged, so a served response costs what it did. Not re-measured." },
  { through = "b25727e077", note = "FND-21 (PR #1049), three commits. The first adds test fixtures under src/wire_pin and no code. The second makes the signer trait const-generic over the envelope width: the serve loop takes the width from its signer where it read one constant, and the envelope is encoded through a sealed trait that monomorphizes to the same to_canonical_bytes and array conversion. No read, hash, signature or socket write is added or removed, and the whole response for the live scheme is byte-identical to fixtures captured before the change (serve_wire_pin_tests.rs). The third makes the fetch target generic over its key: the client reads the envelope into a heap buffer of the scheme's width where it filled a 3,385-byte stack array, which is one allocation per response, and parses and verifies through a trait that monomorphizes to the same two calls. Not measured." },
  { through = "37b8beb1b8", note = "FND-21 follow-up (PR #1049): sign_receipt_transcript pairs a transcript with the receipt domain. sign_pass_transcript is the same one line. The live serve loop still signs with the identity key and does not call the new function; the fetch client is untouched; the test receipt signer changes are behind cfg(test) and the test-signer feature. No read, hash, sign, retry or socket operation on the shipped identity path is added, removed or reordered. The receipt-key changes in engine-core are off this path set. Not measured." },
  { through = "e8740ab466", note = "PR #1049 review: the doc comment of sign_receipt_transcript in countersign.rs states that the function is STAGED, who makes it live and its falsifier. Doc comment only; no executable serve or fetch code changed." },
  { through = "45a115cc3f", note = "p-serve (45a115cc3f): the write-stall tests move into serve_stall_tests.rs, and write_bounded's writer parameter is renamed from W to S so W stays the envelope width. The stall bound is the same timeout around each write. No read, hash, sign or socket operation on the serve or fetch path is added, removed or reordered. Not re-measured." },
  { through = "be38532e2b", note = "Two unused type aliases (IdentityPassKey, IdentityPassSigner) and their re-export deleted from shekyl-p-serve; shekyl-p-fetch gains PassVerifyingKey::WITHIN_WIDEST, a compile-time assertion that a scheme's envelope is within the widest, evaluated in max_response_len as a unit constant. No read, hash, signature or socket operation on the serve or fetch path is added, removed or reordered, and nothing runs at run time that did not before. Not re-measured." },
  { through = "08af7470a1", note = "The request header and the transcript open with a stream byte. The client writes one leading zero on an economy read and verifies that byte; the server signs 113 bytes where it signed 112 and refuses a header that does not decode before it opens the store. One extra byte on the wire and in the signed message. The readings these constants rest on predate it. Not re-measured." },
  { through = "1871825227", note = "Comments in serve.rs name the 73-byte header and the 113-byte transcript. No executable serve or fetch code changed. Not re-measured." },
  { through = "efa02f64b", note = "The identity exchange pins are regenerated from the same seeds. The request carries the 73-byte header with the economy stream byte first, and the signed responses cover the 113-byte transcript. Those are the bytes 08af7470a1 already exchanges. Fixture bytes only; no read, hash, sign or socket operation on the serve or fetch path changed. Not re-measured." },
  { through = "678eb42df", note = "SO-D12 4c: RequestHeader::on_stream in shekyl-p-fetch header.rs builds the same 73-byte header with a caller-named stream byte, so a challenge read on the support stream carries the stream its receipt verifies under. Same bytes per read, same handshake; no read, hash, sign or socket operation is added. Not re-measured." },
  { through = "3a1e5a9d4", note = "SO-D12 4c: Malformed::FrameLong carries the count of content bytes left ahead of the envelope, the value the reader already held when it refused. One u64 in an error value on a refused read; a good read is unchanged. Not re-measured." },
  { through = "6cf2bff68", note = "SO-D12 4c: Timeouts::fetch_ceiling in shekyl-p-fetch client.rs is a const fn summing the existing bounds, called at compile time by the bundle producer; no fetch runs it. The producer now starts at most MAX_INFLIGHT (8) challenge reads at once where it spawned every due read and let the rest queue on the client's semaphore, so the client's concurrency is the 8 it already was. No read, hash, signature or socket operation is added. Not re-measured." },
  { through = "6e5d82e510", note = "The fetch client can read its SOCKS address at each fetch (the managed Tor's route) instead of holding one: a function call before the TCP connect, and with no route the fetch is Stall::NoRoute before any I/O. The dial, the head and body reads and the countersignature check are unchanged. Not re-measured." },
  { through = "24ef80f60c", note = "The serve provider reads a held shard through HeldShardSource. A served body asks the body-store actor once to open and once per chunk; the endpoint's blocking thread waits, and the actor does the redb read and the AEAD open. One actor round trip per chunk is added on the wallet's serve path. The floor probe's BodyStore source still reads in process, and the fetch client is unchanged. A response's bytes are unchanged. Not re-measured; the rows stay stale." },
  { through = "d85697a328", note = "The body-store actor leaves the engine runtime for its own one-worker runtime, sk-body-store, whose threads lower themselves to serving nice before they take work. The redb read and the chunk decrypt of a served body run there for the whole session. The endpoint thread still only waits, and the fetch client is unchanged. Not re-measured; the rows stay stale." },
  { through = "ec931d5858", note = "Only test files and the identity wire-pin fixtures changed: the fixtures were re-recorded because the derived persona keys moved (NI-R7). No serving or fetch code changed. Not re-measured." },
  { through = "a867b6840c", note = "Test fixtures only: the p-fetch and p-serve identity wire pins (src/wire_pin/*.hex) re-recorded because the derivation salt name_id || purpose moved the pinned persona keys. No serve or fetch code changed, no cost moved. Not re-measured." },
  { through = "d6e8da7d44", note = "Rules after the C++ removal (#1308): shekyl-p-fetch's crate root takes #![deny(unsafe_code)]; the crate holds no unsafe, so the attribute compiles to nothing and nothing the captures priced has moved." },
  { through = "34255a8945", note = "rpc 4.0: shekyl-p-fetch's client gains PFetchClient::with_slots, so one client is sized to the producer's reads plus the view's two flights (VIEW_SLOTS, 2) instead of MAX_INFLIGHT (8). A fetch still dials, reads, hashes and checks; per-response serve work is unchanged. The composed cap can exceed 8 when both lanes run. Not re-measured; the rows stay stale." },
]

