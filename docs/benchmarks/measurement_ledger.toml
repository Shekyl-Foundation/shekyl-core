  { through = "155e85a130", note = "Review follow-up: a doc comment in delivery.rs says which part of the digest moved off the executor. No code changed; no cost moved." },
  { through = "598596ba2f", note = "The fetch dial names Isolation::Persona. Isolation::Read was the same username/password greeting and is deleted. The bytes on the wire are the header's nonce credentials, already heard at 6068ba31e9 and 71b41cb6cf. No read, hash, retry, or circuit is added. Not re-measured." },
