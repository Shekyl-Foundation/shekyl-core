  { through = "eba86c7ff9", note = "The refused-dial test holds a bound socket that is not listening, so a parallel test cannot accept the port. Only that test changed. Dial, handshake, and gap waits are unchanged. Not re-measured." },
  { through = "c1eaab634f", note = "A zone's connector cap is released when that zone stops, and a zone that did not set a cap clears one a previous zone left. Dial, handshake, and gap waits are unchanged. Not re-measured." },
  { through = "3953422bd1", note = "The declaration records measured transit, read from the relay-privacy table. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "4363637e68", note = "The declaration records cover class, and the relay reads that cell and the transit cell. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "3035d6c1fb", note = "The transit cell is transit_ms, a DerivationMs carrying its basis (Assumption), instead of a bare u32; the declaration table is otherwise unchanged. Dial, handshake, and gap I/O are unchanged. Not re-measured; under Ruling B these spans are CppPath and are measured again on the Rust dialer after the cutover (DAEMON_RELAY_PRIVACY.md section 97)." },
  { through = "b3bc220aab", note = "The transit cell's type is DerivationMs built by a named constructor, with AdmissibleBasis in place of the marker types; the declaration table's values are unchanged. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "4bc4ad7380", note = "A doc comment in declaration.rs names the hidden stem slot's pin in place of the own-edge draw (PR-1, #1018). No code changed in these paths. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "cb7cfe943d", note = "SH-3: shekyl_runtime::runtime gained a thread-start hook parameter at this commit (a ThreadStart, since reshaped into ThreadHooks on runtime_with_thread_hooks; the two-argument runtime came back at da7b70c8cf, heard below). The clearnet tests passed the empty hook, so their runtime threads started exactly as before; no production path in this set changed. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "da7b70c8cf", note = "SH-3: the ordinary runtime constructor is a budget and a name again. The clearnet tests call it with the same two arguments they had before the hook parameter (the serving runtime alone uses ThreadHooks through runtime_with_thread_hooks), so their runtime threads start as before. No production path in this set changed. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "3081ba830b", note = "The failed-address predicate (implicates_address) answers true only for an onion dial with a destination-naming proxy reply; every clearnet cause is false. It runs after a dial has ended and decides whether the address is remembered. The clearnet dial, handshake, and gap waits do the same I/O. Not re-measured." },
  { through = "3a0d211d80", note = "The failed-address predicate reads the destination_authenticated cell of the connector declaration in place of matching the connector. Clearnet still answers false for every cause. It runs after a dial has ended. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "e3a167bac2", note = "RT-W9 step 1 (PR #1038): the record layer (aead.rs, channel.rs) and the handshake's symmetric state move out of shekyl-p2p-transport into a new crate, shekyl-noise, which this path set now names so that later changes to that code are heard here. A refactor: the same functions run in the same order on the same bytes, the pinned handshake vectors are untouched and their test is byte-identical. Split now returns a named struct instead of the caller taking the chaining key out of the state, which is one move of three 32-byte values per handshake. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "482da291c5", note = "RT-W9 step 2 at this commit: SymmetricState::mix_key_and_hash for the hybridXK static-KEM tokens, and a three-output HKDF beside the two-output one. A has_key accessor landed with no caller. The P2P handshake and the clearnet connector call none of them. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "edcae056fc", note = "RT-W9 step 1 review (PR #1038): SymmetricState::into_halves owns the initiator/responder key order, and the hash, HKDF and AEAD stay crate-private. The same HKDF still feeds the same two record directions; the pinned handshake vectors are untouched. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "1c42c17c21", note = "RT-W9 step 1 review (PR #1038): into_halves and Established::split are must_use. No bytes on the wire moved. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "d03aeb2e0f", note = "RT-W9 step 1 review (PR #1038): the split yields two Directions, and the length-prefixed framer stays in shekyl-p2p-transport. The same HKDF still feeds the same two record directions; the pinned handshake vectors and the post-rekey record are untouched. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "4ae7de867a", note = "RT-W9 step 2 (PR #1039): has_key is gone and the two HKDF functions are one. The two-output bytes are unchanged, and the P2P handshake still uses two outputs. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "7813b29af9", note = "RT-W9 step 2: Direction counts the ciphertexts it has opened (one saturating add of a u64 on each successful open, none on a failed tag) and exposes the count, for the RPC handshake's pending session to gate on. The P2P record path opens through Direction, so that add is on it, twice per record. It is one integer add beside two AEAD operations; no I/O changed. Dial, handshake, and gap waits are unchanged. Not re-measured." },
  { through = "b57c18478e", note = "PR-3 (#1056): the spans moved from the C++ transport_spans to shekyl-transport-layer::spans, the same numbers with the same provenance comment; the connectors read them from the zone host as before. The outbound cap and its floor moved to the dialer; the dial path is the Rust dialer, whose deadlines these are. Not re-measured: Ruling B measures them again on the Rust path after the cutover." },
  { through = "fbfc1fff5", note = "PR-3 diagnosis instrumentation: debug lines at the clearnet dial, the handshake, the first bytes read and the gap's wake, each a tracing call beside the existing I/O. The dial, handshake and gap waits do the same I/O. Not re-measured." },
  { through = "dc9130534", note = "PR-3 fix 2 (Rick, 2026-10-14): the gap now ends at the peer's first complete Levin frame, not at this node's handshake verdict, and a fired wake waits one IO driver turn for the reader before it times the peer out. This changes what the gap span bounds: the capture measured channel to verdict, which includes this node's own handshake work, so it overstates the peer's silence the gap now measures. The span stays as it is until the cold-first-contact rerun measures channel to first frame. The dial is unchanged. Not re-measured." },
  { through = "034bbdd5e", note = "PR-3, the measurement build (Rick, 2026-10-14): under the measurement-spans feature, set only by CMake's SHEKYL_MEASUREMENT_SPANS (default OFF, gated out of release by check_measurement_spans.py), the Tor dial and gap are 120 s. A default build compiles the released lines unchanged, so no released deadline or I/O moved. Not re-measured; the measurement build is what the cold-first-contact rerun measures with." },
  { through = "ee87fc633", note = "The Tor connector names its own SOCKS proxy: a failed TCP connect to it, or an exchange it closed without a reply, closes as ProxyUnavailable instead of LocalClose, with a rate-limited warning; a new close kind in cause.rs. The dial and the gap wait do the same I/O; only the close's label and one log line change. No cost moved. The clearnet path set holds cause.rs; clearnet closes are unchanged." },
  { through = "b096e8c77", note = "spans.rs changes the Tor spans and the shutdown wait only; the clearnet dial, handshake and gap constants and their I/O are unchanged. Not re-measured." },
  { through = "58ad7eac8", note = "spans.rs changes the Tor gap and its provenance comment and adds a derivation test; the clearnet dial, handshake and gap constants and their I/O are unchanged. Not re-measured." },
  { through = "189f8104a", note = "The gap ends at the peer's first complete handshake frame, where it ended at any first complete frame: a frame of another command no longer disarms it. The dial, the handshake and their I/O are unchanged; in the clearnet legs the peer's first frame was its handshake. Not re-measured." },
  { through = "cf144a645", note = "The gap and dial timeout arms stop logging the wake's identity fields at debug; the timeout and its close kind are unchanged. Logging only. Not re-measured." },
  { through = "db6e11e07", note = "Tests, the seam post and the ban view move into files of their own; no code path changes. Not re-measured." },
  { through = "f0948195c", note = "DC-Q7: a proxied clearnet dial presents the operator's RFC 1929 pair when one is configured, one sub-negotiation round trip to the operator's own proxy before CONNECT, and a refused authentication closes as ProxyUnavailable with a once-a-minute warning instead of LocalClose. A direct dial, and a proxied dial without a pair, do the same I/O. A proxied dial runs on the Tor dial's span (proxied_dial_within), which these constants do not price. Not re-measured." },
  { through = "cb507edf7", note = "A link per connector (TSR-F1): a route and an outbound facet on the seam hub, read by the connector at each dial in place of its proxy slot. No deadline and no dial I/O changes. Not re-measured." },
  { through = "f60ab687f", note = "Republishing the usable route keeps its incarnation and tells no watcher; a return from down is a new incarnation. Link bookkeeping only; no deadline and no dial I/O changes. Not re-measured." },
  { through = "21524f1a8", note = "A link subscription unsubscribes when dropped. Watcher bookkeeping only; no deadline and no dial I/O changes. Not re-measured." },
  { through = "7e9ea0f61", note = "The managed-Tor death watch follows the route now installed, and a shutdown publishes ProcessStopped. Link bookkeeping only; no deadline and no dial I/O changes. Not re-measured." },
  { through = "0d882303c3", note = "Direction carries a 32-byte handshake-hash stamp set once by into_directions, so the P2P handshake's split copies 32 bytes per direction once per session. No record seal, open or rekey reads it; the per-record path is unchanged. Not re-measured." },
  { through = "b67b94731", note = "The gap tests' frame that is not the handshake is a timed-sync request in place of the support-flags request (1007), which is deleted with the support-flags word. Only those two tests changed; no code path in these files moved. Dial, handshake, and gap waits are unchanged. Not re-measured." },
  { through = "ea68874a8", note = "RT-W9 step 5a: ClassedRecord, a new framer in shekyl-noise that the P2P transport does not use, and two crate-private reads on Direction (its next nonce and epoch, and the header-protection key). Direction's seal and open are unchanged and the P2P framer calls nothing new. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "37e6ec8ee", note = "The header-protection key is no longer a method of Direction. ClassedRecord passes the record-header label to hkdf_from_record_key and keeps the output. The P2P transport does not call it. Direction's seal and open are unchanged. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "6884efdbe", note = "ClassedError implements Display and Error, so a caller can keep the variant as the source of an io::Error. seal and open are unchanged. The P2P transport does not match on the error's text. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "969085429", note = "RT-W9 close-out F3/F5: the P2P framer holds a SendDirection and a RecvDirection in place of two Directions, and a direction checks one dead flag per seal and open. RecvHalf already killed itself on any error but truncation, so nothing it can observe changes. The same AEAD calls run on the same bytes. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "5089df9db", note = "RT-W9 close-out F4: poly1305 and the mask cipher wipe their state when dropped, and the HMAC digests land in wiped buffers. Each P2P record seal and open now ends with a wipe of the Poly1305 state (r, h, pad; tens of bytes), and each HKDF writes two digests to wiped stack arrays. Nanoseconds a record against the record path; not re-measured." },
  { through = "5671b3721", note = "rustfmt line breaks in the close-out files; no code changed. Not re-measured." },
  { through = "3c8ed9e03", note = "Crate documentation and a test helper only; no code the P2P path runs changed. Not re-measured." },
  { through = "f7c1a94de7", note = "RT-W9 close-out review: the shared direction state is private to its module, and the P2P record path still seals and opens the same AEAD on the same bytes. A non-truncation refusal sets the RecvDirection's poison flag instead of a flag on RecvHalf. A dead sealer returns Poisoned before its argument checks; the P2P sender does not use that sealer. Dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "2d5a37384", note = "Close-cause classification runs after a dial ends: opened_a_stream says whether a stream opened, and 0x01 joins the onion destination-naming set because a live service's port refuses with that byte after a working rendezvous. This commit's own edit is the comment that separates that observation from RFC 1928's general SOCKS failure; a clearnet dial still does not remember the byte, because implicates_address requires destination authentication. Dial, handshake, and gap I/O and these span constants are unchanged. Not re-measured." },
  { through = "52cc732c0", note = "The gray lifecycle, item 2: the close cause carries three marks in its padding byte, stamped at construction; names_the_destination reads the mark. The clearnet dial, its handshake, the gap and their I/O are unchanged; this moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "9356a73e6", note = "The gray lifecycle, items 3 and 4: a Tor test retries within itself and the failed-address memory is deleted. Clearnet makes one attempt per test, as before; a dial, its handshake and the gap run the same I/O under the same deadlines, and the deleted memory was a map with no I/O. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "b96997932", note = "Rick's review of #1185: cooling gray seats are evictable, the address file leaves out banned addresses at the write, and the SOCKS reply table moves from the transport layer into the Tor connector, which hands the marks in. List bookkeeping and a file filter; the clearnet dial, its handshake, the gap and their I/O are unchanged. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "97fc6cfd0", note = "The merge onto the gray lifecycle: opened_a_stream is the D12 phase, a kind that applies once the channel exists and not before it, and a proxy reply is before the channel. SOCKS 0x01 on an onion dial is final and names the destination. The clearnet dial, its handshake, the gap and their I/O are unchanged. Not re-measured. The rows stay stale for the reasons already recorded." },
  { through = "4c0766da8", note = "The in-flight bound, revision 4, items 10 and 11: the close cause carries a fourth mark, a timeout of the dial's own window, on the dial deadline's TransportTimeout and Tor's 0x06; the dialer reads it against a Tor attempt's start, and a Tor timeout at or after the managed Tor's SocksTimeout ends its test. Clearnet makes one attempt per test, as before; its dial, its handshake, the gap and their I/O are unchanged. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "7559d9f81", note = "The in-flight bound, revision 4: the dialer reads the managed Tor's window from its earliest expiry, one second inside SocksTimeout, and times each attempt inside its task; doc comments on the close cause say so. Clearnet's dial, its handshake, the gap and their I/O are unchanged. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "5a01801ee", note = "The dial profile: each connector declares its stand-off and pace numbers beside its declaration; the clearnet dial, handshake and gap constants are unchanged and the profile reads the dial deadline as clearnet's window. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "2d868c2dc", note = "The dial profile's quiet threshold: K attempts and a span S per connector, read by the dialer's quiet guard. The clearnet dial, handshake and gap constants are unchanged. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "793e30248", note = "The quiet span S is computed in the profile from K, the in-flight bound, the dial deadline and the wake spacing. It reads the dial deadline constants and changes none of them. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "0eb355bc5", note = "A doc comment on the profile's quiet-span test. No code changed. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "dc617814d", note = "Clearnet's quiet K moves from 10 to 11 (read at the bound of a series with no live failure), and its derived S from 29.15 s to 32.065 s; a doc comment in the Tor supervisor's Policy. No deadline or span constant moved. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "d9bb3e534", note = "The quiet span is derived from the row's dial deadline instead of a stored literal, and the dialer keeps only a published retry window. No deadline or span constant moved. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "56d76465a", note = "A build-time check that every dial profile row's quiet threshold is well formed. No deadline or span constant moved. This moves no cost. The rows stay stale for the reasons already recorded." },
  { through = "65d33f49ce", note = "The Tor link gains its inbound facet, published for an incarnation without calling a watcher; a new route resets it. Clearnet's link reads NotOffered and nothing writes it. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "346e890ffe", note = "Clearnet accepts check an accept-rate gate under the socket table's lock, after the ban and the ceilings and before a socket is reserved; clearnet's row is not assessed, so no node builds a gate yet and an accept does the same work as before. Dial, handshake, and gap I/O are unchanged. Not re-measured." },  { through = "cfcfefd4c0", note = "A connection refused at accept (the ban, the ceilings, the accept rate) now reads and drops what has already arrived, at most one initiator flight and without waiting, before it closes, so it ends with FIN and not RST. That runs only on a refused accept, before any handshake; an admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },  { through = "264f716a67", note = "A connection refused at accept is handed to the accept loop's linger task: write side shut at once, read until one initiator flight has arrived or the handshake span passes, then closed; at most what the connector admits in one span linger at once, and none while clearnet's rates are not assessed. Only refused accepts take this path; an admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },  { through = "e308fe4c77", note = "A test only: idle refused accepts close at the span and free their linger slots. No production code moved. Not re-measured." },  { through = "940baf2bd0", note = "The daemon reserves the clearnet linger cap beside the inbound ceiling, computed once at startup from the clearnet row (zero until the rates are ruled). No connection does different I/O. Not re-measured." },  { through = "49e4185efe", note = "Clearnet's accept rates are written (Assumptions: one accept every 100 ms, burst 20; per host one every 6 s, burst 3), so clearnet accepts now pass the gate and refused ones linger, up to 34. An admitted connection's dial, handshake and gap do the same I/O. Not re-measured; the step 7 flood re-derives the rates." },
  { through = "d11a8dd02f", note = "A measurement build logs one line per Levin message from each clearnet session's writer and reader (step 7, item 1). A release build constructs no tap, so its dial, handshake, and gap I/O are unchanged; the handshake gap's frame walk moved into shekyl-levin unchanged. Not re-measured." },
  { through = "579f5614c5", note = "The message-size tap's tracing target moves under shekyl_clearnet, a name only. A release build constructs no tap. Not re-measured." },
  { through = "9e024da04b", note = "The C5 bench gains a framer-free one-window seal and open, behind the c5-bench feature; production code gains nothing it calls. Not re-measured." },
  { through = "913595dbd5", note = "In a measurement build only, the message-size tap logs one line when a direction's Levin walk ends on a header that does not read. A release build has no tap. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "4d99af87fc", note = "A release build's message-size tap is zero-sized: feed is empty and the session future holds no walker. The measurement build turns that tap on with SHEKYL_MEASUREMENT_SPANS, beside the transport-layer feature, and the clearnet feature enables nothing. Command classes are read from the Levin closed sets. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "fef25aec75", note = "The C5 bench's fixed-window case and the framed seal and open share one handshake and one timed loop. Established::split and directions share the role choice. Production code gains no caller. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "5d8596436d", note = "The Linux test that pins the kernel's RST gates its Shutdown import. No production code moved. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "e5fc509bd5", note = "A refusal that closes at once and a linger that has finished share one read of the initiator flight the kernel already holds, before the socket is dropped. Only a refused accept takes that path. An admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "b80d43d2fd", note = "The accept gate returns which bucket could not pay, and the socket table counts every accept refusal under its lock, before any handshake. An admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "16698c94aa", note = "One linger task for the connector is cloned into every accept loop, in place of a task per loop. A refused accept still shuts its write side and reads until one flight arrives or the handshake span passes. An admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "ab1fb2bc1a", note = "The in-memory loopback harness reserves its clearnet row (the ban, the ceilings, an id) and spends no accept-rate token. The listener's accept still passes the gate before a socket is reserved. An admitted connection's dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "82b33f4eda", note = "CS-5 retires 2003, 2004, 2006 and 2007: shekyl-clearnet's message-size class loses their four arms (sizes.rs), which a message of those ids no longer reaches because the ingress refuses it first. The dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "30cdb22bf9", note = "The Tor supervisor's directory check (#1232): a new inbound cause, DescriptorNotFound, in link.rs beside the two the link already carries, set after a probe's check. No clearnet code path changes; dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "b23fd66a5d", note = "The Tor supervisor's clock ruling: link.rs's inbound causes lose DescriptorRejected and gain UploadsRefused and ClockBehind, set by the supervisor's core after a sample or a round. No clearnet code path changes; dial, handshake, and gap I/O are unchanged. Not re-measured." },
  { through = "482e42e014", note = "Tests only, ported from the deleted C++ ban tests; admitted I/O unchanged." },
  { through = "d57f15525c", note = "Tests and the module doc only: the ban tests are split and the doc names the operator as the list's only writer; admitted I/O unchanged." },
  { through = "02956b9c5e", note = "The dial-failure judge's type (failure.rs) and each connector's judging row in the dial profile: data read after a dial has ended. No span constant moved. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "94c9ba7130", note = "Each connector stamps its own failures into DialFailure (clearnet's stamping.rs, the Tor reply table), after a dial has ended. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "6488776789", note = "Connectors stamp only what they observe, and a retry follows the failure's meaning: classification after a dial has ended; it may add or remove a redial within a test; each dial's I/O is unchanged. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "687aa88f7d", note = "Doc comments in the dial profile: the outage-retry bases and the build-time check say what they hold. No value moved. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "b86c3760ac", note = "The ban list posts each ban and lift to its subscribers as an event: bookkeeping on a ban or a lift, not on a dial. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "1a4c78117f", note = "Ban expiry is the timer's alone and bans arrive as events: the admission check on an accept, and on a clearnet dial after its TCP connect (2b moves it before the connect), is a lookup that reads no clock and does no I/O; open_clearnet drops its now argument. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "8067c817eb", note = "One ban-set type, a keyed lookup (the exact host, then a range over the subnets), held once by the peer list: bookkeeping with no I/O. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "63bfdbc714", note = "Ban subscribers are rung after the socket table's lock drops, on a ban, a lift or an expiry, never on a dial. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "92a5de3824", note = "The merge of dev: one ban.rs test calls is_banned(host) under this branch's signature. Tests only. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "f8162491ba", note = "Step 2b's contract: each connector stamps every end it observed from its own table and hands it on as a DialEnd beside the same D12 cause; read_capped no longer stores its cause, and the connector seals with the stamped end in the same select arm. Classification only, after each step: no deadline moved, and the ban check still runs after the TCP connect (step 3 moves it). The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "18493ce394", note = "The I/O changes: a clearnet dial is admitted before its TCP connect, so a host banned between the draw and the connect gets no SYN; an admitted dial holds its socket's slot through the connect. An admitted dial's connect, handshake and gap do the same I/O as before. Not re-measured." },
  { through = "f3438c1330", note = "Two commits. 3cf7479839 binds a test's send result instead of dropping it: tests only. f3438c1330 deletes the close cause's marks byte and its readers; the cause is now a kind and a reply code, and what a close is evidence of is the DialFailure the connector already stamped beside it. A proxy refusal is built without the marks argument. The clearnet dial, handshake and gap do the same I/O, and no deadline moved. Not re-measured." },
  { through = "316dbce93a", note = "The quiet guard's thresholds are deleted from the dial profile: K, the quiet span S, its derivation and the build-time check that S covered a dial deadline. Nothing read them after the judge replaced the guard. The dial deadline, handshake and gap spans these rows price are untouched, and no I/O changes. Not re-measured." },
  { through = "2e51e0f20d", note = "A comment in the dial profile: clearnet corroboration is a byte on an outbound session, as OE-D5 already ruled, where the comment still said the ruling was open. The judging row is unchanged. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "93a1e8ff42", note = "One commit path for a ban: the four ban methods become one, and the ban API moves beside the occupancy table. A store that changes nothing closes nothing. Bookkeeping on a ban, a lift or an expiry, not on a dial. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "c9fb52ee4b", note = "The socket table claims one ban timer for the process engine it registers on, and the node starts that timer at open, so a finite ban expires with no zone host. The claim is taken when the timer starts, not on a dial. The clearnet dial, handshake and gap do the same I/O. Not re-measured." },
  { through = "ec931d5858", note = "The network id and wire-prefix derivation moved to shekyl-network unchanged (the same cSHAKE over the same inputs), and prefix.rs re-exports it. The dial, the handshake and the gap wait do the same I/O. Not re-measured." },
  { through = "496c6d8858", note = "The I/O change, Windows only: the dial socket caps its SYN retransmissions at one (SIO_TCP_INITIAL_RTO), so a refused connect is reported after one retry, about 0.5 s, where the default retried for about 2.0 s past the deadline; a lost SYN is still resent once at +1.0 s. On Linux the dial builds its socket before the connect and the I/O is unchanged. The dial deadline, handshake and gap spans are untouched. Not re-measured; the Windows timings are shekyl-dev data/windows-refused-connect/, 2026-11-03." },
  { through = "91073c960d", note = "The Windows SYN retry cap is narrowed to direct dials: a dial to the operator's SOCKS proxy keeps the system's retries, as before 496c6d8858. Linux I/O is unchanged and no span moved. Not re-measured." },
  { through = "9864bff631", note = "Tests only: the Windows refusal-timing tests hold the port bound instead of dropping the listener first. No dial, handshake or gap I/O changes, and no span moved. Not re-measured." },
  { through = "f4b32aa2a8", note = "Tests only: the Windows refusal test names Ipv4Addr by its path, so the Windows build resolves it. No dial I/O changes and no span moved. Not re-measured." },
  { through = "6945d00c70", note = "levin: the two command enums (DefinedCommand, SyncCommand) become one Command; shekyl-clearnet's sizes.rs classifies a wire id with one match in place of two lookups. A release build constructs no size record. The dial, the handshake and the gap do the same I/O. Not re-measured." },
  { through = "dd41e79476", note = "p2p-session: cause.rs gains two close kinds the session layer closes with (NetworkMismatch, InvokeTimeout). An enum table only; the connectors' dial, handshake and gap are unchanged. Not re-measured." },
  { through = "a45484558e", note = "p2p: the C++ host is deleted. In these paths cause.rs drops the C projection of CloseKind (c_name, name_nul, c_header) and lib.rs its re-export; no close kind, deadline or dial I/O changes. The spans the connectors read are unchanged. Not re-measured; the clearnet rows stay stale from the capture." },
  { through = "c0f6274413", note = "transport: the inbound reservation that skipped the accept-rate gate is deleted; harness tables are built with no gate and take accept_clearnet. The listener's accept checks the ban, the ceilings and the rate in the same order as before; no dial, handshake or gap I/O changes. Not re-measured." },
  { through = "623fa03dce", note = "Each connector publishes an admitted socket through a callback in place of the shared admission channel. The library listener still sends on that channel (publish_on), at the same point after the channel exists. The dial, the handshake and the gap do the same I/O, and no span constant moved. Not re-measured. The rows stay stale for the reasons already recorded." },
  { through = "63fcdd9d25", note = "profile.rs: the doc comment on Tor's δ names its 60 s basis as shekyl-p2p-session's TIMED_SYNC_MIN plus half TIMED_SYNC_JITTER, in place of the deleted C++ P2P_DEFAULT_HANDSHAKE_INTERVAL. A comment only; no dial, handshake, gap or shutdown wait changes. Not measured; the rows stay stale." },
  { through = "4943ebc7f7", note = "rpc 4.0: one module-doc line in shekyl-transport-layer's ban.rs renames set_bans to ban_add. Dial, handshake and gap I/O are unchanged. Not re-measured; the rows stay stale." },
]

