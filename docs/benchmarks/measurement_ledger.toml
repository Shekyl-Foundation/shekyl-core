[[path_set]]
id = "tor-span"
spec = [
  "rust/shekyl-tor/src",
  "rust/shekyl-transport-layer/src",
]
stale_through = [
  { through = "b5e7dbfed5", note = "Seeded at this merge, 2026-10-05. The other commits to these paths since the capture were not individually reviewed for cost." },
  { through = "5838269c20", note = "A Tor dial that does not open, and a wake that is dropped, are LocalClose instead of DialFailed. A SOCKS reply that is this node's request is logged. The dial and the gap wait do the same I/O. Not re-measured." },
  { through = "29d3d75860", note = "Send and receive instants leave the connection board and sit on the byte tally in the transport layer. A direct connect counts only when the peer refuses it. The Tor dial and the gap wait are unchanged. Not re-measured." },
  { through = "34567c4930", note = "The byte stamp is monotonic and taken when the socket reads or writes, instead of a unix millisecond when the rate gate grants a chunk. Before the first byte the mark is admission on that clock. The Tor dial and the gap wait are unchanged. Not re-measured." },
  { through = "23189972dc", note = "The Tor connector records its close cause on both session ends. The byte stamp is a per-session atomic instead of another take of the link-budget lock, which is after the dial. Dial and gap I/O are unchanged. Not re-measured." },
  { through = "d5d908bc76", note = "The link budget drops its activity clock. The copy holds a direction lease so abort releases the byte stamp, and the connector seals the session once before aborting the other half. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "8fa5ba8bbb", note = "The Tor writer is joined once, on the select arm that already took it. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "c1eaab634f", note = "A zone's connector cap is released when that zone stops, and a zone that did not set a cap clears one a previous zone left. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "3953422bd1", note = "The declaration records measured transit, read from the relay-privacy table. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "4363637e68", note = "The declaration records cover class, and the relay reads that cell and the transit cell. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "3035d6c1fb", note = "The transit cell is transit_ms, a DerivationMs carrying its basis (Assumption), instead of a bare u32; the declaration table is otherwise unchanged. The dial and the gap wait are unchanged. Not re-measured; under Ruling B these spans are CppPath and are measured again on the Rust dialer after the cutover (DAEMON_RELAY_PRIVACY.md section 97)." },
  { through = "b3bc220aab", note = "The transit cell's type is DerivationMs built by a named constructor, with AdmissibleBasis in place of the marker types; the declaration table's values are unchanged. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "4bc4ad7380", note = "A doc comment in declaration.rs names the hidden stem slot's pin in place of the own-edge draw (PR-1, #1018). No code changed in these paths. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "cb7cfe943d", note = "SH-3: shekyl_runtime::runtime gained a thread-start hook parameter at this commit (a ThreadStart, since reshaped into ThreadHooks on runtime_with_thread_hooks; the two-argument runtime came back at da7b70c8cf, heard below). shekyl-tor's tests passed the empty hook, so their runtime threads started exactly as before; no production path in this set changed. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "da7b70c8cf", note = "SH-3: the ordinary runtime constructor is a budget and a name again. shekyl-tor's tests call it with the same two arguments they had before the hook parameter (the serving runtime alone uses ThreadHooks through runtime_with_thread_hooks), so their runtime threads start as before. No production path in this set changed. The dial and the gap wait are unchanged. Not re-measured." },
  { through = "3081ba830b", note = "The failed-address predicate (implicates_address) no longer counts DialFailed or LevinHandshakeRejected on an onion dial; the five destination-naming replies still count. It runs after a dial has ended. The Tor dial and the gap wait are unchanged. Not re-measured." },
  { through = "3a0d211d80", note = "The failed-address predicate reads the destination_authenticated cell, and on Tor a rejected Levin handshake counts again beside the five destination-naming replies. It runs after a dial has ended. The Tor dial and the gap wait are unchanged. Not re-measured." },
  { through = "b57c18478e", note = "PR-3 (#1056): the spans moved from the C++ transport_spans to shekyl-transport-layer::spans, the same numbers with the same provenance comment; the connectors read them from the zone host as before. The outbound cap and its floor moved to the dialer; the dial path is the Rust dialer, whose deadlines these are. Not re-measured: Ruling B measures them again on the Rust path after the cutover." },
  { through = "8359ef531", note = "Cold first contact instrumented: the Tor driver logs its first bytes read and written and the gap's end, each a tracing call beside the existing I/O. The dial and the gap wait do the same I/O. Not re-measured." },
  { through = "e32770626", note = "The Tor gap logs what it armed and the wake it received. Logging only; the dial and the gap wait do the same I/O. Not re-measured." },
  { through = "05c1aeb93", note = "The Tor gap's wake line names the wake's owner. Logging only; the dial and the gap wait are unchanged. Not re-measured." },
  { through = "fbfc1fff5", note = "PR-3 diagnosis instrumentation: one more debug line set on the Tor driver's wake and close. Logging only; the dial and the gap wait do the same I/O. Not re-measured." },
  { through = "dc9130534", note = "PR-3 fix 2 (Rick, 2026-10-14): the gap now ends at the peer's first complete Levin frame, not at this node's handshake verdict, and a fired wake waits one IO driver turn for the reader before it times the peer out. This changes what the gap span bounds: the capture measured channel to verdict, which includes this node's own handshake work, so it overstates the peer's silence the gap now measures. The span stays as it is until the cold-first-contact rerun measures channel to first frame. The dial is unchanged. Not re-measured." },
  { through = "034bbdd5e", note = "PR-3, the measurement build (Rick, 2026-10-14): under the measurement-spans feature, set only by CMake's SHEKYL_MEASUREMENT_SPANS (default OFF, gated out of release by check_measurement_spans.py), the Tor dial and gap are 120 s. A default build compiles the released lines unchanged, so no released deadline or I/O moved. Not re-measured; the measurement build is what the cold-first-contact rerun measures with." },
  { through = "c0f6274413", note = "transport: the inbound reservation that skipped the accept-rate gate is deleted; harness tables are built with no gate and take accept_clearnet. The listener's accept checks the ban, the ceilings and the rate in the same order as before; no dial, handshake or gap I/O changes. Not re-measured." },
]
cleared = [
  { through = "ee87fc633", reason = "The Tor connector names its own SOCKS proxy: a failed TCP connect to it, or an exchange it closed without a reply, closes as ProxyUnavailable instead of LocalClose, with a rate-limited warning; a new close kind in cause.rs. The dial and the gap wait do the same I/O; only the close's label and one log line change. No cost moved." },
  { through = "b096e8c77", reason = "The spans themselves: TOR_DIAL_WITHIN_NANOS 120 s and TOR_GAP_WITHIN_NANOS 31 s from the rerun (this ledger's current rows), SHUTDOWN_TIMEOUT_NANOS following the dial, TOR_SPANS_BASIS RustPath, and the measurement feature lifting the gap alone. The values are the capture's; nothing else on these paths changed." },
  { through = "58ad7eac8", reason = "The Tor gap corrected to 37.4 s, 2 x the pooled p99 of 18.69 s (rank 188 of 189 per D9), rounded up to 100 ms (Rick, 2026-10-14; 31 s struck as a miscount of rank 187). The capture is unchanged; this applies its derivation correctly. A derivation test is added. The dial, the shutdown wait and the I/O are unchanged." },
  { through = "189f8104a", reason = "The gap ends at the peer's first complete handshake frame instead of its first complete frame (Copilot on #1056). In the capture the two are the same frame: the dialer sends its handshake request first and accepts only the response as its first message, so every counted session's first frame was its handshake (the record says so). The capture still prices this tree; the dial and the I/O are unchanged." },
  { through = "cf144a645", reason = "The Tor dial and gap timeout arms drop their debug lines naming the wake; the deadlines, the timeout and its close kind are unchanged, so the capture still prices this tree." },
  { through = "db6e11e07", reason = "The Tor listener tests and the seam's post and ban types move into files of their own; no code path changes." },
  { through = "f0948195c", reason = "DC-Q7: the operator's Tor SOCKS dial presents its RFC 1929 pair when one is configured, one sub-negotiation round trip on loopback before CONNECT against the 120 s dial span, and a refused authentication closes as ProxyUnavailable with a once-a-minute warning instead of LocalClose; the warning limiter moved to shekyl-socks unchanged. The managed Tor's dial, which the capture measured, offers no authentication as before and does the same I/O, so the capture still prices this tree." },
  { through = "cb507edf7", reason = "The Tor link (TSR-F1) holds the route the Tor dial used to read from the zone host's proxy slot; the dial, the gap and their I/O are unchanged, so the capture still prices this tree." },
  { through = "f60ab687f", reason = "The Tor link keeps one incarnation across a repeated publish of the same route, so the managed-Tor death watcher is armed once. The dial, the gap and their I/O are unchanged." },
  { through = "21524f1a8", reason = "Link subscriptions are removed when dropped. The dial, the gap and their I/O are unchanged." },
  { through = "7e9ea0f61", reason = "The Tor link's death watch is re-planned on each publish and a stop has its own cause; the dial, the gap and their I/O are unchanged, so the capture still prices this tree." },
  { through = "b67b94731", reason = "The listener test's frame that is not the handshake is a timed-sync request in place of the deleted support-flags request (1007). No code path in these files changes, so the capture still prices this tree." },
  { through = "7258399ad", reason = "Increment 3's supervisor publishes the managed route when Tor is running and publish takes the boot's onion seed. The dial, the gap and the shutdown wait in these paths do the same I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "2d5a37384", reason = "The same close-cause classification: opened_a_stream and 0x01 in the onion destination-naming set run after a dial ends, and this commit only says that 0x01 is RFC 1928's general SOCKS failure except on an onion dial. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "52cc732c0", reason = "The gray lifecycle, item 2: a close cause carries three marks in the byte that was padding, stamped at construction from a per-kind table and the SOCKS reply table; names_the_destination reads the mark. The dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the capture still prices this tree." },
  { through = "9356a73e6", reason = "The gray lifecycle, items 3 and 4: a Tor test makes up to three attempts, each its own dial and gap under the same deadlines, with the wait between attempts outside every span this row prices; the failed-address memory, a map with no I/O, is deleted. The dial, the gap, the shutdown wait and their I/O are unchanged, so the capture still prices this tree." },
  { through = "b96997932", reason = "Rick's review of #1185: the SOCKS reply table moves from the transport layer into this connector (replies.rs), which builds the refused cause with the same reply code and the same marks; cooling gray seats become evictable and the address file leaves out banned addresses, both list bookkeeping. The dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the capture still prices this tree." },
  { through = "97fc6cfd0", reason = "The merge onto the gray lifecycle. opened_a_stream follows the D12 phase and runs after a dial ends. SOCKS 0x01 on an onion dial is final and names the destination, so the reply table does not retry it. The dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "4c0766da8", reason = "The in-flight bound, revision 4, items 10 and 11: a Tor attempt that times out at or after the managed Tor's SocksTimeout ends its test instead of waiting for a retry, read from a fourth close-cause mark against the attempt's start; the tally counts a deferred attempt. Each attempt is still one dial and one gap under the same deadlines; no deadline moved and no span this row prices gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "7559d9f81", reason = "The in-flight bound, revision 4: a Tor timeout from 104 s into the attempt's own run, timed inside its task, ends its test; the window comparison and the close cause's doc comments change, and the launch argument does not. Each attempt is still one dial and one gap under the same deadlines; no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "e102eb8c2", reason = "Every Tor reply worth a retry now carries the window-timeout mark, so an onion code at or after the managed Tor's SocksTimeout ends its test as 0x06 does; the reply codes, the dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "5a01801ee", reason = "The dial profile: each connector declares its stand-off and pace numbers beside its declaration in this crate; the dial deadline and gap constants are unchanged and the clearnet window names CLEARNET_DIAL_WITHIN_NANOS. No deadline moved and no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "2d868c2dc", reason = "The dial profile's quiet threshold: the profile in this crate gains each connector's K attempts and span S, read by the dialer's quiet guard and the managed-Tor supervisor. No deadline or span constant moved and no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "793e30248", reason = "The quiet span S is computed in the profile from K, the in-flight bound, the dial deadline and the wake spacing. It reads TOR_DIAL_WITHIN_NANOS and CLEARNET_DIAL_WITHIN_NANOS and changes no deadline or span constant; no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "0eb355bc5", reason = "A doc comment on the profile's quiet-span test. No code changed, so the 2026-10-14 capture still prices this tree." },
  { through = "dc617814d", reason = "Clearnet's quiet K moves from 10 to 11 and its derived S with it; a doc comment in the Tor supervisor's Policy. No deadline or span constant moved and no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "d9bb3e534", reason = "The quiet span is derived from the row's dial deadline instead of a stored literal, and the dialer keeps only a published retry window. No deadline or span constant moved and no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "7098cae175", reason = "Wording, a field name and test fixtures in the Tor connector: the crate doc names the Rust options (tor-socks, tor-onion, tor-onion-listen) in place of the retired C++ flags, Config::anonymous_inbound is operator_onion_binds, publish.rs names note_own_onion in place of m_our_address, one test is renamed, and the fixtures use 11021 and 12021 in place of 18080 and 18081. The dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "56d76465a", reason = "A build-time check that every dial profile row's quiet threshold is well formed. No deadline or span constant moved and no span gained I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "65d33f49ce", reason = "Increment 4's pieces: the Tor link gains its inbound facet, published for an incarnation with no watcher called, and a new route resets it to publishing. Nothing on the Tor dial, the gap or the shutdown wait reads it, and the probe dials outside the connector, so the 2026-10-14 capture still prices this tree." },
  { through = "346e890ffe", reason = "Tor accepts pass no accept-rate gate (the onion's proof-of-work is Tor's row); the change is clearnet's accept, a new close cause, and a once-a-minute report task. The Tor dial and the gap wait are unchanged. Not re-measured." },  { through = "264f716a67", reason = "The linger for refused clearnet accepts, its cap in the accept-rate gate and Sockets, and the clearnet tests. Tor's accept loop builds no linger and its dial, gap and shutdown wait do the same I/O, so the 2026-10-14 capture still prices this tree." },  { through = "940baf2bd0", reason = "The descriptor reservation gains the clearnet linger cap (zero until the rates are ruled) and the row-level linger_cap formula. Nothing on the Tor dial, the gap or the shutdown wait reads them, so the 2026-10-14 capture still prices this tree." },  { through = "49e4185efe", reason = "Clearnet's accept rates and the build-time check of every connector's bound against its declaration; Tor's row stays the onion's proof-of-work. Nothing on the Tor dial, the gap or the shutdown wait reads them, so the 2026-10-14 capture still prices this tree." },
  { through = "b80d43d2fd", reason = "The accept gate returns which bucket could not pay, and the socket table counts accept refusals; the clearnet linger figure moves beside linger_cap. Tor's accept builds no linger. The Tor dial, the gap and the shutdown wait do the same I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "ab1fb2bc1a", reason = "The loopback harness reserves a clearnet row and spends no accept-rate token. Tor's accept passes no gate. The Tor dial, the gap and the shutdown wait do the same I/O, so the 2026-10-14 capture still prices this tree." },
  { through = "30cdb22bf9", reason = "The Tor supervisor's directory check (#1232): a new inbound cause, DescriptorNotFound, in link.rs beside the two the link already carries, set after a probe's check. The dial, the gap, the shutdown wait and their I/O are unchanged, so the capture still prices this tree." },
  { through = "b23fd66a5d", reason = "The Tor supervisor's clock ruling: link.rs's inbound causes lose DescriptorRejected and gain UploadsRefused and ClockBehind, set by the supervisor's core after a sample or a round. The dial, the gap, the shutdown wait and their I/O are unchanged, so the capture still prices this tree." },
  { through = "482e42e014", reason = "Tests only, ported from the deleted C++ ban tests; admitted I/O unchanged." },
  { through = "d57f15525c", reason = "Tests and the module doc only: the ban tests are split and the doc names the operator as the list's only writer; admitted I/O unchanged." },
  { through = "02956b9c5e", reason = "The dial-failure judge's type (failure.rs) and each connector's judging row in the dial profile: data read after a dial has ended. No span constant moved. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "94c9ba7130", reason = "Each connector stamps its own failures into DialFailure (clearnet's stamping.rs, the Tor reply table), after a dial has ended. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "6488776789", reason = "Connectors stamp only what they observe, and a retry follows the failure's meaning: classification after a dial has ended. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "687aa88f7d", reason = "Doc comments in the dial profile: the outage-retry bases and the build-time check say what they hold. No value moved. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "b86c3760ac", reason = "The ban list posts each ban and lift to its subscribers as an event: bookkeeping on a ban or a lift, not on a dial. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "0e3f7f869c", reason = "The Tor reply table stamps each SOCKS reply as tor 0.4.9.14 reads it: classification after a dial has ended. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "9a43553917", reason = "SOCKS 0x02 is classed Uncertain, and the reply table cites the rulings retry finality rests on: classification after a dial has ended; it may add or remove a redial within a test; each dial's I/O is unchanged. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "1a4c78117f", reason = "Ban expiry is the timer's alone and bans arrive as events: the admission check on an accept, and on a clearnet dial after its TCP connect (2b moves it before the connect), is a lookup that reads no clock and does no I/O; open_clearnet drops its now argument. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "8067c817eb", reason = "One ban-set type, a keyed lookup (the exact host, then a range over the subnets), held once by the peer list: bookkeeping with no I/O. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "63bfdbc714", reason = "Ban subscribers are rung after the socket table's lock drops, on a ban, a lift or an expiry, never on a dial. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "92a5de3824", reason = "The merge of dev: one ban.rs test calls is_banned(host) under this branch's signature. Tests only. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "f8162491ba", reason = "Step 2b's contract: each connector stamps every end it observed from its own table and hands it on as a DialEnd beside the same D12 cause; a malformed SOCKS exchange is labelled ProxyUnavailable instead of LocalClose. Classification only, after each step; no deadline moved. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "f3438c1330", reason = "The close cause's marks are deleted: a cause is a kind and a reply code, and the Tor reply table's retry set is a private predicate behind stamp_reply, which already decided each reply's DialFailure. A proxy refusal is built without the marks argument. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "316dbce93a", reason = "The quiet guard's thresholds are deleted from the dial profile: K, the quiet span S and its derivation, which nothing read after the judge replaced the guard. The Tor dial deadline, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "2e51e0f20d", reason = "A comment in the dial profile: clearnet corroboration is a byte on an outbound session, as OE-D5 already ruled, where the comment still said the ruling was open. The judging row is unchanged. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "93a1e8ff42", reason = "One commit path for a ban: the four ban methods become one, and the ban API moves beside the occupancy table. A store that changes nothing closes nothing. Bookkeeping on a ban, a lift or an expiry, not on a dial. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "c9fb52ee4b", reason = "The socket table claims one ban timer for the process engine it registers on, and the node starts that timer at open, so a finite ban expires with no zone host. The claim is taken when the timer starts, not on a dial. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
  { through = "dd41e79476", reason = "p2p-session: cause.rs gains two close kinds the session layer closes with (NetworkMismatch, InvokeTimeout). An enum table only; the Tor dial, the gap and the shutdown wait are unchanged." },
  { through = "a45484558e", reason = "p2p: the C++ host is deleted. In these paths cause.rs drops the C projection of CloseKind (c_name, name_nul, c_header) and lib.rs its re-export; no close kind, deadline or dial I/O changes, and the Tor spans are unchanged. The RustPath captures still describe the code: the connectors they measured are the ones running under the Rust session layer." },
  { through = "c0f6274413", reason = "transport: the inbound reservation that skipped the accept-rate gate is deleted; harness tables are built with no gate and take accept_clearnet. The listener's accept checks the ban, the ceilings and the rate in the same order as before; no dial, handshake or gap I/O changes. Not re-measured." },
  { through = "623fa03dce", reason = "Each connector publishes an admitted socket through a callback in place of the shared admission channel. The library listener still sends on that channel (publish_on), at the same point after the channel exists. The Tor dial, the gap, the shutdown wait and their I/O are unchanged, and no deadline moved, so the 2026-10-14 capture still prices this tree." },
  { through = "63fcdd9d25", reason = "profile.rs: the doc comment on Tor's δ names its 60 s basis as shekyl-p2p-session's TIMED_SYNC_MIN plus half TIMED_SYNC_JITTER, in place of the deleted C++ P2P_DEFAULT_HANDSHAKE_INTERVAL. A comment only; no dial, handshake, gap or shutdown wait changes." },
  { through = "c42ef64a2d", reason = "C++ removal (#1299): comments only in shekyl-tor publish.rs; no code path changed, and nothing the capture priced has moved." },
  { through = "1cd88d18ba", reason = "The onion keypair moves into shekyl-crypto-pq: OnionIdentity is built from a keypair and the daemon holds one for the boot instead of a seed, so an ADD_ONION no longer expands a seed first. The publish path only; no SOCKS dial, gap, shutdown wait or deadline changes, so the 2026-10-14 capture still prices this tree." },
  { through = "4943ebc7f7", reason = "rpc 4.0: one module-doc line in shekyl-transport-layer's ban.rs renames set_bans to ban_add. Comment only; the Tor dial, the gap, the shutdown wait and their I/O are unchanged, so the 2026-10-14 capture still prices this tree." },
]

