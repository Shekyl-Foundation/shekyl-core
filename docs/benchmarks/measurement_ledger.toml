  { through = "8238319ac3", note = "SH-2 review (PR #990): ServeCounterReader moves from serve.rs into serve_counters.rs. The accept loop holds one crate-private writer and clones it into each connection; that clone copies all six arcs, where the connection previously cloned the four it increments. Increments stay a relaxed fetch_add of one on the same six atomics at the same events. No read, hash, sign or socket operation is added, removed or reordered on the shipped serve path. Not measured." },
  { through = "112a9a62bf", note = "SH-2 review (PR #990): the public module docs in serve_counters.rs no longer link the crate-private writer, which rustdoc -D warnings rejects. Doc text only. No read, hash, sign or socket operation changed. Not measured." },
  { through = "24f769906", note = "SF-D8 amendment (PR #1015): the serve path streams the body unframed. The RF-D4 frame header is no longer built, written or absorbed into the delivery digest; the body length comes from the provider and the digest is over the body alone. One ~20-byte hasher update and one small write leave the serve path; reads, the hash pass over the body, the signature and the socket I/O are the same. The client stops parsing a frame header before the body. Not measured." },
  { through = "3ccb5a225", note = "Fetch Sub-PR 2 client (PR #1015): the body is the tx-range frame, verified as it streams. Per transaction the client hashes the two segments it reads (txid_parts against the retained txs_prunable_hash / txs_pqc_auth_hash rows) and folds them into the view hash, with one transaction resident; this replaces buffering the whole body and recomputing the leaf-segment root over it. Client CPU is a hash pass over the same bytes in a different shape (two per-tx digests and one fold, in place of one Merkle recompute); peak memory drops from the whole body to one transaction plus a read chunk. The serve path is unchanged. Not measured (BA-T6 is the client's floor run)." },
  { through = "11a2d409f", note = "Doc comments only, in shekyl-p-fetch client.rs and error.rs and shekyl-p-serve provider.rs, describing the frame grammar and what a leaf-segment body is refused as. No executable serve or fetch code changed; no cost moved." },
  { through = "a17110c27", note = "Merge of dev into PR #1015: the client's dial carries the read's SOCKS credentials (6068ba31e9, heard above) with this branch's typed shard id; a doc comment on MAX_INFLIGHT records that the circuit-per-read cost is unmeasured. The resolution adds no read, hash, sign or socket operation beyond what each side already had." },
  { through = "6f4988ca5e", note = "The fetch client's pre-read length check takes pqc_auth_count and refuses a count that is not zero exactly when pqc_auths_len is zero, before the body is read. A canonical frame is read, hashed and checked as before. The serve path is untouched. Not measured." },
  { through = "96f49b7c99", note = "The streaming reader's one varint call site maps VarintFault into FrameError::Varint. Same bytes, same refusal, same order. Not measured." },
  { through = "a63cf0c8d6", note = "The streaming body reader moves from the fetch client into its own module. Same reads, same hashes, same order. Not measured." },
  { through = "1b309eae79", note = "A stall's io::Error is shared through Arc so one flight's refusal can be cloned onto every waiter. No read, hash, sign or socket operation changes. Not measured." },
  { through = "8ed51316e", note = "StoreShardProvider reads the sealed body store: each chunk is an AEAD open where the floor capture read a frozen segment. One decrypt per chunk is added on the serve path. The client is unchanged. Not measured." },
  { through = "b45e0c389", note = "A doc comment in shekyl-p-fetch header.rs: with_nonce is the challenge's derived nonce, not only a test helper. No executable fetch or serve code changed; no cost moved." },
  { through = "dc40167ad", note = "A doc comment in provider.rs: content-length is fixed from the meta row before any chunk byte, and a later chunk authentication failure can only close the stream. No read, hash, sign or socket operation changed. The key check this commit adds is at store open, off this path." },
  { through = "976c7d0564", note = "p-serve (976c7d0564): the write-stall bound counts only waits the peer causes. write_bounded tries the socket on every poll, arms the 30 s clock only when a poll finds no room and clears it on progress; a starved serving task that finds the socket writable is never charged. Chunk size, read, digest and sign are untouched, so a served response costs what it did; the change moves only the cut a starved task could suffer, and the next floor block should show zero cuts. Not re-measured." },
  { through = "8eb6b3bea8", note = "p-serve (8eb6b3bea8): the stall bound is a timeout around each write, the bytes the socket will take, in place of a sleep beside one poll of the slice. Same rule: bytes accepted start the clock over, and a poll that finds the socket writable writes however late it is. Tests fail if the timeout wraps write_all again. Chunk size, read, digest and sign are unchanged, so a served response costs what it did. Not re-measured." },
  { through = "b25727e077", note = "FND-21 (PR #1049), three commits. The first adds test fixtures under src/wire_pin and no code. The second makes the signer trait const-generic over the envelope width: the serve loop takes the width from its signer where it read one constant, and the envelope is encoded through a sealed trait that monomorphizes to the same to_canonical_bytes and array conversion. No read, hash, signature or socket write is added or removed, and the whole response for the live scheme is byte-identical to fixtures captured before the change (serve_wire_pin_tests.rs). The third makes the fetch target generic over its key: the client reads the envelope into a heap buffer of the scheme's width where it filled a 3,385-byte stack array, which is one allocation per response, and parses and verifies through a trait that monomorphizes to the same two calls. Not measured." },
  { through = "37b8beb1b8", note = "FND-21 follow-up (PR #1049): sign_receipt_transcript pairs a transcript with the receipt domain. sign_pass_transcript is the same one line. The live serve loop still signs with the identity key and does not call the new function; the fetch client is untouched; the test receipt signer changes are behind cfg(test) and the test-signer feature. No read, hash, sign, retry or socket operation on the shipped identity path is added, removed or reordered. The receipt-key changes in engine-core are off this path set. Not measured." },
  { through = "e8740ab466", note = "PR #1049 review: the doc comment of sign_receipt_transcript in countersign.rs states that the function is STAGED, who makes it live and its falsifier. Doc comment only; no executable serve or fetch code changed." },
  { through = "45a115cc3f", note = "p-serve (45a115cc3f): the write-stall tests move into serve_stall_tests.rs, and write_bounded's writer parameter is renamed from W to S so W stays the envelope width. The stall bound is the same timeout around each write. No read, hash, sign or socket operation on the serve or fetch path is added, removed or reordered. Not re-measured." },
  { through = "be38532e2b", note = "Two unused type aliases (IdentityPassKey, IdentityPassSigner) and their re-export deleted from shekyl-p-serve; shekyl-p-fetch gains PassVerifyingKey::WITHIN_WIDEST, a compile-time assertion that a scheme's envelope is within the widest, evaluated in max_response_len as a unit constant. No read, hash, signature or socket operation on the serve or fetch path is added, removed or reordered, and nothing runs at run time that did not before. Not re-measured." },
]

