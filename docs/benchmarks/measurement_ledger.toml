  { through = "661087ac08", reason = "The mac1 key is typed: the daemon derives it once with its keypair (it was derived once with its bundle), and its check recomputes the mac1 and compares it in constant time, the work verify_slice did. A busy reply MACs the same 34 bytes. A client derives the key at each start, one BLAKE2s over the 1,216-byte bundle, outside every step the daemon charges. The budget still charges 2,163,800 ns, and the RT-P9 deadlines are unchanged." },
