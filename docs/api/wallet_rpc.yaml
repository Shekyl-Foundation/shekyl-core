# ============================================================================
# Shekyl wallet RPC — OpenAPI 3.1 contract (Phase 4, WALLET_REWRITE_PLAN.md)
# ============================================================================
#
# THIS FILE IS THE CONTRACT. Per WALLET_REWRITE_PLAN.md §"Spec-first", the
# implementation in rust/shekyl-wallet-rpc conforms to this spec, never the
# reverse. A method that is not specified here does not exist; a change to a
# specified shape lands here first (or in the same PR as) the implementation
# change.
#
# Transport: JSON-RPC 2.0 over HTTP POST / or a Unix domain socket. UDS with
# filesystem-permission auth is the recommended deployment mode
# (docs/WALLET_RPC_README.md); HTTP basic auth remains available for tooling.
#
# JSON shape policy (locked, WALLET_REWRITE_PLAN.md §"JSON shape"):
#   - Shekyl-native. No Monero wallet_rpc_server compatibility, partial or
#     otherwise.
#   - Amounts are atomic units only, encoded as u64 DECIMAL STRINGS (JSON
#     numbers lose precision past 2^53). No floats, no coin-name units.
#   - Capability mode ("FULL" | "VIEW_ONLY" | "HARDWARE_OFFLOAD") is carried
#     explicitly on every wallet-handle response — never inferred.
#   - Hybrid PQC signatures are structured: {"ed25519": hex, "ml_dsa_65": hex}.
#     Never a single opaque signature blob.
#   - CTTypeFcmpPlusPlusPqc is the only transaction type; no "ct_type"
#     field exists anywhere in this API.
#
# Method registry status. Every planned method is listed in one of two
# states:
#   SPECIFIED — full request/response schemas below; implementable now.
#   RESERVED  — name + error-code range allocated; full schemas land in the
#               sub-PR that implements the method, gated on the named
#               engine-layer prerequisite (rule 21 reversion shape: the
#               reopening criterion for each reserved method is the landing
#               of its named prerequisite on dev, verified per rule 94).
#
#   SPECIFIED (this commit):
#     create_wallet, open_wallet, close_wallet, change_password,
#     get_balance, get_primary_address,
#     build_pending_tx, submit_pending_tx, discard_pending_tx,
#     abandon_tx                                   (PR-SJ-3 — the P3-4
#                                                   user-authored abandon)
#     set_tx_note, get_tx_note                     (PR-SA-4 — SJ-DQ-7
#                                                   per-txid annotation;
#                                                   the reader is the only
#                                                   way to read a note whose
#                                                   tx is not yet scanned)
#     get_transfers, get_transfer_by_id,
#     refresh, rescan_blockchain,
#     get_height, get_version,
#     stake                                        (#332 staker-activation
#                                                   entry)
#   SPECIFIED (WI-RPC-1 — receiving / fee / staking-read projection):
#     create_payment_request, list_payment_requests,
#     make_uri, parse_uri                          (FA-8d engine substrate;
#                                                   rid-on-URI receiving —
#                                                   no subaddress/account
#                                                   model exists)
#     estimate_tx_size_and_weight,
#     get_default_fee_priority                     (predict_weight /
#                                                   fee-converge projection)
#     get_staked_balance, get_staked_outputs,
#     staking_info                                 (authoritative staking
#                                                   read view; read-only)
#   SPECIFIED (WI-RPC-2a — CLI-off-wallet2 transport swap):
#     restore_wallet                               (deterministic inverse of
#                                                   create_wallet's BIP-39
#                                                   backup; mainnet/stagenet
#                                                   only — testnet is
#                                                   raw-seed)
#   SPECIFIED (WI-RPC-3 — Phase 2c proofs tranche):
#     get_tx_proof, check_tx_proof                 (DLEQ tx proofs over
#                                                   rust/shekyl-proofs;
#                                                   check_* is wallet-less)
#     get_reserve_proof, check_reserve_proof       (DLEQ reserve proofs;
#                                                   check_* is wallet-less)
#   SPECIFIED (WI-RPC-4 — thin CLI surfaces):
#     get_wallet_info                              (one-round-trip aggregate
#                                                   of live reads; CLI
#                                                   engine_info)
#     get_transfers.attribution filter +           (FA-8 unattributed
#       Transfer.attribution                        receives; CLI history
#                                                   incoming --unattributed)
#   RESERVED (prerequisite in parentheses):
#     unstake, claim, get_stakes                   (Stage 3 StakeEngine +
#                                                   Phase 2b orchestrator;
#                                                   reward path blocked on
#                                                   REWARD_EMISSION_LEG.md
#                                                   PR-E1..E3 / C-1)
#       CONTRACT PIN (P-lane fee uniformity, ratified 2026-07-19,
#       V3_WALLET_DECISION_LOG.md "P-lane fees"): when these schemas land
#       they carry NO fee parameter — no FeePriority, no amount, no
#       cover-amount input. Every P-lane tx pays the canonical weight-priced
#       floor fee from persona working capital (cover + earnings); a
#       user-visible fee control would be a wallet-fingerprint channel in a
#       cleartext field on P-attributed transactions. Unbonding is an
#       autonomous first-class process: the surfaced method is at most a
#       trigger plus read-only progress, never a parameterized action.
#     match_transfer_to_request                    (Phase 2c orchestrator
#                                                   wrapper over the FA-8
#                                                   engine substrate; the
#                                                   create/list/URI half
#                                                   landed with WI-RPC-1)
#
#   REJECTED (rule 21 reversion shape — removed from RESERVED, not landed):
#     get_tx_key, check_tx_key                     (WI-RPC-3, 2026-07-23;
#       rationale corrected 2026-07-24. Exporting the raw per-tx secret as
#       a naked hex string is the wallet2-era mechanism. The OUTBOUND tx
#       proof also discloses the per-tx secret — it is carried in the
#       proof wire format by construction (tx_proof.rs header) — so the
#       rejection is NOT "the proof avoids revealing the key"; it is that
#       the proof is the strictly better carrier for the same disclosure:
#       Schnorr-sealed, challenge-message-bound, framed with the outputs
#       it proves, and consumable by check_tx_proof without a second
#       protocol. The INBOUND proof genuinely avoids the tx key (view-side
#       per-output secrets only). A naked-key export method adds a second,
#       weaker surface for a disclosure the proof already carries in
#       bound form. Storage side: the wallet schema retains per-tx
#       secrets (shekyl-engine-state TxMetaBlock.tx_keys), and the
#       send path persists them at dispatch — that retention writer
#       landed in this same WI-RPC-3 tranche as an in-scope
#       prerequisite of the OUTBOUND proof, not a deferral (see
#       GetTxProofParams). Reopen when: an
#       external verifier/tool emerges that structurally cannot consume a
#       DLEQ proof string and requires the raw scalar (named consumer,
#       threat-model review); the re-evaluation shape is a fresh contract
#       sub-PR citing this note. Pre-genesis there is no user holding
#       wallet2-era tx keys to honor — rule 16 user-absent inversion
#       applies.)
#     get_spend_proof, check_spend_proof           (WI-RPC-3, 2026-07-24.
#       Wallet2-era spend proofs exist ONLY to link key images to an
#       identity — the reserve proof's forward-linkability hazard (see
#       the Proofs section's DISCLOSURE SEMANTICS) as the entire product
#       rather than a priced side effect, with no reserve-attestation
#       payoff. Under FCMP++ that linkage is precisely what the system
#       hides; outbound tx proofs already attest authorship of a
#       payment. Registry residue: HRP_SPEND_PROOF in
#       rust/shekyl-encoding has zero producers/consumers whole-tree
#       and is deleted in the WI-RPC-3 implementation PR (rule 15) so
#       the seal condition lives here, not in a dangling encoding
#       entry. Reopen when: a named consumer requires spend attestation
#       that an outbound tx proof structurally cannot express, with a
#       threat-model review accepting the key-image disclosure; the
#       re-evaluation shape is a fresh contract sub-PR citing this
#       note.)
#     export_unsigned, submit_signed               (Phase 2d UnsignedTxBundle
#                                                   / SignedTxBundle)
#   SPECIFIED (PR-SM-2 — message-signing projection; formerly the
#   "sign, verify" RESERVED entry, which sat ambiguously below the
#   REJECTED block — it was reserved, never rejected):
#     sign_message, verify_message                 (A2 nested-hybrid message
#                                                   signing per
#                                                   docs/design/WALLET_MESSAGE_SIGNING.md
#                                                   §7; verify is
#                                                   SESSION-LESS (SM-R-6).
#                                                   Live end to end since the
#                                                   fork-(ii) address layout
#                                                   landed — see the Message
#                                                   signing section)
#
# Error-code allocation (stable ranges; per-method codes land alongside each
# method, ranges are fixed from this first commit — WALLET_REWRITE_PLAN.md
# §"Cross-cutting design decisions"):
#
#   -32700, -32600..-32603   JSON-RPC 2.0 protocol errors (spec-standard)
#   -29000..-29099           wallet lifecycle (create/open/close/password)
#   -29100..-29199           send / build / submit / discard
#   -29200..-29299           refresh / rescan
#   -29300..-29399           proofs (RESERVED range)
#   -29400..-29499           transfers / history queries
#   -29500..-29599           staking (RESERVED range)
#   -29600..-29699           payment requests (RESERVED range)
#   -29700..-29799           air-gapped bundles (RESERVED, UNUSED --
#                            not pending work. A4 (2026-08-06) descoped
#                            cold bundles from V3.0; the range is held,
#                            not withdrawn, so a reopening under the
#                            rule-21 clause cannot collide with a reused
#                            code, and so no client can pin a meaning we
#                            later reassign)
#   -29800..-29899           sign / verify message (PR-SM-2:
#                            -29800..-29802 allocated; -29803
#                            ADDRESS_UNBOUND was allocated for the
#                            R6-a-gated interim and RETIRED unused when
#                            the fork-(ii) address layout landed — never
#                            reuse the number; rest reserved)
#   -29900..-29999           server / transport / tenancy
#
# Codes allocated in this commit are enumerated in
# components.schemas.WalletRpcErrorCode.

openapi: 3.1.0
info:
  title: Shekyl Wallet RPC
  version: 0.1.0
  description: >
    JSON-RPC 2.0 interface served by `shekyl-wallet-rpc` (Phase 4 of the
    wallet rewrite; replaces the C++ `wallet_rpc_server`). One wallet-bearing
    process type: `shekyl-cli` is a thin client of this API (Shape B), and the
    GUI/mobile wallets re-wire against it after Phase 6.
  license:
    name: BSD-3-Clause

servers:
  - url: "uds:///run/user/{uid}/shekyl.sock"
    description: Recommended — Unix domain socket, filesystem-permission auth.
  - url: "http://127.0.0.1:29500"
    description: Loopback HTTP with basic auth, for tooling compatibility.

paths:
  /:
    post:
      operationId: jsonRpcCall
      summary: JSON-RPC 2.0 envelope; the `method` member selects the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: >
            JSON-RPC 2.0 response. Application-level failures ride the
            `error` member with codes from the allocation table; HTTP status
            is 200 for every well-formed JSON-RPC exchange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"

components:
  schemas:
    # ── Envelope ─────────────────────────────────────────────────────
    JsonRpcRequest:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          const: "2.0"
        id:
          oneOf: [{ type: string }, { type: integer }]
        method:
          type: string
          # SPECIFIED methods only — the callable surface. RESERVED names
          # (file header) are deliberately absent: a method not specified here
          # does not exist, and listing an unimplemented name would be
          # pre-provisioning the contract for an absent caller (rule 21
          # reversion shape). Each reserved name joins this enum in the sub-PR
          # that implements it; pre-genesis that growth is an atomic cutover,
          # not client-breaking skew (see GetVersionResult.api_version, rule 16).
          enum:
            - create_wallet
            - restore_wallet
            - open_wallet
            - close_wallet
            - change_password
            - get_balance
            - get_primary_address
            - build_pending_tx
            - submit_pending_tx
            - discard_pending_tx
            - abandon_tx
            - set_tx_note
            - get_tx_note
            - get_transfers
            - get_transfer_by_id
            - get_wallet_info
            - refresh
            - rescan_blockchain
            - get_height
            - get_version
            - stake
            - create_payment_request
            - list_payment_requests
            - make_uri
            - parse_uri
            - estimate_tx_size_and_weight
            - get_default_fee_priority
            - get_staked_balance
            - get_staked_outputs
            - staking_info
            - get_tx_proof
            - check_tx_proof
            - get_reserve_proof
            - check_reserve_proof
            - sign_message
            - verify_message
        params:
          description: Per-method params object; see `*Params` schemas.
          type: object

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      # JSON-RPC 2.0 §5: a response carries EXACTLY ONE of `result` / `error`,
      # never both and never neither. Encoded structurally so generated clients
      # cannot accept or emit an invalid envelope.
      oneOf:
        - required: [result]
          not: { required: [error] }
        - required: [error]
          not: { required: [result] }
      properties:
        jsonrpc:
          const: "2.0"
        id:
          oneOf: [{ type: string }, { type: integer }, { type: "null" }]
        result:
          description: Per-method result object; see `*Result` schemas.
          type: object
        error:
          $ref: "#/components/schemas/JsonRpcError"

    JsonRpcError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/WalletRpcErrorCode"
        message:
          type: string
          description: >
            Human-readable summary. Never carries secret material, addresses
            of counterparties, or amounts (privacy: error text is the most
            commonly logged surface).
        data:
          type: object
          description: Structured per-code detail (documented per code).

    WalletRpcErrorCode:
      type: integer
      # Exactly the codes allocated in THIS commit (JSON-RPC protocol errors +
      # the -29xxx application codes enumerated below). RESERVED ranges carry no
      # specific codes yet and are deliberately absent (rule 21 reversion shape:
      # each reserved code lands in the sub-PR that implements its method). A
      # server emitting a code outside this set is a conformance failure.
      enum:
        - -32700   # JSON-RPC parse error
        - -32600   # JSON-RPC invalid request
        - -32601   # JSON-RPC method not found (covers RESERVED, unimplemented names)
        - -32602   # JSON-RPC invalid params
        - -32603   # JSON-RPC internal error
        - -29000   # WALLET_ALREADY_OPEN
        - -29001   # WALLET_NOT_OPEN
        - -29002   # WALLET_FILE_EXISTS
        - -29003   # WALLET_FILE_NOT_FOUND
        - -29004   # INVALID_PASSWORD
        - -29005   # CAPABILITY_FORBIDS
        - -29006   # WALLET_SESSION_ENDED
        - -29100   # INVALID_RECIPIENT
        - -29101   # INSUFFICIENT_FUNDS
        - -29102   # FEE_ESTIMATION_FAILED
        - -29103   # RESERVATION_NOT_FOUND
        - -29104   # SNAPSHOT_INVALIDATED
        - -29105   # CONTENT_GEN_MISMATCH
        - -29106   # SUBMIT_REJECTED
        - -29107   # SUBMIT_AMBIGUOUS
        - -29108   # ABANDON_STATE_FORBIDS
        - -29109   # DAEMON_FEE_UNREASONABLE
        - -29200   # REFRESH_IN_PROGRESS
        - -29201   # DAEMON_UNREACHABLE
        - -29202   # RESCAN_BLOCKED
        - -29203   # RESCAN_INCOMPLETE
        - -29300   # PROOF_MALFORMED
        - -29301   # PROOF_TX_SECRET_UNAVAILABLE
        - -29302   # PROOF_NO_PROVABLE_OUTPUTS
        - -29303   # PROOF_TX_NOT_FOUND
        - -29400   # UNKNOWN_TRANSFER_ID
        - -29500   # STAKE_NOT_READY
        - -29501   # STAKE_IN_FLIGHT
        - -29502   # ALREADY_STAKED
        - -29503   # STAKE_RECORD_MOVED
        - -29504   # STAKE_RECOVERED_PENDING_REOPEN
        - -29505   # STAKE_NO_SHARDS_AVAILABLE
        - -29506   # STAKE_FOUNDATION_UNACKNOWLEDGED
        - -29800   # MSG_SIG_VERIFY_FAILED
        - -29801   # MSG_SIG_CORRUPTED
        - -29802   # MSG_SIG_UNSUPPORTED_SCHEME
        - -29900   # TENANT_UNAVAILABLE
      description: |
        Allocated codes (this commit). Per-method additions extend this enum
        within the ranges fixed in the file header.

          -29000 WALLET_ALREADY_OPEN      lifecycle: a wallet is open; close first
          -29001 WALLET_NOT_OPEN          lifecycle: no wallet open
          -29002 WALLET_FILE_EXISTS       create: refusing to overwrite
          -29003 WALLET_FILE_NOT_FOUND    open: no such wallet file
          -29004 INVALID_PASSWORD         open/change_password: MAC failure
          -29005 CAPABILITY_FORBIDS       operation requires FULL capability
                                          (data: {"capability": "..."})
          -29006 WALLET_SESSION_ENDED     the open wallet's session ended
                                          (key actor stopped, key material
                                          wiped): terminal for the session —
                                          close and reopen the wallet, then
                                          retry. Emitted by sign_message;
                                          any future key-actor method maps
                                          its stopped-actor failure here

          -29100 INVALID_RECIPIENT        build/proofs: address parse or
                                          network check failed
          -29101 INSUFFICIENT_FUNDS       build: spendable balance too low
          -29102 FEE_ESTIMATION_FAILED    build: daemon fee query failed
          -29103 RESERVATION_NOT_FOUND    submit: unknown/expired handle
          -29104 SNAPSHOT_INVALIDATED     submit: reorg raced the reservation;
                                          discard-or-rebuild (lazy R5)
          -29105 CONTENT_GEN_MISMATCH     submit: seen_gen != content_gen —
                                          re-anchor changed authorized content
                                          (CT-5d); re-review and resubmit
          -29106 SUBMIT_REJECTED          submit: definite daemon rejection
                                          (data carries the SubmitVerdict
                                          projection per DAEMON_SUBMIT_VERDICT
                                          §2.5)
          -29107 SUBMIT_AMBIGUOUS         submit: transport-level RpcError;
                                          resubmit-of-held-bytes is the
                                          status query
          -29108 ABANDON_STATE_FORBIDS    abandon_tx: the send's state
                                          forbids abandoning (CONFIRMED is
                                          on chain; FAILED never relayed).
                                          data: {"state": "..."} in
                                          get_transfers vocabulary. There
                                          is no force override (P3-4)
          -29109 DAEMON_FEE_UNREASONABLE  build / get_default_fee_priority /
                                          stake: the daemon ANSWERED the fee
                                          query and the wallet refused the
                                          answer —
                                          non-monotonic tier band, or a
                                          tier whose effective weight-1
                                          charge (mask rounding included)
                                          exceeds the era-maximum
                                          legitimate fee — the
                                          daemon-rounded genesis-condition
                                          Fh, 14,000,000
                                          atomic-units/weight, derived from
                                          the economics parameters and
                                          KAT-pinned
                                          (data: {"reason","rate","bound"}).
                                          Distinct from -29102 (the query
                                          itself failed) by rule 82: the
                                          remedies differ — retry vs. stop
                                          trusting this daemon. The
                                          intra-snapshot 10×-economy lock is
                                          withdrawn (honest 2021-scaling
                                          Fh/Fl exceeds 10×), as is the
                                          custom-only 100×-economy ceiling.
                                          The historical median-multiple
                                          ceiling lands with the V3.x
                                          wallet-side estimator.
                                          On `stake` this refuses the BOND
                                          fee, which is charged to persona
                                          working capital and has no fee
                                          control of its own — so this is
                                          the only place the operator learns
                                          the daemon quoted an absurd rate.
                                          Nothing durable is written (W1)
          -29200 REFRESH_IN_PROGRESS      refresh: single-flight violation
          -29201 DAEMON_UNREACHABLE       refresh/rescan/proofs: daemon RPC
                                          failed (proof methods dial the
                                          daemon for tx bodies / spent-set
                                          queries; for rescan this code is
                                          reserved to the *preflight*
                                          refusal — wallet untouched. A
                                          mid-scan daemon drop after the
                                          reset is durable is -29203)
          -29202 RESCAN_BLOCKED           rescan: refused — outstanding
                                          pending-tx reservations
                                          (consumer-held or in-flight)
                                          hold in-memory output locks a
                                          chain replay cannot rebuild
                                          (unconfirmed submitted txs no
                                          longer refuse: the send journal
                                          re-derives their locks). A
                                          resolvable state conflict, NOT a
                                          bad request: submit or discard
                                          the reservations, retry. Nothing
                                          was reset
                                          (data: {"detail": "..."})
          -29203 RESCAN_INCOMPLETE        rescan: reset persisted, then the
                                          producer failed before the ledger
                                          was rebuilt (any join-path
                                          RefreshError — Io, cancel,
                                          malformed scan, concurrent
                                          mutation, invariant, curve-tree
                                          ingest). History is empty until a
                                          rescan finishes; retry. Distinct
                                          from -29201 so clients that branch
                                          on "untouched" do not lie after a
                                          mid-scan failure; distinct from
                                          -32603 so durability-branching
                                          clients do not miss non-Io
                                          producer failures
          -29300 PROOF_MALFORMED          check_*: proof string failed
                                          Bech32m decode, carried the wrong
                                          HRP, its wire framing did not
                                          parse, it exceeds the size caps
                                          pinned in the Proofs section
                                          (locator count / decoded payload
                                          bytes — refused before any daemon
                                          fetch), or a reserve proof's
                                          entries repeat a key image
                                          (duplicate-output inflation —
                                          malformed by construction, see
                                          CheckReserveProofParams). Distinct
                                          from a VALID framing that fails
                                          cryptographic verification — that
                                          is result {"valid": false}, not an
                                          error
          -29301 PROOF_TX_SECRET_UNAVAILABLE
                                          get_tx_proof (outbound): the
                                          wallet holds no per-tx secret for
                                          this txid (not sent by this
                                          wallet, or sent by another copy)
          -29302 PROOF_NO_PROVABLE_OUTPUTS
                                          get_tx_proof (inbound): no owned
                                          outputs in this tx (the scan path
                                          stores a source ciphertext for
                                          every recorded incoming transfer,
                                          so owned always implies provable).
                                          get_reserve_proof: zero eligible
                                          unspent outputs, or unspent total
                                          below the requested amount
          -29303 PROOF_TX_NOT_FOUND       proofs: a txid named by the
                                          request (or embedded in a reserve
                                          proof's locators) is unknown to
                                          the daemon
          -29400 UNKNOWN_TRANSFER_ID      get_transfer_by_id: a well-formed
                                          id naming no row (a malformed id
                                          is -32602, not this)
          -29500 STAKE_NOT_READY          stake: persona funding not ready
                                          (W1-clean refusal — fund via
                                          stake_in and/or let the persona
                                          scan catch up, then retry;
                                          data: {"detail": "..."} — never
                                          amounts)
          -29501 STAKE_IN_FLIGHT          stake: a signed bond post is
                                          already sealed awaiting its
                                          scheduled broadcast
          -29502 ALREADY_STAKED           stake: a confirmed bond exists
                                          for a bonded persona (idempotent
                                          refusal)
          -29503 STAKE_RECORD_MOVED       stake: the wallet's own staking
                                          record was reconciled during the
                                          credentialed reopen (a phantom slot
                                          collected, or the cursor burned past
                                          a retired persona), so the slot
                                          picked before it is stale; nothing
                                          durable was written — call stake
                                          again (no payload: persona
                                          numbering is wallet-internal).
                                          A reconcile that ADOPTS a
                                          chain-proven bond returns -29502
                                          instead, not this code
          -29504 STAKE_RECOVERED_PENDING_REOPEN
                                          stake: this session's scan recovered
                                          a staked slot; staking becomes
                                          operational at the next wallet
                                          open — close and reopen, then retry
          -29505 STAKE_NO_SHARDS_AVAILABLE
                                          stake: market staking assigns a
                                          shard automatically, and shard
                                          assignment is not available yet;
                                          nothing was written. Kept off
                                          -29500 because "fund and retry"
                                          is the wrong sentence for a wallet
                                          whose funding is fine
          -29506 STAKE_FOUNDATION_UNACKNOWLEDGED
                                          stake: posture
                                          "foundation_complete_tree" was
                                          requested without
                                          acknowledge_non_earning_unbounded.
                                          The refusal MESSAGE IS THE WARNING
                                          (D-4): every client, including a
                                          third-party wrapper, must
                                          round-trip the acknowledgment, so
                                          the terms are seen or deliberately
                                          echoed. Nothing was written
          -29800 MSG_SIG_VERIFY_FAILED    verify_message: well-formed,
                                          checksum-intact, and NOT a valid
                                          signature by that address over
                                          this message on this network.
                                          The method's honest negative
                                          answer (SM-R-6), never conflated
                                          with a shape error (-32602) or a
                                          damaged paste (-29801)
          -29801 MSG_SIG_CORRUPTED        verify_message: the armored
                                          string's 4-byte checksum failed —
                                          the paste was damaged in transit.
                                          Remedy: re-copy the signature.
                                          The checksum is NOT security
                                          (verification is the integrity
                                          check); it exists exactly so this
                                          sentence and -29800 stay apart
                                          (rule 82)
          -29802 MSG_SIG_UNSUPPORTED_SCHEME
                                          verify_message: the scheme byte
                                          names a signature scheme this
                                          build does not implement — "this
                                          wallet is too old to check it",
                                          the append-only forward-compat
                                          outcome (SM-R-5).
                                          data: {"scheme": <byte>}
          -29900 TENANT_UNAVAILABLE       server: wallet-dir tenancy (reserved
                                          for the multi-tenant sub-PR)

    # ── Scalars ──────────────────────────────────────────────────────
    AtomicUnits:
      type: string
      pattern: "^[0-9]+$"
      description: >
        u64 amount in atomic units, decimal string. Mirrors
        `shekyl_units::AtomicUnits`.

    Feerate:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: >
        Nonzero feerate in atomic units per **weight** unit, decimal string.
        Per weight, NOT per byte: the two diverge by the Bulletproofs+
        clawback once a transaction has more than two outputs, so sizing a
        rate against the serialized length pins the wrong number. Mirrors the
        `NonZeroU64` inside `shekyl_engine_core::FeePriority::Custom` — a rate,
        NOT an amount, so it is distinct from `AtomicUnits` and forbids "0"
        (the pattern excludes zero and leading zeros).

    Hex32:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: 32 bytes, lowercase hex.

    CapabilityMode:
      type: string
      enum: [FULL, VIEW_ONLY, HARDWARE_OFFLOAD]
      description: >
        Typed projection of the wallet envelope capability
        (`shekyl_engine_file::Capability`). Carried explicitly on every
        wallet-handle response; never inferred by the client.

    FeePriority:
      description: >
        Mirrors `shekyl_engine_core::FeePriority`. Named tiers resolve to a
        feerate via the daemon fee estimate at build time — never hardcoded
        multipliers — and the snapshot must be well-formed (monotonic
        tiers, no named tier above the era-maximum absolute cap;
        -29109 otherwise).
        `custom` pins atomic units per weight unit (see `Feerate` — per
        weight, not per byte), bypassing the named tiers
        but not the policy they obey: it must sit at or above the
        snapshot's economy floor and at or below the same absolute cap
        (-32602 otherwise — a `custom` rate is the caller's parameter,
        not a daemon defect). There is no `custom`-only relative
        ceiling, so `custom` can always express the snapshot's own
        `PRIORITY` rate, or a little more.
      oneOf:
        - type: string
          enum: [ECONOMY, STANDARD, PRIORITY]
        - type: object
          required: [custom]
          properties:
            custom:
              $ref: "#/components/schemas/Feerate"

    HybridSignature:
      type: object
      required: [ed25519, ml_dsa_65]
      description: >
        Hybrid PQC signature; both components always present. Fixed lengths
        mirror `shekyl_crypto_pq::HybridSignature::validate`
        (`ED25519_SIGNATURE_LENGTH` = 64 B; `ML_DSA_65_SIGNATURE_LENGTH` =
        `ml_dsa_65::SIG_LEN` = 3309 B) so spec-based conformance rejects
        malformed signatures the same way the Rust validator does.
      properties:
        ed25519:
          type: string
          pattern: "^[0-9a-f]{128}$"
          description: 64-byte Ed25519 signature, lowercase hex.
        ml_dsa_65:
          type: string
          pattern: "^[0-9a-f]{6618}$"
          description: 3309-byte ML-DSA-65 signature, lowercase hex.

    # ── Wallet lifecycle ─────────────────────────────────────────────
    WalletHandle:
      type: object
      required: [name, capability, network]
      description: >
        Returned by every lifecycle call that leaves a wallet open. The RPC
        process holds at most one open wallet per tenant; the handle is
        informational, not a bearer token — auth rides the transport.
      properties:
        name:
          type: string
          description: Wallet file stem within the served wallet directory.
        capability:
          $ref: "#/components/schemas/CapabilityMode"
        network:
          type: string
          enum: [MAINNET, TESTNET, STAGENET]
        restore_height_hint:
          type: integer
          format: int64

    CreateWalletParams:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string
        language:
          type: string
          default: en
          description: BIP-39 wordlist language for the generated seed.

    CreateWalletResult:
      type: object
      required: [wallet]
      description: >
        On success the wallet is open. Backup material is returned exactly
        once: BIP-39 `mnemonic` on mainnet/stagenet, or `raw_seed_hex` on
        testnet (32-byte entropy, lowercase hex). Clients must persist the
        backup before discarding the response; the server does not re-emit it.
      properties:
        wallet:
          $ref: "#/components/schemas/WalletHandle"
        mnemonic:
          type: string
          description: >
            24-word BIP-39 English mnemonic (mainnet/stagenet). Absent on
            testnet. Equally secret with the master seed — never log.
        raw_seed_hex:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            32-byte raw seed as lowercase hex (testnet only). Absent on
            mainnet/stagenet.

    RestoreWalletParams:
      type: object
      required: [name, password, mnemonic]
      description: >
        Recreate a wallet from its seed backup (WI-RPC-2a). The name must
        not collide with an existing wallet file (-29002). Seed format is
        NETWORK-GOVERNED, mirroring create's output: mainnet/stagenet
        take the 24-word BIP-39 mnemonic; testnet takes the 32-byte raw
        seed as 64-char hex (exactly CreateWalletResult.raw_seed_hex) —
        ratified through the WI-RPC-2a high-review pass 2026-07-23;
        contract reconciled to the shipped lifecycle.rs behavior
        2026-07-24 (the earlier "testnet refuses with -32602" text
        contradicted dev). Format failures refuse with -32602; the
        invalid-seed error messages are stable and never reflect the
        supplied material.
      properties:
        name:
          type: string
        password:
          type: string
          description: New envelope password for the restored wallet file.
        mnemonic:
          type: string
          description: >
            Network-governed seed material: 24-word BIP-39 English
            mnemonic (mainnet/stagenet) or 64-hex raw seed (testnet),
            from CreateWalletResult. Equally secret with the master
            seed — never log.
        restore_height:
          type: integer
          format: int64
          minimum: 0
          description: >
            Rescan floor — a block height at or below the wallet's first
            output. Omitted or 0 scans from genesis. Values above the u32
            keys-file field refuse with -32602 rather than truncating.
        language:
          type: string
          default: en
          description: >
            BIP-39 wordlist language of the supplied mnemonic
            (mainnet/stagenet path only; ignored for testnet raw seeds).

    RestoreWalletResult:
      type: object
      required: [wallet]
      description: >
        On success the wallet is open. No backup material is echoed — the
        caller supplied the mnemonic.
      properties:
        wallet:
          $ref: "#/components/schemas/WalletHandle"

    OpenWalletParams:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string

    OpenWalletResult:
      type: object
      required: [wallet]
      properties:
        wallet:
          $ref: "#/components/schemas/WalletHandle"

    CloseWalletParams:
      type: object
      description: No parameters; closing an already-closed wallet is an error (-29001).

    CloseWalletResult:
      type: object
      description: Empty object on success.

    ChangePasswordParams:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string

    ChangePasswordResult:
      type: object
      description: Empty object on success.

    StakeParams:
      type: object
      required: [password]
      description: >
        First-stake continuation. The engine entry is posture-mandatory,
        and this surface offers both: `posture` selects which obligation
        the bond takes on, and omitting it means market staking — so every
        caller written before the parameter existed keeps its exact
        behaviour. The foundation posture is reachable ONLY by also
        setting `acknowledge_non_earning_unbounded`; without it the call
        refuses -29506 and the refusal message is the full warning (D-4).
        Market staking today refuses -29505: shard assignment is its own
        round, so a well-funded wallet is told so rather than silently
        owing the corpus.
      properties:
        password:
          type: string
          description: >
            Wallet password — load-bearing, not UX: a mid-session wallet
            holds no seed, and only a credentialed reopen re-materializes
            it for the bootstrap persona derivation (SA-R1-d). Verified
            against the sealed envelope BEFORE the reopen closes anything,
            so a wrong password refuses (-29004) with the wallet still
            open. Crosses a local transport only.
        posture:
          type: string
          enum: [market, foundation_complete_tree]
          default: market
          description: >
            Which archival obligation this bond takes on. `market` is an
            ordinary per-shard staking position inside the reward market.
            `foundation_complete_tree` is the whole-corpus archival
            backstop: permanently excluded from the reward market by
            holdings shape, unbounded and monotone in disk, and fully
            inside the penalty economy. Absent means `market`, which is
            what makes this parameter additive rather than breaking.
            A posture, never a shard set and never a raw holdings kind —
            there is no select-all affordance on this API.
        acknowledge_non_earning_unbounded:
          type: boolean
          default: false
          description: >
            Required to be `true` for posture
            `foundation_complete_tree`; ignored for `market`. Its absence
            is not a validation nicety — it is the warning gate (D-4):
            the -29506 refusal body carries the full statement of terms,
            so a client either shows the operator those terms or
            deliberately echoes an acknowledgment it was handed. The
            wallet GUI never sends this field, which is what keeps the
            foundation posture off that surface by construction.

    FoundationPostureWarning:
      type: string
      description: |
        The verbatim body of a -29506 refusal, and the text the CLI prints
        before it will accept the typed phrase. Published here because the
        contract is what a client implementer reads: a wrapper that wants
        to render the terms itself must render THESE terms. The server
        constant and this block are compared whitespace-normalized by
        `foundation_warning_matches_the_published_contract`, so the two
        cannot drift apart silently.
      example: |
        Foundation CompleteTree posture — read before confirming.
        This bond declares your node a whole-corpus archival backstop. It is not a staking product:
        1. It never earns. CompleteTree holdings are excluded from the reward market by holdings shape, permanently. This is not a phase or a promotion path.
        2. The obligation grows forever. You commit to storing and serving every frozen shard the chain ever produces. Disk consumption is unbounded and monotone. Your drive space is your commitment.
        3. The penalty side is fully live. You are challenged like any archiver, over the entire frozen corpus. Missed service inside the tolerance window is absorbed; crossing it slashes your collateral, clears your holdings, and demotes this record to an ordinary market position. Reinstatement from there is as a market participant. Returning to CompleteTree posture requires a fresh foundation bond under a new persona.
        4. Capital is locked at zero yield. The bond floor is nominal, but it is collateral against the largest possible obligation.
        5. Durability credit is genesis-gated. Unless your identity is in the genesis foundation enumeration, this node also receives no durability_count credit — it is a pure donation to the network. Donations are welcome and genuinely valuable; they are simply not compensated.
        To proceed, confirm that you are choosing a non-earning, unbounded-storage service posture.
        CLI: type exactly: `serve without reward` — RPC: set `acknowledge_non_earning_unbounded: true`.

    StakeResult:
      type: object
      required: [slot, swept_inputs, resumed, state]
      description: >
        The first-stake continuation completed and the signed bond post is
        durably sealed awaiting its scheduled broadcast (no broadcast
        happens on this call — the dispatch driver sends at its GF-7
        offset). Re-invoking `stake` after a mid-flow failure resumes the
        durable slot (`resumed: true`).
      properties:
        slot:
          type: integer
          description: The persona slot the first bond was posted for.
        swept_inputs:
          type: integer
          description: >
            Funding inputs the sweep consumed (the common case is exactly
            1 — the structured stake_in output).
        resumed:
          type: boolean
          description: Whether this call resumed a crashed first-stake.
        state:
          type: string
          enum: [pending_dispatch]

    # ── Balance / address ────────────────────────────────────────────
    GetBalanceParams:
      type: object
      description: No parameters.

    GetBalanceResult:
      type: object
      required: [liquid, staked, unlocked, claimable_rewards, pending]
      description: >
        Staking is first-class (locked JSON shape). `staked` and
        `claimable_rewards` are "0" until the Stage 3 stake methods land;
        the fields are present from the first release so the shape never
        changes under clients.
      properties:
        liquid:
          $ref: "#/components/schemas/AtomicUnits"
        staked:
          $ref: "#/components/schemas/AtomicUnits"
        unlocked:
          $ref: "#/components/schemas/AtomicUnits"
        claimable_rewards:
          $ref: "#/components/schemas/AtomicUnits"
        pending:
          $ref: "#/components/schemas/AtomicUnits"

    GetPrimaryAddressParams:
      type: object
      description: No parameters.

    GetPrimaryAddressResult:
      type: object
      required: [address]
      description: >
        Single `address` string; no `index` field (no subaddresses — payment
        requests are the receive-attribution surface, Phase 2c).
      properties:
        address:
          type: string

    # ── Send lifecycle (build / submit / discard) ────────────────────
    TxRecipient:
      type: object
      required: [address, amount]
      properties:
        address:
          type: string
          description: Canonical Shekyl address; parsed and network-checked at build.
        amount:
          $ref: "#/components/schemas/AtomicUnits"

    BuildPendingTxParams:
      type: object
      required: [recipients, priority]
      description: >
        Mirrors `shekyl_engine_core::TxRequest`. No payment_id, no extra
        escape hatch (Phase 1 decision).
      properties:
        recipients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TxRecipient"
        priority:
          $ref: "#/components/schemas/FeePriority"

    BuildPendingTxResult:
      type: object
      required: [pending_tx_id, built_at_height, built_at_tip_hash, fee, content_gen]
      description: >
        Mirrors `shekyl_engine_core::PendingTx`. `pending_tx_id` is a
        process-local reservation handle — it carries no meaning across RPC
        server restarts (the reservation ledger is process state). Clients
        display fee + recipients for confirmation, then submit or discard.
      properties:
        pending_tx_id:
          type: string
          description: Opaque reservation handle (`ReservationId`).
        built_at_height:
          type: integer
          format: int64
        built_at_tip_hash:
          $ref: "#/components/schemas/Hex32"
        fee:
          $ref: "#/components/schemas/AtomicUnits"
        content_gen:
          type: integer
          format: int64
          description: >
            Authorized-content generation (CT-5d re-anchor gate). Pass back
            verbatim as `seen_gen` on submit; a mismatch means a re-anchor
            changed the transaction content after the client reviewed it.

    SubmitPendingTxParams:
      type: object
      required: [pending_tx_id, seen_gen]
      properties:
        pending_tx_id:
          type: string
        seen_gen:
          type: integer
          format: int64

    SubmitPendingTxResult:
      type: object
      required: [tx_hash, verdict]
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"
        verdict:
          type: string
          enum: [ACCEPTED, ALREADY_IN_POOL, ALREADY_IN_CHAIN]
          description: >
            Success projection of the wire `SubmitVerdict`
            (`shekyl_rpc_types::SubmitVerdict`; DAEMON_SUBMIT_VERDICT.md
            §2.5). Rejections surface as error -29106 with the verdict
            detail in `error.data`; transport ambiguity as -29107.
        confirmed_height:
          type: integer
          format: int64
          description: Present iff verdict is ALREADY_IN_CHAIN.

    DiscardPendingTxParams:
      type: object
      required: [pending_tx_id]
      properties:
        pending_tx_id:
          type: string

    DiscardPendingTxResult:
      type: object
      description: >
        Empty object. Idempotent — discarding an unknown handle succeeds
        (cross-cutting lock 4).

    AbandonTxParams:
      type: object
      required: [tx_hash]
      description: >
        `abandon_tx` (WALLET_SEND_RECORD.md P3-4 / SJ-DQ-8): give up on a
        dispatched send. The send record moves to ABANDONED and its
        retention reference migrates off the live pending set; the
        retained per-tx secret is kept, so `get_tx_proof` OUTBOUND still
        works for the abandoned txid. Input locks are NOT released by
        intent: an abandoned-but-still-landable send keeps its spent-input
        locks until the watchdog's confirmed-absent evidence releases them
        (the self-link defence), and a late confirmation flips the row to
        CONFIRMED loudly. Idempotent: re-abandoning an ABANDONED row
        succeeds with the same result. Refusals: unknown txid -29400;
        CONFIRMED / FAILED rows -29108 (no force override — deleting a row
        from view is the deletion surface's job, not abandon's).
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"

    AbandonTxResult:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ABANDONED]
          description: The row's resulting state (always ABANDONED).

    SetTxNoteParams:
      type: object
      required: [tx_hash, note]
      description: >
        `set_tx_note` (WALLET_SEND_RECORD.md SJ-DQ-7): attach or clear a
        user-authored note on a transaction. The note is keyed by the bare
        txid, so it annotates the transaction rather than one output — it
        surfaces on every `get_transfers` / `get_transfer_by_id` row for
        that txid, both the INCOMING change row and the OUTGOING row of a
        self-send. Purely local wallet UX state: never on the wire, never in
        a proof. A non-empty note is accepted only for a **transaction this
        wallet is a party to** — received, spent, pending, or seen in the
        pool; a note on an unknown txid is refused with -32602 ("no such
        transaction in this wallet"). An **empty `note` clears** any existing
        note (there is no separate delete method — "unset" and "set-empty"
        are the same state) and is always allowed, even for an unknown txid,
        so a note orphaned by a reorg can be removed. A note longer than 4096
        UTF-8 bytes is rejected with -32602 (byte length, not character
        count); the refusal reports byte counts only, never the note text.
        The same ceilings are enforced on the wallet write path so every
        caller shares the invariant.
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"
        note:
          type: string
          description: >
            The note text (UTF-8). Empty string clears the note. Hard limit is
            4096 **UTF-8 bytes** (not Unicode scalar count) — OpenAPI has no
            byte-length constraint, so clients must measure `len(utf8)` and
            not character count; the server refuses over-length notes with
            -32602 reporting byte counts only.

    SetTxNoteResult:
      type: object
      required: [tx_hash]
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"
        note:
          type: string
          description: >
            The note as stored after the write. Omitted when the note was
            cleared (empty input).

    GetTxNoteParams:
      type: object
      required: [tx_hash]
      description: >
        `get_tx_note` (WALLET_SEND_RECORD.md SJ-DQ-7): read back the note
        stored for a txid. This is the paired reader for `set_tx_note`, and it
        is the ONLY way to read a note whose transaction has no history row
        yet: a note can be set on any txid the wallet is a party to, including
        an outgoing tx still pending confirmation or one seen only in the pool,
        but `TransferView.note` can only annotate rows that exist — so until
        the transaction lands in scanned history the note appears on no history
        row. An unknown txid is NOT an error: it answers with `note` omitted,
        exactly as a cleared note does (a read makes no existence claim about
        the transaction).
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"

    GetTxNoteResult:
      type: object
      required: [tx_hash]
      properties:
        tx_hash:
          $ref: "#/components/schemas/Hex32"
        note:
          type: string
          description: >
            The stored note. Omitted when there is none — which is also the
            answer for a txid the wallet has never seen.

    # ── History ──────────────────────────────────────────────────────
    ReceiveAttributionKind:
      type: string
      enum: [UNATTRIBUTED, MATCHED, LABEL_UNKNOWN, MANUAL_MATCH, DISPUTED]
      description: >
        FA-8 receive-attribution kind on an INCOMING transfer row. Cleartext
        request labels never appear here — they stay on `list_payment_requests`.

    ReceiveAttribution:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/ReceiveAttributionKind"
        request_id:
          type: string
          description: Decimal payment-request id when MATCHED / MANUAL_MATCH.
        echoed_label_hash:
          type: string
          description: 64-char lowercase hex of the echoed label hash (LABEL_UNKNOWN).
        dispute_reason:
          type: string
          description: WrongLabel / WrongAmount / Other(...) when DISPUTED.

    Transfer:
      type: object
      required: [id, direction, tx_hash, amount, fee, state]
      description: >
        Client-facing transfer history row. INCOMING projects
        `shekyl_engine_state::TransferDetails` (scan ledger outputs);
        OUTGOING projects `SendJournalBlock` rows (SJ-DQ-7 / PR-SJ-2).
        Internal fields (key material, key offsets, commitments) never cross
        this boundary — the RPC exposes accounting facts only.


        One transaction can produce several rows: each receive-side
        output the wallet owns (including the change output of the
        wallet's own send) projects an INCOMING row, and the send's
        journal record projects an OUTGOING row. `tx_hash` is therefore
        **not** unique across the result set — `id` is the unique key.
        A client that groups or totals history by transaction must
        expect both directions under one hash and must not sum `amount`
        across them.
      properties:
        id:
          type: string
          description: >
            Stable per-wallet transfer identifier. INCOMING:
            `{tx_hash_hex}:{internal_output_index}`. OUTGOING: bare
            `{tx_hash_hex}` (journal is txid-keyed; no output index).
        direction:
          type: string
          enum: [INCOMING, OUTGOING]
        tx_hash:
          $ref: "#/components/schemas/Hex32"
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        fee:
          $ref: "#/components/schemas/AtomicUnits"
        block_height:
          type: integer
          format: int64
          description: >
            Inclusion height — the height the transaction was mined at.
            **Absent** exactly when the transaction is not on chain: an
            OUTGOING row in `PENDING`, `FAILED`, `DROPPED` or
            `ABANDONED`. The wallet
            knows the height it dispatched at, but that is a local sync
            counter, not an inclusion height; emitting it here would put
            a plausible block number beside a send that was never mined.
            INCOMING rows are scanner-observed and always carry it.
        state:
          type: string
          enum: [PENDING, CONFIRMED, SPENT, FAILED, DROPPED, ABANDONED]
          description: >
            PENDING = unsettled (receive awaiting confirmation, or send
            still in flight). CONFIRMED = on-chain. SPENT = receive
            output consumed. FAILED = OUTGOING only: the daemon refused
            dispatch (`TerminalRejected`); never mined. DROPPED =
            OUTGOING only: the confirmed-absent watchdog concluded the
            network no longer holds the send and released its input
            locks (`PresumedDead`), so the funds are spendable again and
            the send can be re-made — a late confirmation still flips
            such a row to CONFIRMED. ABANDONED = OUTGOING only: the user
            gave up on the send (`abandon_tx`); unlike DROPPED the
            release claim is intent, not evidence, so the input locks
            may still be held until the watchdog resolves — and a late
            confirmation still flips such a row to CONFIRMED.


            Each value is a distinct situation and none collapses into
            another: a DROPPED send reported as PENDING would say the
            wallet is still waiting while the same wallet reports those
            funds available; an ABANDONED send reported as DROPPED would
            claim evidence the wallet never observed.
        spent_height:
          type: integer
          format: int64
        attribution:
          allOf:
            - $ref: "#/components/schemas/ReceiveAttribution"
          description: >
            Present on INCOMING rows only. Receive attribution answers
            which payment request a receive arrived against, which has no
            meaning for a row the wallet sent, so an OUTGOING row omits
            the field rather than carrying an invented `UNATTRIBUTED`.
        note:
          type: string
          description: >
            User-authored note for this transaction (SJ-DQ-7), set via
            `set_tx_note`. Keyed by the bare txid, so it annotates the
            transaction, not one output: both directions of a self-send
            surface the same note. Omitted when no note is set.

    GetTransfersParams:
      type: object
      description: All filters optional; unfiltered returns full history.
      properties:
        direction:
          type: string
          enum: [INCOMING, OUTGOING]
        state:
          type: string
          enum: [PENDING, CONFIRMED, SPENT, FAILED, DROPPED, ABANDONED]
        since_height:
          type: integer
          format: int64
          minimum: 0
          description: >
            Inclusive lower bound on transfer `block_height`. Negative values
            are rejected with `-32602 InvalidParams`.
        attribution:
          type: string
          enum: [UNATTRIBUTED, MATCHED, LABEL_UNKNOWN, MANUAL_MATCH, DISPUTED]
          description: >
            Filter by FA-8 receive attribution. CLI `history incoming
            --unattributed` sends `direction: INCOMING` +
            `attribution: UNATTRIBUTED`.


            Bounds *inclusion* height only: a row with no `block_height`
            (an OUTGOING send in `PENDING`, `FAILED`, `DROPPED` or
            `ABANDONED`) has
            nothing to compare against and is **always** returned. This
            is what makes the filter usable as a polling watermark —
            a never-mined row could never rise above a rising bound, so
            excluding it would hide unsettled and failed sends
            permanently, and would hide a confirmed send the moment a
            reorg flipped it back to unsettled.

    GetTransfersResult:
      type: object
      required: [transfers]
      description: >
        Ordered: ascending `block_height`, then INCOMING before OUTGOING
        within a height, then transaction hash, then output index. Rows
        with no `block_height` (never mined) sort after every mined row.
        The order is total and stable across calls; it is computed from
        typed fields, so a transaction's outputs are ordered by index
        rather than by the lexicographic form of `id`.
      properties:
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"

    GetTransferByIdParams:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: >
            A `Transfer.id` as returned by `get_transfers`: for a
            receive, `{tx_hash_hex}:{internal_output_index}`; for a
            send, a bare `{tx_hash_hex}`. Both hex forms are exactly 64
            **lowercase** hex characters and the index is decimal with
            no leading zeros — the canonical form this server emits.


            A string that is not in one of those two forms is rejected
            with `-32602 InvalidParams`; only a well-formed id naming no
            row yields `-29400 UNKNOWN_TRANSFER_ID`. The distinction
            matters: an uppercase txid answered with "unknown transfer"
            would tell a user their send does not exist.

    GetTransferByIdResult:
      type: object
      required: [transfer]
      properties:
        transfer:
          $ref: "#/components/schemas/Transfer"

    GetWalletInfoParams:
      type: object
      description: No parameters. Aggregate of already-live read surfaces.

    GetWalletInfoResult:
      type: object
      required:
        - name
        - capability
        - network
        - address
        - wallet_height
        - balance
        - staking
        - restore_height
      description: >
        One-round-trip wallet summary for CLI `engine_info` (WI-RPC-4).
        Composes `get_balance` / height / address / staking_info; no new
        Engine API.
      properties:
        name:
          type: string
        capability:
          $ref: "#/components/schemas/CapabilityMode"
        network:
          type: string
          enum: [MAINNET, TESTNET, STAGENET]
        address:
          type: string
        wallet_height:
          type: integer
          format: int64
        daemon_height:
          type: integer
          format: int64
          nullable: true
        restore_height:
          type: integer
          format: int64
          description: Wallet scan floor (`restore_from_height`).
        balance:
          $ref: "#/components/schemas/GetBalanceResult"
        staking:
          $ref: "#/components/schemas/StakingInfoResult"

    # ── Refresh / rescan ─────────────────────────────────────────────
    RefreshParams:
      type: object
      description: No parameters. Single-flight; a concurrent call errors -29200.

    RefreshResult:
      type: object
      required: [blocks_processed, transfers_detected, synced_height]
      description: Projection of `shekyl_engine_core::RefreshSummary`.
      properties:
        blocks_processed:
          type: integer
          format: int64
        transfers_detected:
          type: integer
          format: int64
        synced_height:
          type: integer
          format: int64
        reorg_fork_height:
          type: integer
          format: int64
          description: Present iff a reorg was detected and rewound this refresh.

    RescanBlockchainParams:
      type: object
      description: >
        No parameters. Full rescan from the wallet's scan floor
        (`restore_from_height`, raised by any configured `skip_to_height` /
        `refresh_from_block_height`). Destroys and rebuilds scan-derived
        state; accounting facts are re-derived from chain data, while
        user-authored records (retained tx keys, notes, payment-request rows,
        address book) and durable staking bond records survive.

        Shares the refresh single-flight slot (-29200). Refuses before
        touching the wallet when the daemon is unreachable (-29201) or when
        outstanding pending-tx reservations (consumer-held or in-flight)
        hold spend records a replay cannot rebuild (-29202; unconfirmed
        submitted transactions no longer refuse — the send journal carries
        their input set across the wipe). Past those refusals the reset is
        durable before scanning begins: a scan that then fails (any producer
        failure on join) leaves the wallet emptied and returns -29203
        RESCAN_INCOMPLETE (re-runnable; not -29201, and not a generic
        -32603).

    RescanBlockchainResult:
      type: object
      required: [blocks_processed, transfers_detected, synced_height]
      properties:
        blocks_processed:
          type: integer
          format: int64
        transfers_detected:
          type: integer
          format: int64
        synced_height:
          type: integer
          format: int64

    # ── Node info ────────────────────────────────────────────────────
    GetHeightParams:
      type: object
      description: No parameters.

    GetHeightResult:
      type: object
      required: [wallet_height]
      properties:
        wallet_height:
          type: integer
          format: int64
          description: Wallet synced height; always present (local state).
        daemon_height:
          type: integer
          format: int64
          nullable: true
          description: >-
            Daemon chain height, or null when the daemon is unreachable. The
            wallet_height is still returned in that case so an offline or
            still-syncing node does not hide the wallet's own status.

    GetVersionParams:
      type: object
      description: No parameters.

    GetVersionResult:
      type: object
      required: [version, api_version]
      properties:
        version:
          type: string
          description: shekyl-wallet-rpc semver.
        api_version:
          type: integer
          description: >
            Monotonic API contract version; bumped when any SPECIFIED shape
            changes incompatibly. Pre-genesis this stays 1 — incompatible
            changes are atomic cutovers, not versioned skew (rule 16
            user-absent-context inversion).

    # ── Receiving (payment requests / URI) — WI-RPC-1 ────────────────
    # Shekyl has NO subaddresses and NO accounts. The receive-attribution
    # surface is the payment request: an opaque non-zero u48 `rid` riding
    # the `shekyl:` URI. The wallet matches incoming payments to requests
    # and un-matches on reorg; the RPC projects that bookkeeping only.
    PaymentRequestId:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: >
        Opaque payment-request reference (`rid`): non-zero, fits the u48-LE
        wire encoding (max 281474976710655). Decimal string on the wire
        (JSON numbers lose precision past 2^53 as a policy; u48 fits, but
        the id is opaque and string-typed for stability).

    PaymentRequestState:
      type: string
      enum: [PENDING, MATCHED, EXPIRED, CANCELLED]

    PaymentRequest:
      type: object
      required: [id, label, amount, created_at, state]
      description: >
        Client-facing projection of the engine's payment-request
        bookkeeping. Accounting facts only; no key material.
      properties:
        id:
          $ref: "#/components/schemas/PaymentRequestId"
        label:
          type: string
          description: Merchant-local label (may be empty).
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        created_at:
          type: integer
          format: int64
          description: Block height at creation (the request clock is height).
        expiry:
          type: integer
          format: int64
          description: Absolute expiry height. Absent when the request has none.
        state:
          $ref: "#/components/schemas/PaymentRequestState"
        matched_tx_hash:
          $ref: "#/components/schemas/Hex32"
          description: Present iff state is MATCHED.
        matched_output_index:
          type: integer
          format: int64
          description: Present iff state is MATCHED.

    CreatePaymentRequestParams:
      type: object
      required: [label, amount]
      description: >
        The one mutating receiving method: local bookkeeping, persisted via
        the wallet's normal crash-atomic save path (no second writer).
      properties:
        label:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        expiry:
          type: integer
          format: int64
          minimum: 0
          description: Optional absolute expiry height.

    CreatePaymentRequestResult:
      type: object
      required: [id, uri]
      properties:
        id:
          $ref: "#/components/schemas/PaymentRequestId"
        uri:
          type: string
          description: >
            `shekyl:` URI carrying the wallet's primary address and this
            `rid`, composed from the STORED request so the URI cannot
            drift from the bookkeeping.

    ListPaymentRequestsParams:
      type: object
      properties:
        filter:
          type: string
          enum: [ALL, PENDING, MATCHED]
          default: ALL
          description: Unknown filter values are rejected (-32602), never ALL.

    ListPaymentRequestsResult:
      type: object
      required: [payment_requests]
      properties:
        payment_requests:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"

    MakeUriParams:
      type: object
      description: >
        Freeform URI composition. The address is not format-validated here
        (mirrors `shekyl_address::format_payment_uri`), but a provided
        address must be non-empty and contain no whitespace — anything else
        would embed into the composed URI as an ambiguous `shekyl:` string
        (-32602). `rid`, when given, must be non-zero and u48-fitting
        (-32602 otherwise).
      properties:
        address:
          type: string
          pattern: "^\\S+$"
          description: Defaults to the open wallet's primary address.
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        label:
          type: string
        rid:
          $ref: "#/components/schemas/PaymentRequestId"
        expiry:
          type: integer
          format: int64
          minimum: 0

    MakeUriResult:
      type: object
      required: [uri]
      properties:
        uri:
          type: string

    ParseUriParams:
      type: object
      required: [uri]
      properties:
        uri:
          type: string

    ParseUriResult:
      type: object
      required: [address]
      description: >
        Parsed query components. The address string is not format-validated
        at parse time (mirrors `shekyl_address::parse_payment_uri`).
      properties:
        address:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        label:
          type: string
        rid:
          $ref: "#/components/schemas/PaymentRequestId"
        expiry:
          type: integer
          format: int64

    # ── Fees — WI-RPC-1 ──────────────────────────────────────────────
    # Scope: the PRINCIPAL send surface only. The P lane (bond posts,
    # unbond, emission claims) pays the canonical weight-priced floor fee
    # from persona working capital with no tier and no knob (P-lane fee
    # uniformity, V3_WALLET_DECISION_LOG.md "P-lane fees", 2026-07-19) —
    # these estimate/priority methods never apply to it.
    EstimateTxSizeAndWeightParams:
      type: object
      required: [n_inputs, n_outputs]
      description: >
        Offline size/weight estimate for a hypothetical shape. Projects the
        engine's `predict_weight` byte model — the same single source the
        build path uses; never a second byte model. Counts outside the
        model's supported range are rejected (-32602), not clamped.
      properties:
        n_inputs:
          type: integer
          minimum: 1
        n_outputs:
          type: integer
          minimum: 2
        fee:
          $ref: "#/components/schemas/AtomicUnits"
          description: >
            Expected fee (feeds the weight's own varint(fee) term).
            Omitted → "0", a floor estimate within 9 bytes of exact.

    EstimateTxSizeAndWeightResult:
      type: object
      required: [size, weight, tree_depth]
      properties:
        size:
          type: integer
          format: int64
          description: Serialized transaction size in bytes.
        weight:
          type: integer
          format: int64
          description: >
            Fee weight in bytes (size + Bp+ verification clawback; equals
            the wire `Transaction::weight()`).
        tree_depth:
          type: integer
          description: Curve-tree depth the FCMP++ proof-size term used.

    GetDefaultFeePriorityParams:
      type: object
      description: Shape defaults to the canonical 2-in/2-out transfer.
      properties:
        n_inputs:
          type: integer
          minimum: 1
        n_outputs:
          type: integer
          minimum: 2

    GetDefaultFeePriorityResult:
      type: object
      required:
        [default_priority, economy_fee, standard_fee, priority_fee, tree_depth]
      description: >
        One daemon fee snapshot + the same converge fixpoint the build path
        runs, per named tier. The quote is gated by the same snapshot
        checks the build path applies, so a quote never reports a
        snapshot a build would refuse: a fee query that *failed* is
        -29102, and a snapshot that answered but was *refused* is
        -29109 (both the same codes the build path uses).
      properties:
        default_priority:
          type: string
          enum: [STANDARD]
        economy_fee:
          $ref: "#/components/schemas/AtomicUnits"
        standard_fee:
          $ref: "#/components/schemas/AtomicUnits"
        priority_fee:
          $ref: "#/components/schemas/AtomicUnits"
        tree_depth:
          type: integer

    # ── Staking reads — WI-RPC-1 ─────────────────────────────────────
    # Read-only projections of the authoritative staking view (reconcile
    # evidence + sealed pending posts + funding outputs). NEVER derived
    # from the StakingBlock `bonded_slots` hint. The staking ACTION surface
    # (unstake, claim) remains RESERVED.
    StakedBalance:
      type: object
      required:
        [
          bonded_principal_confirmed,
          bonded_principal_pending,
          rewards_received_unspent,
        ]
      description: Three separate fields, never conflated.
      properties:
        bonded_principal_confirmed:
          $ref: "#/components/schemas/AtomicUnits"
          description: Bond principal locked under confirmed live bonds.
        bonded_principal_pending:
          $ref: "#/components/schemas/AtomicUnits"
          description: >
            Bond principal committed by in-flight (sealed, unconfirmed)
            posts.
        rewards_received_unspent:
          $ref: "#/components/schemas/AtomicUnits"
          description: >
            Emission-reward money received and still unspent in
            staking-side outputs. NOT "accrued but unclaimed" — that is a
            future surface (reward path blocked on REWARD_EMISSION_LEG.md
            PR-E1..E3 / C-1).

    StakedOutput:
      type: object
      required: [gindex, amount, p_slot, unlock_height, confirmed]
      properties:
        gindex:
          type: string
          pattern: "^[0-9]+$"
          description: Global (chain-wide) output index, decimal string (u64).
        amount:
          $ref: "#/components/schemas/AtomicUnits"
        p_slot:
          type: integer
          description: Owning persona slot ordinal.
        unlock_height:
          type: integer
          format: int64
          description: Height at which the output becomes spendable.
        confirmed:
          type: boolean
          description: >
            Always true at V3.0 — the staking scan records outputs only
            behind the finality horizon. Present so the shape never
            changes if a pre-finality view is added later.

    GetStakedBalanceParams:
      type: object
      description: No parameters.

    GetStakedBalanceResult:
      $ref: "#/components/schemas/StakedBalance"

    GetStakedOutputsParams:
      type: object
      properties:
        confirmed_only:
          type: boolean
          default: true
          description: >
            Accepted for wire-shape stability; the authoritative set
            contains only finality-confirmed outputs at V3.0, so `false`
            changes nothing.

    GetStakedOutputsResult:
      type: object
      required: [staked_outputs]
      properties:
        staked_outputs:
          type: array
          items:
            $ref: "#/components/schemas/StakedOutput"

    StakingInfoParams:
      type: object
      description: No parameters.

    StakingInfoResult:
      type: object
      required: [staking_enabled, balance, staked_output_count]
      properties:
        staking_enabled:
          type: boolean
          description: >
            Whether staking is enabled for this wallet (the StakingBlock's
            own contract — the one field it IS authoritative for).
        balance:
          $ref: "#/components/schemas/StakedBalance"
        staked_output_count:
          type: integer
          format: int64
        pscan_synced_height:
          type: integer
          format: int64
          description: >
            The staking scan's sealed frontier height. Absent when the
            wallet has never scanned as a staker.
        posture:
          type: string
          description: >
            What this wallet's serving host is currently obligated to
            serve. **Absent means no host is running** — a non-staker, a
            staker still inside its launch standoff, or a wallet whose
            serving path failed — and renders as "not serving" rather than
            as either posture.

            Values defined at this contract version: `market`,
            `foundation_complete_tree`.

            **Deliberately an open string, not a closed enum.** A serving
            posture is added by a later round, and a *response* enum would
            make an older validator reject the whole `staking_info` reply
            over one display field it did not recognise — breaking a
            client's balance and scan readings to protect a status line.
            Clients must therefore treat an unknown value as an opaque
            posture name and render it as-is, which is exactly what the
            wallet CLI does; treating it as "not serving" would be a false
            negative about a node that is serving. The set above is the
            documentation, and adding to it is a contract change like any
            other.

            Read-only and derived from the LIVE serving witness, never
            from a stored setting: no posture is durable wallet-side, and
            the connected bond record lives daemon-side, so this answers
            "what is being served now" rather than "what was intended".
            Consequently it can be absent for a wallet that is bonded —
            which is the honest reading, not a gap.

    # ── Proofs — WI-RPC-3 (Phase 2c) ─────────────────────────────────
    # DLEQ-based payment and reserve proofs over rust/shekyl-proofs. Two
    # method pairs; the generate half needs an open FULL wallet, the check
    # half is WALLET-LESS (a verifier checks someone else's proof against
    # an address + the chain; it holds no wallet). Both check methods dial
    # the daemon for on-chain data and never touch tenant wallet state.
    #
    # Proof strings are Bech32m over the canonical HRPs pinned in
    # rust/shekyl-encoding (FCMP_PLUS_PLUS.md §"Address encoding" /
    # "Implementation" — the proof-HRP constant list):
    #
    #   tx proof       HRP "shekyltxproof"
    #                  payload: direction[1] ‖ proof_bytes
    #                    direction 0x01 = OUTBOUND (prover = sender),
    #                              0x02 = INBOUND  (prover = recipient);
    #                    proof_bytes = shekyl-proofs tx_proof wire format
    #                    (version-prefixed, Schnorr-sealed)
    #   reserve proof  HRP "shekylreserveproof"
    #                  payload: count[u32 LE]
    #                           ‖ (txid[32] ‖ vout_index[u32 LE]) × count
    #                           ‖ proof_bytes
    #                    the locator prefix names the on-chain outputs so a
    #                    wallet-less verifier can fetch them; proof_bytes =
    #                    shekyl-proofs reserve_proof wire format
    #
    #   Size caps (verifier-side resource bound; the VALUES are
    #   provisional, the EXISTENCE of the bound is the contract-level
    #   fact): reserve locator count ≤ 4096 (rhymes with
    #   MAX_HOLDINGS_SHARDS), and decoded proof payload ≤ 1 MiB
    #   (1,048,576 bytes) for BOTH check methods — a 4096-locator
    #   reserve proof decodes to 933,961 bytes, so the caps are
    #   mutually consistent. An over-limit proof is malformed by this
    #   contract's definition (-29300) and is refused BEFORE any
    #   daemon fetch: the u32 locator count otherwise admits four
    #   billion tx fetches against the verifier's daemon off one
    #   hostile string — a cheap amplification lever.
    #
    # The wallet2-era HRPs ("shekylouttxproof"/"shekylintxproof") are a
    # divergence from the pinned registry and are deleted with wallet2
    # (Phase 5); pre-genesis there are no proof strings in the wild to
    # honor (rule 16 user-absent inversion — no legacy-HRP acceptance).
    #
    # DISCLOSURE SEMANTICS (wargame, verified against the shekyl-proofs
    # wire formats 2026-07-24). A proof string is a deliberate,
    # irrevocable disclosure artifact: anything below is learned by ANY
    # holder of the string, not just the intended verifier, forever.
    #
    #   adversary: proof-string holder (intended verifier, or anyone a
    #   verifier leaks/sells the string to; strings cannot be revoked)
    #
    #   OUTBOUND tx proof — carries tx_key_secret in plaintext
    #     (tx_proof.rs header: version ‖ tx_key_secret[32] ‖ sig ‖ count).
    #     Holder re-derives the combined shared secret for EVERY output
    #     of that tx: decrypts all amounts and can test any candidate
    #     address for recipiency. Disclosure is tx-wide, not bound to
    #     the address in the proof. Sharing an outbound proof = sharing
    #     the tx key, in signed form.
    #     WHY the scalar is revealed at all (forcing constraint — do
    #     not "fix" this into a DLEQ): Monero's OutProofV2 reveals
    #     per-output shared-secret points under DLEQ, never the
    #     scalar. Shekyl cannot — the verifier must re-derive the
    #     HYBRID combined secret, and there is no DLEQ over the
    #     ML-KEM half: deterministic re-encapsulation needs the
    #     encapsulation coins, which derive from tx_key_secret
    #     (crypto-pq output.rs rederive_combined_ss: per-output seed
    #     = derive_kem_seed(tx_key_secret, …); bytes 32..64 feed
    #     encaps_from_seed). An X25519-half-only DLEQ would silently
    #     degrade outbound verification to classical-only, breaking
    #     the hybrid posture (00-mission priority 1). The tradeoff is
    #     deliberate: tx-wide disclosure bought PQ-complete
    #     verification.
    #     RE-MINT COROLLARY: because the signing key travels inside
    #     the proof, any holder of an OUTBOUND string can re-sign a
    #     fresh proof for the SAME tx under a DIFFERENT challenge
    #     message (re-binding to an unpaid address fails output
    #     derivation, but the message is free). Outbound
    #     challenge-binding therefore attests KNOWLEDGE OF THE TX
    #     KEY, not first-party identity — a holder of the sender's
    #     proof for challenge C1 can answer a third party's C2 as if
    #     they were the sender. Freshness is exactly as strong as
    #     tx-key secrecy, which the proof destroys on first share.
    #     Verifiers must scope conclusions accordingly. INBOUND does
    #     not have this property (the view scalar never travels;
    #     only per-output projections do).
    #   INBOUND tx proof — carries per-output view-side secrets
    #     (ho/y/z/k_amount) for the DISCLOSED outputs only. Holder
    #     decrypts those outputs' amounts and links them to the
    #     recipient address. Scoped to the disclosed outputs.
    #   Reserve proof — carries, per disclosed output: amounts
    #     (k_amount) AND the key image of an UNSPENT output. Publishing
    #     an unspent output's key image lets the holder watch the chain
    #     and detect the exact moment that output is later spent —
    #     FCMP++ spend-unlinkability for the disclosed outputs is
    #     permanently broken against every holder of the string. This
    #     is inherent to reserve proving (the DLEQ against the spent
    #     set IS the mechanism), not an implementation artifact. On the
    #     wallet2 lineage this cost little marginally (the spend graph
    #     was already visible-ish); on Shekyl it is the largest
    #     identity-to-chain link surface in the wallet API.
    #     Wargame row — adversary: verifier, or anyone the bearer
    #     string ever reaches (no verifier binding beyond `message`);
    #     capability: permanent spend-detection on the disclosed
    #     outputs, attributable to the prover's identity; defense:
    #     amount-bounded minimal proofs (fewest-beacons selection) +
    #     the GetReserveProofResult warning + intended-verifier-only
    #     sharing.
    #
    # Client guidance the servers of this contract must surface: share a
    # proof string only with the party it is generated for; prefer
    # amount-bounded reserve proofs (smallest disclosed output set);
    # prefer INBOUND direction when both sides can prove.
    GetTxProofParams:
      type: object
      required: [txid, address]
      description: >
        Generate a payment proof for `txid` bound to `address`. Direction
        is selected by address ownership, mirroring the prover's actual
        capability: `address` equal to the open wallet's primary address
        selects INBOUND (the wallet proves it RECEIVED outputs in the tx,
        signing with view material over per-output secrets re-derived
        from the stored source ciphertexts — the scan path records a
        source ciphertext for every incoming transfer, so an owned
        output is always provable); any other address selects OUTBOUND
        (the wallet proves it PAID that address, disclosing the per-tx
        secret inside the sealed proof — see the section's DISCLOSURE
        SEMANTICS block — -29301 when this wallet holds no retained
        secret for the tx, i.e. it did not send it). The ownership
        comparison is between DECODED addresses (canonical forms), never
        raw strings — Bech32m admits an all-uppercase encoding of the
        same address, and a string compare would silently misroute
        INBOUND to OUTBOUND and fail -29301 on correct-looking input.
        Capability: INBOUND requires only view material and is permitted
        on VIEW_ONLY wallets (the auditor-wallet use case, deliberate);
        OUTBOUND is not capability-gated — it needs the retained tx
        secret, not spend material, and a view-only wallet answers
        -29301 naturally because it never sent.
        OUTBOUND PREREQUISITE (in-scope for WI-RPC-3, its own commit
        ordered before the proof wrapper): the send path must persist
        the per-tx secret into TxMetaBlock.tx_keys — the schema exists
        but has no production writer as of 2026-07-24; without that
        retention commit every OUTBOUND request truthfully answers
        -29301. The retention write's lifecycle pins: (1) WRITE at
        DISPATCH, not at build and not at the accept verdict
        (review-hardened 2026-07-24 from the original submit-ACCEPTED
        form): the record — secret plus its pending-record reference —
        is persisted atomically immediately before the bytes can leave
        for the daemon, because the verdict is an observation about
        network exposure, not its start; a crash or dropped connection
        between dispatch and verdict must not orphan the secret of a
        tx the network may still mine. A built-then-discarded tx still
        leaves no secret residue (keeps the engine-state I-2
        no-orphans invariant), and the definite refusal verdicts
        (terminal / retryable — provably unrelayed under
        single-egress) retire the record in their finalizers so a
        daemon-refused build leaves none either; (2) DEATH follows I-2
        with the reference set CLOSED BY THE SPEND-QUADRUPLE — spent
        transfer rows record their
        spending_tx_hash (TransferDetails grows the field; written at
        spend detection, where the scanner holds the containing tx —
        KeyImageObserved grows the hash alongside block_height), and
        I-2's live set becomes: transfer-creating tx hashes + spent
        rows' spending hashes + scanned-pool entries + pending records.
        Without the quadruple, an exact-spend send (no change output)
        orphans its secret the moment post-confirmation cleanup drops
        the transient references — a steady-state hole, not a rescan
        corner; with it, the send stays referenced by the spent rows it
        consumed for as long as the wallet retains its history. Death
        is RECONCILIATION-ONLY (review-hardened 2026-07-24): a reorg
        rewind re-pends entries it unreferences instead of collecting
        them — the references died with the orphaned blocks, not the
        tx, and re-confirmation on the new chain is the common
        outcome, which a deleted secret could never serve; and the
        watchdog's confirmed-absent release clears F14 locks only,
        never the retention record, because its trigger is a local
        relay verdict (fee policy / unmapped reject cause at the
        wallet's own daemon), not a proof of network-wide absence. A
        tx that never re-confirms therefore leaves a bounded
        safe-direction residue (a retained secret with no proof to
        serve) — the deliberate trade under the indefinite-retention
        policy below; reopen a supersession-driven collector (keyed on
        persisted input linkage) only if pending-record growth is
        observed in practice; (3) RESCAN-SURVIVING, coherently — tx_keys is
        send-derived state that cannot be rebuilt from chain data, so
        it survives rescan; rescan's spend re-detection rebuilds the
        spending-hash references from chain data, so I-2 holds through
        rescan by construction rather than by carve-out. The quadruple
        also feeds the TransferDirection::Outgoing projection (typed
        as reserved for exactly this datum) and outbound-proof
        enumeration. Retention policy (deliberate): per-tx secrets are
        retained indefinitely with the OUTBOUND proof as their sole
        consumer — the raw-export surface stays rejected (see
        get_tx_key in the header registry).
        Requires an open wallet; OUTBOUND additionally fetches the tx
        body from the daemon to enumerate outputs.
      properties:
        txid:
          $ref: "#/components/schemas/Hex32"
        address:
          type: string
          description: >
            The counterparty address the proof is bound to (or the
            wallet's own primary address for INBOUND). Parse/network
            failures are -29100 INVALID_RECIPIENT.
        message:
          type: string
          default: ""
          description: >
            Optional challenge text sealed into the proof's Schnorr
            challenge. The verifier must present the identical string.

    GetTxProofResult:
      type: object
      required: [proof, direction]
      properties:
        proof:
          type: string
          description: >
            Bech32m, HRP `shekyltxproof`. A disclosure artifact — see
            the DISCLOSURE SEMANTICS block (OUTBOUND strings carry the
            tx key; treat as sensitive, share only with the intended
            verifier).
        direction:
          type: string
          enum: [OUTBOUND, INBOUND]

    CheckTxProofParams:
      type: object
      required: [txid, address, proof]
      description: >
        WALLET-LESS verification of a `shekyltxproof` string against the
        chain. Fetches the tx body from the daemon (-29303 when unknown),
        extracts the per-output on-chain data (output keys, commitments,
        encrypted amounts, hybrid KEM ciphertexts), and verifies the
        proof's DLEQ/Schnorr content against `address` and `message`.
        Direction is read from the proof payload, not guessed.
      properties:
        txid:
          $ref: "#/components/schemas/Hex32"
        address:
          type: string
          description: The address the prover claims the proof binds to.
        proof:
          type: string
          description: Bech32m `shekyltxproof` string (-29300 on decode/framing failure).
        message:
          type: string
          default: ""

    CheckTxProofResult:
      type: object
      required: [valid]
      description: >
        `valid: false` means the proof parsed but its cryptographic
        content does not verify against this (txid, address, message) —
        the method succeeded at answering the question. All other fields
        are present only when `valid` is true.
      properties:
        valid:
          type: boolean
        direction:
          type: string
          enum: [OUTBOUND, INBOUND]
        received:
          $ref: "#/components/schemas/AtomicUnits"
          description: Sum of the verified outputs' decrypted amounts.
        outputs:
          type: array
          description: Per-output verification detail.
          items:
            type: object
            required: [output_index, amount]
            properties:
              output_index:
                type: integer
                format: int64
              amount:
                $ref: "#/components/schemas/AtomicUnits"
        in_pool:
          type: boolean
          description: Whether the tx is still in the mempool.
        confirmations:
          type: integer
          format: int64
          description: >
            Daemon chain height (block COUNT) minus the tx's block
            height (0-based index): a tx in the tip block reports 1;
            0 is reported only while the tx is pool-only.

    GetReserveProofParams:
      type: object
      description: >
        Prove control of unspent balance. With `amount` omitted, every
        eligible unspent output is included (prove-all). With `amount`
        given, a minimal subset of outputs covering at least that amount
        is selected (largest-first), and the proof discloses ONLY those
        outputs — amount-bounding is output selection, so the proven
        total may exceed `amount` by up to one output's value.
        Selection policy is a DELIBERATE choice, not a wallet2
        inheritance: every disclosed output is a permanent
        spend-detection beacon (see DISCLOSURE SEMANTICS), so
        largest-first minimizes the number of beacons at the cost of
        placing the highest-value outputs under surveillance; the
        alternative (small-outputs-first) inverts that trade. Fewest
        beacons wins here because beacon count, not beacon value,
        bounds the holder's forward-linkage surface — revisit if a
        caller emerges that needs value-under-surveillance minimized
        instead.
        Requires an open FULL wallet (-29005 otherwise; the proof signs
        with the spend key). -29302 when the wallet has no eligible
        outputs or the unspent total is below `amount`.
      properties:
        amount:
          $ref: "#/components/schemas/AtomicUnits"
          description: >
            Minimum reserve to prove. Omitted = full balance. Must be
            positive when present: `"0"` selects no outputs and proves
            nothing, so it is refused as invalid params (-32602,
            "amount must be positive") — omit the field to prove the
            full balance.
        message:
          type: string
          default: ""

    GetReserveProofResult:
      type: object
      required: [proof, total, output_count]
      properties:
        proof:
          type: string
          description: >
            Bech32m, HRP `shekylreserveproof`. A disclosure artifact —
            see the DISCLOSURE SEMANTICS block (holders learn amounts
            and gain permanent spend-detection on the disclosed
            outputs; prefer amount-bounded proofs).
        total:
          $ref: "#/components/schemas/AtomicUnits"
          description: Sum of the amounts the proof actually discloses.
        output_count:
          type: integer
          format: int64

    CheckReserveProofParams:
      type: object
      required: [address, proof]
      description: >
        WALLET-LESS verification of a `shekylreserveproof` string.
        Enforces the section's size caps BEFORE any daemon traffic
        (locator count ≤ 4096, decoded payload ≤ 1 MiB — over-limit is
        -29300), then fetches every locator-named tx from the daemon
        (-29303 when any is unknown), extracts the named outputs'
        on-chain data, verifies the
        proof's per-output DLEQ content and spend-key signature against
        `address` and `message`, REJECTS any proof whose entries repeat
        a key image (-29300 — entries verify independently, so a
        duplicated UNSPENT output would otherwise inflate the proven
        reserve N-fold with `spent` staying zero; the key image is the
        dedup key because it is what makes an entry economically
        distinct and what the spent set is keyed on), and queries the
        daemon's spent set for the proof's key images — a proof over spent outputs verifies
        cryptographically but the spent portion is reported so the
        verifier can subtract it. Note the spent-set query forwards the
        proof's key-image list to the VERIFIER'S daemon
        (is_key_image_spent): a hostile or remote daemon learns which
        key images the verifier is interested in — the standard
        remote-daemon caveat applies to the verifier here, on top of
        the prover-side disclosure in DISCLOSURE SEMANTICS.
      properties:
        address:
          type: string
          description: The prover's address (carries the spend pubkey the proof signs under).
        proof:
          type: string
          description: Bech32m `shekylreserveproof` string (-29300 on decode/framing failure).
        message:
          type: string
          default: ""

    CheckReserveProofResult:
      type: object
      required: [valid]
      description: >
        `valid: false` = parsed but cryptographically refused (same
        contract as CheckTxProofResult). `total`/`spent` present only
        when valid; the provable live reserve is `total - spent`.
      properties:
        valid:
          type: boolean
        total:
          $ref: "#/components/schemas/AtomicUnits"
          description: Sum of all verified outputs in the proof.
        spent:
          $ref: "#/components/schemas/AtomicUnits"
          description: >
            Portion of `total` whose key images the daemon reports spent
            at verification time.
        output_count:
          type: integer
          format: int64

    # ── Message signing — PR-SM-2 (A2 / Phase 2c residue) ────────────
    # Transferable attestations binding a message to a Shekyl address:
    # the nested hybrid ratified in docs/design/WALLET_MESSAGE_SIGNING.md
    # §7 (SLH-DSA-SHA2-192s inner, spend-scalar Schnorr outer, cSHAKE256
    # domain-separated preimage binding the address's bound classical
    # segment, the network, and a mode byte).
    #
    # The armored signature is a single line, `shekylmsgsig1.` +
    # unpadded canonical-strict base64url — about 21.7 KB (16,295
    # canonical bytes) for the one shipping scheme. Decode enforces a
    # 64 KB ceiling on the ENCODED length before any decoding.
    #
    # sign_message needs the open FULL wallet (the signing identity is
    # derived on demand from the master seed) and is MULTI-SECOND BY
    # DESIGN: ~4.3 s per call on the smallest supported device (Pi 4
    # floor, SM-R-8 — signing is a rare, deliberate act; verification
    # is ~3.4 ms there). Clients should present the wait as expected
    # work, never as a hang (rule 82).
    #
    # verify_message is SESSION-LESS (SM-R-6): message, signature, and
    # address are all public caller-supplied inputs, so it is callable
    # with no wallet open, never touches wallet state, and never dials
    # the daemon. It is constant-time with respect to NOTHING — every
    # input is public; do not add timing hardening here.
    #
    # Error taxonomy (the contract-level fact of this section): shape
    # errors are -32602 (malformed signature string, undecodable or
    # classical-only address — shape-first, the get_transfer_by_id
    # precedent); every other outcome is an ANSWER with its own code:
    # -29800 not-by-that-address, -29801 corrupted paste, -29802
    # unknown scheme. The signature string is judged BEFORE the
    # address, so the paste taxonomy is a property of the paste alone.
    #
    # REACH: verification is live end to end — every address carries the
    # 48-byte SLH-DSA key as its fourth classical field (fork (ii)), so
    # the SignerIdentity extraction that gated the R6-a interim is total.
    # (-29803 ADDRESS_UNBOUND, the interim refusal, was retired unused.)

    SignMessageParams:
      type: object
      required: [message]
      description: >
        Sign `message` as the open wallet's address (spend-tier mode).
        Requires a FULL wallet (-29005 otherwise; -29001 with no wallet
        open; -29006 if the session's key actor has stopped — close and
        reopen). Multi-second by design — see the section header.
        Single-flight per wallet: concurrent calls queue FIFO behind the
        engine's sign permit rather than running in parallel.
      properties:
        message:
          type: string
          description: >
            The exact string to sign, bound byte-for-byte (UTF-8). The
            verifier must supply the identical string.

    SignMessageResult:
      type: object
      required: [signature]
      properties:
        signature:
          type: string
          description: >
            Single-line armored signature (`shekylmsgsig1.` + unpadded
            base64url, ~21.7 KB). Not secret — it is a transferable
            attestation; anyone holding message + signature + address
            can verify it.

    VerifyMessageParams:
      type: object
      required: [address, message, signature]
      description: >
        SESSION-LESS verification of a message signature against an
        address. Works with no wallet open; reads only the server's
        network binding (the address must belong to it). Requires the
        FULL address form — the classical-only display form cannot
        reconstruct the bound segment the signature covers (-32602).
      properties:
        address:
          type: string
          description: The claimed signer's full Shekyl address.
        message:
          type: string
          description: The exact string the signer claims to have signed.
        signature:
          type: string
          description: >
            The armored `shekylmsgsig1.` string. Decode tolerates
            embedded whitespace (mail clients wrap 21.7 KB lines) but is
            otherwise canonical-strict.

    VerifyMessageResult:
      type: object
      required: [verified]
      description: >
        SUCCESS-ONLY by contract: every negative outcome is one of the
        -29800-band error codes, because the taxonomy needs four
        distinct sentences (mismatch / corruption / unknown scheme /
        unbound address) that a `valid: false` boolean cannot carry.
        This deliberately diverges from CheckTxProofResult's
        `valid: false` shape, which predates the SM-R-6 ruling.
      properties:
        verified:
          const: true
          description: >
            The signature verifies for the address, message, and
            network. Present so scripted callers read a self-describing
            field rather than inferring success from an empty object.
